 {sep:1},
 {v:'tasks',t:'업무',i:'task',sec:1},{v:'snippets',t:'문구함',i:'quote',sec:1},{v:'settings',t:'설정',i:'gear',sec:1}];
const TITLES={home:'홈',timetable:'시간표',notice:'개강안내',students:'학생',alarms:'알림',progress:'진도관리',tasks:'업무',snippets:'문구함',settings:'설정'};
const DOCK=[['home','홈','home'],['timetable','시간표','cal'],['notice','안내','mail'],['students','학생','users'],['tasks','업무','task']];
let navBound=false;
/* 메뉴가 오른쪽 버튼과 겹치지 않게: 넘치면 보조 메뉴 글자 → 전체 글자 순서로 숨김 */
function fitNav(){ const top=$('#topnav'), n=$('#nav'); if(!top||!n) return; top.classList.remove('fit1','fit2'); if(innerWidth<=900) return;
  const over=()=>n.scrollWidth>n.clientWidth+1; if(over()) top.classList.add('fit1'); if(over()) top.classList.add('fit2'); }
function renderSide(){
  const n=activeAlarms().filter(a=>!a.ack).length;
  const items=NAV.map(x=>{
    if(x.sep) return '<span class="tn-sep"></span>';
    return `<a data-go="${x.v}" class="${S.view===x.v?'on':''} ${x.sec?'sec':''}" title="${x.t}"><span class="ic">${ic(x.i)}${x.badge?`<i class="dot ${n?'has':''}"></i>`:''}</span><span class="tx">${x.t}</span>${x.badge&&n?`<span class="badge num">${n}</span>`:''}</a>`;
  }).join('');
  const top=$('#topnav'); top.classList.toggle('mini',S.collapsed);
  top.innerHTML=`<div class="tn-left"><div class="lights"><i></i><i></i><i></i></div><button class="wordmark" data-go="home" aria-label="홈"><img src="${LOGO}" alt=""><b class="full">KAIA DESK</b></button><span class="tn-title">${TITLES[S.view]||''}</span></div>
   <nav class="tn-nav" id="nav" aria-label="메뉴"><i class="pill" id="pill"></i>${items}</nav>
   <div class="tn-right">${syncChip()}
     <button class="tn-btn m-only" data-go="alarms" aria-label="알림">${ic('bell')}${n?'<i class="dot"></i>':''}</button>
     <button class="tn-btn d-only" data-act="collapse" aria-label="${S.collapsed?'메뉴 이름 보이기':'메뉴 아이콘만 보기'}" title="${S.collapsed?'메뉴 이름 보이기':'아이콘만 보기'}">${ic(S.collapsed?'down':'up2')}</button>
     <button class="tn-btn" data-act="cmd" aria-label="명령 (Ctrl+K)" title="명령 · Ctrl+K">${ic('search')}</button>
     <button class="tn-btn d-only" data-act="lockNow" aria-label="화면 잠금" title="화면 잠금">${ic('power')}</button>
     <button class="who d-only" data-go="settings"><span class="mark">${esc((S.settings.name||'K').slice(0,1))}</span><span class="meta"><strong>${esc(S.settings.name||'')}</strong><span>${esc(S.settings.role||'')}</span></span><span class="chev">${ic('down')}</span></button>
     <button class="tn-btn m-only" data-act="sheetToggle" aria-label="전체 메뉴">${ic($('#sheetnav').classList.contains('open')?'x':'menu')}</button>
   </div>`;
  const navEl=$('#nav');
  navEl.addEventListener('mouseover',e=>{const a=e.target.closest('a');if(a)movePill(a)});
  navEl.addEventListener('mouseleave',()=>movePill($('#nav a.on')));
  fitNav(); requestAnimationFrame(()=>movePill($('#nav a.on'),true));
  if(!navBound){ navBound=true; addEventListener('resize',()=>{ fitNav(); movePill($('#nav a.on'),true); }); try{ document.fonts.ready.then(()=>{ fitNav(); movePill($('#nav a.on'),true); }); }catch(e){} }
  $('#sheetnav').innerHTML=`<div class="sheet-grid">${NAV.filter(x=>!x.sep).map(x=>`<a data-go="${x.v}" class="${S.view===x.v?'on':''}">${ic(x.i)}<span>${x.t}</span>${x.badge&&n?`<b class="badge num">${n}</b>`:''}</a>`).join('')}<a data-act="lockNow">${ic('power')}<span>화면 잠금</span></a></div>`;
  $('#dock').innerHTML=DOCK.map(([v,t,i])=>`<a data-go="${v}" class="${S.view===v?'on':''}">${ic(i)}<span>${t}</span>${v==='notice'&&n?'<i class="dot"></i>':''}</a>`).join('');
}
function movePill(a,instant){
  const p=$('#pill'); if(!p) return;
  if(!a||!a.offsetWidth){p.style.opacity=0;return}
  if(instant){p.style.transition='none'}
  p.style.transform=`translateX(${a.offsetLeft}px)`; p.style.width=a.offsetWidth+'px'; p.style.opacity=1;
  $$('#nav a').forEach(x=>x.classList.toggle('pon',x===a));
  if(instant){p.offsetHeight;p.style.transition=''}
}
function go(v){
  if(v==='lock'){ lock(); return; }
  if(v!==S.view) sfx('nav');
  const doIt=()=>{ S.view=v; closeDrawer(); render(); $('#main').scrollTop=0; window.scrollTo&&window.scrollTo(0,0); };
  if(FX.on()&&v!==S.view&&$('#view .view')){ FX.shatter(); S._fxAssemble=true; setTimeout(doIt,120); }
  else { if(FX.on()) S._fxAssemble=true; doIt(); }
  try{ history.replaceState(null,'','#'+v); }catch(e){}
}
function openDrawer(){ $('#sheetnav').classList.add('open'); $('#scrim').classList.add('show'); renderSide(); }
function closeDrawer(){ const s=$('#sheetnav'); if(s&&s.classList.contains('open')){ s.classList.remove('open'); $('#scrim').classList.remove('show'); renderSide(); } }

/* ---------- render ---------- */
let renderPending=false,renderDirty=false;
function scheduleRender(){ if(renderPending) return; renderPending=true; requestAnimationFrame(()=>{ renderPending=false; const a=document.activeElement; if(a&&a.closest&&a.closest('#view')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){ renderDirty=true; renderSide(); return; } render(); }); }
function render(){
  renderDirty=false;
  document.body.classList.toggle('gate',!!S.gate);
  renderSide();
  const V={home:vHome,timetable:vTimetable,notice:vNotice,students:vStudents,alarms:vAlarms,progress:vProgress,tasks:vTasks,snippets:vSnippets,settings:vSettings}[S.view]||vHome;
  const html=S.gate?vLogin():(S.demo?demoBanner():'')+V();
  const view=$('#view'); const same=view.dataset.v===S.view; view.dataset.v=S.view;
  view.innerHTML=html; if(!same){ view.style.animation='none'; view.offsetHeight; view.style.animation=''; }
  afterRender();
}
function demoBanner(){ return `<div class="banner"><p><b>예시 화면입니다.</b> 이름 앞에 "예시"가 붙은 데이터는 둘러보기용이에요. 엑셀 시간표를 올리면 예시는 사라지고 실제 데이터로 시작해요.</p><div class="btns"><button class="btn sm pri" data-act="startReal">내 데이터로 시작</button></div></div>`; }
function syncChip(){ if(S.mode==='gas'){ const st=store.syncState||'ok'; return `<span class="sync ${st==='busy'?'busy':st==='off'?'off':''}" title="구글 시트 동기화"><i></i><span>${st==='busy'?'저장 중':st==='off'?'오프라인':'동기화됨'}</span></span>`; } return ''; }
function countUp(el){ const to=+el.dataset.count; if(!to){ el.textContent='0'; return; } const st=performance.now(); const f=now=>{ const k=Math.min(1,(now-st)/1100); el.textContent=Math.round(to*(1-Math.pow(1-k,4))); if(k<1) requestAnimationFrame(f); }; requestAnimationFrame(f); }
function afterRender(){
  $$('#view>.view>*').forEach((el,i)=>el.style.setProperty('--i',Math.min(i,8)));
  if(S._fxAssemble){ S._fxAssemble=false; requestAnimationFrame(()=>FX.assemble([$('#view')])); }
  $$('[data-count]').forEach(countUp);
  if($('#herofx')) bgfx.bindHero($('#herofx'));
  if($('#corefx')){ bgfx.bindCore($('#corefx'),hudCoreData()); startHudClock(); }
  // animate rings
  $$('.ring[data-p]').forEach(r=>{ const p=+r.dataset.p; let cur=0; const st=performance.now(); const f=now=>{ const k=Math.min(1,(now-st)/900); cur=p*(1-Math.pow(1-k,3)); r.style.setProperty('--p',cur.toFixed(1)); if(k<1) requestAnimationFrame(f); }; requestAnimationFrame(f); });
}

/* ---------- views ---------- */
function vh(title,sub,btns=''){ return `<div class="vh"><div><div class="sub">${sub}</div><h1>${title}</h1></div>${btns?`<div class="btns">${btns}</div>`:''}</div>`; }
function alarmRow(a,compact){
  const st=noticeStat(a); const c=a.c;
  const sub=`${fmtMD(a.date)} ${a.type==='start'?'개강':'종강'} · ${esc(daysLabel(c.days,c.daysB))} ${esc(c.time||'')} · 안내 ${st.sent}/${st.n}명`;
  return `<div class="alarm ${a.type==='end'?'e':''} ${a.ack?'ack':''}">
   <span class="dbadge ${a.type==='start'?'s':'e'} ${!a.ack&&a.state==='now'?'now':''}">${a.type==='start'?'개강':'종강'} D-${diffDays(todayStr(),a.date)}</span>
   <div class="grow"><div class="t1">${esc(c.name)}</div><div class="t2">${sub}</div></div>
   <div class="btns"><button class="btn sm" data-act="toNotice" data-id="${c.id}" data-key="${a.key}">${ic('send')}안내하기</button>${compact?'':`<button class="btn sm ghost" data-act="ack" data-key="${a.key}">${a.ack?'되돌리기':'확인'}</button>`}</div></div>`;
}
function vHome(){ return isHud()?vHomeHud():vHomeLight(); }
function vHomeBody(){ const h=vHomeLight(); const i=h.indexOf('<div class="grid2">'); return h.slice(i,h.length-'</div>'.length); }
function vHomeLight(){
  const t=todayStr(); const d=parseYmd(t);
  const cs=list('courses'); const act=activeAlarms(); const un=act.filter(a=>!a.ack);
  const running=cs.filter(c=>courseStatus(c).k==='run');
  const thisMonth=cs.filter(c=>ym(c.start)===ym(t));
  const studying=list('students').filter(s=>s.status==='수강중').length;
  const todayTasks=list('tasks').filter(k=>!k.done&&k.due&&k.due<=t);
  const todayClasses=running.map(c=>({c,p:progOf(c)})).filter(x=>x.p.todayIdx>=0).sort((a,b)=>(a.c.time||'').localeCompare(b.c.time||''));
  // 14-day strip
  const days=[...Array(14)].map((_,i)=>addDays(t,i));
  const ev={}; cs.forEach(c=>{ if(c.start) (ev[c.start]=ev[c.start]||[]).push({k:'s',c}); const e=courseEnd(c); if(e) (ev[e]=ev[e]||[]).push({k:'e',c}); });
  const al={}; alarmsAll().forEach(a=>{ (al[a.ad]=al[a.ad]||0); al[a.ad]++; });
  const strip=days.map((x,i)=>{ const dd=parseYmd(x); const marks=(ev[x]||[]).map((e,j)=>`<i class="${e.k}" style="animation-delay:${(i*40+j*80)}ms" title="${esc(e.c.name)}"></i>`).join('')+(al[x]?`<i class="a" style="animation-delay:${i*40}ms"></i>`:'');
    return `<div class="d ${i===0?'today':''} ${dd.getDay()%6===0?'we':''}"><span>${DOW[dd.getDay()]}</span><b>${dd.getDate()}</b><div class="m">${marks}</div></div>`; }).join('');
  const upcoming=[]; days.forEach(x=>(ev[x]||[]).forEach(e=>upcoming.push({d:x,...e})));
  const syncLabel=S.mode==='db'?'Claude 계정과 동기화':S.mode==='gas'?'구글 시트와 동기화':'이 기기에 저장';
  return `<div class="view">
  <section class="hero" id="hero"><canvas id="herofx" aria-hidden="true"></canvas>
    <div class="hero-in">
      <div class="eyebrow">${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()} ${DOW[d.getDay()]}요일<span class="live"><i></i>${syncLabel}</span></div>
      <h1><span class="line"><span>안녕하세요,</span></span><span class="line"><span>${esc(S.settings.name||'')}님</span></span></h1>
      <p>확인할 알림 <b>${un.length}건</b> · 오늘 수업 <b>${todayClasses.length}개</b> · 오늘까지 할 일 <b>${todayTasks.length}건</b></p>
      <div class="acts"><button class="btn inv mag" data-go="${un.length?'alarms':'notice'}">${un.length?'알림 확인하기':'개강안내 열기'}${ic('right')}</button><button class="btn inv-g mag" data-go="timetable">${ic('up')}시간표 올리기</button></div>
    </div>
    <div class="hero-stats">
      <div><b data-count="${running.length}">${running.length}</b><span>진행 중 과정</span></div>
      <div><b data-count="${thisMonth.length}">${thisMonth.length}</b><span>${d.getMonth()+1}월 개강</span></div>
      <div><b data-count="${studying}">${studying}</b><span>수강 중 학생</span></div>
      <div><b data-count="${list('students').length}">${list('students').length}</b><span>전체 학생</span></div>
    </div>
  </section>
  <div class="grid2">
    <div class="col">
      <section class="pane"><h2>확인할 알림 <small>개강·종강 ${(S.settings.offsets||[]).map(o=>'D-'+o).join(' · ')}</small><button class="btn sm ghost r" data-go="alarms">전체 보기</button></h2>
        ${act.length?act.slice(0,5).map(a=>alarmRow(a)).join(''):`<div class="empty"><b>지금 확인할 알림이 없어요</b>개강·종강 일주일 전과 하루 전에 여기에 떠요.</div>`}
      </section>
      <section class="pane"><h2>앞으로 2주 <small>개강·종강 일정</small></h2>
        <div class="strip">${strip}</div>
        <div class="legend"><span><i style="background:var(--blue)"></i>개강</span><span><i style="background:var(--violet)"></i>종강</span><span><i style="box-shadow:inset 0 0 0 1.5px var(--warn)"></i>알림 뜨는 날</span></div>
        ${upcoming.length?`<div class="list" style="margin-top:12px">${upcoming.map(u=>`<div class="row click" data-act="openCourse" data-id="${u.c.id}"><span class="dbadge ${u.k}">${u.k==='s'?'개강':'종강'}</span><div class="grow"><div class="t1">${esc(u.c.name)}</div><div class="t2">${fmtMD(u.d)} · ${esc(daysLabel(u.c.days,u.c.daysB))} ${esc(u.c.time||'')} · 학생 ${studentsIn(u.c.id).length}명</div></div></div>`).join('')}</div>`:''}
      </section>
    </div>
    <div class="col">
      <section class="pane"><h2>오늘 수업 <small>${todayClasses.length}개</small></h2>
        ${todayClasses.length?`<div class="list">${todayClasses.map(({c,p})=>`<div class="row click" data-act="openCourse" data-id="${c.id}" data-tab="prog"><div class="grow"><div class="t1">${esc(c.name)}</div><div class="t2">${esc(c.time||'')} · ${esc(c.room||'')} · ${p.todayIdx+1}/${p.total}회차</div></div>${p.pending?`<span class="chip warn">진도 미체크 ${p.pending}</span>`:'<span class="chip ok">진도 정상</span>'}</div>`).join('')}</div>`:`<div class="empty"><b>오늘은 수업이 없어요</b>시간표를 올리면 요일별 수업이 자동으로 잡혀요.</div>`}
      </section>
      <section class="pane"><h2>할 일 <small>오늘까지</small><button class="btn sm ghost r" data-go="tasks">업무로 이동</button></h2>
        ${todayTasks.length?`<div class="list">${todayTasks.map(taskRow).join('')}</div>`:`<div class="empty"><b>오늘 할 일을 모두 끝냈어요</b>콜백 약속은 업무 메뉴에 시간과 함께 적어 두세요.</div>`}
      </section>
    </div>
  </div></div>`;
}

function vTimetable(){
  const t=todayStr(); if(!S.calMonth) S.calMonth=ym(t);
  const [Y,M]=S.calMonth.split('-').map(Number);
  const first=new Date(Y,M-1,1); const gridStart=addDays(ymd(first),-first.getDay());
  const mStart=ymd(first), mEnd=ymd(new Date(Y,M,0));
  const f=S.calFilter; const cs=list('courses').filter(c=>f==='all'||c.kind===f);
  const ev={}; const runCount={};
  cs.forEach(c=>{ if(c.start)(ev[c.start]=ev[c.start]||[]).push({k:'s',c}); const e=courseEnd(c); if(e)(ev[e]=ev[e]||[]).push({k:'e',c});
    if(c.start&&e&&c.start<=addDays(gridStart,42)&&e>=gridStart) sessionsOf(c).forEach(d=>{runCount[d]=(runCount[d]||0)+1}); });
  let cells=''; for(let i=0;i<42;i++){ const x=addDays(gridStart,i); const dd=parseYmd(x); const evs=ev[x]||[];
    const hol=HOLIDAYS[x];
    cells+=`<div class="c ${ym(x)!==S.calMonth?'out':''} ${x===t?'today':''} ${S.calSel===x?'sel':''} ${dd.getDay()===0?'sun':''} ${dd.getDay()===6?'sat':''} ${hol?'hd':''}" data-act="calSel" data-d="${x}">
      <div class="n"><b>${dd.getDate()}</b>${hol?`<span class="hol">${hol}</span>`:''}</div>
      ${evs.slice(0,3).map(e=>`<div class="ev ${e.k}">${e.k==='s'?'개강':'종강'} ${esc(e.c.name)}</div>`).join('')}${evs.length>3?`<div class="more">+${evs.length-3}</div>`:''}
      <div class="dots">${evs.map(e=>`<i class="${e.k}"></i>`).join('')}</div>
      ${runCount[x]?`<div class="run">수업 ${runCount[x]}</div>`:''}</div>`; }
  let selBox='';
  if(S.calSel){ const x=S.calSel; const evs=ev[x]||[]; const running=cs.filter(c=>sessionsOf(c).includes(x));
    selBox=`<div style="margin-top:16px;border-top:1px solid var(--stroke);padding-top:14px"><h2 style="margin-bottom:6px">${fmtKo(x)}${HOLIDAYS[x]?` <span class="chip bad">${HOLIDAYS[x]}</span>`:''}</h2><div class="list">
      ${evs.map(e=>`<div class="row click" data-act="openCourse" data-id="${e.c.id}"><span class="dbadge ${e.k}">${e.k==='s'?'개강':'종강'}</span><div class="grow"><div class="t1">${esc(e.c.name)}</div><div class="t2">${esc(e.c.time||'')} · ${esc(e.c.room||'')}</div></div></div>`).join('')}
      ${running.filter(c=>!evs.some(e=>e.c.id===c.id)).map(c=>{const p=progOf(c);return `<div class="row click" data-act="openCourse" data-id="${c.id}" data-tab="prog"><span class="dbadge" style="background:var(--glass-2)">${p.ss.indexOf(x)+1}회차</span><div class="grow"><div class="t1">${esc(c.name)}</div><div class="t2">${esc(c.time||'')} · ${esc(c.room||'')}</div></div></div>`}).join('')}
      ${!evs.length&&!running.length?'<div class="empty">이 날은 수업이 없어요.</div>':''}</div></div>`; }
  const monthCs=cs.filter(c=>c.start&&c.start<=mEnd&&courseEnd(c)>=mStart).sort((a,b)=>a.start<b.start?-1:1);
  return `<div class="view">
  ${vh('시간표','엑셀 시간표를 올리면 개강·종강 알림과 진도표가 자동으로 만들어져요',
    `<label class="btn pri" for="xlsFile">${ic('up')}엑셀 올리기</label><input id="xlsFile" type="file" accept=".xlsx,.xlsm,.xls,.csv" multiple hidden>
     <button class="btn" data-act="pasteImport">${ic('quote')}문자로 등록</button>
     <button class="btn" data-act="tplXlsx">${ic('dl')}양식 받기</button>
     <button class="btn" data-act="ics">${ic('cal')}휴대폰 달력으로 보내기</button>
     <button class="btn" data-act="newCourse">${ic('plus')}과정 추가</button>`)}
  <section class="pane">
    <div class="btns" style="justify-content:space-between;margin-bottom:14px">
      <div class="btns"><button class="btn sm" data-act="calPrev" aria-label="이전 달">${ic('left')}</button><b style="font-size:17px;font-weight:600;min-width:120px;text-align:center" class="num">${Y}년 ${M}월</b><button class="btn sm" data-act="calNext" aria-label="다음 달">${ic('right')}</button><button class="btn sm ghost" data-act="calToday">오늘</button></div>
      <div class="seg">${[['all','전체'],['평일','평일'],['주말','주말']].map(([k,l])=>`<button class="${f===k?'on':''}" data-act="calFilter" data-k="${k}">${l}</button>`).join('')}</div>
    </div>
    <div class="cal">${[...DOW].map(x=>`<div class="h">${x}</div>`).join('')}${cells}</div>
    ${selBox}
  </section>

function subjectGroups(){
  const t=todayStr(); const g={};
  list('courses').filter(c=>c.start).forEach(c=>{ const k=subjectOf(c); (g[k]=g[k]||[]).push(c); });
  const next=k=>{ const up=g[k].filter(c=>c.start>=t).map(c=>c.start).sort()[0]; return up||'9999'; };
  const keys=Object.keys(g).sort((a,b)=>{ const na=next(a),nb=next(b); return na!==nb?(na<nb?-1:1):a.localeCompare(b,'ko'); });
  return {g,keys,next};
}

function parseZoomText(txt){
  const out=[]; const blocks=String(txt).split(/(?=비대면\s*계정\s*[A-Za-z])|(?=[-–]\s*[A-Za-z]\s*계정)/);
  for(const b of blocks){ const k=(b.match(/계정\s*([A-Za-z])\b/)||b.match(/\b([A-Za-z])\s*계정/)||[])[1]; const id=(b.match(/회의\s*ID\s*[:：]\s*([\d\s]+\d)/i)||[])[1]; const pw=(b.match(/회의\s*PW\s*[:：]\s*(\S+)/i)||[])[1];
    if(k&&id&&pw) out.push({k:k.toUpperCase(),id:id.trim().replace(/\s+/g,' '),pw:pw.trim()}); }
  return out;
}

  modalEl.addEventListener('mousedown',e=>{ if(e.target===modalEl) modalEl._down=true; }); modalEl.addEventListener('click',e=>{ if(e.target===modalEl&&modalEl._down) closeModal(); modalEl&&(modalEl._down=false); });

let IM=null;
function readBuf(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsArrayBuffer(file); }); }
async function handleXlsx(files){
  files=[...files].filter(f=>/\.(xlsx|xlsm|xls|csv)$/i.test(f.name)); if(!files.length) return;
  if(!window.XLSX){ toast('엑셀 도구를 불러오지 못했어요','인터넷 연결을 확인하고 새로고침해 주세요.'); return; }
  const ctx={today:todayStr()}; const sheets=[]; const bad=[];
  for(const f of files){
    try{
      const wb=XLSX.read(new Uint8Array(await readBuf(f)),{type:'array'});
      for(const n of wb.SheetNames){
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''});
        const grid=parseGridSheet(rows,ctx);
        let res=grid&&grid.length?{header:null,items:grid,grid:true}:parseRows(rows,ctx);
        if(!res.items.length){ // 표가 아니면 개강안내 문자 형식(○날짜 : …)으로 다시 읽기
          const txt=rows.map(r=>r.filter(x=>x!=='').join(' ')).join('\n'); const it=parseNoticeText(txt,ctx); if(it.length) res={header:null,items:it,text:true}; }
        sheets.push({name:files.length>1?`${f.name.replace(/\.[^.]+$/,'')} · ${n}`:n,rows,res,file:f.name});
      }
    }catch(e){ console.error(e); bad.push(f.name); }
  }
  if(bad.length) toast('읽지 못한 파일이 있어요',bad.join(', '));
  if(!sheets.length) return;
  IM={file:files.length>1?`파일 ${files.length}개`:files[0].name,sheets,si:0,sel:{}};
  const firstGood=sheets.findIndex(s=>s.res.items.length); IM.si=firstGood<0?0:firstGood;
  const seen={};
  sheets.forEach((sh,si)=>sh.res.items.forEach((it,i)=>{ const k=courseKey(it.course); if(seen[k]){ it.dup=seen[k]; IM.sel[si+':'+i]=false; } else { seen[k]=sh.name; IM.sel[si+':'+i]=it.ok; } }));
  if(firstGood<0) toast('시간표를 찾지 못했어요','제목줄(과정명 · 개강일 또는 기간)이 있는지 확인해 주세요. 아래 "열 연결"에서 직접 골라도 돼요.','alarm-t');
  drawImport();
}

function remapImport(f,val){

function icsText(){
  const esc2=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  const fold=line=>{ const enc=new TextEncoder(); if(enc.encode(line).length<=74) return line; let out='',cur='',n=0; for(const ch of line){ const b=enc.encode(ch).length; if(n+b>73){ out+=cur+'\r\n '; cur=''; n=1; } cur+=ch; n+=b; } return out+cur; };
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const [hh,mm]=(S.settings.icsTime||'09:30').split(':').map(Number);
  const utc=(dstr,h,m)=>{ const d=parseYmd(dstr); d.setHours(h,m,0,0); return d.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''); };
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//KAIA DESK//KO','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:KAIA 개강·종강','X-WR-TIMEZONE:Asia/Seoul'];
  const t=todayStr(); let n=0;
  for(const c of list('courses')){
    const e=courseEnd(c); if(!e||e<t) continue;
    const desc=`${daysLabel(c.days,c.daysB)} ${c.time||''} · ${c.room||''} · 학생 ${studentsIn(c.id).length}명`;
    for(const [type,date] of [['start',c.start],['end',e]]){ if(!date||date<t) continue;
      const lab=type==='start'?'개강':'종강';
      L.push('BEGIN:VEVENT',`UID:${c.id}-${type}@kaia-desk`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${date.replace(/-/g,'')}`,`DTEND;VALUE=DATE:${addDays(date,1).replace(/-/g,'')}`,`SUMMARY:${esc2(`[${lab}] ${c.name}`)}`,`DESCRIPTION:${esc2(desc)}`,'TRANSP:TRANSPARENT','END:VEVENT'); n++;
      for(const off of (S.settings.offsets||[7,1])){ const ad=addDays(date,-off); if(ad<t) continue;
        const st=utc(ad,hh,mm); const en=utc(ad,hh,mm+15);
        L.push('BEGIN:VEVENT',`UID:${c.id}-${type}-${off}@kaia-desk`,`DTSTAMP:${stamp}`,`DTSTART:${st}`,`DTEND:${en}`,`SUMMARY:${esc2(`[${lab} D-${off}] ${c.name} 안내`)}`,`DESCRIPTION:${esc2(`${fmtKo(date)} ${lab} · ${desc}`)}`,
          'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${esc2(`${lab} D-${off} ${c.name}`)}`,'TRIGGER:PT0M','END:VALARM','END:VEVENT'); n++; }
    }
  }
  L.push('END:VCALENDAR'); return {text:L.map(fold).join('\r\n'),n};
}

const normName=s=>String(s||'').toLowerCase().replace(/[\s()\[\]·\-_.,]/g,'');
function matchCourseIds(cobjs,status){
  const t=todayStr(); const cs=list('courses'); const ids=[],miss=[];
  for(const raw of cobjs){
    const co=typeof raw==='string'?{name:raw}:raw; if(!co||(!co.name&&!co.start)) continue;
    let best=null,bs=0;
    if(co.start){ // 날짜가 있으면 같은 날(±3일) 개강한 수업 중에서만 찾기
      for(const c of cs){ if(!c.start||Math.abs(diffDays(c.start,co.start))>3) continue;
        let sc=co.name?Math.max(nameSim(co.name,c.name),nameSim(co.name,subjectOf(c))):0;
        const sameRoom=co.room&&c.room&&String(co.room).trim().toUpperCase()===String(c.room).trim().toUpperCase();
        if(co.room&&c.room&&!sameRoom) sc-=0.4;                       // 강의실이 다르면 다른 반
        if(sameRoom) sc+=0.6;
        if(co.time&&c.time&&co.time.replace(/\s/g,'').slice(0,5)===String(c.time).replace(/\s/g,'').slice(0,5)) sc+=0.3;
        sc-=Math.abs(diffDays(c.start,co.start))*0.05; if(sc>bs){ bs=sc; best=c; } }
      if(best&&bs>=0.5){ ids.push(best.id); continue; }
      miss.push(co); continue;
    }
    const cands=cs.map(c=>({c,sc:Math.max(nameSim(co.name,c.name),nameSim(co.name,subjectOf(c)))})).filter(x=>x.sc>=0.75).map(x=>x.c);
    if(!cands.length){ miss.push(co); continue; }
    const run=cands.filter(c=>c.start<=t&&courseEnd(c)>=t), up=cands.filter(c=>c.start>t).sort((a,b)=>a.start<b.start?-1:1), past=cands.filter(c=>courseEnd(c)<t).sort((a,b)=>a.start<b.start?1:-1);
    ids.push((status==='수료'?(past[0]||run[0]||up[0]):(run[0]||up[0]||past[0])).id);
  }
  return {ids:[...new Set(ids)],miss};
}
function relinkStudents(){
  let n=0;
  for(const s of list('students')){
    if(!s.prevCourses||!s.prevCourses.length) continue;
    const {ids,miss}=matchCourseIds(s.prevCourses,s.status);
    if(!ids.length) continue;
    store.put('students',{...s,courses:[...new Set([...(s.courses||[]),...ids])],prevCourses:miss}); n++;
  }
  return n;
}

/* ---------- sound (synthesised, no files) ---------- */
function sfx(kind){
  if(!S.settings.sfx) return; if(!isHud()&&!/shard|roll|burst/.test(kind)) return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); const a=audioCtx, t=a.currentTime;
    const tone=(f,dur,type='sine',vol=0.05,delay=0,glide)=>{ const o=a.createOscillator(),g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,t+delay); if(glide) o.frequency.exponentialRampToValueAtTime(glide,t+delay+dur); g.gain.setValueAtTime(0.0001,t+delay); g.gain.exponentialRampToValueAtTime(vol,t+delay+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+delay+dur); o.connect(g).connect(a.destination); o.start(t+delay); o.stop(t+delay+dur+0.02); };
    if(kind==='nav'){ tone(1650,0.06,'sine',0.025); tone(2480,0.05,'sine',0.018,0.035); }
    else if(kind==='open'){ tone(520,0.18,'triangle',0.03,0,980); tone(1960,0.09,'sine',0.015,0.08); }
    else if(kind==='close'){ tone(900,0.14,'triangle',0.025,0,420); }
    else if(kind==='ok'){ tone(880,0.09,'sine',0.03); tone(1320,0.14,'sine',0.03,0.07); }
    else if(kind==='boot'){ [220,330,440,660].forEach((f,i)=>tone(f,0.6,'sine',0.025,i*0.09)); tone(1760,0.3,'sine',0.012,0.45,2640); }
    else if(kind==='roll'){ for(let i=0;i<7;i++) tone(2400-i*140,0.025,'triangle',0.009,i*0.032); }
    else if(kind==='shard'){ tone(3200+Math.random()*900,0.03,'triangle',0.012,0,1900); }
    else if(kind==='burst'){ const n=a.createBufferSource(), b=a.createBuffer(1,a.sampleRate*0.25,a.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3); n.buffer=b; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=2500; const g=a.createGain(); g.gain.value=0.05; n.connect(f).connect(g).connect(a.destination); n.start(t); }
    else if(kind==='alert'){ tone(1046,0.12,'square',0.02); tone(1046,0.12,'square',0.02,0.18); }
  }catch(e){}
}

/* ---------- voice briefing ---------- */
function briefingText(){
  const t=todayStr(), d=parseYmd(t), h=new Date().getHours();
  const hi=h<12?'좋은 아침입니다':h<18?'좋은 오후입니다':'좋은 저녁입니다';
  const un=activeAlarms().filter(a=>!a.ack);
  const run=list('courses').filter(c=>courseStatus(c).k==='run');
  const todayCls=run.filter(c=>progOf(c).todayIdx>=0);
  const tasks=list('tasks').filter(k=>!k.done&&k.due&&k.due<=t);
  const parts=[`${S.settings.name||''}님, ${hi}. 오늘은 ${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일입니다.`];
  if(un.length){ parts.push(`확인하실 알림이 ${un.length}건 있습니다.`); un.slice(0,3).forEach(a=>{ const n=diffDays(t,a.date); parts.push(`${subjectOf(a.c)} ${a.type==='start'?'개강':'종강'}이 ${n===0?'오늘':n===1?'내일':n+'일 뒤'}입니다.`); }); }
  else parts.push('지금 확인하실 알림은 없습니다.');
  parts.push(todayCls.length?`오늘 수업은 ${todayCls.length}개 진행됩니다.`:'오늘 예정된 수업은 없습니다.');
  if(tasks.length) parts.push(`오늘까지 처리할 업무가 ${tasks.length}건 남아 있습니다.`);
  parts.push('필요하신 게 있으면 말씀해 주세요.');
  return parts.join(' ');
}
function speak(text){
  if(!('speechSynthesis' in window)){ toast('이 브라우저는 음성 브리핑을 지원하지 않아요',''); return; }
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='ko-KR'; u.rate=1.02; u.pitch=0.92;
    const vs=speechSynthesis.getVoices().filter(v=>/ko/i.test(v.lang)); const pick=vs.find(v=>/male|남|Google|Yuna|Heami|InJoon/i.test(v.name))||vs[0]; if(pick) u.voice=pick;
    u.onstart=()=>document.body.classList.add('speaking'); u.onend=u.onerror=()=>document.body.classList.remove('speaking');
    speechSynthesis.speak(u); }catch(e){}
}

function bootSequence(lines){

  if(seen) return Promise.resolve();

    const under=light?'brightness(0) invert(1)':'brightness(0) opacity(.78)';

      LS=R*0.62; LT=cy-LS*0.42; logos.forEach(l=>Object.assign(l.style,{width:LS+'px',left:(cx-LS/2)+'px',top:LT+'px'})); nameEl.style.top=(cy+R+34)+'px'; lineEl.style.top=(cy+R+62)+'px'; };

    /* 물리 상태 */

    let level=0, lv=0, target=0;             // 0~1 물높이 (스프링)
    let E=0;                                 // 출렁임 에너지
    let tilt=0, tv=0;                        // 좌우 슬로시 (스프링)

    const net=Array.from({length:9},()=>({x:0,y:0,ox:(Math.random()-.5)*1.5,oy:0.15+Math.random()*0.8,ph:Math.random()*6}));

      net.forEach(n=>{ n.x=cx+n.ox*R+Math.sin(t*0.8+n.ph)*R*0.06; n.y=cy+n.oy*R+Math.cos(t*0.7+n.ph)*R*0.05; });
      /* 물 */
      if(level>0.002){
        x.save(); x.beginPath(); x.arc(cx,cy,R-1.5,0,Math.PI*2); x.clip();
        const step=3, L=cx-R, Rr=cx+R;
        // 뒤쪽 물결 (깊이감)
        x.beginPath(); x.moveTo(L,cy+R); for(let px=L;px<=Rr;px+=step){ const y=surf(px*0.93+R*0.37,t*0.85+2)-R*0.025; x.lineTo(px,y); } x.lineTo(Rr,cy+R); x.closePath();
        x.fillStyle=P.a2; x.globalAlpha=light?0.28:0.32; x.fill(); x.globalAlpha=1;
        // 앞쪽 물
        const top=lvlY(level)-R*0.1; const g=x.createLinearGradient(0,top,0,cy+R); g.addColorStop(0,P.a2); g.addColorStop(1,P.a1);
        x.beginPath(); x.moveTo(L,cy+R); const pts=[]; for(let px=L;px<=Rr;px+=step){ const y=surf(px,t); pts.push([px,y]); x.lineTo(px,y); } x.lineTo(Rr,cy+R); x.closePath();
        const sty=P.fx, lineArt=['dots','contour','strand','net'].includes(sty);
        if(sty==='bloom'){ x.shadowColor=P.a1; x.shadowBlur=R*0.25; }
        x.fillStyle=lineArt?ink(.1):g; x.globalAlpha=lineArt?1:(light?0.9:0.88); x.fill(); x.globalAlpha=1; x.shadowBlur=0;
        if(lineArt||sty==='caustic'||sty==='stars'){ x.save(); x.clip(); const yTop=lvlY(level)-R*0.15;
          if(sty==='dots'){ const sp=Math.max(5,R*0.085); x.fillStyle=ink(.85); for(let yy=cy+R;yy>yTop;yy-=sp) for(let px=L+((yy/sp)%2?sp/2:0);px<Rr;px+=sp){ const d=(cy+R-yy)/(2*R); x.beginPath(); x.arc(px,yy+Math.sin(px*0.05+t*2)*1.2,sp*0.22*(0.65+0.35*(1-d)),0,Math.PI*2); x.fill(); } }
          if(sty==='contour'){ x.strokeStyle=ink(.7); x.lineWidth=1; for(let k=0;k<26;k++){ x.beginPath(); pts.forEach(([px],n)=>{ const y=surf(px,t-k*0.09)+k*R*0.075; n?x.lineTo(px,y):x.moveTo(px,y); }); x.globalAlpha=Math.max(.15,1-k*0.04); x.stroke(); } x.globalAlpha=1; }
          if(sty==='strand'){ x.strokeStyle=ink(.55); x.lineWidth=1; const sp=Math.max(4,R*0.07), sh=(t*8)%sp; for(let k=-2*R;k<2*R;k+=sp){ x.beginPath(); x.moveTo(L+k+sh,cy+R); x.lineTo(L+k+sh+R*1.2,yTop); x.stroke(); } }
          if(sty==='net'){ const nodes=net; x.fillStyle=ink(.9); nodes.forEach(n=>{ x.beginPath(); x.arc(n.x,n.y,1.6,0,Math.PI*2); x.fill(); }); x.strokeStyle=ink(.35); x.lineWidth=0.8; for(let a=0;a<nodes.length;a++) for(let b=a+1;b<nodes.length;b++){ const dx=nodes[a].x-nodes[b].x, dy=nodes[a].y-nodes[b].y; if(dx*dx+dy*dy<(R*0.45)**2){ x.beginPath(); x.moveTo(nodes[a].x,nodes[a].y); x.lineTo(nodes[b].x,nodes[b].y); x.stroke(); } } }
          if(sty==='caustic'){ x.strokeStyle='rgba(255,255,255,.22)'; x.lineWidth=1.2; for(let k=1;k<6;k++){ x.beginPath(); for(let px=L;px<=Rr;px+=4){ const y=lvlY(level)+k*R*0.28+Math.sin(px*0.06+t*1.6+k)*R*0.05+Math.sin(px*0.023-t*0.9+k*2)*R*0.07; px===L?x.moveTo(px,y):x.lineTo(px,y); } x.stroke(); } }
          if(sty==='stars'){ stars.forEach(s=>{ const a=0.3+0.6*Math.abs(Math.sin(t*s.s+s.p)); x.fillStyle=`rgba(255,255,255,${a.toFixed(2)})`; x.fillRect(cx+s.x*R,cy+s.y*R,s.r,s.r); }); }
          x.restore(); }
        // 수면 하이라이트
        x.beginPath(); pts.forEach(([px,y],n)=>n?x.lineTo(px,y):x.moveTo(px,y)); const lineArtS=['dots','contour','strand','net'].includes(P.fx);
        if(P.fx==='exec'){ x.strokeStyle=P.head; x.lineWidth=1.6; }
        else if(lineArtS){ x.strokeStyle=ink(.95); x.lineWidth=1.6; }
        else { x.strokeStyle=`rgba(255,255,255,${light?0.55:0.45})`; x.lineWidth=1.4; if(P.fx==='hud'||P.fx==='glow'){ x.shadowColor=P.a2; x.shadowBlur=10; } }
        x.stroke(); x.shadowBlur=0;
        // 기포
        if(level>0.12&&Math.random()<dt*2.2) bubbles.push({x:cx+(Math.random()-.5)*R*1.1,y:cy+R*0.9,r:0.8+Math.random()*1.8,vy:-R*(0.35+Math.random()*0.4),ph:Math.random()*6});
        for(let n=bubbles.length-1;n>=0;n--){ const b=bubbles[n]; b.y+=b.vy*dt; b.x+=Math.sin(t*6+b.ph)*0.25; if(b.y<surf(b.x,t)+2){ bubbles.splice(n,1); continue; } x.beginPath(); x.arc(b.x,b.y,b.r,0,Math.PI*2); x.strokeStyle='rgba(255,255,255,.55)'; x.lineWidth=0.8; x.stroke(); }
        // 유리 안쪽 반사

        // 로고: 물에 잠긴 부분은 반전색
        const cut=[]; for(let s=0;s<=12;s++){ const px=cx-LS/2+LS*s/12; const yy=(surf(px,t)-LT)/(LS*0.82)*100; cut.push(`${(s/12*100).toFixed(1)}% ${Math.max(-5,Math.min(105,yy)).toFixed(1)}%`); }
        logoU.style.clipPath=`polygon(${cut.join(',')},100% 105%,0% 105%)`;
      } else logoU.style.clipPath='inset(100% 0 0 0)';
      /* 떨어지는 방울 */
      for(let n=drops.length-1;n>=0;n--){ const d=drops[n]; d.vy+=G*dt*(d.big?1.05:1); d.y+=d.vy*dt; const sy=d.big?lvlY(Math.max(level,0)):surf(d.x,t);
        if(d.y+d.r>=sy){ drops.splice(n,1); landed++;
          const imp=d.big?R*0.11:R*0.05; E+=imp; tv+=(d.x-cx)/R*(d.big?1.2:2.4)*(Math.random()<.5?1:-1)*0.6+((Math.random()-.5)*1.2);
          target=d.big?BASE:Math.min(1,BASE+(1-BASE)*Math.min(1,(landed-1)/Math.max(1,lines.length)*(lines.ready?1:0.92)));
          if(d.big){ introDone=true; lastSpawn=t-0.12; ring(t,R,R*1.9,.28,1.2); ring(t+0.1,R,R*1.45,.18,1); }
          const k=d.big?6:3; for(let s=0;s<k;s++){ const a=-Math.PI/2+(s-(k-1)/2)*(d.big?0.42:0.6)+(Math.random()-.5)*0.25, v=R*(d.big?2.6:1.6)*(0.8+Math.random()*0.5); spl.push({x:d.x,y:sy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:d.r*(0.28+Math.random()*0.22)}); }
          for(let s=0;s<(d.big?4:2);s++) bubbles.push({x:d.x+(Math.random()-.5)*R*0.2,y:sy+R*0.12+Math.random()*R*0.15,r:0.8+Math.random()*1.6,vy:-R*0.5,ph:Math.random()*6});
          continue; }
        x.save(); x.translate(d.x,d.y); const st=Math.min(0.6,d.vy/(R*12)); x.scale(1-st*0.3,1+st);
        x.beginPath(); x.moveTo(0,-d.r*1.25); x.bezierCurveTo(d.r*0.9,-d.r*0.2,d.r,d.r*0.9,0,d.r); x.bezierCurveTo(-d.r,d.r*0.9,-d.r*0.9,-d.r*0.2,0,-d.r*1.25);
        x.fillStyle=P.a1; x.globalAlpha=.92; x.fill(); x.globalAlpha=1; x.restore(); }
      /* 튀는 물방울 */
      for(let n=spl.length-1;n>=0;n--){ const s=spl[n]; s.vy+=G*dt; s.x+=s.vx*dt; s.y+=s.vy*dt; if(s.vy>0&&s.y>=surf(s.x,t)){ spl.splice(n,1); E+=R*0.006; continue; } if(s.y>cy+R+40){ spl.splice(n,1); continue; } x.beginPath(); x.arc(s.x,s.y,s.r,0,Math.PI*2); x.fillStyle=P.a2; x.globalAlpha=.9; x.fill(); x.globalAlpha=1; }
      /* 바깥 잔물결 */
      for(let n=rings.length-1;n>=0;n--){ const r=rings[n]; const p=(t-r.t)/r.dur; if(p<0) continue; if(p>=1){ rings.splice(n,1); continue; } const e=1-Math.pow(1-p,3); x.beginPath(); x.arc(cx,cy,r.r0+(r.r1-r.r0)*e,0,Math.PI*2); x.strokeStyle=ink(r.a*Math.pow(1-p,1.7)); x.lineWidth=1.2; x.stroke(); }
      /* 로고 · 이름 */
      const lo=introDone?Math.min(1,Math.max(0,(t-0.75)/0.6)):0; logos.forEach(l=>{ l.style.opacity=lo; l.style.transform=`scale(${0.9+0.1*(1-Math.pow(1-lo,3))})`; });
      nameEl.style.opacity=Math.min(1,Math.max(0,(t-0.95)/0.5));
      if(!done&&((lines.ready&&landed-1>=lines.length&&Math.abs(level-target)<0.01&&target>0.99&&t>2)||t>9)) finish(false);
      raf=requestAnimationFrame(frame);
    };
    raf=requestAnimationFrame(frame);
  });
}

/* ---------- command console ---------- */
let CMD=null;
function parseTaskCmd(q){
  const m=q.match(/^(할\s*일|업무|콜백|메모)\s*[:：]?\s*(.+)$/); if(!m) return null;
  let text=m[2].trim(), due=todayStr(), time='';
  if(/내일/.test(text)){ due=addDays(due,1); text=text.replace(/내일/,''); } else if(/모레/.test(text)){ due=addDays(due,2); text=text.replace(/모레/,''); }
  const dm=text.match(/(\d{1,2})\s*[\/월.]\s*(\d{1,2})\s*일?/); if(dm){ const y=inferYear(+dm[1],{today:todayStr()}); const v=validDate(y,+dm[1],+dm[2]); if(v){ due=v; text=text.replace(dm[0],''); } }
  const pm=/오후|저녁|밤/.test(text);
  const tm=text.match(/(\d{1,2})\s*:\s*(\d{2})/)||text.match(/(\d{1,2})\s*시(?:\s*(\d{1,2})\s*분|\s*반)?/);
  if(tm){ let hh=+tm[1]; let mm=tm[2]?+tm[2]:(/반/.test(tm[0])?30:0); if(pm&&hh<12) hh+=12; else if(!pm&&hh>=1&&hh<=7) hh+=12; time=`${pad(hh)}:${pad(mm)}`; text=text.replace(tm[0],''); }
  text=text.replace(/오전|오후|저녁|밤/g,'').replace(/\s+/g,' ').trim();
  const st=list('students').find(s=>text.includes(s.name));
  return {text:(m[1].includes('콜백')?`${st?st.name+' ':''}콜백 ${text.replace(st?st.name:'','').trim()}`.trim():text)||'할 일',due,time,cat:m[1].includes('콜백')?'콜백':'기타',sid:st?st.id:''};
}
function cmdResults(q){
  q=(q||'').trim(); const out=[]; const ql=q.toLowerCase();
  const tk=parseTaskCmd(q); if(tk) out.push({k:'NEW TASK',t:`${tk.text}`,h:`${dueLabel(tk)} · ${tk.cat}`,run:()=>{ if(S.demo) startReal(true); store.put('tasks',{id:uid('t'),...tk,done:false,at:Date.now()}); sfx('ok'); toast('할 일을 추가했어요',`${dueLabel(tk)} · ${tk.text}`); render(); }});
  if(!q||/브리핑|보고|briefing/i.test(q)) out.push({k:'VOICE',t:'오늘 브리핑 듣기',h:'알림 · 수업 · 할 일 요약',run:()=>speak(briefingText())});
  NAV.filter(x=>x.v&&(!q||x.t.includes(q))).forEach(x=>out.push({k:'GO',t:x.t,h:'화면 열기',run:()=>go(x.v)}));
  if(!q||/잠금|lock/i.test(q)) out.push({k:'LOCK',t:'화면 잠금',h:'',run:()=>lock()});
  Object.entries(BG_THEMES).filter(([k,th])=>q&&(/테마|디자인|배경|theme/i.test(q)||th.name.includes(q))).forEach(([k,th])=>out.push({k:'THEME',t:`테마 · ${th.name}`,h:S.settings.theme===k?'사용 중':'바꾸기',run:()=>{ S.settings.theme=k; store.saveSettings(); applyTheme(k); render(); }}));
  if(q){
    list('students').filter(s=>s.name.includes(q)||(q.replace(/\D/g,'').length>=4&&(s.phone||'').replace(/\D/g,'').includes(q.replace(/\D/g,'')))).slice(0,6).forEach(s=>out.push({k:'STUDENT',t:`${s.name} · ${s.status}`,h:s.phone||'',run:()=>openStudent(s.id)}));
    const subs=[...new Set(list('courses').map(subjectOf))].filter(x=>x.toLowerCase().includes(ql)||aliasNorm(x).includes(aliasNorm(q))).slice(0,5);
    subs.forEach(sb=>out.push({k:'NOTICE',t:`${sb} 개강안내 문자`,h:'과목 → 월 선택',run:()=>{ S.ntSubj=sb; S.ntMonth=null; S.noticeCourse=null; S.ntTplPicked=false; go('notice'); }}));
    list('courses').filter(c=>c.name.toLowerCase().includes(ql)).sort((a,b)=>a.start<b.start?1:-1).slice(0,5).forEach(c=>out.push({k:'COURSE',t:c.name,h:`${fmtMD(c.start)}~${fmtMD(courseEnd(c))} · ${roomLabel(c)}`,run:()=>openCourse(c.id)}));
  }
  return out.slice(0,12);
}
function openCmd(){
  if(CMD) return; sfx('open');
  const el=document.createElement('div'); el.className='cmd'; el.innerHTML=`<div class="cmd-box" role="dialog" aria-label="명령"><div class="cmd-in">${ic('search')}<input id="cmdQ" placeholder="무엇을 할까요? 예: 서민수 · DBMS · 콜백 내일 3시 홍길동" autocomplete="off">${(window.SpeechRecognition||window.webkitSpeechRecognition)?`<button class="cmd-mic" id="cmdMic" aria-label="음성으로 말하기">${ic('quote')}</button>`:''}</div><div class="cmd-list" id="cmdList"></div><div class="cmd-foot"><span>↑↓ 이동 · Enter 실행 · Esc 닫기</span><span>"할일 …" · "콜백 내일 3시 이름" 으로 바로 추가</span></div></div>`;
  document.body.appendChild(el); CMD={el,sel:0,items:[]};
  const q=$('#cmdQ'); const draw=()=>{ CMD.items=cmdResults(q.value); CMD.sel=Math.min(CMD.sel,Math.max(0,CMD.items.length-1)); $('#cmdList').innerHTML=CMD.items.length?CMD.items.map((r,i)=>`<div class="cmd-item ${i===CMD.sel?'sel':''}" data-i="${i}"><span class="k">${r.k}</span><span class="t">${esc(r.t)}</span><span class="h">${esc(r.h||'')}</span></div>`).join(''):'<div class="empty">찾는 게 없어요. "할일 …"로 적으면 바로 할 일로 추가돼요.</div>'; };
  const run=i=>{ const r=CMD.items[i]; if(!r) return; closeCmd(); r.run(); };
  q.addEventListener('input',()=>{ CMD.sel=0; draw(); });

const FX={

    const out=[]; for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){ const a=P[j][i],b=P[j][i+1],c=P[j+1][i+1],d=P[j+1][i]; if(Math.random()<.5) out.push([a,b,c],[a,c,d]); else out.push([a,b,d],[b,c,d]); }

function cleanTranscript(raw){
  const lines=String(raw||'').replace(/\r/g,'').split('\n');
  const out=[]; let cur=null;
  const spk=/^\s*(.{1,14}?)\s+(\d{1,2}:\d{2}(?::\d{2})?)\s*$/;
  for(let ln of lines){
    ln=ln.replace(/\s+/g,' ').trim(); if(!ln) continue;
    const m=ln.match(spk);
    if(m){ const who=m[1].trim(); if(cur&&cur.who===who) continue; cur={who,t:[]}; out.push(cur); continue; }
    if(/^\d{1,2}:\d{2}(:\d{2})?$/.test(ln)) continue;
    if(/^(클로바노트|CLOVA Note|녹음|참석자\s*\d*\s*$)/i.test(ln)) continue;
    if(!cur){ cur={who:'',t:[]}; out.push(cur); }
    cur.t.push(ln);
  }
  return out.filter(o=>o.t.length).map(o=>(o.who?o.who+': ':'')+o.t.join(' ')).join('\n');
}

     </div>`; }).join(''):'<div class="empty"><b>등록된 과제가 없어요</b><b>과제 제작</b>으로 과목 · 난이도를 고르면 시험지가 바로 만들어지고, 답안을 넣으면 자동으로 채점 · 분석돼요. 주차별 과제를 쌓아 두면 다음 과제 출제 요청문에 지난 진도와 점수가 자동으로 들어가요.</div>'}

/* ---------- 첨삭 탭 ---------- */

  const nextLabel=vs.length?DOC_LABELS[Math.min(DOC_LABELS.length-1,DOC_LABELS.indexOf(vs[0].label)+1)]||'첨삭본':'학생 원본';

   <div class="seg wk-kinds">${DOC_KINDS.map(k=>`<button class="${dk===k?'on':''}" data-act="wDocKind" data-k="${k}">${k} <small>${(s.docs||[]).filter(v=>v.kind===k).length||''}</small></button>`).join('')}</div>
   <div class="wk-panel"><div class="wk-row"><select id="wdLabel" class="in" style="max-width:170px">${DOC_LABELS.map(l=>`<option ${l===nextLabel?'selected':''}>${l}</option>`).join('')}</select><span class="wk-cnt" id="wdCnt">0자</span></div>
     <textarea id="wdText" class="in" rows="7" placeholder="${interview?'면접 체크리스트 답변을 붙여넣으세요':dk+' 글을 붙여넣으세요'}"></textarea>

   <div class="btns">${interview?`<button class="btn sm" data-act="wPrompt" data-k="docInterview">${ic('send')}소견서 요청문</button><button class="btn sm" data-act="wPrompt" data-k="docOnsite">${ic('send')}현장 피드백 정리 요청문</button>`
     :`<button class="btn sm" data-act="wPrompt" data-k="docFeedback">${ic('send')}피드백 요청문</button><button class="btn sm" data-act="wPrompt" data-k="docFinal">${ic('send')}최종본 다듬기 요청문</button>`}</div>
   ${vs.length?vs.map(v=>`<div class="wk-ver"><div class="wk-as-h"><b>${esc(v.label)}</b><span class="grow wk-as-m">${fmtMD(v.d)} · 공백 포함 ${v.text.length}자</span><button class="btn sm ghost" data-act="wDocCopy" data-id="${v.id}">${ic('copy')}</button><button class="btn sm ghost" data-act="wDocDel" data-id="${v.id}">${ic('trash')}</button></div>${wClamp(v.text,180)}</div>`).join('')

  </div>`;

/* ---------- Claude 요청문 ---------- */
function stuProfile(s){
  const cs=(s.courses||[]).map(id=>D().courses[id]).filter(Boolean).map(c=>`${c.name} (${fmtMD(c.start)}~${fmtMD(courseEnd(c))})`);
  const recent=(s.logs||[]).slice().sort((a,b)=>(b.d||'').localeCompare(a.d||'')).slice(0,6).map(l=>`- ${l.d} [${(LOG_KINDS[l.k]||['기록'])[0]}] ${String(l.t).replace(/\n+/g,' ').slice(0,180)}`);
  return [`학생: ${s.name||'(이름)'}${s.status?` · ${s.status}`:''}${s.type?` · ${s.type}`:''}`,
    s.goal?`목표 · 관심: ${s.goal}`:'', cs.length?`수강: ${cs.join(', ')}`:'', s.memo?`메모: ${String(s.memo).replace(/\n+/g,' ').slice(0,300)}`:'',
    recent.length?`최근 기록:\n${recent.join('\n')}`:''].filter(Boolean).join('\n');
}
function buildPrompt(k,s,id){
  const as=(s.assigns||[]).slice().sort((a,b)=>(a.week||0)-(b.week||0));
  const latest=kind=>(s.docs||[]).filter(v=>v.kind===kind).sort((a,b)=>(b.at||0)-(a.at||0))[0];
  const dk=s._dk||'자기소개서';
  if(k==='asMake'){ const next=(as.length?+as[as.length-1].week||0:0)+1;
    return `[과제 출제 요청]\n${stuProfile(s)}\n\n지금까지 과제:\n${as.length?as.map(a=>`- ${a.week}주차 ${a.title||''} · ${(AS_STEPS.find(x=>x[0]===a.st)||[])[1]||''}${a.score?` · 점수 ${a.score}`:''}${a.fb?` · ${a.fb}`:''}`).join('\n'):'- 없음 (첫 과제)'}\n\n이번에 공부한 범위:\n(학생이 보낸 정리 내용을 여기에 붙여넣어 주세요)\n\n요청:\n- 위 범위에 맞춘 ${next}주차 과제를 만들어 주세요. 기본 문제 8~10개와 심화 2~3개, 난이도는 중간으로 해 주세요.\n- 지난 과제에서 약했던 부분이 있으면 한두 문제 다시 다뤄 주세요.\n- 학원 유인물 형태로, AI가 만든 티가 나지 않게 작성하고 워드 파일로 만들어 주세요.\n- 정답보다 코드 이해가 중점입니다. 틀려도 되니 코드를 어떻게 분석했는지, 구조를 어떻게 짰는지 리포트 형식으로 제출하라는 안내를 넣어 주세요.`; }
  if(k==='asGrade'){ const a=(s.assigns||[]).find(x=>x.id===id)||{};
    return `[과제 첨삭 요청]\n${stuProfile(s)}\n\n과제: ${a.week}주차 ${a.title||''}\n\n[과제 내용]\n${a.body||'(과제 내용)'}\n\n[학생 제출 답안 · 리포트]\n${a.ans||'(학생 답안을 붙여넣어 주세요)'}\n\n요청:\n- 정답 여부보다 코드 이해와 구조 설계를 중심으로 문항별로 판독해 주세요.\n- 잘한 점, 잘못 이해한 개념, 다음 과제에서 보완할 점을 짧게 정리해 주세요.\n- 끝에 총평 3줄과 10점 만점 점수를 붙여 주세요.`; }
  if(k==='docFeedback'){ const v=latest(dk);
    return `[${dk} 피드백 요청]\n${stuProfile(s)}\n\n아래는 학생이 쓴 ${dk}${v?` (${v.label}, 공백 포함 ${v.text.length}자)`:''}입니다.\n---\n${v?v.text:'(글을 붙여넣어 주세요)'}\n---\n\n요청 양식:\n- 자기소개서는 소프트웨어 역량·경험 / 인성·공동체 / 진학 이유, 학업계획서는 지원동기 / 3개년 로드맵 / 졸업 후 진로 항목별로 좋은 점 · 아쉬운 점 · 핵심 문제를 짧은 메모체로 적어 주세요.\n- 끝에 공백 포함 글자수와, 1000자 이내 · '문제→해결' 흐름에 대한 코멘트를 붙여 주세요.\n- 학생이 쓰지 않은 사실(경험·장면)은 절대 추가하지 마세요.`; }
  if(k==='docFinal'){ const v=latest(dk);
    return `[${dk} 최종본 다듬기 요청]\n${stuProfile(s)}\n\n---\n${v?v.text:'(글을 붙여넣어 주세요)'}\n---\n\n요청:\n- 중학생 수준의 문장을 유지하고, AI가 쓴 티가 나지 않게 해 주세요.\n- 학생 내용은 바꾸지 말고 흐름과 문장만 다듬어 주세요. 학생이 쓰지 않은 사실은 절대 추가하지 마세요.\n- 결과는 이름 등 정보표가 있는 이력서식 격식 양식의 워드 파일로 만들어 주세요.`; }
  if(k==='docInterview'){ const v=latest('면접 답변');
    return `[면접 답변 첨삭 · 소견서 요청]\n${stuProfile(s)}\n\n아래는 학생의 면접 체크리스트 답변입니다.\n---\n${v?v.text:'(답변을 붙여넣어 주세요)'}\n---\n\n요청:\n- 문항별로 첨삭하고, 학생별 소견서를 작성해 주세요.\n- 문체는 '~니다'체가 아닌 문어체(다나까)로, 격식 있게, AI가 쓴 티가 나지 않게 써 주세요.\n- 소견서는 멘토 본인이 직접 쓴 것처럼 써 주세요. "학생에게 전달", "멘토가 ~" 같은 제3자 지시 문구는 쓰지 마세요.\n- 학생이 쓰지 않은 사실은 추가하지 마세요.\n- PDF로 만들 수 있게 정리해 주세요.`; }
  if(k==='docOnsite'){ const v=latest('면접 답변');
    return `[현장 피드백 정리 요청]\n${stuProfile(s)}\n\n오늘 학생과 대면으로 피드백했습니다. 원고는 더 바꾸지 말고, 학생이 스스로 고칠 포인트만 정리해 주세요.\n---\n${v?v.text:'(학생 답변 또는 현장 메모를 붙여넣어 주세요)'}\n---\n\n요청:\n- 멘토 본인이 직접 쓴 문서처럼 써 주세요. "학생에게 전달", "멘토가 ~" 같은 제3자 지시 문구는 쓰지 마세요.\n- 고칠 포인트는 짧고 구체적으로, 우선순위 순서로 정리해 주세요.`; }
  if(k==='transcript'){ const raw=($('#wlRaw')&&$('#wlRaw').value)||'';
    return `[상담 녹취 정리 요청]\n${stuProfile(s)}\n\n아래는 클로바노트로 뽑은 상담 녹취 스크립트입니다.\n---\n${raw||'(녹취 텍스트를 붙여넣어 주세요)'}\n---\n\n요청:\n- 대사가 이상하게 인식된 부분과 오탈자를 고치고, 상담자와 학생 화자를 바로잡아 자연스러운 대화문으로 정리해 주세요.\n- 끝에 상담 요약(학생 상황 · 관심 과정 · 걸림돌 · 다음 할 일)을 5줄 이내로 붙여 주세요.`; }
  if(k==='prep'){
    return `[상담 준비 요청]\n${stuProfile(s)}\n${as.length?`\n과제 진행: ${as.map(a=>`${a.week}주차 ${(AS_STEPS.find(x=>x[0]===a.st)||[])[1]}${a.score?`(${a.score})`:''}`).join(', ')}`:''}\n\n요청:\n- 위 기록을 바탕으로 이번 상담에서 꼭 확인할 것 3가지와, 학생이 망설일 만한 부분에 대한 답변 포인트를 정리해 주세요.\n- 국비지원(내일배움카드 · KDT 등)과 연결할 수 있으면 함께 짚어 주세요.\n- 상담 후 보낼 짧은 문자 초안도 하나 써 주세요.`; }
  return '';
}
function copyPrompt(txt){
  const ok=()=>toast('요청문을 복사했어요','Claude 대화창에 붙여넣으면 돼요. 받은 결과는 다시 여기에 저장해 두세요.');

/* ---------- 진단 결과 수신함 ---------- */
S.inbox=S.inbox||{};
function inboxList(all){ return Object.values(S.inbox||{}).filter(x=>x&&(all||!x.done)).sort((a,b)=>(b.at||0)-(a.at||0)); }
const digits=v=>String(v||'').replace(/\D/g,'');
function inboxMatch(r){ const p=digits(r.phone); const st=list('students');
  return (p.length>=8&&st.find(s=>digits(s.phone).slice(-8)===p.slice(-8)))||(r.name&&st.find(s=>s.name.replace(/\s/g,'')===String(r.name).replace(/\s/g,'')))||null; }
function inboxSection(){
  if(S.mode!=='gas') return '';

  return `<section class="pane"><h2>진단 결과 수신함 <small>학생이 진단 · 테스트를 마치면 여기로 들어와요</small>${items.length?`<span class="chip warn r">새 결과 ${items.length}</span>`:''}</h2>
    ${items.length?`<div class="list">${items.map(r=>{ const m=inboxMatch(r); return `<div class="row wk-in"><div class="grow"><div class="t1">${esc(r.test||'진단')} · ${esc(r.name||'이름 없음')}${r.score?` · <b>${esc(r.score)}</b>`:''}</div><div class="t2">${r.phone?esc(r.phone)+' · ':''}${r.at?new Date(r.at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):''}${r.summary?' · '+esc(String(r.summary).slice(0,120)):''}</div></div>
      ${m?`<button class="btn sm pri" data-act="wInAttach" data-id="${r.id}" data-sid="${m.id}">${esc(m.name)}에게 붙이기</button>`:`<select class="in wk-insel" id="wis_${r.id}"><option value="">학생 선택</option>${sts.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><button class="btn sm" data-act="wInAttach" data-id="${r.id}">붙이기</button><button class="btn sm" data-act="wInLead" data-id="${r.id}">새 상담 학생</button>`}
      <button class="btn sm ghost" data-act="wInHide" data-id="${r.id}" aria-label="숨기기">${ic('x')}</button></div>`; }).join('')}</div>`

function inboxAttach(rid,sid){
  const r=S.inbox[rid]; const s=D().students[sid]; if(!r||!s) return;

  o.logs.push({id:wid('l'),k:'diag',d:r.at?ymd(new Date(r.at)):todayStr(),t:txt,url:r.url||'',at:Date.now()}); store.put('students',o);

}

/* ---------- 업무 허브 (업무 화면 위쪽) ---------- */
function workHub(){
  const t=todayStr(); const st=list('students'); const rows=[];
  st.forEach(s=>(s.assigns||[]).forEach(a=>{ if(a.st==='sub') rows.push({g:'grade',s,a,txt:`${a.week}주차 ${a.title||''}`}); else if(a.st==='set'&&a.due&&a.due<t) rows.push({g:'late',s,a,txt:`${a.week}주차 ${a.title||''} · 마감 ${fmtMD(a.due)}`}); }));
  const recentDocs=[]; st.forEach(s=>{ const v=(s.docs||[]).slice().sort((a,b)=>(b.at||0)-(a.at||0))[0]; if(v&&v.label!=='최종본'&&diffDays(v.d,t)<=21) recentDocs.push({s,v}); });
  const inbox=S.mode==='gas'?inboxList().length:0;
  const g=k=>rows.filter(r=>r.g===k);
  const card=(title,n,body,cls='')=>`<div class="wk-hub-c ${cls}"><div class="wk-hub-n">${n}</div><div class="wk-hub-t">${title}</div>${body}</div>`;
  const lst=arr=>arr.length?`<div class="wk-hub-l">${arr.slice(0,4).map(r=>`<button data-act="wOpen" data-id="${r.s.id}" data-tab="${r.tab||'as'}">${esc(r.s.name)} · ${esc(r.txt)}</button>`).join('')}</div>`:'';
  if(!rows.length&&!recentDocs.length&&!inbox) return '';
  return `<section class="pane"><h2>학생 업무 <small>과제 · 첨삭 · 진단 결과</small><button class="btn sm r" data-act="wLead">${ic('plus')}빠른 상담 등록</button></h2><div class="wk-hub">
    ${card('채점 대기',g('grade').length,lst(g('grade')),g('grade').length?'warn':'')}
    ${card('마감 지난 과제',g('late').length,lst(g('late')),g('late').length?'bad':'')}
    ${card('첨삭 진행 중',recentDocs.length,lst(recentDocs.map(x=>({s:x.s,tab:'doc',txt:`${x.v.kind} · ${x.v.label}`}))))}
    ${S.mode==='gas'?card('새 진단 결과',inbox,inbox?'<div class="wk-hub-l"><button data-go="alarms">수신함 열기</button></div>':'',inbox?'warn':''):''}
  </div></section>`;
}

 {t:2,l:1,q:'왼쪽 테이블의 모든 행을 남기고 오른쪽은 일치하는 것만 붙이는 조인은?',o:['INNER JOIN','LEFT OUTER JOIN','RIGHT OUTER JOIN','NATURAL JOIN'],a:2,e:'일치하지 않는 오른쪽 값은 NULL로 채워져요.'},
 {t:2,l:2,q:'A 테이블 5행, B 테이블 4행을 CROSS JOIN 하면 결과 행 수는?',o:['9','20','5','4'],a:2,e:'모든 조합이라 5 × 4 = 20행이에요.'},
 {t:2,l:2,q:'직원 10명 중 3명이 부서가 없을 때(DEPTNO가 NULL), EMP LEFT JOIN DEPT 결과 행 수는? (부서는 모두 존재)',o:['7','10','13','3'],a:2,e:'LEFT JOIN은 왼쪽(EMP) 행을 모두 남겨요.'},
 {t:2,l:2,q:'같은 테이블을 두 번 사용해 직원과 그 상사 이름을 함께 조회하는 조인은?',o:['CROSS JOIN','셀프 조인','NATURAL JOIN','FULL OUTER JOIN'],a:2,e:'같은 테이블에 별칭을 두 개 붙여 조인해요.'},
 {t:2,l:3,q:'A(1,2,3), B(2,3,4)를 같은 값으로 FULL OUTER JOIN 하면 결과 행 수는?',o:['2','3','4','6'],a:3,e:'일치하는 2, 3에 A만 있는 1, B만 있는 4를 더해 4행이에요.'},
 {t:2,l:3,q:"LEFT JOIN에서 오른쪽 테이블 조건을 ON이 아닌 WHERE에 쓰면 생기는 일은?",o:['결과가 같다','INNER JOIN처럼 동작할 수 있다','문법 오류가 난다','행이 늘어난다'],a:2,e:'WHERE에서 오른쪽 열 조건을 걸면 NULL인 행이 걸러져 사실상 INNER JOIN이 돼요.'},
 {t:2,l:3,q:'NATURAL JOIN에 대한 설명으로 틀린 것은?',o:['이름이 같은 열을 기준으로 조인한다','조인 열에 테이블 별칭(접두사)을 붙일 수 없다','ON 절로 조건을 직접 지정한다','같은 이름 열은 결과에 한 번만 나온다'],a:3,e:'NATURAL JOIN은 ON이나 USING 없이 같은 이름 열로 자동 조인해요.'},
 {t:3,l:1,q:'서브쿼리는 어디에 쓰나요?',o:['괄호 안에 들어간 SELECT 문','두 테이블을 합치는 키워드','정렬 방법','테이블 이름'],a:1,e:'SQL 안에 괄호로 넣은 또 다른 SELECT를 서브쿼리라고 해요.'},
 {t:3,l:1,q:'평균 급여보다 많이 받는 직원을 찾는 SQL로 알맞은 것은?',o:['SELECT * FROM EMP WHERE SAL > AVG(SAL)','SELECT * FROM EMP WHERE SAL > (SELECT AVG(SAL) FROM EMP)','SELECT * FROM EMP HAVING SAL > AVG(SAL)','SELECT AVG(SAL) FROM EMP WHERE SAL >'],a:2,e:'평균을 서브쿼리로 먼저 구해서 비교해요.'},
 {t:3,l:1,q:'서브쿼리 결과가 여러 행일 때 = 대신 쓰는 연산자는?',o:['LIKE','IN','BETWEEN','IS'],a:2,e:'여러 값 중 하나와 같은지 비교할 때 IN을 써요.'},
 {t:3,l:2,q:'서브쿼리 결과가 한 행이라도 있으면 참이 되는 연산자는?',o:['IN','EXISTS','ANY','ALL'],a:2,e:'EXISTS는 결과 존재 여부만 확인해요.'},
 {t:3,l:2,q:'SAL > ALL (100, 200, 300)과 같은 의미는?',o:['SAL > 100','SAL > 300','SAL > 200','SAL > 600'],a:2,e:'ALL은 모든 값보다 커야 하니 가장 큰 300보다 커야 해요.'},
 {t:3,l:2,q:'FROM 절에 쓰는 서브쿼리를 부르는 이름은?',o:['스칼라 서브쿼리','인라인 뷰','상관 서브쿼리','중첩 함수'],a:2,e:'FROM 절 서브쿼리는 임시 테이블처럼 쓰여서 인라인 뷰라고 해요.'},
 {t:3,l:3,q:'바깥 쿼리의 열을 서브쿼리 안에서 참조하는 서브쿼리는?',o:['인라인 뷰','상관 서브쿼리','단일 행 서브쿼리','스칼라 함수'],a:2,e:'바깥 행마다 서브쿼리가 다시 계산돼요.'},
 {t:3,l:3,q:'SAL > ANY (100, 200, 300)과 같은 의미는?',o:['SAL > 100','SAL > 300','SAL > 600','SAL IN (100, 200, 300)'],a:1,e:'ANY는 하나라도 만족하면 되니 가장 작은 100보다 크면 돼요.'},
 {t:3,l:3,q:'SELECT 절에 쓰여 한 행 한 값을 돌려주는 서브쿼리는?',o:['인라인 뷰','스칼라 서브쿼리','다중 열 서브쿼리','EXISTS 서브쿼리'],a:2,e:'스칼라 서브쿼리는 반드시 한 행, 한 열을 돌려줘야 해요.'},
 {t:4,l:1,q:'새 행을 추가하는 SQL 명령은?',o:['ADD','INSERT','UPDATE','CREATE'],a:2,e:'INSERT INTO 테이블 VALUES (...) 형태예요.'},
 {t:4,l:1,q:'테이블을 새로 만드는 명령은?',o:['MAKE TABLE','CREATE TABLE','NEW TABLE','INSERT TABLE'],a:2,e:'DDL인 CREATE TABLE로 만들어요.'},
 {t:4,l:1,q:'기존 행의 값을 바꾸는 명령은?',o:['UPDATE','ALTER','MODIFY','CHANGE'],a:1,e:'UPDATE 테이블 SET 열 = 값 WHERE 조건 형태예요.'},
 {t:4,l:2,q:'다음 중 DDL이 아닌 것은?',o:['CREATE','ALTER','DROP','DELETE'],a:4,e:'DELETE는 데이터를 지우는 DML이에요.'},
 {t:4,l:2,q:'기본키(PRIMARY KEY)의 특징으로 알맞은 것은?',o:['NULL을 허용한다','중복을 허용한다','UNIQUE와 NOT NULL을 모두 만족한다','테이블에 여러 개 만들 수 있다'],a:3,e:'기본키는 유일하고 비어 있으면 안 돼요.'},
 {t:4,l:2,q:'트랜잭션의 변경 내용을 확정하는 명령은?',o:['SAVE','COMMIT','ROLLBACK','END'],a:2,e:'COMMIT으로 확정하고 ROLLBACK으로 되돌려요.'},
 {t:4,l:3,q:'테이블 구조는 남기고 데이터만 모두 지우며, 되돌릴 수 없는 명령은?',o:['DELETE','DROP','TRUNCATE','ROLLBACK'],a:3,e:'TRUNCATE는 구조는 남기고 데이터를 지우며 ROLLBACK이 안 돼요.'},
 {t:4,l:3,q:'트랜잭션의 ACID 중 "모두 실행되거나 전혀 실행되지 않아야 한다"는 특성은?',o:['원자성','일관성','고립성','지속성'],a:1,e:'원자성(Atomicity)이에요.'},
 {t:4,l:3,q:'외래키(FK)로 참조 중인 부모 행을 지울 때 자식 행도 함께 지우는 옵션은?',o:['ON DELETE SET NULL','ON DELETE CASCADE','ON DELETE RESTRICT','ON UPDATE CASCADE'],a:2,e:'CASCADE는 부모 삭제를 자식에게 이어서 적용해요.'},
 {t:5,l:1,q:'업무에서 관리할 대상(사람, 장소, 사건 등)을 무엇이라고 하나요?',o:['속성','엔터티','관계','도메인'],a:2,e:'관리할 대상의 집합이 엔터티예요.'},
 {t:5,l:1,q:'엔터티의 각 행을 유일하게 구별하는 속성은?',o:['식별자','도메인','관계','인덱스'],a:1,e:'식별자로 인스턴스를 구분해요.'},
 {t:5,l:1,q:'속성이 가질 수 있는 값의 범위를 무엇이라고 하나요?',o:['도메인','카디널리티','튜플','스키마'],a:1,e:'예: 성별 속성의 도메인은 남, 여.'},
 {t:5,l:2,q:'제1정규형의 조건은?',o:['부분 함수 종속 제거','모든 속성 값이 원자값','이행 함수 종속 제거','다치 종속 제거'],a:2,e:'한 칸에 값이 하나만 들어가야 해요.'},
 {t:5,l:2,q:'제2정규형에서 제거하는 것은?',o:['반복 그룹','부분 함수 종속','이행 함수 종속','조인 종속'],a:2,e:'복합 키의 일부에만 종속된 속성을 분리해요.'},
 {t:5,l:2,q:'A → B, B → C 일 때 A → C가 성립하는 종속을 없애는 정규형은?',o:['제1정규형','제2정규형','제3정규형','BCNF'],a:3,e:'이행 함수 종속 제거가 제3정규형이에요.'},
 {t:5,l:3,q:'조회 성능을 위해 일부러 중복을 허용하는 작업은?',o:['정규화','반정규화','인덱싱','파티셔닝'],a:2,e:'반정규화는 성능을 위해 정규화를 일부 되돌려요.'},
 {t:5,l:3,q:'부모 엔터티의 식별자가 자식 엔터티의 주식별자 일부가 되는 관계는?',o:['비식별 관계','식별 관계','순환 관계','배타 관계'],a:2,e:'부모 식별자가 자식 기본키에 포함되면 식별 관계예요.'},
 {t:5,l:3,q:'한 학생이 여러 과목을 듣고 한 과목도 여러 학생이 들을 때, 이를 해소하는 방법은?',o:['1:1 관계로 바꾼다','관계 엔터티(수강)를 만든다','학생 엔터티를 삭제한다','속성을 합친다'],a:2,e:'M:N 관계는 중간 엔터티로 1:N 두 개로 나눠요.'}
 ]},
linux:{cat:'base',name:'리눅스',topics:[
 {n:'파일 · 디렉터리',study:['pwd · ls · cd · mkdir · touch로 폴더를 만들고 이동하는 연습부터 하세요.','cp · mv · rm 옵션(-r, -i, -f)과 절대 경로 · 상대 경로(. ..)를 구분하세요.','find · 링크(ln, ln -s) · 디렉터리 구조(/etc, /var, /home, /tmp)의 역할을 정리하세요.']},
 {n:'권한 · 소유권',study:['ls -l 결과의 rwxr-xr-x를 사용자 · 그룹 · 기타로 끊어 읽는 연습을 하세요.','chmod 숫자 표기(755, 644)와 기호 표기(u+x), chown · chgrp를 직접 실습하세요.','SetUID · SetGID · Sticky Bit, umask 계산을 정리하세요.']},
 {n:'프로세스 · 작업',study:['ps · top으로 실행 중인 프로세스를 보고 PID를 찾는 연습을 하세요.','kill 시그널(15, 9), &와 jobs · fg · bg로 작업을 오가는 법을 익히세요.','nice · renice 우선순위, nohup, cron 예약 작업의 형식을 정리하세요.']},
 {n:'사용자 · 그룹',study:['useradd · passwd · userdel로 계정을 만들고 지워 보세요.','/etc/passwd · /etc/shadow · /etc/group 파일의 각 필드 의미를 정리하세요.','su · sudo 차이, usermod 옵션(-aG 등), 계정 잠금 정책을 정리하세요.']},
 {n:'셸 · 텍스트 처리',study:['cat · head · tail · less로 파일 내용을 보는 명령을 손에 익히세요.','리다이렉션(> >> <)과 파이프(|), grep으로 원하는 줄만 뽑는 연습을 하세요.','sort · uniq · wc · cut · awk · sed를 파이프로 이어 로그를 분석해 보세요.']},
 {n:'패키지 · 서비스 · 네트워크',study:['ip addr(ifconfig) · ping으로 내 컴퓨터의 네트워크 상태를 확인해 보세요.','systemctl로 서비스 시작 · 중지 · 상태 확인, 패키지 설치(apt · dnf)를 실습하세요.','ss(netstat)로 열린 포트 확인, 방화벽(firewalld · ufw), 로그 위치(/var/log)를 정리하세요.']}],
 q:[
 {t:0,l:1,q:'현재 작업 중인 디렉터리 경로를 보여 주는 명령은?',o:['ls','cd','pwd','dir'],a:3,e:'pwd = print working directory.'},
 {t:0,l:1,q:'새 디렉터리를 만드는 명령은?',o:['mkdir','touch','newdir','md'],a:1,e:'mkdir 디렉터리명.'},
 {t:0,l:1,q:'숨김 파일까지 모두 보여 주는 ls 옵션은?',o:['-l','-a','-h','-r'],a:2,e:'점(.)으로 시작하는 숨김 파일까지 보여 줘요.'},
 {t:0,l:2,q:'디렉터리와 그 안의 내용을 모두 복사하는 명령은?',o:['cp dir1 dir2','cp -r dir1 dir2','mv -r dir1 dir2','copy dir1 dir2'],a:2,e:'-r은 하위 내용까지 재귀적으로 복사해요.'},
 {t:0,l:2,q:'현재 위치가 /home/user/docs일 때 cd ../.. 후의 위치는?',o:['/home/user','/home','/','/home/user/docs'],a:2,e:'..은 상위 디렉터리, 두 번 올라가면 /home이에요.'},
 {t:0,l:2,q:'파일 이름을 바꿀 때 쓰는 명령은?',o:['rename','cp','mv','ln'],a:3,e:'mv 기존이름 새이름으로 이름을 바꿔요.'},
 {t:0,l:3,q:'/etc 아래에서 이름이 .conf로 끝나는 파일을 찾는 명령은?',o:['find /etc -name "*.conf"','grep /etc .conf','ls /etc | find conf','locate -etc conf'],a:1,e:'find 경로 -name 패턴 형식이에요.'},
 {t:0,l:3,q:'원본을 지우면 연결이 끊어지는 링크는?',o:['하드 링크','심볼릭 링크','둘 다','둘 다 아님'],a:2,e:'심볼릭 링크는 경로만 가리켜서 원본이 사라지면 깨져요.'},
 {t:0,l:3,q:'시스템 로그 파일이 주로 저장되는 디렉터리는?',o:['/etc','/var/log','/usr/bin','/home'],a:2,e:'/var는 계속 바뀌는 데이터, 그중 log가 로그예요.'},
 {t:1,l:1,q:'ls -l 결과 -rw-r--r-- 에서 소유자의 권한은?',o:['읽기만','읽기 · 쓰기','읽기 · 쓰기 · 실행','실행만'],a:2,e:'첫 글자(파일 종류) 다음 세 글자 rw-가 소유자 권한이에요.'},
 {t:1,l:1,q:'파일 권한을 바꾸는 명령은?',o:['chown','chmod','chgrp','perm'],a:2,e:'change mode의 줄임말이에요.'},
 {t:1,l:1,q:'권한 숫자 표기에서 r, w, x의 값은?',o:['1, 2, 4','4, 2, 1','3, 2, 1','4, 1, 2'],a:2,e:'읽기 4, 쓰기 2, 실행 1을 더해요.'},
 {t:1,l:2,q:'chmod 750 file 실행 후 권한은?',o:['rwxr-x---','rwxr-xr-x','rw-r-----','rwx---r-x'],a:1,e:'7=rwx, 5=r-x, 0=---.'},
 {t:1,l:2,q:'파일 소유자를 user1로 바꾸는 명령은?',o:['chmod user1 file','chown user1 file','chgrp user1 file','own user1 file'],a:2,e:'chown은 소유자를 바꿔요.'},
 {t:1,l:2,q:'소유자에게만 실행 권한을 추가하는 기호 표기는?',o:['chmod a+x file','chmod u+x file','chmod g+x file','chmod o+x file'],a:2,e:'u=소유자, g=그룹, o=기타, a=모두.'},
 {t:1,l:3,q:'umask가 022일 때 새로 만든 파일의 기본 권한은?',o:['755','644','666','600'],a:2,e:'파일 기본 666에서 022를 빼면 644예요.'},
 {t:1,l:3,q:'/tmp처럼 누구나 쓸 수 있지만 자기 파일만 지울 수 있게 하는 특수 권한은?',o:['SetUID','SetGID','Sticky Bit','umask'],a:3,e:'Sticky Bit가 설정되면 ls -l에 t로 보여요.'},
 {t:1,l:3,q:'passwd 명령처럼 실행하는 동안 소유자(root) 권한으로 동작하게 하는 특수 권한은?',o:['Sticky Bit','SetUID','SetGID','ACL'],a:2,e:'SetUID가 있으면 실행 중에 파일 소유자의 권한을 얻어요.'},
 {t:2,l:1,q:'실행 중인 프로세스 목록을 보여 주는 명령은?',o:['ps','ls','pwd','cat'],a:1,e:'ps aux로 전체 프로세스를 볼 수 있어요.'},
 {t:2,l:1,q:'프로세스를 종료하는 명령은?',o:['stop','kill','end','exit'],a:2,e:'kill PID로 종료 신호를 보내요.'},
 {t:2,l:1,q:'CPU · 메모리 사용량을 실시간으로 보여 주는 명령은?',o:['top','free -s','df','du'],a:1,e:'top은 계속 갱신되는 화면을 보여 줘요.'},
 {t:2,l:2,q:'명령을 백그라운드로 실행하려면 끝에 무엇을 붙이나요?',o:['&','|','>','*'],a:1,e:'명령 & 형태로 실행해요.'},
 {t:2,l:2,q:'kill -9 PID가 보내는 시그널은?',o:['SIGTERM','SIGKILL','SIGHUP','SIGINT'],a:2,e:'9번 SIGKILL은 강제 종료예요. 기본값은 15번 SIGTERM.'},
 {t:2,l:2,q:'백그라운드 작업을 다시 앞으로 가져오는 명령은?',o:['bg','fg','jobs','nohup'],a:2,e:'fg %작업번호.'},
 {t:2,l:3,q:'crontab 항목 "0 2 * * 1 /backup.sh"의 실행 시점은?',o:['매일 0시 2분','매주 월요일 2시 0분','매월 1일 2시','2분마다'],a:2,e:'순서: 분 시 일 월 요일. 요일 1은 월요일이에요.'},
 {t:2,l:3,q:'터미널을 닫아도 명령이 계속 실행되게 하는 명령은?',o:['nice','nohup','renice','wait'],a:2,e:'nohup은 로그아웃 신호(SIGHUP)를 무시하게 해요.'},
 {t:2,l:3,q:'nice 값에 대한 설명으로 알맞은 것은?',o:['값이 클수록 우선순위가 높다','값이 작을수록 우선순위가 높다','0만 쓸 수 있다','일반 사용자도 음수로 바꿀 수 있다'],a:2,e:'nice는 -20~19, 작을수록 우선순위가 높고 음수는 root만 줄 수 있어요.'},
 {t:3,l:1,q:'새 사용자 계정을 만드는 명령은?',o:['useradd','usermod','newuser','mkuser'],a:1,e:'useradd 사용자명.'},
 {t:3,l:1,q:'사용자 비밀번호를 설정 · 변경하는 명령은?',o:['pass','passwd','chpass','pw'],a:2,e:'passwd 사용자명.'},
 {t:3,l:1,q:'관리자 권한으로 명령 하나를 실행할 때 앞에 붙이는 것은?',o:['root','sudo','admin','su'],a:2,e:'sudo 명령 형태로 써요.'},
 {t:3,l:2,q:'사용자 계정 정보(이름, UID, 홈 디렉터리, 셸)가 저장된 파일은?',o:['/etc/shadow','/etc/passwd','/etc/group','/etc/login'],a:2,e:'/etc/passwd에 계정 정보, 암호화된 비밀번호는 /etc/shadow에 있어요.'},
 {t:3,l:2,q:'암호화된 비밀번호가 저장된 파일은?',o:['/etc/passwd','/etc/shadow','/etc/group','/etc/sudoers'],a:2,e:'/etc/shadow는 root만 읽을 수 있어요.'},
 {t:3,l:2,q:'root 계정의 UID는?',o:['0','1','100','1000'],a:1,e:'UID 0이 관리자예요.'},
 {t:3,l:3,q:'기존 그룹을 유지하면서 user1을 docker 그룹에 추가하는 명령은?',o:['usermod -G docker user1','usermod -aG docker user1','groupadd docker user1','chgrp docker user1'],a:2,e:'-a(추가) 없이 -G만 쓰면 기존 보조 그룹이 지워져요.'},
 {t:3,l:3,q:'su와 su - 의 차이로 알맞은 것은?',o:['차이가 없다','su -는 대상 사용자의 환경 변수와 홈 디렉터리까지 불러온다','su는 root만 쓸 수 있다','su -는 비밀번호를 묻지 않는다'],a:2,e:'su -는 로그인 셸처럼 환경을 새로 불러와요.'},
 {t:3,l:3,q:'sudo 권한을 설정할 때 안전하게 편집하는 명령은?',o:['vi /etc/sudoers','visudo','sudo -e passwd','nano /etc/group'],a:2,e:'visudo는 문법 검사를 해 줘서 설정 실수를 막아요.'},
 {t:4,l:1,q:'파일 내용 전체를 화면에 출력하는 명령은?',o:['cat','cut','cp','cd'],a:1,e:'cat 파일명.'},
 {t:4,l:1,q:'파일의 마지막 10줄을 보여 주는 명령은?',o:['head','tail','end','last'],a:2,e:'tail은 끝부분, head는 앞부분이에요.'},
 {t:4,l:1,q:'명령 결과를 파일에 덮어써서 저장하는 기호는?',o:['>','>>','<','|'],a:1,e:'>는 덮어쓰기, >>는 이어 쓰기예요.'},
 {t:4,l:2,q:'로그 파일에서 "error"가 들어간 줄만 찾는 명령은?',o:['find error log.txt','grep error log.txt','cat error log.txt','search error log.txt'],a:2,e:'grep 패턴 파일.'},
 {t:4,l:2,q:'앞 명령의 출력을 다음 명령의 입력으로 넘기는 기호는?',o:['>','&','|',';'],a:3,e:'파이프 | 로 명령을 이어요.'},
 {t:4,l:2,q:'파일의 줄 수를 세는 명령은?',o:['wc -l file','count file','grep -c file','len file'],a:1,e:'wc -l은 줄 수를 세요.'},
 {t:4,l:3,q:'access.log에서 IP(첫 번째 칸)별 접속 횟수를 많은 순으로 보는 명령은?',o:["awk '{print $1}' access.log | sort | uniq -c | sort -nr","grep IP access.log | wc -l","cut access.log | uniq","sort access.log | head"],a:1,e:'첫 칸만 뽑아 정렬 → uniq -c로 개수 → 숫자 역순 정렬.'},
 {t:4,l:3,q:'sed "s/old/new/g" file 의 동작은?',o:['old가 들어간 줄을 지운다','모든 old를 new로 바꿔 출력한다','첫 old만 new로 바꾼다','파일 이름을 바꾼다'],a:2,e:'s는 치환, g는 한 줄의 모든 일치 항목을 바꿔요.'},
 {t:4,l:3,q:'명령의 오류 메시지만 error.log에 저장하는 방법은?',o:['cmd > error.log','cmd 2> error.log','cmd | error.log','cmd >> error.log 1'],a:2,e:'2는 표준 에러(stderr)예요.'},
 {t:5,l:1,q:'다른 컴퓨터와 통신이 되는지 확인하는 명령은?',o:['ping','route','hostname','netstat -r'],a:1,e:'ping 주소로 응답을 확인해요.'},
 {t:5,l:1,q:'내 컴퓨터의 IP 주소를 확인하는 명령은?',o:['ip addr','ls ip','whoami','hostname -x'],a:1,e:'ip addr(또는 ifconfig)로 확인해요.'},
 {t:5,l:1,q:'우분투에서 패키지를 설치하는 명령은?',o:['apt install','yum get','rpm -x','pkg add'],a:1,e:'데비안 · 우분투 계열은 apt를 써요.'},
 {t:5,l:2,q:'nginx 서비스의 상태를 확인하는 명령은?',o:['systemctl status nginx','service nginx check','nginx -t','ps nginx'],a:1,e:'systemctl start · stop · restart · status로 서비스를 다뤄요.'},
 {t:5,l:2,q:'부팅할 때 서비스가 자동으로 시작되게 하는 명령은?',o:['systemctl start nginx','systemctl enable nginx','systemctl boot nginx','systemctl auto nginx'],a:2,e:'enable은 부팅 시 자동 시작, start는 지금 바로 시작이에요.'},
 {t:5,l:2,q:'CentOS · Rocky 계열에서 쓰는 패키지 관리자는?',o:['apt','dnf(yum)','pacman','brew'],a:2,e:'레드햇 계열은 dnf(예전 yum)를 써요.'},
 {t:5,l:3,q:'현재 열려서 대기 중인 TCP 포트를 확인하는 명령은?',o:['ss -tln','ping -p','ip route','traceroute -l'],a:1,e:'t=TCP, l=LISTEN, n=숫자로 표시.'},
 {t:5,l:3,q:'firewalld에서 80번 포트를 영구적으로 여는 명령은?',o:['firewall-cmd --add-port=80/tcp --permanent','iptables open 80','ufw enable 80','systemctl open 80'],a:1,e:'--permanent 후 firewall-cmd --reload로 적용해요.'},
 {t:5,l:3,q:'DNS 서버 주소가 설정되는 파일은?',o:['/etc/hosts','/etc/resolv.conf','/etc/hostname','/etc/services'],a:2,e:'/etc/hosts는 직접 지정한 이름, resolv.conf는 DNS 서버예요.'}
 ]},
netsec:{cat:'base',name:'네트워크 · 정보보안',topics:[
 {n:'OSI · TCP/IP',study:['OSI 7계층 이름과 순서를 먼저 외우고 계층마다 대표 장비 하나씩 연결해 보세요.','TCP와 UDP 차이, 3-way handshake 과정을 그림으로 그려 보세요.','캡슐화 단위(프레임 · 패킷 · 세그먼트), 계층별 프로토콜(ARP, ICMP 등)을 정리하세요.']},
 {n:'IP · 서브넷',study:['IPv4 주소가 8비트씩 4칸이라는 것, 사설 IP 대역(10, 172.16, 192.168)을 먼저 익히세요.','서브넷 마스크(/24, /26)로 네트워크 주소와 브로드캐스트 주소를 구하는 연습을 하세요.','서브넷 분할 계산, 호스트 수 계산(2^n - 2), NAT · DHCP 동작을 정리하세요.']},
 {n:'포트 · 프로토콜',study:['HTTP 80, HTTPS 443, SSH 22, DNS 53 같은 대표 포트를 카드로 외우세요.','DNS 조회 과정, HTTP 요청 · 응답 구조와 상태 코드(200, 404, 500)를 정리하세요.','FTP 액티브 · 패시브, SMTP · POP3 · IMAP 차이, TLS 핸드셰이크를 정리하세요.']},
 {n:'암호 · 인증',study:['대칭키와 공개키 암호의 차이를 비유(자물쇠 · 열쇠)로 정리해 보세요.','해시(SHA-256)의 특징, 비밀번호를 해시로 저장하는 이유와 솔트를 익히세요.','전자서명 · 인증서(PKI) 흐름, 다중 인증(MFA), 접근 통제 모델을 정리하세요.']},
 {n:'웹 공격',study:['SQL 인젝션과 XSS가 무엇인지 공격 예시 한 줄씩 외워 보세요.','CSRF · 파일 업로드 취약점 · 디렉터리 이동 공격과 대응 방법을 짝지어 정리하세요.','OWASP Top 10 항목과 시큐어 코딩(입력 검증, 준비된 문장)을 정리하세요.']},
 {n:'보안 장비 · 운영',study:['방화벽 · IDS · IPS가 각각 무엇을 막고 탐지하는지 한 줄로 정리하세요.','DoS · DDoS 유형(SYN Flood 등), 로그 분석의 기본(누가 · 언제 · 무엇을)을 익히세요.','VPN · 망분리 · 보안 관제(SIEM) 흐름, 침해 사고 대응 절차를 정리하세요.']}],
 q:[
 {t:0,l:1,q:'OSI 7계층 중 가장 아래 계층은?',o:['물리 계층','데이터링크 계층','네트워크 계층','응용 계층'],a:1,e:'1계층 물리 → 7계층 응용 순서예요.'},
 {t:0,l:1,q:'IP 주소를 이용해 경로를 정하는 계층은?',o:['전송 계층','네트워크 계층','세션 계층','물리 계층'],a:2,e:'3계층 네트워크 계층, 대표 장비는 라우터예요.'},
 {t:0,l:1,q:'연결을 맺고 신뢰성 있게 전달하는 전송 프로토콜은?',o:['UDP','TCP','IP','ARP'],a:2,e:'TCP는 연결 지향, UDP는 비연결형이에요.'},
 {t:0,l:2,q:'TCP 3-way handshake의 순서는?',o:['SYN → ACK → FIN','SYN → SYN/ACK → ACK','ACK → SYN → FIN','SYN → FIN → ACK'],a:2,e:'연결 요청 → 응답 · 요청 → 확인.'},
 {t:0,l:2,q:'스위치가 동작하는 계층은?',o:['1계층','2계층','4계층','7계층'],a:2,e:'일반 스위치는 MAC 주소로 전달하는 2계층 장비예요.'},
 {t:0,l:2,q:'실시간 영상 · 음성 스트리밍에 주로 쓰이는 프로토콜은?',o:['TCP','UDP','ARP','ICMP'],a:2,e:'조금 손실돼도 빠른 UDP가 유리해요.'},
 {t:0,l:3,q:'IP 주소로 MAC 주소를 알아내는 프로토콜은?',o:['RARP','ARP','ICMP','DNS'],a:2,e:'ARP는 IP → MAC, RARP는 반대예요.'},
 {t:0,l:3,q:'ping 명령이 사용하는 프로토콜은?',o:['TCP','UDP','ICMP','ARP'],a:3,e:'ICMP Echo Request · Reply를 써요.'},
 {t:0,l:3,q:'전송 계층(4계층)의 데이터 단위는?',o:['프레임','패킷','세그먼트','비트'],a:3,e:'2계층 프레임, 3계층 패킷, 4계층 세그먼트예요.'},
 {t:1,l:1,q:'IPv4 주소는 몇 비트인가요?',o:['16비트','32비트','64비트','128비트'],a:2,e:'8비트 × 4칸 = 32비트. IPv6는 128비트예요.'},
 {t:1,l:1,q:'다음 중 사설 IP 주소는?',o:['8.8.8.8','192.168.0.10','203.0.113.5','1.1.1.1'],a:2,e:'192.168.x.x는 사설 대역이에요.'},
 {t:1,l:1,q:'IP 주소를 자동으로 나눠 주는 프로토콜은?',o:['DNS','DHCP','FTP','SNMP'],a:2,e:'DHCP 서버가 IP를 할당해요.'},
 {t:1,l:2,q:'192.168.1.0/24 네트워크에서 쓸 수 있는 호스트 수는?',o:['254','256','255','128'],a:1,e:'2^8 - 2(네트워크 · 브로드캐스트) = 254.'},
 {t:1,l:2,q:'/24 서브넷 마스크를 10진수로 쓰면?',o:['255.255.0.0','255.255.255.0','255.255.255.255','255.0.0.0'],a:2,e:'앞 24비트가 1이에요.'},
 {t:1,l:2,q:'사설 IP를 공인 IP로 바꿔 인터넷에 나가게 하는 기술은?',o:['DNS','NAT','ARP','VLAN'],a:2,e:'NAT(주소 변환)이에요.'},
 {t:1,l:3,q:'192.168.10.70/26 이 속한 네트워크의 브로드캐스트 주소는?',o:['192.168.10.63','192.168.10.127','192.168.10.255','192.168.10.64'],a:2,e:'/26은 64개씩 나뉘어 64~127 구간, 브로드캐스트는 127이에요.'},
 {t:1,l:3,q:'/27 서브넷 하나에서 쓸 수 있는 호스트 수는?',o:['30','32','62','14'],a:1,e:'2^5 - 2 = 30.'},
 {t:1,l:3,q:'172.20.5.1은 어떤 주소인가요?',o:['공인 IP','사설 IP (172.16.0.0/12 대역)','루프백 주소','멀티캐스트 주소'],a:2,e:'172.16.0.0 ~ 172.31.255.255가 사설 대역이에요.'},
 {t:2,l:1,q:'HTTPS의 기본 포트는?',o:['80','443','22','21'],a:2,e:'HTTP 80, HTTPS 443.'},
 {t:2,l:1,q:'도메인 이름을 IP 주소로 바꿔 주는 서비스는?',o:['DHCP','DNS','FTP','SMTP'],a:2,e:'DNS가 이름을 주소로 바꿔요.'},
 {t:2,l:1,q:'원격 서버에 암호화된 연결로 접속하는 SSH의 기본 포트는?',o:['21','22','23','25'],a:2,e:'23번 Telnet은 암호화가 없어 위험해요.'},
 {t:2,l:2,q:'HTTP 상태 코드 404의 의미는?',o:['성공','요청한 자원을 찾을 수 없음','서버 내부 오류','권한 없음'],a:2,e:'200 성공, 403 금지, 404 없음, 500 서버 오류.'},
 {t:2,l:2,q:'메일을 보낼 때 쓰는 프로토콜은?',o:['POP3','IMAP','SMTP','SNMP'],a:3,e:'보내기는 SMTP, 받기는 POP3 · IMAP이에요.'},
 {t:2,l:2,q:'DNS가 주로 사용하는 포트는?',o:['53','67','110','161'],a:1,e:'DNS는 53번(주로 UDP)을 써요.'},
 {t:2,l:3,q:'HTTPS 연결에서 서버의 신원을 확인하는 데 쓰이는 것은?',o:['쿠키','인증서','세션 ID','방화벽 규칙'],a:2,e:'TLS 핸드셰이크에서 서버 인증서를 검증해요.'},
 {t:2,l:3,q:'받은 메일을 서버에 남겨 두고 여러 기기에서 동기화해 보는 프로토콜은?',o:['POP3','IMAP','SMTP','FTP'],a:2,e:'POP3는 내려받아 가져오고, IMAP은 서버와 동기화해요.'},

/* ===== 과제 제작 · 채점 · 수준 분석 (문제은행 기반) ===== */
let QZ_KEYS=[];
const CIRC=['','①','②','③','④'];
let QW=null; // 제작 마법사 상태
function qzKeys(){ return QZ_KEYS=Object.keys(QBANK); }

function qzShuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function qzPick(sub,lv,topics,per){
  const B=QBANK[sub]; const out=[];
  topics.forEach(t=>{
    const same=qzShuffle(B.q.filter(q=>q.t===t&&q.l===lv));
    const near=qzShuffle(B.q.filter(q=>q.t===t&&Math.abs(q.l-lv)===1));
    same.concat(near).slice(0,per).forEach(q=>{ const ord=qzShuffle([0,1,2,3]); out.push({t:q.t,l:q.l,q:q.q,c:q.c||'',o:ord.map(k=>q.o[k]),a:ord.indexOf(q.a-1)+1,e:q.e}); });
  });
  return qzShuffle(out);
}
function qzTitle(sub,lv){ return `${QBANK[sub].name} ${QLEVEL[lv]} 단계 과제`; }

/* ---------- 제작 마법사 ---------- */
function openQuiz(opt={}){ qzKeys();
  QW={step:opt.sub?2:1,sub:opt.sub||'',lv:opt.lv||2,topics:opt.topics||null,per:opt.per||3,sid:opt.sid||'',qs:null,back:opt.back||''};
  drawQuiz();
}
function drawQuiz(){
  const w=QW; const t=todayStr();
  let body='';
  if(w.step===1){
    const card=k=>`<button class="qz-sub" data-act="qzSub" data-k="${k}"><b>${QBANK[k].name}</b><span>${QBANK[k].topics.map(x=>x.n).join(' · ')}</span><small>${QBANK[k].q.length}문항 보유</small></button>`;
    body=`<p class="qz-lead">어떤 과목의 과제를 만들까요?</p>${[['lang','기초 언어 · DB'],['cert','자격증'],['base','실무 기초']].map(([c,l])=>{ const ks=QZ_KEYS.filter(k=>(QBANK[k].cat||'base')===c); return ks.length?`<div class="qz-cat">${l}</div><div class="qz-subs">${ks.map(card).join('')}</div>`:''; }).join('')}`;
  } else if(w.step===2){
    const B=QBANK[w.sub]; const tp=w.topics||B.topics.map((_,i)=>i);
    body=`<p class="qz-lead">${B.name} · 난이도와 범위를 골라 주세요</p>
      <div class="qz-lv">${[1,2,3].map(l=>`<button class="${w.lv===l?'on':''}" data-act="qzLv" data-k="${l}"><b>${QLEVEL[l]}</b><span>${['','처음 배우는 단계 · 기본 개념','개념을 응용하는 단계','실전 · 자격증 수준'][l]}</span></button>`).join('')}</div>
      <div class="field full"><span>출제 영역</span><div class="qz-tops">${B.topics.map((x,i)=>`<label class="check"><input type="checkbox" class="qzTop" value="${i}" ${tp.includes(i)?'checked':''}>${x.n}</label>`).join('')}</div></div>
      <div class="field full"><span>영역별 문항 수</span><div class="seg">${[1,2,3].map(n=>`<button class="${w.per===n?'on':''}" data-act="qzPer" data-k="${n}">${n}문항씩</button>`).join('')}</div></div>`;
  } else {
    const B=QBANK[w.sub]; const sts=list('students').sort((a,b)=>a.name.localeCompare(b.name,'ko'));
    body=`<div class="qz-head"><div><b>${esc(qzTitle(w.sub,w.lv))}</b><span>${w.qs.length}문항 · ${[...new Set(w.qs.map(q=>B.topics[q.t].n))].join(' · ')}</span></div><button class="btn sm ghost" data-act="qzShuffle">${ic('right')}다시 뽑기</button></div>
      ${B.ref?`<pre class="qz-ref">${esc(B.ref)}</pre>`:''}<div class="qz-prev">${w.qs.map((q,i)=>`<div class="qz-q"><div class="qz-qh"><b>${i+1}.</b> ${esc(q.q)} <span class="chip">${esc(B.topics[q.t].n)} · ${QLEVEL[q.l]}</span></div>${q.c?`<pre>${esc(q.c)}</pre>`:''}<ol>${q.o.map((o,k)=>`<li class="${k+1===q.a?'ok':''}">${CIRC[k+1]} ${esc(o)}</li>`).join('')}</ol></div>`).join('')}</div>
      <div class="form qz-reg"><label class="field"><span>학생</span><select id="qzSid" class="in"><option value="">학생 없이 (인쇄 · 파일만)</option>${sts.map(s=>`<option value="${s.id}" ${w.sid===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>
      <label class="field"><span>제출 마감</span><input id="qzDue" class="in" type="date" value="${addDays(t,7)}"></label></div>`;
  }
  const foot=w.step===1?`<button class="btn ghost" data-act="${w.back?'qzBack':'close'}">취소</button>`
    :w.step===2?`<button class="btn ghost" data-act="qzPrev">이전</button><button class="btn pri" data-act="qzMake">문제 뽑기</button>`
    :`<button class="btn ghost" data-act="qzPrev">이전</button><button class="btn" data-act="qzWord">${ic('dl')}Word</button><button class="btn" data-act="qzPrint">인쇄</button><button class="btn pri" data-act="qzSave">학생 과제로 등록</button>`;
  const html=`${mHead('과제 제작')}<div class="body qz">${body}</div><footer>${foot}</footer>`;
  if(modalEl&&modalEl._kind==='quiz') modalEl.querySelector('.sheet').innerHTML=html; else { openModal(html,'wide'); modalEl._kind='quiz'; }
}

function wsHTML(qz,o={}){

  addEventListener('afterprint',done,{once:true}); setTimeout(()=>{ try{ window.print(); }catch(e){} setTimeout(()=>{ if(document.body.classList.contains('printing')&&!matchMedia('print').matches) done(); },1500); },60);
