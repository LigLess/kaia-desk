<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KAIA DESK</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KAIA DESK">
<meta name="description" content="코리아AI아카데미 멘토 업무 앱 — 시간표 · 개강안내 · 학생 · 진도 · 알림">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: white studio canvas, floating glass bar at the top, an ink-black hero with live line art; content on clean white cards. Dark themes re-map the same tokens. */
:root{
  color-scheme: light;
  --bg:#ffffff; --bg-soft:#f7f7f8;
  --surface:#ffffff; --surface-2:#f4f4f6; --surface-3:#ebebef;
  --fg:#0b0b0f; --fg-2:#3a3a42; --muted:#6c6c76; --faint:#a1a1ab;
  --line:#ebebef; --line-2:#dadae0;
  --ink:#0b0b0f; --ink-fg:#ffffff; --ink-soft:rgba(11,11,15,.06);
  --accent:#2f5bff; --accent-2:#5b7cff; --accent-soft:rgba(47,91,255,.09);
  --ok:#0e9f6e; --ok-soft:rgba(14,159,110,.1); --warn:#c27803; --warn-soft:rgba(232,153,20,.13); --bad:#e0434b; --bad-soft:rgba(224,67,75,.1); --cyan:#0e7fa8; --cyan-soft:rgba(14,127,168,.1);
  --blue:var(--accent); --violet:var(--ink); --magenta:var(--accent);
  --bar:rgba(255,255,255,.74); --bar-line:rgba(11,11,15,.08); --overlay:rgba(12,12,18,.28);
  --pill-bg:var(--ink); --pill-fg:#fff;
  --shadow-sm:0 1px 2px rgba(16,16,24,.04),0 1px 1px rgba(16,16,24,.03);
  --shadow-md:0 10px 30px -14px rgba(16,16,24,.16),0 2px 6px rgba(16,16,24,.04);
  --shadow-lg:0 40px 80px -24px rgba(16,16,24,.3),0 8px 20px rgba(16,16,24,.06);
  --spot:rgba(47,91,255,.07);
  --font:'Pretendard Variable','Pretendard','Noto Sans KR','Geist',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --display:'Geist','Pretendard Variable','Pretendard','Noto Sans KR',system-ui,sans-serif;
  --r-xl:28px; --r-lg:20px; --r-md:14px; --r-sm:10px;
  --ease:cubic-bezier(.22,.8,.2,1); --spring:cubic-bezier(.34,1.4,.4,1);
  /* compatibility with older class names */
  --glass:var(--surface-2); --glass-2:var(--surface-3); --glass-3:var(--line-2); --stroke:var(--line); --stroke-2:var(--line-2); --pane:var(--surface); --pane-solid:var(--surface); --blue-2:var(--accent-2); --text:var(--fg);
}
body.dark{
  color-scheme: dark;
  --bg:#05040f; --bg-soft:#0a0918;
  --surface:rgba(14,14,46,.46); --surface-2:rgba(255,255,255,.07); --surface-3:rgba(255,255,255,.12);
  --fg:#f3f4fc; --fg-2:#d9dbf0; --muted:rgba(222,226,255,.64); --faint:rgba(222,226,255,.38);
  --line:rgba(255,255,255,.13); --line-2:rgba(255,255,255,.24);
  --ink:#ffffff; --ink-fg:#0b0b0f; --ink-soft:rgba(255,255,255,.1);
  --accent:#7c9cff; --accent-2:#a9bcff; --accent-soft:rgba(124,156,255,.18);
  --ok:#3fdc9a; --ok-soft:rgba(63,220,154,.14); --warn:#ffc75e; --warn-soft:rgba(255,199,94,.14); --bad:#ff7d8f; --bad-soft:rgba(255,107,128,.15); --cyan:#6fdcff; --cyan-soft:rgba(83,214,255,.13);
  --violet:#c79bff;
  --bar:rgba(255,255,255,.1); --bar-line:rgba(255,255,255,.2); --overlay:rgba(2,1,8,.5);
  --pill-bg:rgba(255,255,255,.16); --pill-fg:#fff;
  --shadow-sm:none; --shadow-md:0 20px 40px -20px rgba(0,0,0,.6); --shadow-lg:0 40px 80px -20px rgba(0,0,0,.8);
  --spot:rgba(255,255,255,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .5s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
::selection{background:var(--accent);color:#fff}
.num{font-variant-numeric:tabular-nums}

/* ---------- backdrop ---------- */
.space{position:fixed;inset:0;overflow:hidden;z-index:0;background:var(--bg)}
#bgfx{position:absolute;inset:0;width:100%;height:100%;display:block}
.veil{position:absolute;inset:0;pointer-events:none}
body:not(.dark) .veil{background:none}
body.dark .veil{background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(2,2,12,.35))}
.planet,.stars{display:none}
body[data-bg="space"] .planet,body[data-bg="space"] .stars{display:block}
.planet{position:absolute;border-radius:50%}
.planet.p1{width:190vmax;height:190vmax;left:22vmax;top:-152vmax;background:radial-gradient(circle at 22% 86%,#a648f5 0%,#7426d6 7%,#42129c 19%,#1d0852 36%,#0a0420 58%);box-shadow:inset 6px -6px 0 -2px rgba(246,170,255,.85),inset 40px -40px 90px -30px rgba(230,110,255,.55),0 0 90px 10px rgba(185,80,255,.28)}
.planet.p2{width:210vmax;height:210vmax;left:-38vmax;top:58vh;background:radial-gradient(circle at 62% 8%,#4374f2 0%,#2449cf 8%,#142e94 20%,#0a1858 38%,#040a2a 60%);box-shadow:inset -4px 6px 0 -1px rgba(160,205,255,.9),inset -30px 50px 90px -30px rgba(90,150,255,.55),0 -10px 120px 0 rgba(60,110,255,.3)}
.stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 12% 22%,rgba(255,255,255,.5),transparent 50%),radial-gradient(1px 1px at 72% 12%,rgba(255,255,255,.35),transparent 50%),radial-gradient(1px 1px at 33% 68%,rgba(255,255,255,.3),transparent 50%)}

/* ---------- shell ---------- */
.shell{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;gap:14px;padding:16px max(22px,env(safe-area-inset-right,0px)) 0 max(22px,env(safe-area-inset-left,0px))}
.main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:10px 6px 56px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.lights{display:flex;gap:6px}
.lights i{width:10px;height:10px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}

/* ---------- top bar ---------- */
.topnav{position:relative;z-index:20;flex:0 0 auto;width:100%;max-width:1440px;margin:0 auto;height:64px;display:flex;align-items:center;gap:14px;padding:0 10px 0 18px;border-radius:22px;
  background:var(--bar);border:1px solid var(--bar-line);box-shadow:var(--shadow-md);
  backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);animation:barIn .9s var(--ease) both}
body.dark .topnav{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 24px 50px -24px rgba(0,0,0,.65)}
@keyframes barIn{from{opacity:0;transform:translateY(-16px) scale(.985)}}
.tn-left{display:flex;align-items:center;gap:14px;flex:none}
.wordmark{position:relative;display:flex;align-items:center;gap:10px;height:34px;min-width:168px;text-align:left}
.wordmark img{width:28px;height:auto;display:block;transition:transform .6s var(--spring)}
body.dark .wordmark img{filter:invert(1)}
.wordmark:hover img{transform:rotate(-8deg) scale(1.06)}
.wordmark b{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.12em;white-space:nowrap;color:var(--fg);transition:opacity .35s}
.wordmark b.short{display:none}
.tn-title{display:none;font-weight:700;font-size:16px;letter-spacing:-.02em}
.tn-nav{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:2px;height:42px}
.tn-nav .pill{position:absolute;left:0;top:0;height:42px;width:0;border-radius:999px;pointer-events:none;opacity:0;background:var(--pill-bg);box-shadow:0 6px 16px -6px rgba(11,11,15,.45);
  transition:transform .55s var(--spring),width .55s var(--spring),opacity .25s}
body.dark .tn-nav .pill{box-shadow:inset 0 1px 0 rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.3)}
.tn-nav a{position:relative;z-index:1;height:42px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:999px;color:var(--fg-2);text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap;cursor:pointer;transition:color .3s}
.tn-nav a.pon{color:var(--pill-fg)}
.tn-nav a .ic{position:relative;width:18px;height:18px;display:grid;place-items:center;flex:none}
.tn-nav a .ic svg{width:18px;height:18px}
.tn-nav a .badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;font-family:var(--display)}
.tn-nav a .dot{position:absolute;top:-2px;right:-3px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg);opacity:0}
.tn-sep{width:1px;height:20px;margin:0 8px;background:var(--line-2);flex:none}
.tn-right{display:flex;align-items:center;gap:2px;flex:none}
.tn-btn{position:relative;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--fg-2);transition:background .2s,color .2s}
.tn-btn:hover{background:var(--surface-2);color:var(--fg)}
.tn-btn svg{width:18px;height:18px}
.tn-btn .dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
.sync{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:999px;font-size:11.5px;color:var(--muted);background:var(--surface-2);margin-right:4px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.sync.busy i{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);animation:blink 1s infinite}
.sync.off i{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.sync span{display:none}
@keyframes blink{50%{opacity:.3}}
.who{display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;border-radius:14px;text-align:left;margin-left:4px;border:1px solid transparent;transition:background .2s,border-color .2s}
.who:hover{background:var(--surface-2)}
.who .mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--ink);color:var(--ink-fg)}
.who .meta strong{display:block;font-weight:600;font-size:13.5px;line-height:1.2;white-space:nowrap}
.who .meta span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.who .chev svg{width:14px;height:14px;color:var(--faint)}
.m-only{display:none}
.topnav.mini .tn-nav a .tx,.topnav.mini .tn-nav a .badge{display:none}
.topnav.mini .tn-nav a{padding:0 13px}
.topnav.mini .tn-nav a .dot.has{opacity:1}
@media (max-width:1640px){.who .meta,.who .chev{display:none}.who{padding:4px}}
@media (max-width:1400px){.tn-nav a.sec .tx{display:none}.tn-nav a.sec{padding:0 12px}.sync span{display:none}.sync{padding:0 9px}}
@media (max-width:1160px){.tn-nav a .tx,.tn-nav a .badge{display:none}.tn-nav a{padding:0 12px}.tn-nav a .dot.has{opacity:1}.wordmark{min-width:0}.wordmark b.full{display:none}}

/* phone */
.dock,.scrim,.sheetnav{display:none}
@media (max-width:900px){
  body::before{content:"";position:fixed;inset:0 0 auto;height:calc(env(safe-area-inset-top,0px) + 26px);z-index:59;pointer-events:none;background:linear-gradient(180deg,var(--bg) 0,var(--bg) calc(env(safe-area-inset-top,0px) + 12px),color-mix(in srgb,var(--bg) 0%,transparent) 100%)}
  .pane h2{flex-wrap:wrap;row-gap:4px}
  .pane h2 small{flex-basis:100%;order:3;line-height:1.5}
  .shell{display:block;padding:0}
  .main{height:100%;padding:82px max(16px,env(safe-area-inset-right,0px)) 112px max(16px,env(safe-area-inset-left,0px))}
  .topnav{position:fixed;z-index:60;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 10px);width:auto;height:56px;padding:0 6px 0 12px;border-radius:18px;gap:10px}
  .tn-nav,.d-only{display:none!important}
  .m-only{display:grid}
  .tn-left{flex:1;min-width:0;gap:10px}
  .wordmark{min-width:0}.wordmark b{display:none}
  .lights{display:none}
  .tn-title{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sync{height:26px}
  .sheetnav{display:block;position:fixed;z-index:55;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 74px);
    padding:12px;border-radius:22px;background:var(--bar);border:1px solid var(--bar-line);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
    box-shadow:var(--shadow-lg);transform:translateY(-10px) scale(.98);opacity:0;pointer-events:none;transition:transform .45s var(--spring),opacity .25s;transform-origin:top center}
  .sheetnav.open{transform:none;opacity:1;pointer-events:auto}
  .sheet-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .sheet-grid a{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;border-radius:16px;color:var(--fg-2);font-size:12.5px;font-weight:500;text-decoration:none;background:var(--surface-2)}
  .sheet-grid a.on{background:var(--ink);color:var(--ink-fg)}
  .sheet-grid a svg{width:21px;height:21px}
  .sheet-grid a .badge{position:absolute;top:8px;right:10px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:10.5px;display:grid;place-items:center}
  .scrim{display:block;position:fixed;inset:0;z-index:50;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .3s}
  .scrim.show{opacity:1;pointer-events:auto}
  .dock{display:flex;position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
    width:min(440px,calc(100% - 24px));height:62px;padding:6px;border-radius:22px;gap:2px;
    background:var(--bar);border:1px solid var(--bar-line);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);box-shadow:var(--shadow-lg)}
  .dock a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:16px;font-size:10.5px;font-weight:500;color:var(--muted);text-decoration:none;position:relative;transition:background .35s var(--ease),color .35s}
  .dock a svg{width:20px;height:20px}
  .dock a.on{color:var(--ink-fg);background:var(--ink)}
  .dock a .dot{position:absolute;top:7px;left:calc(50% + 7px);width:7px;height:7px;border-radius:50%;background:var(--accent)}
}

/* ---------- content ---------- */
.view{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.view>*{animation:rise .8s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:.001;transform:translateY(18px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 2px 6px}
.vh h1{margin:0;font-size:36px;font-weight:700;letter-spacing:-.035em;line-height:1.1;text-wrap:balance}
.vh .sub{color:var(--muted);font-size:13px;margin-bottom:8px}
.pane{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:22px;min-width:0;isolation:isolate;transition:box-shadow .4s var(--ease),border-color .4s}
body.dark .pane{backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%)}
.pane::before,.pcard::before,.stat::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0;transition:opacity .4s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),var(--spot),transparent 60%)}
.pane:hover::before,.pcard:hover::before,.stat:hover::before{opacity:1}
.pane h2{margin:0 0 14px;font-size:15px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.pane h2 small{font-weight:400;color:var(--faint);font-size:12px}
.pane h2 .r{margin-left:auto}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
.grid2.split{grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr)}
.subjlist{max-height:640px;overflow:auto}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
@media (max-width:1100px){.grid2,.grid2.split{grid-template-columns:minmax(0,1fr)}.subjlist{max-height:280px}}
@media (max-width:900px){.grid3{grid-template-columns:minmax(0,1fr)}.vh h1{font-size:28px}.pane{padding:16px;border-radius:18px}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.stat{position:relative;isolation:isolate;padding:16px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--display);font-size:32px;font-weight:600;letter-spacing:-.03em;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .v small{font-family:var(--font);font-size:13px;color:var(--faint);font-weight:400;margin-left:4px;letter-spacing:0}

/* hero (home) */
.hero{position:relative;overflow:hidden;border-radius:var(--r-xl);background:#0b0b0f;color:#fff;min-height:300px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;padding:34px 36px;isolation:isolate;box-shadow:0 30px 60px -30px rgba(11,11,15,.55)}
body.dark .hero{background:rgba(6,6,18,.6);border:1px solid var(--line);backdrop-filter:blur(20px)}
#herofx{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero-in{display:flex;flex-direction:column;gap:14px;min-width:0}
.hero .eyebrow{display:flex;align-items:center;gap:10px;font-size:12.5px;color:rgba(255,255,255,.6);letter-spacing:.02em}
.hero .eyebrow .live{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.hero .eyebrow .live i{width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 10px #4ade80}
.hero h1{margin:6px 0 0;font-size:clamp(30px,4vw,48px);font-weight:700;letter-spacing:-.04em;line-height:1.08;text-wrap:balance}
.hero h1 .line{display:block;overflow:hidden}
.hero h1 .line>span{display:inline-block;animation:lineUp 1s var(--ease) both}
.hero h1 .line:nth-child(2)>span{animation-delay:.08s}
@keyframes lineUp{from{transform:translateY(105%)}}
.hero p{margin:0;color:rgba(255,255,255,.7);font-size:15px}
.hero p b{color:#fff;font-weight:600}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.hero .btn.inv{background:#fff;color:#0b0b0f;border-color:#fff}
.hero .btn.inv:hover{background:#eef0ff}
.hero .btn.inv-g{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.18)}
.hero .btn.inv-g:hover{background:rgba(255,255,255,.12)}

/* ---- command center (home) ---- */
.hudhome{perspective:1600px}
.hud-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,460px) minmax(0,1fr);gap:22px;align-items:center;transform-style:preserve-3d}
.hpanel{position:relative;isolation:isolate;padding:22px 22px 20px;min-width:0}
.hpanel.left{transform:rotateY(9deg);transform-origin:right center}
.hpanel.right{transform:rotateY(-9deg);transform-origin:left center}
.hl{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;color:var(--accent);opacity:.8;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.hl::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-2),transparent)}
.hpanel .greet{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:.02em;line-height:1.15;color:#effbff;text-shadow:0 0 22px rgba(91,225,255,.35)}
.hpanel .clock{font-family:var(--mono);font-size:44px;font-weight:400;letter-spacing:-.03em;color:#e9fbff;text-shadow:0 0 26px rgba(91,225,255,.55);margin:6px 0 2px;font-variant-numeric:tabular-nums}
.hpanel .clock small{font-size:16px;color:var(--accent);margin-left:6px}
.hpanel .date{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em}
.readout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.readout div{padding:10px 12px;border:1px solid rgba(91,225,255,.15);background:rgba(91,225,255,.04);position:relative}
.readout div::before{content:"";position:absolute;left:-1px;top:-1px;width:6px;height:6px;border-left:1.5px solid var(--accent);border-top:1.5px solid var(--accent)}
.readout b{display:block;font-family:var(--mono);font-size:26px;font-weight:500;color:#effbff;line-height:1.1}
.readout span{font-size:11px;color:var(--muted);letter-spacing:.04em}
.readout .warn b{color:var(--amber);text-shadow:0 0 14px rgba(255,181,71,.5)}
.hpanel .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.core-wrap{position:relative;aspect-ratio:1/1;width:100%;max-width:460px;margin:0 auto}
#corefx{position:absolute;inset:0;width:100%;height:100%}
.core-label{position:absolute;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;color:var(--accent);white-space:nowrap;text-shadow:0 0 8px rgba(91,225,255,.6)}
.core-label.t{top:-2px}.core-label.b{top:calc(100% + 2px)}
.core-wrap{margin-bottom:58px}
.core-next{position:absolute;left:50%;top:calc(100% + 22px);transform:translateX(-50%);text-align:center;pointer-events:none;width:100%}
.core-next b{display:inline-block;margin-right:8px;font-family:var(--mono);font-size:18px;color:var(--amber);text-shadow:0 0 16px rgba(255,181,71,.6);letter-spacing:.02em}
.core-next span{font-size:12.5px;color:var(--fg-2);display:inline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpanel .alist{display:flex;flex-direction:column;gap:8px;max-height:330px;overflow:auto}
.hpanel .aitem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:10px 12px;border-left:2px solid var(--c,var(--accent));background:linear-gradient(90deg,rgba(91,225,255,.08),transparent);cursor:pointer;transition:background .2s,transform .3s var(--ease)}
.hpanel .aitem:hover{background:linear-gradient(90deg,rgba(91,225,255,.18),transparent);transform:translateX(4px)}
.hpanel .aitem.e{--c:var(--amber)}
.hpanel .aitem b{font-family:var(--mono);font-size:13px;color:var(--c,var(--accent));grid-row:span 2;align-self:center;min-width:54px}
.hpanel .aitem .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpanel .aitem .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1100px){.hud-grid{grid-template-columns:minmax(0,1fr)}.hpanel.left,.hpanel.right{transform:none}.core-wrap{max-width:380px;order:-1}}

/* ---- boot sequence ---- */
.boot{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:radial-gradient(60% 60% at 50% 50%,#04182a,#01060b 70%);transition:opacity .7s,filter .7s}
.boot.out{opacity:0;filter:blur(8px) brightness(2);pointer-events:none}
.boot svg{width:min(320px,70vw);height:auto;overflow:visible}
.boot circle{fill:none;stroke:#5be1ff;transform-origin:100px 100px}
.boot .b1{stroke-width:.6;stroke-dasharray:2 3;animation:bspin 6s linear infinite,bdraw 1.2s ease-out both}
.boot .b2{stroke-width:1.4;stroke-dasharray:420;stroke-dashoffset:420;animation:bdash 1.1s .15s cubic-bezier(.6,0,.2,1) forwards,bspin 9s linear infinite reverse;filter:drop-shadow(0 0 6px #5be1ff)}
.boot .b3{stroke-width:7;stroke:rgba(91,225,255,.25);stroke-dasharray:28 10;animation:bspin 4s linear infinite,bdraw .8s .3s both}
.boot .b4{stroke-width:1;stroke:#ffb547;stroke-dasharray:40 300;animation:bspin 1.6s linear infinite;filter:drop-shadow(0 0 6px #ffb547)}
.boot image{opacity:0;animation:bfade .6s .7s forwards}
@keyframes bspin{to{transform:rotate(360deg)}}
@keyframes bdash{to{stroke-dashoffset:0}}
@keyframes bdraw{from{opacity:0;transform:scale(.6) rotate(-90deg)}}
@keyframes bfade{to{opacity:1}}
.boot-lines{position:absolute;left:50%;top:calc(50% + min(190px,42vw));transform:translateX(-50%);width:min(440px,86vw);font-family:'JetBrains Mono',monospace;font-size:12px;color:#7fe3ff;letter-spacing:.08em;text-align:center;line-height:1.9;min-height:6em}
.boot-lines p{margin:0;opacity:0;animation:bfade .25s forwards}
.boot-lines p.ok{color:#ffb547}
.boot-skip{position:absolute;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(127,227,255,.5);letter-spacing:.2em}

/* ---- command console ---- */
.cmd{position:fixed;inset:0;z-index:250;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;background:var(--overlay);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s}
.cmd-box{width:min(680px,100%);background:var(--bg);border:1px solid var(--line-2);box-shadow:var(--shadow-lg);border-radius:20px;overflow:hidden;animation:pop2 .4s var(--spring)}
body.hud .cmd-box{border-radius:0;background:linear-gradient(180deg,rgba(6,30,48,.96),rgba(2,12,20,.98));clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px)}
.cmd-in{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.cmd-in svg{width:20px;height:20px;color:var(--accent);flex:none}
.cmd-in input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:18px;color:var(--fg)}
body.hud .cmd-in input{font-family:var(--display);font-size:20px;letter-spacing:.03em}
.cmd-mic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--fg)}
.cmd-mic.on{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
.cmd-list{max-height:52vh;overflow:auto;padding:6px}
.cmd-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;cursor:pointer}
body.hud .cmd-item{border-radius:0}
.cmd-item.sel{background:var(--surface-2);box-shadow:inset 2px 0 0 var(--accent)}
.cmd-item .k{font-size:11px;font-family:var(--mono,monospace);color:var(--accent);min-width:56px;letter-spacing:.06em}
.cmd-item .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd-item .h{font-size:12px;color:var(--faint)}
.cmd-foot{padding:10px 18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);display:flex;gap:16px;flex-wrap:wrap}


/* ================= EXECUTIVE : minimal premium on the HUD skeleton ================= */

  color-scheme:light;
  --bg:#f6f6f3; --bg-soft:#efefeb;
  --surface:#ffffff; --surface-2:#f2f2ef; --surface-3:#e8e8e3;
  --fg:#0c0c10; --fg-2:#33333b; --muted:#6d6d76; --faint:#a3a3aa;
  --line:#e7e7e2; --line-2:#d6d6cf;
  --ink:#0c0c10; --ink-fg:#ffffff; --ink-soft:rgba(12,12,16,.06);
  --accent:#3554ff; --accent-2:#2a43d6; --accent-soft:rgba(53,84,255,.09);
  --amber:#ff6a3d; --amber-soft:rgba(255,106,61,.11);
  --ok:#0f9f6e; --ok-soft:rgba(15,159,110,.1); --warn:#e8590c; --warn-soft:rgba(255,106,61,.11); --bad:#e5484d; --bad-soft:rgba(229,72,77,.1); --cyan:#3554ff; --cyan-soft:rgba(53,84,255,.09);
  --violet:#0c0c10;
  --bar:rgba(255,255,255,.78); --bar-line:rgba(12,12,16,.07); --overlay:rgba(20,20,26,.28);
  --pill-bg:#0c0c10; --pill-fg:#fff;
  --shadow-sm:0 1px 2px rgba(16,16,24,.04); --shadow-md:0 12px 32px -16px rgba(16,16,24,.18); --shadow-lg:0 40px 80px -28px rgba(16,16,24,.3),0 0 0 1px rgba(16,16,24,.04);
  --spot:rgba(53,84,255,.06);
  --display:'Geist','Pretendard Variable','Pretendard','Noto Sans KR',sans-serif;
  --mono:'Geist','Pretendard Variable',sans-serif;
}

<body>
<div class="space" aria-hidden="true"><div class="stars"></div><div class="planet p1"></div><div class="planet p2"></div><canvas id="bgfx"></canvas><div class="veil"></div></div>
<div class="shell">
  <header class="topnav" id="topnav"></header>
  <main class="main" id="main"><div id="view"></div></main>
</div>
<div class="sheetnav" id="sheetnav"></div>
<div class="scrim" id="scrim"></div>
<div class="dropzone" id="dropzone"><div><b>여기에 놓으세요</b><span>엑셀(.xlsx · .xls · .csv)은 시간표로, .json은 학생 데이터로 가져와요</span></div></div>
<nav class="dock" id="dock" aria-label="빠른 메뉴"></nav>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ===== CORE: dates, holidays, sessions, excel parser (pure) ===== */
const DOW='일월화수목금토';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const[a,b,c]=String(s).split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parseYmd(b)-parseYmd(a))/864e5);
const todayStr=()=>ymd(new Date());
const fmtMD=s=>{if(!s)return'';const d=parseYmd(s);return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`};
const fmtKo=s=>{if(!s)return'';const d=parseYmd(s);return `${d.getMonth()+1}월 ${d.getDate()}일(${DOW[d.getDay()]})`};
const ym=s=>String(s||'').slice(0,7);

const HOLIDAYS={'2026-01-01':'신정','2026-02-16':'설날','2026-02-17':'설날','2026-02-18':'설날','2026-03-01':'삼일절','2026-03-02':'대체공휴일','2026-05-05':'어린이날','2026-05-24':'부처님오신날','2026-05-25':'대체공휴일','2026-06-03':'지방선거','2026-06-06':'현충일',
'2026-08-15':'광복절','2026-08-17':'대체공휴일','2026-09-24':'추석','2026-09-25':'추석','2026-09-26':'추석','2026-10-03':'개천절','2026-10-05':'대체공휴일','2026-10-09':'한글날','2026-12-25':'성탄절',
'2027-01-01':'신정','2027-02-06':'설날','2027-02-07':'설날','2027-02-08':'설날','2027-02-09':'대체공휴일','2027-03-01':'삼일절','2027-05-05':'어린이날','2027-05-13':'부처님오신날','2027-06-06':'현충일','2027-08-15':'광복절','2027-08-16':'대체공휴일',
'2027-09-14':'추석','2027-09-15':'추석','2027-09-16':'추석','2027-10-03':'개천절','2027-10-04':'대체공휴일','2027-10-09':'한글날','2027-10-11':'대체공휴일','2027-12-25':'성탄절','2027-12-27':'대체공휴일',
'2028-01-01':'신정','2028-01-25':'설날','2028-01-26':'설날','2028-01-27':'설날','2028-03-01':'삼일절','2028-05-02':'부처님오신날','2028-05-05':'어린이날','2028-06-06':'현충일','2028-08-15':'광복절','2028-10-02':'추석','2028-10-03':'개천절','2028-10-04':'추석','2028-10-05':'추석','2028-10-09':'한글날','2028-12-25':'성탄절'};

/* "월~금", "토/일", "월수금", "평일", "주말", "월수금/월수"(격주) → {a:[..], b:[..]|null} */
function parseDays(str){
  str=String(str||'').replace(/\s/g,'');
  if(!str) return null;
  const expand=s=>{
    const out=new Set();
    if(/평일/.test(s)) [1,2,3,4,5].forEach(x=>out.add(x));
    if(/주말/.test(s)) [6,0].forEach(x=>out.add(x));
    if(/매일/.test(s)) [0,1,2,3,4,5,6].forEach(x=>out.add(x));
    const re=/([일월화수목금토])(?:요일)?\s*[~\-–]\s*([일월화수목금토])/g;let m;let rest=s;
    while((m=re.exec(s))){let a=DOW.indexOf(m[1]),b=DOW.indexOf(m[2]);for(let i=0;i<7;i++){const d=(a+i)%7;out.add(d);if(d===b)break}rest=rest.replace(m[0],'')}
    rest=rest.replace(/요일/g,'');
    for(const ch of rest) if(DOW.includes(ch)) out.add(DOW.indexOf(ch));
    return [...out];
  };
  const parts=str.split('/').filter(Boolean);
  if(parts.length===2 && parts.every(p=>expand(p).length>=2) && !/[~\-–]/.test(str)){
    return {a:expand(parts[0]).sort(),b:expand(parts[1]).sort()};
  }
  // "월수금월수" → 1주차 월수금 / 2주차 월수 (격주)
  if(!/[~\-–\/·,]|평일|주말|매일/.test(str)){
    const chars=[...str.replace(/요일/g,'')].filter(c=>DOW.includes(c)); const ord=c=>(DOW.indexOf(c)+6)%7; const runs=[[]];
    chars.forEach((c,i)=>{ if(i&&ord(c)<=ord(chars[i-1])) runs.push([]); runs[runs.length-1].push(DOW.indexOf(c)); });
    if(runs.length===2&&runs.every(r=>r.length)) return {a:runs[0].sort(),b:runs[1].sort()};
  }
  const a=expand(str);
  return a.length?{a:a.sort(),b:null}:null;
}
function daysLabel(days,daysB){
  const lab=d=>{
    if(!d||!d.length) return '';
    const s=[...d].sort((x,y)=>((x+6)%7)-((y+6)%7));
    const key=s.join(',');
    if(key==='1,2,3,4,5') return '월~금';
    if(key==='1,2,3,4,5,6') return '월~토';
    if(key==='6,0') return '토·일';
    return s.map(x=>DOW[x]).join('·');
  };
  return daysB&&daysB.length? `${lab(days)} / ${lab(daysB)} 격주` : lab(days);
}
function defaultDays(c){ if(c.kind==='주말') return [6,0]; return [1,2,3,4,5]; }

/* all class dates for a course */
function sessionsOf(c){
  if(!c||!c.start) return [];
  if(c.fixedDates&&c.fixedDates.length){ const sk=new Set(c.skips||[]); const out=c.fixedDates.filter(d=>!sk.has(d)); for(const x of (c.extras||[])) if(!out.includes(x)) out.push(x); return out.sort(); }
  const A=(c.days&&c.days.length)?c.days:defaultDays(c);
  const B=(c.daysB&&c.daysB.length)?c.daysB:null;
  const skip=new Set(c.skips||[]);
  const skipHol=c.skipHol!==false;
  if(!c.end&&!c.total) return [c.start];
  const end=c.end||addDays(c.start,730);
  const s0=parseYmd(c.start); const w0=new Date(s0); w0.setDate(w0.getDate()-s0.getDay());
  const out=[]; let d=c.start; let guard=0;
  while(d<=end&&guard++<800){
    const dt=parseYmd(d), wd=dt.getDay();
    const wi=Math.floor(Math.round((dt-w0)/864e5)/7);
    const set=(B&&wi%2)?B:A;
    if(set.includes(wd)&&!(skipHol&&HOLIDAYS[d])&&!skip.has(d)) out.push(d);
    if(!c.end&&c.total&&out.length>=c.total) break;
    d=addDays(d,1);
  }
  for(const x of (c.extras||[])) if(!out.includes(x)) out.push(x);
  return out.sort();
}
const courseEnd=c=>c.end||(sessionsOf(c).slice(-1)[0])||c.start;

/* ---------- Excel parsing ---------- */
const FIELD_DEFS=[
  ['period',['교육기간','수업기간','훈련기간','기간']],
  ['start',['개강일','개강일자','개강','시작일','교육시작일','훈련시작일','시작']],
  ['end',['종강일','종강일자','종강','종료일','교육종료일','훈련종료일','수료일','종료']],

const KV_RE=/^[\s○●◎•·\-▶▷◆◇■□*※>]*\s*(과목명?|과정명?|수업명|강좌명?|날짜|기간|교육기간|수업기간|일정|개강일|종강일|시간|수업시간|요일|수업요일|강의실|강의장|장소|강사|담당강사|회차|시수|총회차|구분)\s*[:：]\s*(.+?)\s*$/;

    const course={name:name||'(이름 없음)',kind:kind||'기타',days,daysB,time:cellTime(b.time||''),start,end,total,teacher:(b.teacher||'').trim(),room:(b.room||'').trim(),memo:'',skipHol:true};

function memoDates(line,year,startMonth){

  const out=[]; let curM=null;

function parseGridSheet(rows,ctx){

function nameSim(a,b){
  const x=aliasNorm(a), y=aliasNorm(b); if(!x||!y) return 0; if(x===y) return 1;
  const nx=(x.match(/(\d+)$/)||[])[1], ny=(y.match(/(\d+)$/)||[])[1]; if(nx&&ny&&nx!==ny) return 0; // 파이썬1 ≠ 파이썬2
  if(x.length>=2&&y.length>=2&&(x.includes(y)||y.includes(x))) return 0.85;
  const bg=s=>{ const o=[]; for(let i=0;i<s.length-1;i++) o.push(s.slice(i,i+2)); return o; };
  const A=bg(x),B=bg(y); if(!A.length||!B.length) return 0; const pool=[...B]; let hit=0; for(const t of A){ const i=pool.indexOf(t); if(i>=0){ hit++; pool.splice(i,1); } }

const gas={
  q:null,timer:null,poll:null,busy:false,
  cfg(){ try{ const c=JSON.parse(lsGet('md.sync')||'null'); return c&&c.url&&c.token?c:null; }catch(e){ return null; } },
  /* 팀 서버 주소: 로그인 기록 → 초대 링크(?server=) → 이전에 입력한 주소 */
  server(){ const c=this.cfg(); if(c) return c.url; let q=''; try{ q=new URLSearchParams(location.search).get('server')||''; }catch(e){} if(/^https:\/\/script\.google/.test(q)){ lsSet('md.server',q); return q; } return lsGet('md.server')||DEFAULT_SERVER; },
  async call(method,params,body,cfgOverride){
    const c=cfgOverride||this.cfg(); if(!c) throw new Error('not_configured');
    const qs=new URLSearchParams({token:c.token,...(params||{})}).toString();
    const opt=method==='GET'?{method:'GET',redirect:'follow'}:{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:c.token,...body})};
    const r=await fetch(method==='GET'?`${c.url}${c.url.includes('?')?'&':'?'}${qs}`:c.url,opt);

  },
  loadQ(){ if(this.q) return this.q; try{ this.q=JSON.parse(lsGet('md.syncq')||'{}'); }catch(e){ this.q={}; } return this.q; },
  saveQ(){ lsSet('md.syncq',JSON.stringify(this.q||{})); },
  enqueue(col,id,data,del){ this.loadQ()[col+'/'+id]={col,id,data,del,v:Date.now()}; this.saveQ(); this.state('busy'); clearTimeout(this.timer); this.timer=setTimeout(()=>this.flush(),1200); },
  state(st){ if(store.syncState!==st){ store.syncState=st; const el=$('.sync'); if(el) renderSide(); } },
  async flush(){

    if(this.busy){ clearTimeout(this.timer); this.timer=setTimeout(()=>this.flush(),1500); return; } this.busy=true;
    const batch=keys.slice(0,80).map(k=>({k,...q[k]}));
    try{
      await this.call('POST',null,{writes:batch.map(({col,id,data,del})=>({col,id,data,del}))});
      batch.forEach(b=>{ if(q[b.k]&&q[b.k].v===b.v) delete q[b.k]; }); this.saveQ();
      this.busy=false; if(Object.keys(q).length) this.flush(); else this.state('ok');
    }catch(e){ this.busy=false; this.state('off'); clearTimeout(this.timer); this.timer=setTimeout(()=>this.flush(),15000); }
  },
  apply(docs){
    const q=this.loadQ(); let n=0;

  async pull(full){

/* ---------- derived ---------- */
function courseStatus(c,t=todayStr()){
  const e=courseEnd(c);
  if(!c.start) return {k:'none',label:'날짜 없음',chip:''};
  if(t<c.start) return {k:'soon',label:`D-${diffDays(t,c.start)} 개강`,chip:'blue'};
  if(e&&t>e) return {k:'done',label:'종강',chip:''};
  return {k:'run',label:'진행 중',chip:'ok'};
}
function progOf(c,t=todayStr()){
  const ss=sessionsOf(c); const prog=c.prog||{};
  const done=ss.filter(d=>prog[d]&&prog[d].done).length;
  const expected=ss.filter(d=>d<t).length;
  const todayIdx=ss.indexOf(t);
  const pending=ss.filter(d=>d<t&&!(prog[d]&&prog[d].done)).length;
  return {ss,total:ss.length,done,expected,todayIdx,pending,pct:ss.length?Math.round(done/ss.length*100):0};
}
const studentsIn=cid=>list('students').filter(s=>(s.courses||[]).includes(cid));
const tplKey=(type,off)=>(type==='start'?'s':'e')+(off>=3?'7':'1');
function alarmsAll(t=todayStr()){
  const offs=(S.settings.offsets&&S.settings.offsets.length?S.settings.offsets:[7,1]).slice().sort((a,b)=>b-a);
  const out=[];
  for(const c of list('courses')){
    const pts=[['start',c.start],['end',courseEnd(c)]];
    for(const [type,date] of pts){ if(!date) continue;
      for(const off of offs){
        const ad=addDays(date,-off); const key=`${c.id}|${type}|${off}`;
        const state=t<ad?'soon':(t<=date?'now':'past');
        out.push({key,c,type,off,ad,date,state,ack:!!(S.settings.acks||{})[key]});
      }
    }
  }
  return out.sort((a,b)=>a.ad<b.ad?-1:a.ad>b.ad?1:(a.off-b.off));
}
function activeAlarms(){
  // only the most urgent stage per course+type is "now"
  const now=alarmsAll().filter(a=>a.state==='now');
  const best={}; now.forEach(a=>{const k=a.c.id+a.type; if(!best[k]||a.off<best[k].off) best[k]=a;});
  return Object.values(best).sort((a,b)=>a.date<b.date?-1:1);
}
function noticeStat(a){ const k=`${a.c.id}|${tplFor(a.c,a.type,a.off)}`; const st=studentsIn(a.c.id).filter(s=>!['환불','보류'].includes(s.status)); return {n:st.length,sent:st.filter(s=>(s.sent||{})[k]).length}; }
function subjectOf(c){ if(c.subject&&c.subject.trim()) return c.subject.trim(); const n=String(c.name||'').replace(/\s*[(\[][^)\]]*[)\]]\s*$/,'').replace(/\s*(평일|주말|오전|오후|야간|저녁|주간)\s*반?\s*$/,'').trim(); return n||c.name||''; }
function noticeDays(c){
  if(c.dayText&&c.dayText.trim()) return c.dayText.trim();
  const ord=d=>[...d].sort((x,y)=>((x+6)%7)-((y+6)%7));
  const A=c.days&&c.days.length?c.days:defaultDays(c);
  if(c.daysB&&c.daysB.length) return ord(A).map(x=>DOW[x]).join('')+ord(c.daysB).map(x=>DOW[x]).join('');
  if(ord(A).join(',')==='1,2,3,4,5') return '월~금';
  return ord(A).map(x=>DOW[x]).join('');
}
const isOnline=c=>/비대면|온라인|zoom|줌/i.test(String(c.room||'')+' '+String(c.name||''));
function roomLabel(c){ const r=String(c.room||'').trim(); if(!r) return ''; const m=(S.settings.rooms||{})[r]; if(m) return m; if(/^[A-Za-z]$/.test(r)) return r.toUpperCase()+'강의장'; if(r==='비대면') return '비대면(ZOOM)'; return r; }
function tplFor(c,type,off){ const k=tplKey(type,off); return k==='s7'&&isOnline(c)?'s7z':k; }
const yyDot=s=>s?s.slice(2).replace(/-/g,'.'):'';
function zoomOf(c){
  const zs=S.settings.zooms||[]; if(!zs.length) return null;
  if(c.zoom==='none') return null;
  let z=c.zoom&&zs.find(x=>x.k===c.zoom);
  if(!z){ const m=String(c.room||'').match(/([A-Za-z])\s*(강의장|강의실|룸|반|호)/)||String(c.room||'').match(/\b([A-Za-z])\b/); if(m) z=zs.find(x=>x.k.toUpperCase()===m[1].toUpperCase()); }
  return z||null;
}
function fillTpl(tpl,c,s){
  const ss=sessionsOf(c); const z=zoomOf(c);
  const map={'이름':s?s.name.replace(/^예시\s/,''):'○○○','과정':c.name,'과목':subjectOf(c),'기간':`${yyDot(c.start)}~${yyDot(courseEnd(c))}`,'날짜':`${yyDot(c.start)}~${yyDot(courseEnd(c))}`,
    '개강일':fmtKo(c.start),'종강일':fmtKo(courseEnd(c)),'요일':noticeDays(c),
    '시간':(c.time||'(추후 안내)').replace(/\s*[–\-∼]\s*/g,'~'),'강의실':roomLabel(c)||'(추후 안내)','수업일':ss.map(d=>+d.slice(8)).join(','),'강사':c.teacher||'','회차':c.total||ss.length,'멘토':S.settings.mentor||'','지점':S.settings.branch||'',
    '줌계정':z?z.k+'계정':'','회의ID':z?z.id:'','회의PW':z?z.pw:''};
  return String(tpl||'').replace(/\{([^}]+)\}/g,(m,k)=>map[k]!=null?map[k]:m);
}
function dLabel(a){ return `${a.type==='start'?'개강':'종강'} D-${a.off}`; }
function dueLabel(tk){
  if(!tk.due) return '날짜 없음';
  const t=todayStr(); const n=diffDays(t,tk.due);
  const base=n===0?'오늘':n===1?'내일':n===-1?'어제':fmtMD(tk.due);

}

function toast(title,body,cls=''){

function copyText(txt){
  const ok=()=>toast('복사했어요','카톡이나 문자에 붙여넣으면 돼요.');
  const fb=()=>{ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');ok();}catch(e){toast('복사하지 못했어요','문구를 길게 눌러 직접 복사해 주세요.')} ta.remove(); };

function confirmBox(title,body,okLabel='확인',danger=false){

}
let audioCtx=null;
function beep(){ try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type='sine'; o.frequency.value=880; g.gain.setValueAtTime(0.0001,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.2,audioCtx.currentTime+0.02); g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.6); o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.65);}catch(e){} }

function subjectGroups(){
  const t=todayStr(); const g={};
  list('courses').filter(c=>c.start).forEach(c=>{ const k=subjectOf(c); (g[k]=g[k]||[]).push(c); });
  const next=k=>{ const up=g[k].filter(c=>c.start>=t).map(c=>c.start).sort()[0]; return up||'9999'; };
  const keys=Object.keys(g).sort((a,b)=>{ const na=next(a),nb=next(b); return na!==nb?(na<nb?-1:1):a.localeCompare(b,'ko'); });
  return {g,keys,next};
}

function vProgress(){
  const t=todayStr(); const cs=list('courses');
  const groups={run:cs.filter(c=>courseStatus(c).k==='run'),soon:cs.filter(c=>courseStatus(c).k==='soon'&&diffDays(t,c.start)<=30),done:cs.filter(c=>courseStatus(c).k==='done'&&diffDays(courseEnd(c),t)<=60)};
  if(!S.progPicked&&!groups[S.progFilter].length){ const k=['run','soon','done'].find(k=>groups[k].length); if(k) S.progFilter=k; }
  const sel=groups[S.progFilter]||groups.run;
  const late=groups.run.filter(c=>progOf(c).pending>0).length;
  const card=c=>{ const p=progOf(c); const s=courseStatus(c);
    const chip=s.k==='run'?(p.pending?`<span class="chip warn">미체크 ${p.pending}회</span>`:'<span class="chip ok">정상</span>'):`<span class="chip ${s.chip}">${s.label}</span>`;
    const exp=p.total?Math.min(100,p.expected/p.total*100):0;
    return `<div class="pcard" data-act="openCourse" data-id="${c.id}" data-tab="prog"><div class="ring" data-p="${p.pct}" style="--c:${p.pending?'var(--warn)':'var(--blue)'}"><b>${p.pct}%</b></div>
      <div class="grow"><div class="t1">${esc(c.name)}</div><div class="t2 num">${p.done}/${p.total}회 완료 · ${fmtMD(c.start)}~${fmtMD(courseEnd(c))}${p.todayIdx>=0?` · 오늘 ${p.todayIdx+1}회차`:''}</div>
      <div class="bar"><i style="width:${p.pct}%"></i>${s.k==='run'?`<u style="left:${exp}%" title="오늘까지 예정"></u>`:''}</div><div>${chip}</div></div></div>`; };
  return `<div class="view">${vh('진도관리','수업이 끝나면 회차를 체크하고 배운 내용을 한 줄 남겨 두세요')}

   <section class="pane"><div class="seg" style="margin-bottom:16px">${[['run','진행 중'],['soon','개강 예정'],['done','최근 종강']].map(([k,l])=>`<button class="${S.progFilter===k?'on':''}" data-act="progFilter" data-k="${k}">${l} ${groups[k].length}</button>`).join('')}</div>
   ${sel.length?`<div class="grid3">${sel.sort((a,b)=>a.start<b.start?-1:1).map(card).join('')}</div>`:'<div class="empty"><b>해당하는 과정이 없어요</b>노란 세로선은 오늘까지 나갔어야 하는 진도예요.</div>'}</section></div>`;

function parseZoomText(txt){
  const out=[]; const blocks=String(txt).split(/(?=비대면\s*계정\s*[A-Za-z])|(?=[-–]\s*[A-Za-z]\s*계정)/);
  for(const b of blocks){ const k=(b.match(/계정\s*([A-Za-z])\b/)||b.match(/\b([A-Za-z])\s*계정/)||[])[1]; const id=(b.match(/회의\s*ID\s*[:：]\s*([\d\s]+\d)/i)||[])[1]; const pw=(b.match(/회의\s*PW\s*[:：]\s*(\S+)/i)||[])[1];
    if(k&&id&&pw) out.push({k:k.toUpperCase(),id:id.trim().replace(/\s+/g,' '),pw:pw.trim()}); }
  return out;
}

/* ---------- excel import ---------- */
let IM=null;
function readBuf(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsArrayBuffer(file); }); }
async function handleXlsx(files){
  files=[...files].filter(f=>/\.(xlsx|xlsm|xls|csv)$/i.test(f.name)); if(!files.length) return;
  if(!window.XLSX){ toast('엑셀 도구를 불러오지 못했어요','인터넷 연결을 확인하고 새로고침해 주세요.'); return; }
  const ctx={today:todayStr()}; const sheets=[]; const bad=[];
  for(const f of files){
    try{
      const wb=XLSX.read(new Uint8Array(await readBuf(f)),{type:'array'});
      for(const n of wb.SheetNames){
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''});
        const grid=parseGridSheet(rows,ctx);
        let res=grid&&grid.length?{header:null,items:grid,grid:true}:parseRows(rows,ctx);
        if(!res.items.length){ // 표가 아니면 개강안내 문자 형식(○날짜 : …)으로 다시 읽기
          const txt=rows.map(r=>r.filter(x=>x!=='').join(' ')).join('\n'); const it=parseNoticeText(txt,ctx); if(it.length) res={header:null,items:it,text:true}; }
        sheets.push({name:files.length>1?`${f.name.replace(/\.[^.]+$/,'')} · ${n}`:n,rows,res,file:f.name});
      }
    }catch(e){ console.error(e); bad.push(f.name); }
  }
  if(bad.length) toast('읽지 못한 파일이 있어요',bad.join(', '));
  if(!sheets.length) return;
  IM={file:files.length>1?`파일 ${files.length}개`:files[0].name,sheets,si:0,sel:{}};
  const firstGood=sheets.findIndex(s=>s.res.items.length); IM.si=firstGood<0?0:firstGood;
  const seen={};
  sheets.forEach((sh,si)=>sh.res.items.forEach((it,i)=>{ const k=courseKey(it.course); if(seen[k]){ it.dup=seen[k]; IM.sel[si+':'+i]=false; } else { seen[k]=sh.name; IM.sel[si+':'+i]=it.ok; } }));
  if(firstGood<0) toast('시간표를 찾지 못했어요','제목줄(과정명 · 개강일 또는 기간)이 있는지 확인해 주세요. 아래 "열 연결"에서 직접 골라도 돼요.','alarm-t');
  drawImport();

async function saveFile(filename,data){
  if(!store.dl){ try{ const blob=data instanceof Blob?data:new Blob([data],{type:/\.json$/.test(filename)?'application/json':/\.ics$/.test(filename)?'text/calendar':'application/octet-stream'}); const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); toast('파일을 저장했어요',filename); }catch(e){ toast('파일을 저장하지 못했어요',''); } return; }
  try{ const r=await store.dl.save({filename,data}); if(r&&r.status==='saved') toast('파일을 저장했어요',filename); }
  catch(e){ if(e&&e.code&&!/cancel|declin|abort/i.test(e.code)) toast('파일을 저장하지 못했어요',e.message||''); }
}
function icsText(){
  const esc2=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  const fold=line=>{ const enc=new TextEncoder(); if(enc.encode(line).length<=74) return line; let out='',cur='',n=0; for(const ch of line){ const b=enc.encode(ch).length; if(n+b>73){ out+=cur+'\r\n '; cur=''; n=1; } cur+=ch; n+=b; } return out+cur; };
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const [hh,mm]=(S.settings.icsTime||'09:30').split(':').map(Number);
  const utc=(dstr,h,m)=>{ const d=parseYmd(dstr); d.setHours(h,m,0,0); return d.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''); };
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//KAIA DESK//KO','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:KAIA 개강·종강','X-WR-TIMEZONE:Asia/Seoul'];
  const t=todayStr(); let n=0;
  for(const c of list('courses')){
    const e=courseEnd(c); if(!e||e<t) continue;
    const desc=`${daysLabel(c.days,c.daysB)} ${c.time||''} · ${c.room||''} · 학생 ${studentsIn(c.id).length}명`;
    for(const [type,date] of [['start',c.start],['end',e]]){ if(!date||date<t) continue;
      const lab=type==='start'?'개강':'종강';
      L.push('BEGIN:VEVENT',`UID:${c.id}-${type}@kaia-desk`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${date.replace(/-/g,'')}`,`DTEND;VALUE=DATE:${addDays(date,1).replace(/-/g,'')}`,`SUMMARY:${esc2(`[${lab}] ${c.name}`)}`,`DESCRIPTION:${esc2(desc)}`,'TRANSP:TRANSPARENT','END:VEVENT'); n++;
      for(const off of (S.settings.offsets||[7,1])){ const ad=addDays(date,-off); if(ad<t) continue;
        const st=utc(ad,hh,mm); const en=utc(ad,hh,mm+15);
        L.push('BEGIN:VEVENT',`UID:${c.id}-${type}-${off}@kaia-desk`,`DTSTAMP:${stamp}`,`DTSTART:${st}`,`DTEND:${en}`,`SUMMARY:${esc2(`[${lab} D-${off}] ${c.name} 안내`)}`,`DESCRIPTION:${esc2(`${fmtKo(date)} ${lab} · ${desc}`)}`,
          'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${esc2(`${lab} D-${off} ${c.name}`)}`,'TRIGGER:PT0M','END:VALARM','END:VEVENT'); n++; }
    }
  }
  L.push('END:VCALENDAR'); return {text:L.map(fold).join('\r\n'),n};
}

const normName=s=>String(s||'').toLowerCase().replace(/[\s()\[\]·\-_.,]/g,'');
function matchCourseIds(cobjs,status){
  const t=todayStr(); const cs=list('courses'); const ids=[],miss=[];
  for(const raw of cobjs){
    const co=typeof raw==='string'?{name:raw}:raw; if(!co||(!co.name&&!co.start)) continue;
    let best=null,bs=0;
    if(co.start){ // 날짜가 있으면 같은 날(±3일) 개강한 수업 중에서만 찾기
      for(const c of cs){ if(!c.start||Math.abs(diffDays(c.start,co.start))>3) continue;
        let sc=co.name?Math.max(nameSim(co.name,c.name),nameSim(co.name,subjectOf(c))):0;
        const sameRoom=co.room&&c.room&&String(co.room).trim().toUpperCase()===String(c.room).trim().toUpperCase();
        if(co.room&&c.room&&!sameRoom) sc-=0.4;                       // 강의실이 다르면 다른 반
        if(sameRoom) sc+=0.6;
        if(co.time&&c.time&&co.time.replace(/\s/g,'').slice(0,5)===String(c.time).replace(/\s/g,'').slice(0,5)) sc+=0.3;
        sc-=Math.abs(diffDays(c.start,co.start))*0.05; if(sc>bs){ bs=sc; best=c; } }
      if(best&&bs>=0.5){ ids.push(best.id); continue; }
      miss.push(co); continue;
    }
    const cands=cs.map(c=>({c,sc:Math.max(nameSim(co.name,c.name),nameSim(co.name,subjectOf(c)))})).filter(x=>x.sc>=0.75).map(x=>x.c);
    if(!cands.length){ miss.push(co); continue; }
    const run=cands.filter(c=>c.start<=t&&courseEnd(c)>=t), up=cands.filter(c=>c.start>t).sort((a,b)=>a.start<b.start?-1:1), past=cands.filter(c=>courseEnd(c)<t).sort((a,b)=>a.start<b.start?1:-1);
    ids.push((status==='수료'?(past[0]||run[0]||up[0]):(run[0]||up[0]||past[0])).id);
  }
  return {ids:[...new Set(ids)],miss};
}
function relinkStudents(){
  let n=0;
  for(const s of list('students')){
    if(!s.prevCourses||!s.prevCourses.length) continue;
    const {ids,miss}=matchCourseIds(s.prevCourses,s.status);
    if(!ids.length) continue;
    store.put('students',{...s,courses:[...new Set([...(s.courses||[]),...ids])],prevCourses:miss}); n++;
  }
  return n;
}

    if(kind==='nav'){ tone(1650,0.06,'sine',0.025); tone(2480,0.05,'sine',0.018,0.035); }

    else if(kind==='shard'){ tone(3200+Math.random()*900,0.03,'triangle',0.012,0,1900); }
    else if(kind==='burst'){ const n=a.createBufferSource(), b=a.createBuffer(1,a.sampleRate*0.25,a.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3); n.buffer=b; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=2500; const g=a.createGain(); g.gain.value=0.05; n.connect(f).connect(g).connect(a.destination); n.start(t); }

        x.beginPath(); x.arc(cx,cy,R+24,-rot*2,-rot*2+Math.PI*2*Math.max(0.02,level)); x.strokeStyle=ink(.55); x.lineWidth=1.5; if(P.fx==='hud'){ x.shadowColor=P.a1; x.shadowBlur=8; } x.stroke(); x.shadowBlur=0; }
      net.forEach(n=>{ n.x=cx+n.ox*R+Math.sin(t*0.8+n.ph)*R*0.06; n.y=cy+n.oy*R+Math.cos(t*0.7+n.ph)*R*0.05; });
      /* 물 */
      if(level>0.002){
        x.save(); x.beginPath(); x.arc(cx,cy,R-1.5,0,Math.PI*2); x.clip();
        const step=3, L=cx-R, Rr=cx+R;
        // 뒤쪽 물결 (깊이감)
        x.beginPath(); x.moveTo(L,cy+R); for(let px=L;px<=Rr;px+=step){ const y=surf(px*0.93+R*0.37,t*0.85+2)-R*0.025; x.lineTo(px,y); } x.lineTo(Rr,cy+R); x.closePath();
        x.fillStyle=P.a2; x.globalAlpha=light?0.28:0.32; x.fill(); x.globalAlpha=1;
        // 앞쪽 물
        const top=lvlY(level)-R*0.1; const g=x.createLinearGradient(0,top,0,cy+R); g.addColorStop(0,P.a2); g.addColorStop(1,P.a1);
        x.beginPath(); x.moveTo(L,cy+R); const pts=[]; for(let px=L;px<=Rr;px+=step){ const y=surf(px,t); pts.push([px,y]); x.lineTo(px,y); } x.lineTo(Rr,cy+R); x.closePath();
        const sty=P.fx, lineArt=['dots','contour','strand','net'].includes(sty);
        if(sty==='bloom'){ x.shadowColor=P.a1; x.shadowBlur=R*0.25; }
        x.fillStyle=lineArt?ink(.1):g; x.globalAlpha=lineArt?1:(light?0.9:0.88); x.fill(); x.globalAlpha=1; x.shadowBlur=0;
        if(lineArt||sty==='caustic'||sty==='stars'){ x.save(); x.clip(); const yTop=lvlY(level)-R*0.15;
          if(sty==='dots'){ const sp=Math.max(5,R*0.085); x.fillStyle=ink(.85); for(let yy=cy+R;yy>yTop;yy-=sp) for(let px=L+((yy/sp)%2?sp/2:0);px<Rr;px+=sp){ const d=(cy+R-yy)/(2*R); x.beginPath(); x.arc(px,yy+Math.sin(px*0.05+t*2)*1.2,sp*0.22*(0.65+0.35*(1-d)),0,Math.PI*2); x.fill(); } }
          if(sty==='contour'){ x.strokeStyle=ink(.7); x.lineWidth=1; for(let k=0;k<26;k++){ x.beginPath(); pts.forEach(([px],n)=>{ const y=surf(px,t-k*0.09)+k*R*0.075; n?x.lineTo(px,y):x.moveTo(px,y); }); x.globalAlpha=Math.max(.15,1-k*0.04); x.stroke(); } x.globalAlpha=1; }
          if(sty==='strand'){ x.strokeStyle=ink(.55); x.lineWidth=1; const sp=Math.max(4,R*0.07), sh=(t*8)%sp; for(let k=-2*R;k<2*R;k+=sp){ x.beginPath(); x.moveTo(L+k+sh,cy+R); x.lineTo(L+k+sh+R*1.2,yTop); x.stroke(); } }
          if(sty==='net'){ const nodes=net; x.fillStyle=ink(.9); nodes.forEach(n=>{ x.beginPath(); x.arc(n.x,n.y,1.6,0,Math.PI*2); x.fill(); }); x.strokeStyle=ink(.35); x.lineWidth=0.8; for(let a=0;a<nodes.length;a++) for(let b=a+1;b<nodes.length;b++){ const dx=nodes[a].x-nodes[b].x, dy=nodes[a].y-nodes[b].y; if(dx*dx+dy*dy<(R*0.45)**2){ x.beginPath(); x.moveTo(nodes[a].x,nodes[a].y); x.lineTo(nodes[b].x,nodes[b].y); x.stroke(); } } }
          if(sty==='caustic'){ x.strokeStyle='rgba(255,255,255,.22)'; x.lineWidth=1.2; for(let k=1;k<6;k++){ x.beginPath(); for(let px=L;px<=Rr;px+=4){ const y=lvlY(level)+k*R*0.28+Math.sin(px*0.06+t*1.6+k)*R*0.05+Math.sin(px*0.023-t*0.9+k*2)*R*0.07; px===L?x.moveTo(px,y):x.lineTo(px,y); } x.stroke(); } }
          if(sty==='stars'){ stars.forEach(s=>{ const a=0.3+0.6*Math.abs(Math.sin(t*s.s+s.p)); x.fillStyle=`rgba(255,255,255,${a.toFixed(2)})`; x.fillRect(cx+s.x*R,cy+s.y*R,s.r,s.r); }); }
          x.restore(); }
        // 수면 하이라이트
        x.beginPath(); pts.forEach(([px,y],n)=>n?x.lineTo(px,y):x.moveTo(px,y)); const lineArtS=['dots','contour','strand','net'].includes(P.fx);
        if(P.fx==='exec'){ x.strokeStyle=P.head; x.lineWidth=1.6; }
        else if(lineArtS){ x.strokeStyle=ink(.95); x.lineWidth=1.6; }
        else { x.strokeStyle=`rgba(255,255,255,${light?0.55:0.45})`; x.lineWidth=1.4; if(P.fx==='hud'||P.fx==='glow'){ x.shadowColor=P.a2; x.shadowBlur=10; } }
        x.stroke(); x.shadowBlur=0;
        // 기포
        if(level>0.12&&Math.random()<dt*2.2) bubbles.push({x:cx+(Math.random()-.5)*R*1.1,y:cy+R*0.9,r:0.8+Math.random()*1.8,vy:-R*(0.35+Math.random()*0.4),ph:Math.random()*6});
        for(let n=bubbles.length-1;n>=0;n--){ const b=bubbles[n]; b.y+=b.vy*dt; b.x+=Math.sin(t*6+b.ph)*0.25; if(b.y<surf(b.x,t)+2){ bubbles.splice(n,1); continue; } x.beginPath(); x.arc(b.x,b.y,b.r,0,Math.PI*2); x.strokeStyle='rgba(255,255,255,.55)'; x.lineWidth=0.8; x.stroke(); }
        // 유리 안쪽 반사

        // 로고: 물에 잠긴 부분은 반전색
        const cut=[]; for(let s=0;s<=12;s++){ const px=cx-LS/2+LS*s/12; const yy=(surf(px,t)-LT)/(LS*0.82)*100; cut.push(`${(s/12*100).toFixed(1)}% ${Math.max(-5,Math.min(105,yy)).toFixed(1)}%`); }
        logoU.style.clipPath=`polygon(${cut.join(',')},100% 105%,0% 105%)`;
      } else logoU.style.clipPath='inset(100% 0 0 0)';
      /* 떨어지는 방울 */
      for(let n=drops.length-1;n>=0;n--){ const d=drops[n]; d.vy+=G*dt*(d.big?1.05:1); d.y+=d.vy*dt; const sy=d.big?lvlY(Math.max(level,0)):surf(d.x,t);
        if(d.y+d.r>=sy){ drops.splice(n,1); landed++;
          const imp=d.big?R*0.11:R*0.05; E+=imp; tv+=(d.x-cx)/R*(d.big?1.2:2.4)*(Math.random()<.5?1:-1)*0.6+((Math.random()-.5)*1.2);
          target=d.big?BASE:Math.min(1,BASE+(1-BASE)*Math.min(1,(landed-1)/Math.max(1,lines.length)*(lines.ready?1:0.92)));
          if(d.big){ introDone=true; lastSpawn=t-0.12; ring(t,R,R*1.9,.28,1.2); ring(t+0.1,R,R*1.45,.18,1); }
          const k=d.big?6:3; for(let s=0;s<k;s++){ const a=-Math.PI/2+(s-(k-1)/2)*(d.big?0.42:0.6)+(Math.random()-.5)*0.25, v=R*(d.big?2.6:1.6)*(0.8+Math.random()*0.5); spl.push({x:d.x,y:sy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:d.r*(0.28+Math.random()*0.22)}); }
          for(let s=0;s<(d.big?4:2);s++) bubbles.push({x:d.x+(Math.random()-.5)*R*0.2,y:sy+R*0.12+Math.random()*R*0.15,r:0.8+Math.random()*1.6,vy:-R*0.5,ph:Math.random()*6});
          continue; }
        x.save(); x.translate(d.x,d.y); const st=Math.min(0.6,d.vy/(R*12)); x.scale(1-st*0.3,1+st);
        x.beginPath(); x.moveTo(0,-d.r*1.25); x.bezierCurveTo(d.r*0.9,-d.r*0.2,d.r,d.r*0.9,0,d.r); x.bezierCurveTo(-d.r,d.r*0.9,-d.r*0.9,-d.r*0.2,0,-d.r*1.25);
        x.fillStyle=P.a1; x.globalAlpha=.92; x.fill(); x.globalAlpha=1; x.restore(); }
      /* 튀는 물방울 */
      for(let n=spl.length-1;n>=0;n--){ const s=spl[n]; s.vy+=G*dt; s.x+=s.vx*dt; s.y+=s.vy*dt; if(s.vy>0&&s.y>=surf(s.x,t)){ spl.splice(n,1); E+=R*0.006; continue; } if(s.y>cy+R+40){ spl.splice(n,1); continue; } x.beginPath(); x.arc(s.x,s.y,s.r,0,Math.PI*2); x.fillStyle=P.a2; x.globalAlpha=.9; x.fill(); x.globalAlpha=1; }
      /* 바깥 잔물결 */
      for(let n=rings.length-1;n>=0;n--){ const r=rings[n]; const p=(t-r.t)/r.dur; if(p<0) continue; if(p>=1){ rings.splice(n,1); continue; } const e=1-Math.pow(1-p,3); x.beginPath(); x.arc(cx,cy,r.r0+(r.r1-r.r0)*e,0,Math.PI*2); x.strokeStyle=ink(r.a*Math.pow(1-p,1.7)); x.lineWidth=1.2; x.stroke(); }
      /* 로고 · 이름 */
      const lo=introDone?Math.min(1,Math.max(0,(t-0.75)/0.6)):0; logos.forEach(l=>{ l.style.opacity=lo; l.style.transform=`scale(${0.9+0.1*(1-Math.pow(1-lo,3))})`; });
      nameEl.style.opacity=Math.min(1,Math.max(0,(t-0.95)/0.5));
      if(!done&&((lines.ready&&landed-1>=lines.length&&Math.abs(level-target)<0.01&&target>0.99&&t>2)||t>9)) finish(false);
      raf=requestAnimationFrame(frame);
    };
    raf=requestAnimationFrame(frame);
  });
}

/* ---------- command console ---------- */
let CMD=null;
function parseTaskCmd(q){
  const m=q.match(/^(할\s*일|업무|콜백|메모)\s*[:：]?\s*(.+)$/); if(!m) return null;
  let text=m[2].trim(), due=todayStr(), time='';
  if(/내일/.test(text)){ due=addDays(due,1); text=text.replace(/내일/,''); } else if(/모레/.test(text)){ due=addDays(due,2); text=text.replace(/모레/,''); }
  const dm=text.match(/(\d{1,2})\s*[\/월.]\s*(\d{1,2})\s*일?/); if(dm){ const y=inferYear(+dm[1],{today:todayStr()}); const v=validDate(y,+dm[1],+dm[2]); if(v){ due=v; text=text.replace(dm[0],''); } }
  const pm=/오후|저녁|밤/.test(text);
  const tm=text.match(/(\d{1,2})\s*:\s*(\d{2})/)||text.match(/(\d{1,2})\s*시(?:\s*(\d{1,2})\s*분|\s*반)?/);
  if(tm){ let hh=+tm[1]; let mm=tm[2]?+tm[2]:(/반/.test(tm[0])?30:0); if(pm&&hh<12) hh+=12; else if(!pm&&hh>=1&&hh<=7) hh+=12; time=`${pad(hh)}:${pad(mm)}`; text=text.replace(tm[0],''); }
  text=text.replace(/오전|오후|저녁|밤/g,'').replace(/\s+/g,' ').trim();
  const st=list('students').find(s=>text.includes(s.name));
  return {text:(m[1].includes('콜백')?`${st?st.name+' ':''}콜백 ${text.replace(st?st.name:'','').trim()}`.trim():text)||'할 일',due,time,cat:m[1].includes('콜백')?'콜백':'기타',sid:st?st.id:''};
}
function cmdResults(q){
  q=(q||'').trim(); const out=[]; const ql=q.toLowerCase();
  const tk=parseTaskCmd(q); if(tk) out.push({k:'NEW TASK',t:`${tk.text}`,h:`${dueLabel(tk)} · ${tk.cat}`,run:()=>{ if(S.demo) startReal(true); store.put('tasks',{id:uid('t'),...tk,done:false,at:Date.now()}); sfx('ok'); toast('할 일을 추가했어요',`${dueLabel(tk)} · ${tk.text}`); render(); }});
  if(!q||/브리핑|보고|briefing/i.test(q)) out.push({k:'VOICE',t:'오늘 브리핑 듣기',h:'알림 · 수업 · 할 일 요약',run:()=>speak(briefingText())});
  NAV.filter(x=>x.v&&(!q||x.t.includes(q))).forEach(x=>out.push({k:'GO',t:x.t,h:'화면 열기',run:()=>go(x.v)}));
  if(!q||/잠금|lock/i.test(q)) out.push({k:'LOCK',t:'화면 잠금',h:'',run:()=>lock()});
  Object.entries(BG_THEMES).filter(([k,th])=>q&&(/테마|디자인|배경|theme/i.test(q)||th.name.includes(q))).forEach(([k,th])=>out.push({k:'THEME',t:`테마 · ${th.name}`,h:S.settings.theme===k?'사용 중':'바꾸기',run:()=>{ S.settings.theme=k; store.saveSettings(); applyTheme(k); render(); }}));
  if(q){
    list('students').filter(s=>s.name.includes(q)||(q.replace(/\D/g,'').length>=4&&(s.phone||'').replace(/\D/g,'').includes(q.replace(/\D/g,'')))).slice(0,6).forEach(s=>out.push({k:'STUDENT',t:`${s.name} · ${s.status}`,h:s.phone||'',run:()=>openStudent(s.id)}));
    const subs=[...new Set(list('courses').map(subjectOf))].filter(x=>x.toLowerCase().includes(ql)||aliasNorm(x).includes(aliasNorm(q))).slice(0,5);
    subs.forEach(sb=>out.push({k:'NOTICE',t:`${sb} 개강안내 문자`,h:'과목 → 월 선택',run:()=>{ S.ntSubj=sb; S.ntMonth=null; S.noticeCourse=null; S.ntTplPicked=false; go('notice'); }}));
    list('courses').filter(c=>c.name.toLowerCase().includes(ql)).sort((a,b)=>a.start<b.start?1:-1).slice(0,5).forEach(c=>out.push({k:'COURSE',t:c.name,h:`${fmtMD(c.start)}~${fmtMD(courseEnd(c))} · ${roomLabel(c)}`,run:()=>openCourse(c.id)}));
  }
  return out.slice(0,12);
}
function openCmd(){
  if(CMD) return; sfx('open');
  const el=document.createElement('div'); el.className='cmd'; el.innerHTML=`<div class="cmd-box" role="dialog" aria-label="명령"><div class="cmd-in">${ic('search')}<input id="cmdQ" placeholder="무엇을 할까요? 예: 서민수 · DBMS · 콜백 내일 3시 홍길동" autocomplete="off">${(window.SpeechRecognition||window.webkitSpeechRecognition)?`<button class="cmd-mic" id="cmdMic" aria-label="음성으로 말하기">${ic('quote')}</button>`:''}</div><div class="cmd-list" id="cmdList"></div><div class="cmd-foot"><span>↑↓ 이동 · Enter 실행 · Esc 닫기</span><span>"할일 …" · "콜백 내일 3시 이름" 으로 바로 추가</span></div></div>`;
  document.body.appendChild(el); CMD={el,sel:0,items:[]};
  const q=$('#cmdQ'); const draw=()=>{ CMD.items=cmdResults(q.value); CMD.sel=Math.min(CMD.sel,Math.max(0,CMD.items.length-1)); $('#cmdList').innerHTML=CMD.items.length?CMD.items.map((r,i)=>`<div class="cmd-item ${i===CMD.sel?'sel':''}" data-i="${i}"><span class="k">${r.k}</span><span class="t">${esc(r.t)}</span><span class="h">${esc(r.h||'')}</span></div>`).join(''):'<div class="empty">찾는 게 없어요. "할일 …"로 적으면 바로 할 일로 추가돼요.</div>'; };
  const run=i=>{ const r=CMD.items[i]; if(!r) return; closeCmd(); r.run(); };
  q.addEventListener('input',()=>{ CMD.sel=0; draw(); });

  loginServer:()=>{ const f=$('#lgUrl'); if(f){ f.closest('.field').classList.remove('login-hide'); f.focus(); f.select(); } },
  useLocal:()=>gas.useLocal(),
  loginGo:async el=>{
    const url=($('#lgUrl').value||'').trim(), user=($('#lgUser').value||'').trim(), pw=$('#lgPw').value||'';
    if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){ toast('팀 서버 주소를 확인해 주세요','https://script.google.com/macros/s/…/exec 형식이에요.'); const f=$('#lgUrl'); f&&f.closest('.field').classList.remove('login-hide'); return; }
    if(!user||!pw){ toast('아이디와 비밀번호를 넣어 주세요',''); return; }
    const body=S.loginTab==='up'?{a:'signup',user,pw,name:($('#lgName').value||'').trim(),team:($('#lgTeam').value||'').trim()}:{a:'login',user,pw};
    if(body.a==='signup'&&!body.name){ toast('이름을 넣어 주세요','개강안내 문자에 멘토 이름으로 들어가요.'); return; }
    el.disabled=true; el.textContent='확인 중…'; const ok=await gas.signIn(url,body); if(!ok){ el.disabled=false; el.textContent=body.a==='signup'?'가입하고 시작하기':'로그인'; }
  },
  signOut:async()=>{ if(await confirmBox('로그아웃할까요?','이 기기에서 내 데이터를 지워요. 서버에는 그대로 있어서 다시 로그인하면 불러와요.','로그아웃',true)) gas.signOut(); },
  copyInvite:()=>{ const c=gas.cfg(); if(!c) return; const link=location.origin+location.pathname+'?server='+encodeURIComponent(c.url)+'&theme=aurora'; copyText(link); toast('초대 링크를 복사했어요','팀원에게 이 링크와 팀 가입 코드를 보내 주세요.'); },
  syncOff:async()=>{ if(await confirmBox('동기화를 끌까요?','이 기기의 데이터는 그대로 남고, 다른 기기와는 더 이상 맞춰지지 않아요.','끄기',true)) gas.disconnect(); },
  syncNow:async()=>{ try{ await gas.flush(); const n=await gas.pull(false); toast('동기화했어요',n?`바뀐 내용 ${n}건을 받았어요.`:'바뀐 내용이 없어요.'); render(); }catch(e){ toast('동기화하지 못했어요','인터넷 연결을 확인해 주세요.'); } },
  install:async()=>{ const p=window._installPrompt; if(!p) return; p.prompt(); try{ await p.userChoice; }catch(e){} window._installPrompt=null; render(); },
  notifyOn:async()=>{ if(!('Notification' in window)){ toast('이 브라우저는 알림을 지원하지 않아요','아이폰은 홈 화면에 설치한 뒤 다시 눌러 주세요.'); return; } const r=await Notification.requestPermission(); toast(r==='granted'?'알림을 허용했어요':'알림이 꺼져 있어요',r==='granted'?'앱이 열려 있거나 백그라운드에 있을 때 개강·종강 알림과 콜백 알림이 떠요.':'브라우저 설정에서 알림을 허용해 주세요.'); render(); },
  zoomPaste:()=>{ openModal(`${mHead('줌 정보 붙여넣기')}<div class="body"><p style="margin:0;font-size:13px;color:var(--muted)">받으신 안내를 그대로 붙여 넣으세요. "비대면계정A · 회의 ID · 회의 PW"만 읽고, 로그인 아이디 · 비밀번호는 버려요.</p><textarea id="zoomTxt" class="in" rows="12" placeholder="- 비대면계정A -&#10;회의 ID : 000 000 0000&#10;회의 PW : 00000"></textarea></div><footer><button class="btn ghost" data-act="close">취소</button><button class="btn pri" data-act="zoomParse">읽어 오기</button></footer>`,'narrow'); },
  zoomParse:()=>{ const z=parseZoomText($('#zoomTxt').value); if(!z.length){ toast('읽을 수 있는 계정이 없어요','"회의 ID :", "회의 PW :" 줄이 있어야 해요.'); return; } const map={}; (S.settings.zooms||[]).forEach(x=>map[x.k]=x); z.forEach(x=>map[x.k]=x); S.settings.zooms=Object.values(map).sort((a,b)=>a.k.localeCompare(b.k)); store.saveSettings(); closeModal(); toast(`줌 계정 ${z.length}개를 저장했어요`,z.map(x=>x.k+'계정').join(' · ')); render(); },
  pasteImport:()=>openPasteImport(),
  pasteParse:()=>pasteParse(),
  simDo:()=>doStuImport(),
  pasteStudents:()=>openPasteStudents(),
  pasteStuGo:()=>pasteStudentsGo(),
  copyBm:()=>copyText(BOOKMARKLET),
};
document.addEventListener('click',e=>{
  if(S.locked) return;
  const g=e.target.closest('[data-go]'); if(g){ e.preventDefault(); if(modalEl&&g.closest('.modal')) closeModal(); go(g.dataset.go); return; }
  const a=e.target.closest('[data-act]'); if(!a) return;
  if(a.tagName==='INPUT'&&(a.type==='checkbox'||a.type==='text'||a.type==='date')) return; // handled on change
  const f=ACT[a.dataset.act]; if(f){ e.preventDefault(); f(a,e); }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='xlsFile'&&el.files.length){ handleXlsx([...el.files]); el.value=''; return; }
  if(el.id==='stuJson'&&el.files[0]){ handleStudentJson(el.files[0]); el.value=''; return; }
  if(el.id==='simMerge'){ SIM.merge=el.checked; return; }
  if(el.dataset.smap!=null){ const f=el.dataset.smap; for(const k in SIM.map) if(SIM.map[k]===el.value&&k!==f) delete SIM.map[k]; if(el.value) SIM.map[f]=el.value; else delete SIM.map[f]; drawStuImport(); return; }
  if(el.id==='restoreFile'&&el.files[0]){ restoreFrom(el.files[0]); el.value=''; return; }
  if(el.id==='stuCourse'){ S.stuCourse=el.value; render(); return; }
  if(el.dataset.map!=null){ remapImport(el.dataset.map,el.value); return; }
  if(el.dataset.room!=null){ S.settings.rooms={...(S.settings.rooms||{}),[el.dataset.room]:el.value.trim()}; store.saveSettings(); toast('저장했어요',''); return; }
  if(el.dataset.zoom!=null){ const zs=clone(S.settings.zooms||[]); const i=+el.dataset.zoom; let v=el.value.trim(); if(el.dataset.f==='k') v=v.toUpperCase(); zs[i][el.dataset.f]=v; S.settings.zooms=zs; store.saveSettings(); toast('저장했어요',''); return; }
  if(el.dataset.set){ const path=el.dataset.set; let v=el.value;
    if(path==='pin'&&v&&!/^\d{4}$/.test(v)){ toast('비밀번호는 숫자 4자리예요',''); return; }
    if(path.startsWith('tpl.')) S.settings.tpl={...S.settings.tpl,[path.slice(4)]:v}; else S.settings[path]=v;
    store.saveSettings(); renderSide(); toast('저장했어요',''); return; }
  const act=el.dataset.act; if(!act) return;
  if(act==='sentToggle'){ const s=D().students[el.dataset.id]; const sent={...(s.sent||{})}; const k=`${S.noticeCourse}|${S.ntTpl}`; if(el.checked) sent[k]=todayStr(); else delete sent[k]; store.put('students',{...s,sent}); scheduleRender(); }
  else if(act==='taskDone'){ const k=D().tasks[el.dataset.id]; store.put('tasks',{...k,done:el.checked,doneAt:el.checked?Date.now():null}); setTimeout(render,250); }
  else if(act==='sfxToggle'){ S.settings.sfx=el.checked; store.saveSettings(); if(el.checked) sfx('ok'); }
  else if(act==='offToggle'){ const o=+el.dataset.o; const s=new Set(S.settings.offsets||[]); el.checked?s.add(o):s.delete(o); if(!s.size){ el.checked=true; toast('하나 이상은 골라 주세요',''); return; } S.settings.offsets=[...s].sort((a,b)=>b-a); store.saveSettings(); render(); }
  else if(act==='topic'){ const d=el.dataset.d,v=el.value; courseMut(c=>{ c.prog={...(c.prog||{})}; c.prog[d]={...(c.prog[d]||{}),t:v}; }); }
  else if(act==='pDone'){ const d=el.dataset.d,v=el.checked; courseMut(c=>{ c.prog={...(c.prog||{})}; c.prog[d]={...(c.prog[d]||{}),done:v}; }); drawCourse(); render(); }
  else if(act==='imSel'){ IM.sel[el.dataset.k]=el.checked; drawImport(); }
  else if(act==='simSel'){ SIM.sel[el.dataset.i]=el.checked; drawStuImport(); }
  else if(act==='simAll'){ SIM.items.forEach((_,i)=>SIM.sel[i]=el.checked); drawStuImport(); }
});
document.addEventListener('input',e=>{ if(e.target.id==='ntQ'){ S.ntQ=e.target.value; clearTimeout(window._nq); window._nq=setTimeout(()=>{ const pos=e.target.selectionStart; render(); const q=$('#ntQ'); if(q){ q.focus(); q.setSelectionRange(pos,pos); } },180); return; } if(e.target.id==='stuQ'){ S.stuQ=e.target.value; clearTimeout(window._sq); window._sq=setTimeout(()=>{ const pos=e.target.selectionStart; render(); const q=$('#stuQ'); if(q){ q.focus(); q.setSelectionRange(pos,pos); } },180); } });
document.addEventListener('focusout',e=>{ if(renderDirty&&e.target.closest&&e.target.closest('#view')) setTimeout(()=>{ const a=document.activeElement; if(!(a&&a.closest&&a.closest('#view')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))) render(); },50); });
document.addEventListener('submit',e=>{
  if(e.target.id!=='taskForm') return; e.preventDefault();
  const text=$('#tkText').value.trim(); if(!text) return;
  store.put('tasks',{id:uid('t'),text,due:$('#tkDue').value||'',time:$('#tkTime').value||'',cat:$('#tkCat').value,sid:$('#tkSid').value||'',done:false,at:Date.now()});
  toast('할 일을 추가했어요',$('#tkTime').value?`${dueLabel({due:$('#tkDue').value,time:$('#tkTime').value})}에 알려 드릴게요.`:''); render(); const i=$('#tkText'); i&&i.focus();
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.closest&&e.target.closest('.login-form')){ e.preventDefault(); const b=$('.login-go'); b&&!b.disabled&&b.click(); return; } if(e.key==='Escape'){ if(modalEl) closeModal(); else closeDrawer(); } });

/* ===== POINTER MOTION ===== */
document.addEventListener('pointermove',e=>{
  const card=e.target.closest&&e.target.closest('.pane,.pcard,.stat');
  if(card){ const r=card.getBoundingClientRect(); card.style.setProperty('--mx',(e.clientX-r.left)+'px'); card.style.setProperty('--my',(e.clientY-r.top)+'px'); }
  const m=e.target.closest&&e.target.closest('.btn.pri,.mag');
  if(m&&e.pointerType==='mouse'){ const r=m.getBoundingClientRect(); const dx=(e.clientX-r.left-r.width/2)/r.width, dy=(e.clientY-r.top-r.height/2)/r.height; m.style.transform=`translate(${dx*6}px,${dy*5}px)`; m._mag=true; }
},{passive:true});
document.addEventListener('pointerout',e=>{ const m=e.target.closest&&e.target.closest('.btn.pri,.mag'); if(m&&m._mag&&!m.contains(e.relatedTarget)){ m.style.transform=''; m._mag=false; } });

/* ===== TIMERS & BOOT ===== */
let lastDay=null;
function tick(){
  const t=todayStr(); if(lastDay&&lastDay!==t){ render(); dayToast(); } lastDay=t;
  const now=new Date(); const nowKey=`${t}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
  for(const k of list('tasks')){
    if(k.done||!k.due||!k.time||k.notified) continue;
    const key=`${k.due}T${k.time}`; if(key>nowKey) continue;
    const ageH=(now-new Date(`${k.due}T${k.time}:00`))/36e5;
    if(ageH<12){ const st=k.sid&&D().students[k.sid]; toast(`${k.cat==='콜백'?'콜백 시간이에요':'할 일 시간이에요'} · ${k.time}`,k.text+(st&&st.phone?` (${st.phone})`:''),'alarm-t'); beep(); notify(`${k.cat==='콜백'?'콜백':'할 일'} · ${k.time}`,k.text+(st&&st.phone?` (${st.phone})`:'')); }
    store.put('tasks',{...k,notified:true});
  }
  if(S.locked) drawLock();
}
function notify(title,body){ try{ if(!('Notification' in window)||Notification.permission!=='granted') return; const opt={body,icon:'icons/icon-192.png',badge:'icons/favicon-64.png',tag:title}; if(navigator.serviceWorker&&navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(r=>r.showNotification(title,opt)); else new Notification(title,opt); }catch(e){} }
function dayToast(){
  if(S.gate) return; const t=todayStr(); if(lsGet('md.toastDay')===t) return; lsSet('md.toastDay',t);
  const un=activeAlarms().filter(a=>!a.ack); if(!un.length) return;
  const body=un.slice(0,3).map(a=>`${a.type==='start'?'개강':'종강'} D-${diffDays(t,a.date)} ${a.c.name}`).join(' · ');
  toast(`확인할 알림 ${un.length}건`,body,'alarm-t'); notify(`KAIA DESK · 확인할 알림 ${un.length}건`,body);
}
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); window._installPrompt=e; if(S.view==='settings') scheduleRender(); });
function bootLines(){ const n=activeAlarms().filter(a=>!a.ack).length; return ['INITIALIZING KAIA DESK','LINKING DATA CORE…',`시간표 동기화 · ${list('courses').length}개 과정`,`학생 데이터 · ${list('students').length}명`,`확인할 알림 · ${n}건`,`SYSTEM ONLINE — 환영합니다, ${S.settings.name||''}님`]; }
async function boot(){
  document.body.addEventListener('pointerdown',()=>{ try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} },{once:true});
  $('#scrim').onclick=closeDrawer;
  const h=(location.hash||'').slice(1); if(TITLES[h]) S.view=h;
  renderSide();
  $('#view').innerHTML='<div class="loading"><div><i></i>데이터를 불러오는 중…</div></div>';
  bgfx.init(); applyTheme(lsGet('md.bg')||'aurora');
  const BL=['INITIALIZING KAIA DESK','LINKING DATA CORE…']; const bootP=bootSequence(BL);
  await store.init();
  applyTheme();
  BL.push(...(S.gate?['AUTHENTICATION REQUIRED','로그인해 주세요']:bootLines().slice(2))); BL.ready=true;
  await bootP; applyFx(); if(FX.on()) S._fxAssemble=true; render(); dayToast(); tick(); setInterval(tick,30000);
}
boot();
