function qzFileName(qz,name,suffix){ return `${name?name+'_':''}${QBANK[qz.sub].name.replace(/[^\w가-힣]+/g,'')}_${QLEVEL[qz.lv]}_${suffix}.doc`; }

/* ---------- 채점 ---------- */
function parseAnswerText(txt,n){
  const ans=Array(n).fill(0); txt=String(txt||'').replace(/[①②③④]/g,m=>CIRC.indexOf(m));
  const pairs=[...txt.matchAll(/(\d{1,2})\s*[.:)번\-]\s*([1-4])/g)];
  if(pairs.length>=Math.min(3,n)){ pairs.forEach(m=>{ const i=+m[1]-1; if(i>=0&&i<n) ans[i]=+m[2]; }); return ans; }
  const seq=txt.replace(/[^1-4xX\-_?]/g,'').split(''); seq.slice(0,n).forEach((c,i)=>{ ans[i]=/[1-4]/.test(c)?+c:0; }); return ans;
}
function answersFromRows(rows,n){
  const ans=Array(n).fill(0); let hit=0;
  rows.forEach(cells=>{ for(let k=0;k+1<cells.length;k++){ const no=cells[k].trim(), v=cells[k+1].trim().replace(/[①②③④]/g,m=>CIRC.indexOf(m)); if(/^\d{1,2}$/.test(no)&&+no>=1&&+no<=n&&/^[1-4]$/.test(v)){ ans[+no-1]=+v; hit++; k++; } } });
  return hit?ans:null;
}
async function loadJSZip(){ if(window.JSZip) return window.JSZip; await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); return window.JSZip; }
async function answersFromFile(file,n){
  const name=file.name.toLowerCase();
  if(name.endsWith('.docx')){
    const Z=await loadJSZip(); const zip=await Z.loadAsync(await file.arrayBuffer()); const xml=await zip.file('word/document.xml').async('string');
    const doc=new DOMParser().parseFromString(xml,'application/xml'); const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
    const rows=[...doc.getElementsByTagNameNS(W,'tr')].map(tr=>[...tr.getElementsByTagNameNS(W,'tc')].map(tc=>[...tc.getElementsByTagNameNS(W,'t')].map(t=>t.textContent).join('')));
    return answersFromRows(rows,n)||parseAnswerText([...doc.getElementsByTagNameNS(W,'t')].map(t=>t.textContent).join(' '),n);
  }
  const text=await file.text();
  if(/<t[dr][\s>]/i.test(text)){ const d=new DOMParser().parseFromString(text,'text/html'); const rows=[...d.querySelectorAll('tr')].map(tr=>[...tr.children].map(td=>td.textContent)); const r=answersFromRows(rows,n); if(r) return r; return parseAnswerText(d.body.textContent,n); }
  return parseAnswerText(text,n);
}
function gradeQuiz(a){
  const qz=a.quiz; const ans=a.qAns||[]; const by={}; let ok=0, blank=0;
  qz.qs.forEach((q,i)=>{ const b=by[q.t]||(by[q.t]={c:0,n:0,b:0}); b.n++; if(!ans[i]){ b.b++; blank++; } else if(ans[i]===q.a){ b.c++; ok++; } });
  a.res={ok,n:qz.qs.length,blank,by,at:Date.now()}; a.score=`${ok}/${qz.qs.length}`; a.st='done'; const t=todayStr(); a.doneAt=t; if(!a.subAt) a.subAt=t;
  const nm=k=>QBANK[qz.sub].topics[k].n; const E=Object.entries(by);
  const weak=E.filter(([k,v])=>v.c/v.n<0.5).map(([k])=>nm(k)), mid=E.filter(([k,v])=>v.c/v.n>=0.5&&v.c/v.n<0.8).map(([k])=>nm(k));
  a.fb=[weak.length?`취약: ${weak.join(', ')}`:'',mid.length?`보완: ${mid.join(', ')}`:''].filter(Boolean).join(' · ')||'전 영역 양호';
  return a.res;
}
const pct=(c,n)=>n?Math.round(c/n*100):0;
function topicState(p){ return p>=80?['양호','ok']:p>=50?['보완','warn']:['취약','bad']; }

/* ---------- 차트 (SVG) ---------- */
function chartBars(rows,print){
  const col={ok:print?'#1f9d6b':'var(--ok)',warn:print?'#d98a00':'var(--warn)',bad:print?'#d6453a':'var(--bad)'};
  return `<div class="qz-bars" role="img" aria-label="영역별 정답률">${rows.map(r=>`<div class="qz-bar"><span class="n">${esc(r.n)}</span><span class="tr"><i style="width:${Math.max(2,r.p)}%;background:${col[topicState(r.p)[1]]}"></i></span><b>${r.p}%</b></div>`).join('')}</div>`;
}
function chartRadar(rows,print){
  const S2=300,C=S2/2,R=104,n=rows.length; const pt=(i,v)=>{ const a=-Math.PI/2+i*2*Math.PI/n; return [C+Math.cos(a)*R*v,C+Math.sin(a)*R*v]; };
  const grid=[0.25,0.5,0.75,1].map(g=>`<polygon points="${rows.map((_,i)=>pt(i,g).join(',')).join(' ')}" fill="none" stroke="${print?'#ccc':'var(--line-2)'}" stroke-width="1"/>`).join('');
  const axes=rows.map((_,i)=>{ const [x,y]=pt(i,1); return `<line x1="${C}" y1="${C}" x2="${x}" y2="${y}" stroke="${print?'#ddd':'var(--line)'}"/>`; }).join('');
  const poly=rows.map((r,i)=>pt(i,Math.max(0.04,r.p/100)).join(',')).join(' ');
  const labels=rows.map((r,i)=>{ const [x,y]=pt(i,1.2); return `<text x="${x}" y="${y+4}" text-anchor="middle" font-size="11.5" fill="${print?'#222':'currentColor'}">${esc(r.n)}</text>`; }).join('');
  const acc=print?'#1769c2':'var(--accent)';
  return `<svg class="qz-radar" viewBox="-30 -10 ${S2+60} ${S2+20}" role="img" aria-label="영역별 정답률 레이더">${grid}${axes}<polygon points="${poly}" fill="${acc}" fill-opacity=".18" stroke="${acc}" stroke-width="2"/>${rows.map((r,i)=>{ const [x,y]=pt(i,Math.max(0.04,r.p/100)); return `<circle cx="${x}" cy="${y}" r="3.5" fill="${acc}"/>`; }).join('')}${labels}</svg>`;
}
function chartTrend(pts,print){
  if(pts.length<2) return '';
  const W=print?640:Math.max(300,Math.min(860,innerWidth-110)),H=print?150:170,px=36,py=22; const x=i=>px+i*(W-px*2)/(pts.length-1), y=v=>H-py-(H-py*2)*v/100;
  const acc=print?'#1769c2':'var(--accent)';
  return `<svg class="qz-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="점수 추이">${[0,50,100].map(v=>`<line x1="${px}" x2="${W-px}" y1="${y(v)}" y2="${y(v)}" stroke="${print?'#eee':'var(--line)'}"/><text x="${px-8}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="${print?'#777':'currentColor'}" opacity=".7">${v}</text>`).join('')}
    <polyline points="${pts.map((p,i)=>x(i)+','+y(p.p)).join(' ')}" fill="none" stroke="${acc}" stroke-width="2.4" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.p)}" r="4" fill="${acc}"/><text x="${x(i)}" y="${y(p.p)-10}" text-anchor="middle" font-size="11" font-weight="700" fill="${print?'#222':'currentColor'}">${p.p}%</text><text x="${x(i)}" y="${H-2}" text-anchor="middle" font-size="10.5" fill="${print?'#777':'currentColor'}" opacity=".75">${esc(p.l)}</text>`).join('')}</svg>`;
}

/* ---------- 분석 리포트 ---------- */
function quizReport(s,a,print){
  const qz=a.quiz, B=QBANK[qz.sub], r=a.res; const p=pct(r.ok,r.n);
  const rows=Object.keys(r.by).map(k=>({k:+k,n:B.topics[k].n,c:r.by[k].c,t:r.by[k].n,b:r.by[k].b,p:pct(r.by[k].c,r.by[k].n)})).sort((x,y)=>x.k-y.k);
  const hist=(s.assigns||[]).filter(x=>x.kind==='quiz'&&x.res&&x.quiz.sub===qz.sub).sort((x,y)=>(x.res.at||0)-(y.res.at||0)).map(x=>({p:pct(x.res.ok,x.res.n),l:`${x.week}주차 ${QLEVEL[x.quiz.lv]}`}));
  const lvTxt=p>=85?`${QLEVEL[qz.lv]} 단계를 충분히 이해했어요. ${qz.lv<3?`다음엔 ${QLEVEL[qz.lv+1]} 단계로 올려도 좋아요.`:'실전 문제와 자격증 기출로 넘어가도 좋아요.'}`:p>=60?`${QLEVEL[qz.lv]} 단계의 기본은 잡혀 있어요. 아래 보완 영역을 채우면 다음 단계로 넘어갈 수 있어요.`:`${QLEVEL[qz.lv]} 단계가 아직 어려운 편이에요. 취약 영역을 ${qz.lv>1?QLEVEL[qz.lv-1]+' 단계부터 ':''}다시 다지는 걸 추천해요.`;
  const wrong=qz.qs.map((q,i)=>({q,i,ans:(a.qAns||[])[i]||0})).filter(x=>x.ans!==x.q.a);
  const tipFor=row=>{ const st=topicState(row.p)[0]; const i=st==='취약'?Math.max(0,qz.lv-2):st==='보완'?qz.lv-1:Math.min(2,qz.lv); return (st==='양호'&&qz.lv===3?'충분해요. 기출 · 실전 문제로 감을 유지하세요. ':'')+B.topics[row.k].study[i]; };
  const C=print?'qzr print':'qzr';
  return `<div class="${C}">
   <div class="qzr-top"><div><div class="qzr-k">${esc(s.name||'')} · ${esc(B.name)} ${QLEVEL[qz.lv]} 단계 · ${a.week}주차</div><div class="qzr-score"><b>${p}</b><span>점</span><em>${r.ok} / ${r.n} 정답${r.blank?` · 빈칸 ${r.blank}`:''}</em></div></div><p class="qzr-sum">${lvTxt}</p></div>
   <div class="qzr-grid"><div class="qzr-box"><h4>영역별 정답률</h4>${chartBars(rows,print)}</div><div class="qzr-box"><h4>균형</h4>${chartRadar(rows,print)}</div></div>
   ${hist.length>1?`<div class="qzr-box"><h4>${esc(B.name)} 점수 추이</h4>${chartTrend(hist,print)}</div>`:''}
   <div class="qzr-box"><h4>영역별 진단 · 이렇게 공부하세요</h4>${rows.slice().sort((x,y)=>x.p-y.p).map(row=>{ const [st,cls]=topicState(row.p); return `<div class="qzr-tp"><div class="qzr-tph"><span class="chip ${cls}">${st}</span><b>${esc(row.n)}</b><span class="qzr-m">${row.c}/${row.t} 정답 · ${row.p}%${row.b?` · 빈칸 ${row.b}`:''}</span></div><p>${esc(tipFor(row))}</p></div>`; }).join('')}</div>
   ${wrong.length&&B.ref?`<div class="qzr-box"><h4>참고 테이블</h4><pre>${esc(B.ref)}</pre></div>`:''}
   ${wrong.length?`<div class="qzr-box"><h4>틀린 문제 다시 보기 <small>${wrong.length}문항</small></h4>${wrong.map(x=>`<div class="qzr-w"><p class="qzr-wq"><b>${x.i+1}.</b> ${esc(x.q.q)} <span class="qzr-m">[${esc(B.topics[x.q.t].n)}]</span></p>${x.q.c?`<pre>${esc(x.q.c)}</pre>`:''}<p class="qzr-wa">학생 답 <b class="bad">${x.ans?CIRC[x.ans]+' '+esc(x.q.o[x.ans-1]):'빈칸'}</b> · 정답 <b class="ok">${CIRC[x.q.a]} ${esc(x.q.o[x.q.a-1])}</b></p><p class="qzr-we">${esc(x.q.e)}</p></div>`).join('')}</div>`:''}
  </div>`;
}

    a.qAns=ans; if(a.st==='set'){ a.st='sub'; a.subAt=todayStr(); } wRedraw(); toast('답안 파일을 읽었어요',`${got}/${a.quiz.qs.length}문항 인식 · 확인 후 채점하세요.`); }

function ackToggle(key){
  const acks={...(S.settings.acks||{})}; if(acks[key]) delete acks[key]; else acks[key]=todayStr();
  const t=todayStr(); for(const k in acks){ if(acks[k]<addDays(t,-60)) delete acks[k]; }
  S.settings.acks=acks; store.saveSettings(); render();
}

document.addEventListener('click',e=>{
  if(S.locked) return;
  const g=e.target.closest('[data-go]'); if(g){ e.preventDefault(); if(modalEl&&g.closest('.modal')) closeModal(); go(g.dataset.go); return; }
  const a=e.target.closest('[data-act]'); if(!a) return;
  if(a.tagName==='INPUT'&&(a.type==='checkbox'||a.type==='text'||a.type==='date')) return; // handled on change
  const f=ACT[a.dataset.act]||WACT[a.dataset.act]; if(f){ e.preventDefault(); f(a,e); }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='xlsFile'&&el.files.length){ handleXlsx([...el.files]); el.value=''; return; }
  if(el.id==='stuJson'&&el.files[0]){ handleStudentJson(el.files[0]); el.value=''; return; }
  if(el.id==='simMerge'){ SIM.merge=el.checked; return; }
  if(el.dataset.smap!=null){ const f=el.dataset.smap; for(const k in SIM.map) if(SIM.map[k]===el.value&&k!==f) delete SIM.map[k]; if(el.value) SIM.map[f]=el.value; else delete SIM.map[f]; drawStuImport(); return; }
  if(el.id==='restoreFile'&&el.files[0]){ restoreFrom(el.files[0]); el.value=''; return; }
  if(el.id==='stuCourse'){ S.stuCourse=el.value; render(); return; }
  if(el.dataset.map!=null){ remapImport(el.dataset.map,el.value); return; }
  if(el.dataset.room!=null){ S.settings.rooms={...(S.settings.rooms||{}),[el.dataset.room]:el.value.trim()}; store.saveSettings(); toast('저장했어요',''); return; }
  if(el.dataset.zoom!=null){ const zs=clone(S.settings.zooms||[]); const i=+el.dataset.zoom; let v=el.value.trim(); if(el.dataset.f==='k') v=v.toUpperCase(); zs[i][el.dataset.f]=v; S.settings.zooms=zs; store.saveSettings(); toast('저장했어요',''); return; }
  if(el.dataset.set){ const path=el.dataset.set; let v=el.value;
    if(path==='pin'&&v&&!/^\d{4}$/.test(v)){ toast('비밀번호는 숫자 4자리예요',''); return; }
    if(path.startsWith('tpl.')) S.settings.tpl={...S.settings.tpl,[path.slice(4)]:v}; else S.settings[path]=v;
    store.saveSettings(); renderSide(); toast('저장했어요',''); return; }
  const act=el.dataset.act; if(!act) return;
  if(act==='sentToggle'){ const s=D().students[el.dataset.id]; const sent={...(s.sent||{})}; const k=`${S.noticeCourse}|${S.ntTpl}`; if(el.checked) sent[k]=todayStr(); else delete sent[k]; store.put('students',{...s,sent}); scheduleRender(); }
  else if(act==='taskDone'){ const k=D().tasks[el.dataset.id]; store.put('tasks',{...k,done:el.checked,doneAt:el.checked?Date.now():null}); setTimeout(render,250); }
  else if(act==='sfxToggle'){ S.settings.sfx=el.checked; store.saveSettings(); if(el.checked) sfx('ok'); }
  else if(act==='offToggle'){ const o=+el.dataset.o; const s=new Set(S.settings.offsets||[]); el.checked?s.add(o):s.delete(o); if(!s.size){ el.checked=true; toast('하나 이상은 골라 주세요',''); return; } S.settings.offsets=[...s].sort((a,b)=>b-a); store.saveSettings(); render(); }
  else if(act==='topic'){ const d=el.dataset.d,v=el.value; courseMut(c=>{ c.prog={...(c.prog||{})}; c.prog[d]={...(c.prog[d]||{}),t:v}; }); }
  else if(act==='pDone'){ const d=el.dataset.d,v=el.checked; courseMut(c=>{ c.prog={...(c.prog||{})}; c.prog[d]={...(c.prog[d]||{}),done:v}; }); drawCourse(); render(); }
  else if(act==='imSel'){ IM.sel[el.dataset.k]=el.checked; drawImport(); }
  else if(act==='simSel'){ SIM.sel[el.dataset.i]=el.checked; drawStuImport(); }
  else if(act==='simAll'){ SIM.items.forEach((_,i)=>SIM.sel[i]=el.checked); drawStuImport(); }
});

document.addEventListener('pointermove',e=>{
  const card=e.target.closest&&e.target.closest('.pane,.pcard,.stat');
  if(card){ const r=card.getBoundingClientRect(); card.style.setProperty('--mx',(e.clientX-r.left)+'px'); card.style.setProperty('--my',(e.clientY-r.top)+'px'); }

},{passive:true});

/* ===== TIMERS & BOOT ===== */
let lastDay=null;
function tick(){
  const t=todayStr(); if(lastDay&&lastDay!==t){ render(); dayToast(); } lastDay=t;
  const now=new Date(); const nowKey=`${t}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
  for(const k of list('tasks')){
    if(k.done||!k.due||!k.time||k.notified) continue;
    const key=`${k.due}T${k.time}`; if(key>nowKey) continue;
    const ageH=(now-new Date(`${k.due}T${k.time}:00`))/36e5;
    if(ageH<12){ const st=k.sid&&D().students[k.sid]; toast(`${k.cat==='콜백'?'콜백 시간이에요':'할 일 시간이에요'} · ${k.time}`,k.text+(st&&st.phone?` (${st.phone})`:''),'alarm-t'); beep(); notify(`${k.cat==='콜백'?'콜백':'할 일'} · ${k.time}`,k.text+(st&&st.phone?` (${st.phone})`:'')); }
    store.put('tasks',{...k,notified:true});
  }
  if(S.locked) drawLock();
}
function notify(title,body){ try{ if(!('Notification' in window)||Notification.permission!=='granted') return; const opt={body,icon:'icons/icon-192.png',badge:'icons/favicon-64.png',tag:title}; if(navigator.serviceWorker&&navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(r=>r.showNotification(title,opt)); else new Notification(title,opt); }catch(e){} }
function dayToast(){
  if(S.gate) return; const t=todayStr(); if(lsGet('md.toastDay')===t) return; lsSet('md.toastDay',t);
  const un=activeAlarms().filter(a=>!a.ack); if(!un.length) return;
  const body=un.slice(0,3).map(a=>`${a.type==='start'?'개강':'종강'} D-${diffDays(t,a.date)} ${a.c.name}`).join(' · ');
  toast(`확인할 알림 ${un.length}건`,body,'alarm-t'); notify(`KAIA DESK · 확인할 알림 ${un.length}건`,body);
}
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); window._installPrompt=e; if(S.view==='settings') scheduleRender(); });
function bootLines(){ const n=activeAlarms().filter(a=>!a.ack).length; return ['INITIALIZING KAIA DESK','LINKING DATA CORE…',`시간표 동기화 · ${list('courses').length}개 과정`,`학생 데이터 · ${list('students').length}명`,`확인할 알림 · ${n}건`,`SYSTEM ONLINE — 환영합니다, ${S.settings.name||''}님`]; }
async function boot(){
  document.body.addEventListener('pointerdown',()=>{ try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} },{once:true});
  $('#scrim').onclick=closeDrawer;
  const h=(location.hash||'').slice(1); if(TITLES[h]) S.view=h;

  await bootP; applyFx(); if(FX.on()) S._fxAssemble=true; render(); dayToast(); tick(); setInterval(tick,30000);
}
