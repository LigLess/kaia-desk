<title>개강 안내 · 코리아AI아카데미</title>

<meta property="og:title" content="개강 안내 · 코리아AI아카데미">
<meta property="og:description" content="수업 일정 · 시간 · 참여 방법을 확인해 주세요.">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 갤러리형: 흰 면 ↔ 옅은 회색 면 ↔ 검정 타일 · 강조색은 파랑 하나 */
:root{
  --bg:#ffffff; --bg-2:#f5f5f7; --ink:#1d1d1f; --ink-2:#424245; --sub:#6e6e73; --line:#d2d2d7;
  --accent:#0066cc; --accent-ink:#ffffff;
  --tile:#000000; --tile-2:#1d1d1f; --tile-ink:#f5f5f7; --tile-sub:#a1a1a6; --tile-line:#3a3a3c; --tile-accent:#2997ff;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-move:cubic-bezier(.77,0,.175,1);
  --f:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:#fff}
a{color:var(--accent);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:980px;margin:0 auto;padding:0 24px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* 상단 바 */
.bar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);border-bottom:1px solid var(--bg-2)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.brand svg{width:22px;height:22px}
.bar-r{font-size:14px;color:var(--sub)}

/* 첫 화면 */
.hero{padding:72px 0 88px}
.hello{font-size:19px;color:var(--ink-2);margin:0 0 14px}
.hero h1{font-size:clamp(34px,6.4vw,64px);line-height:1.16;letter-spacing:-.035em;font-weight:800;max-width:15em}
.lead{margin:22px 0 0;font-size:clamp(18px,2.2vw,22px);color:var(--ink-2);line-height:1.6}
.lead b{color:var(--ink);font-weight:700}
.dday{display:flex;align-items:flex-end;gap:18px;margin-top:48px;flex-wrap:wrap}
.dday-n{font-size:clamp(84px,15vw,148px);line-height:.86;font-weight:800;letter-spacing:-.05em}
.dday-t{padding-bottom:8px}
.dday-t b{display:block;font-size:20px;font-weight:700}
.dday-t span{font-size:15px;color:var(--sub)}

/* 한눈에: 표 */
.sec{padding:96px 0}
.sec.gray{background:var(--bg-2)}
.sec h2{font-size:clamp(28px,4.2vw,40px);letter-spacing:-.03em;line-height:1.2;font-weight:800}
.sec .sub{margin:12px 0 0;color:var(--ink-2);font-size:17px}
.facts{margin:40px 0 0;border-top:1px solid var(--line)}
.facts div{display:grid;grid-template-columns:160px 1fr;gap:20px;padding:20px 0;border-bottom:1px solid var(--line)}
.facts dt{font-size:15px;color:var(--sub);padding-top:3px}
.facts dd{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em}
.facts dd small{display:block;font-size:15px;font-weight:400;color:var(--ink-2);margin-top:2px}

/* 수업 달력 (설명 모션: 수업 날짜가 순서대로 찍힘) */
.cal-top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px 40px;margin-top:40px}
.month h3{font-size:19px;font-weight:750;margin:0 0 12px;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.months>*{min-width:0}
.grid .w{font-size:13px;color:var(--sub);text-align:center;padding:4px 0 8px}
.grid .w.sun{color:#c9342a}
.d{aspect-ratio:1;display:grid;place-items:center;font-size:15px;color:var(--ink-2);border-radius:50%;position:relative;border:0;background:none;font-family:inherit;padding:0}
.d.out{visibility:hidden}
.d.cls{background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;transition:transform 160ms var(--ease-out)}
.d.cls:active{transform:scale(.94)}
.d.today:not(.cls){box-shadow:inset 0 0 0 1.5px var(--ink)}
.d.cls.sel{background:var(--ink)}
.d i{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:700;color:var(--accent);white-space:nowrap}
.js .d.cls{opacity:0;transform:scale(.95)}
.js .d.cls.on{opacity:1;transform:none;transition:opacity 260ms var(--ease-out),transform 260ms var(--ease-out),background 160ms}
.pick{margin-top:36px;min-height:64px;display:flex;align-items:center;gap:16px;padding:18px 22px;background:var(--bg);border-radius:999px;font-size:17px}
.sec.gray .pick{background:#fff}
.pick b{font-size:15px;font-weight:700;color:var(--accent);flex:none}
.pick span{color:var(--ink)}
.pat{display:inline-flex;align-items:center;gap:8px;font-size:15px;color:var(--ink-2)}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:16px;font-weight:650;text-decoration:none;cursor:pointer;transition:transform 160ms var(--ease-out),background 160ms}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px currentColor}
.btn svg{width:18px;height:18px;flex:none}
@media (hover:hover) and (pointer:fine){.btn:hover{background:#0071e3}.btn.ghost:hover{background:rgba(0,102,204,.06)}}

/* 참여 방법: 검정 타일 */
.tile{background:var(--tile);color:var(--tile-ink)}
.tile h2{color:var(--tile-ink)}
.tile .sub{color:var(--tile-sub)}
.tile a{color:var(--tile-accent)}
.join{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;margin-top:48px;align-items:start}
.join h3{font-size:22px;font-weight:750;letter-spacing:-.01em;margin:0 0 8px}
.join p{margin:0;color:var(--tile-sub)}
.join .blk+.blk{margin-top:44px}
.tile .btn{background:var(--tile-accent);color:#000}
.tile .btn.ghost{background:transparent;color:var(--tile-accent)}
.kv{margin:18px 0 0;display:grid;gap:10px}
.kv div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:var(--tile-2);border-radius:14px}
.kv dt{font-size:14px;color:var(--tile-sub)}
.kv dd{margin:0;font-size:20px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:12px}
.copy{border:0;background:none;color:var(--tile-accent);font:inherit;font-size:14px;font-weight:650;cursor:pointer;padding:6px 2px;transition:transform 160ms var(--ease-out)}
.copy:active{transform:scale(.95)}
.route{margin:18px 0 0;padding:0;list-style:none;display:grid;gap:0}
.route li{display:grid;grid-template-columns:28px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--tile-line)}
.route li:last-child{border-bottom:1px solid var(--tile-line)}
.route li svg{width:24px;height:24px;margin-top:3px}
.route b{display:block;color:var(--tile-ink);font-weight:650}
.route span{color:var(--tile-sub);font-size:15px}
.mapfig{border-radius:20px;background:var(--tile-2);padding:22px}
.mapfig svg{width:100%;height:auto;display:block}
.mapfig figcaption{font-size:14px;color:var(--tile-sub);margin-top:12px}
.memo{white-space:pre-wrap;margin-top:14px;padding:16px 18px;background:var(--tile-2);border-radius:14px;color:var(--tile-ink);font-size:16px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}

/* 안내사항 */
.rules{margin:40px 0 0;padding:0;list-style:none;counter-reset:r;max-width:760px}
.rules li{counter-increment:r;display:grid;grid-template-columns:44px 1fr;gap:8px;padding:22px 0;border-top:1px solid var(--line);font-size:17px}
.rules li::before{content:counter(r);font-size:15px;font-weight:700;color:var(--accent);padding-top:2px}
.rules li b{font-weight:700}

/* 담당 멘토 */
.mentor{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;flex-wrap:wrap;margin-top:28px}
.mentor .who{font-size:clamp(26px,4vw,36px);font-weight:800;letter-spacing:-.025em}
.mentor .tel{font-size:17px;color:var(--ink-2);margin-top:6px}
footer{padding:40px 0 56px;color:var(--sub);font-size:14px;border-top:1px solid var(--bg-2)}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);opacity:0;background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:15px;pointer-events:none;transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out);z-index:10}
.toast.on{opacity:1;transform:translate(-50%,0)}
.err{min-height:70vh;display:grid;place-items:center;text-align:center;padding:40px 24px}
.err h1{font-size:28px}.err p{color:var(--ink-2)}

/* 등장 (스크립트가 있을 때만 숨겼다가 보여줌) */
.js .rv{opacity:0;transform:translateY(24px)}
.js .rv.in{opacity:1;transform:none;transition:opacity 560ms var(--ease-out),transform 560ms var(--ease-out)}

@media (max-width:760px){
  body{font-size:16px}
  .wrap{padding:0 20px}
  .hero{padding:44px 0 64px}
  .sec{padding:72px 0}
  .facts div{grid-template-columns:1fr;gap:2px;padding:16px 0}
  .facts dd{font-size:19px}
  .join{grid-template-columns:1fr;gap:40px}
  .months{grid-template-columns:1fr}
  .pick{border-radius:20px}
  .btn{flex:1 1 auto}
  .bar-r{display:none}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .js .rv,.js .rv.in,.js .d.cls,.js .d.cls.on{transform:none!important;transition:opacity 300ms linear!important}
}
@media print{.bar,.btns,.btn,.copy,.toast{display:none!important}.tile{background:#fff;color:#000}.sec{padding:32px 0}}
</style>
</head>

/* 내 캘린더에 추가 (.ics) */
function ics(D,dates){ var tm=String(D.tm||'').match(/(\d{1,2}):(\d{2})\s*[~\-–]\s*(\d{1,2}):(\d{2})/); var p=function(n){ return String(n).padStart(2,'0'); };
  var lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//KAIA//notice//KO','CALSCALE:GREGORIAN'];
  var esc=function(s){ return String(s||'').replace(/[\\,;]/g,function(c){ return '\\'+c; }).replace(/\n/g,'\\n'); };
  var loc=D.md==='off'?BRANCH.addr:D.md==='zoom'?'ZOOM':'온라인';
  dates.forEach(function(d,i){ var ds=d.replace(/-/g,''); lines.push('BEGIN:VEVENT','UID:'+ds+'-'+i+'-'+Math.abs(hash(D.t||''))+'@kaia','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z');
    if(tm){ lines.push('DTSTART;TZID=Asia/Seoul:'+ds+'T'+p(tm[1])+tm[2]+'00','DTEND;TZID=Asia/Seoul:'+ds+'T'+p(tm[3])+tm[4]+'00'); }
    else { var nx=pd(d); nx.setDate(nx.getDate()+1); lines.push('DTSTART;VALUE=DATE:'+ds,'DTEND;VALUE=DATE:'+ymd(nx).replace(/-/g,'')); }
    lines.push('SUMMARY:'+esc((D.t||'수업')+' '+(i+1)+'회차'),'LOCATION:'+esc(loc));
    if(D.zu) lines.push('URL:'+esc(safeUrl(D.zu)));
    lines.push('END:VEVENT'); });
  lines.push('END:VCALENDAR');
  var blob=new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'}); var u=URL.createObjectURL(blob);
  var a=el('a',{href:u,download:(D.t||'수업')+'.ics'}); document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(u); },4000);
  toast('달력 파일을 열면 수업 '+dates.length+'회가 추가돼요'); }
function hash(s){ var h=0; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return h; }

/* 움직임: 섹션 등장 + 수업 날짜가 회차 순서대로 찍힘 + D-day 숫자 */
function motion(months){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var io=new IntersectionObserver(function(es){ es.forEach(function(e){ if(!e.isIntersecting) return; io.unobserve(e.target); var t=e.target;
      var sib=[].slice.call(t.parentNode.children).filter(function(x){ return x.classList.contains('rv'); }); var i=Math.max(0,sib.indexOf(t));
      setTimeout(function(){ t.classList.add('in'); },i*70); }); },{rootMargin:'0px 0px -8% 0px'});
  document.querySelectorAll('.rv').forEach(function(x){ io.observe(x); });
  var cls=[].slice.call(months.querySelectorAll('.d.cls')).sort(function(a,b){ return a.dataset.no-b.dataset.no; });
  var io2=new IntersectionObserver(function(es){ if(!es[0].isIntersecting) return; io2.disconnect();
    cls.forEach(function(b,i){ setTimeout(function(){ b.classList.add('on'); },reduce?0:180+i*Math.min(90,1400/cls.length)); }); },{threshold:.2});
  io2.observe(months);
  var n=document.querySelector('.dday-n[data-to]'); if(n&&!reduce){ var to=+n.dataset.to, st=performance.now(), from=Math.min(to+30,to*2+5);
    (function f(now){ var k=Math.min(1,(now-st)/1100), e=1-Math.pow(1-k,4); n.textContent='D-'+Math.round(from-(from-to)*e); if(k<1) requestAnimationFrame(f); })(st); }
  var walk=document.querySelector('.walk'); if(walk&&!reduce){ walk.querySelectorAll('path').forEach(function(p){ var L=p.getTotalLength(); p.style.strokeDasharray=L; p.style.strokeDashoffset=L;
      var io3=new IntersectionObserver(function(es){ if(!es[0].isIntersecting) return; io3.disconnect(); p.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:1400,easing:'cubic-bezier(.77,0,.175,1)',fill:'forwards'}).onfinish=function(){ p.style.strokeDasharray='6 7'; p.style.strokeDashoffset=0; }; },{threshold:.4}); io3.observe(p); }); }
  var live=document.querySelector('.live'); if(live&&!reduce) live.animate([{opacity:1},{opacity:.25},{opacity:1}],{duration:1600,iterations:Infinity});
}

function fail(){ document.documentElement.classList.remove('js'); $('#app').innerHTML='<div class="err"><div><h1>안내 링크를 열 수 없어요</h1><p>링크가 잘렸거나 바뀌었을 수 있어요.<br>받은 메시지의 링크를 처음부터 끝까지 그대로 눌러 주시고, 그래도 안 되면 담당 멘토에게 알려 주세요.</p></div></div>'; }
decode().then(function(D){ if(!D||!D.s) throw 0; render(D); }).catch(fail);
