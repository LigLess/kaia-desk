<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>개강 안내 · 코리아AI아카데미</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="수업 일정과 참여 방법을 한 페이지에서 확인하세요.">
<meta property="og:type" content="website">
<meta property="og:title" content="개강 안내 · 코리아AI아카데미">
<meta property="og:description" content="수업 일정 · 시간 · 참여 방법을 확인해 주세요.">
<meta property="og:image" content="https://ligless.github.io/kaia-desk/icons/og-notice.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="theme-color" content="#16110d">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="preload" as="image" href="icons/bg-lounge.jpg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 라운지 글래스: 따뜻한 실내 사진 위에 연기 낀 유리판 · 강조색은 앰버 하나 */
:root{
  --room:#16110d;
  --glass:rgba(26,20,16,.46); --glass-2:rgba(255,255,255,.06); --glass-3:rgba(255,255,255,.1);
  --edge:rgba(255,255,255,.09); --edge-hi:rgba(255,255,255,.16);
  --ink:#fbf6f0; --ink-2:rgba(251,246,240,.82); --sub:rgba(251,246,240,.6); --faint:rgba(251,246,240,.38);
  --amber:#ff9d4d; --amber-ink:#2a1606; --amber-glass:rgba(255,157,77,.24); --amber-edge:rgba(255,190,130,.38);
  --ok:#7ee0a5; --bad:#ff8a7a;
  --blur:blur(24px) saturate(140%);
  --r:22px;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-move:cubic-bezier(.77,0,.175,1);
  --f:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;background:var(--room)}
body{margin:0;color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;min-height:100vh}
::selection{background:var(--amber);color:var(--amber-ink)}
a{color:var(--amber);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* 배경: 흐린 실내 + 스탠드 조명이 천천히 숨 쉬듯 */
.scene{position:fixed;inset:0;z-index:-1;background:var(--room) url(icons/bg-lounge.jpg) center/cover no-repeat}
.scene::after{content:"";position:absolute;inset:0;background:rgba(10,7,5,.28)}
.lamp{position:absolute;right:12%;top:26%;width:46vmax;height:46vmax;transform:translate(50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,168,92,.30),rgba(255,168,92,0));opacity:.7}

.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:inset 0 0 0 1px var(--edge),inset 0 1px 0 var(--edge-hi);border-radius:var(--r)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(26,20,16,.9)}}

/* 왼쪽 레일 (PC) · 아래 독 (폰) */
.rail{position:fixed;left:18px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border-radius:999px}
.mark{width:40px;height:40px;border-radius:12px;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;margin-bottom:10px}
.mark svg{width:22px;height:22px}
.nav{position:relative;display:flex;flex-direction:column;gap:6px}
.nav a{text-decoration:none;position:relative;z-index:1;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--sub);transition:color 200ms var(--ease-out),transform 160ms var(--ease-out)}
.nav a svg{width:20px;height:20px}
.nav a.on{color:#1a120c}
.nav a:active{transform:scale(.92)}
.nav .pill{position:absolute;left:0;top:0;width:44px;height:44px;border-radius:50%;background:#fbf6f0;transition:transform 380ms var(--ease-move);z-index:0}
.nav a span{position:absolute;left:58px;white-space:nowrap;font-size:13px;font-weight:600;color:var(--ink);background:rgba(20,15,12,.9);padding:5px 10px;border-radius:8px;opacity:0;transform:translateX(-4px);pointer-events:none;transition:opacity 160ms var(--ease-out),transform 160ms var(--ease-out)}
@media (hover:hover) and (pointer:fine){.nav a:hover{color:var(--ink)}.nav a.on:hover{color:#1a120c}.nav a:hover span{opacity:1;transform:none}}

.page{max-width:1200px;margin:0 auto;padding:22px 28px 80px 108px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-2)}
.chip svg{width:18px;height:18px}
.chip .dot{width:26px;height:26px;border-radius:50%;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center}
.chip .dot svg{width:15px;height:15px}
.top .sp{flex:1}
.who{width:44px;height:44px;border-radius:50%;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;font-weight:800;font-size:13px;position:relative}
.who::after{content:"";position:absolute;right:1px;bottom:1px;width:11px;height:11px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px #1d1510}

.hello{margin:46px 0 26px}
.hello h1{font-size:clamp(28px,4.4vw,44px);letter-spacing:-.03em;line-height:1.2;font-weight:800}
.hello p{margin:8px 0 0;color:var(--sub);font-size:16px}

/* 대시보드 격자 */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{padding:22px;position:relative;min-width:0}
.card h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.card .cap{font-size:13px;color:var(--sub);margin-top:2px}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:span 4}
.stat{display:flex;flex-direction:column;justify-content:space-between;min-height:150px}
.stat .lab{font-size:14px;color:var(--ink-2);font-weight:600}
.stat .val{font-size:clamp(24px,2.6vw,32px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:18px}
.stat .val.big{font-size:clamp(40px,4.6vw,56px);letter-spacing:-.04em}
.stat .foot{font-size:13px;color:var(--sub);margin-top:6px}
.stat.hot{background:var(--amber-glass);box-shadow:inset 0 0 0 1px var(--amber-edge),inset 0 1px 0 rgba(255,220,180,.35)}
.go{text-decoration:none;position:absolute;right:16px;top:16px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--glass-3);color:var(--ink);transition:transform 160ms var(--ease-out),background 160ms}
.go svg{width:15px;height:15px}
.stat.hot .go{background:#fbf6f0;color:#1a120c}
.go:active{transform:scale(.92)}

/* 회차 막대 (설명 모션: 지난 수업 · 다음 수업 · 남은 수업이 자라남) */
.bars{display:flex;align-items:flex-end;justify-content:space-around;gap:10px;height:200px;margin-top:22px;padding-top:34px;position:relative}
.bar{flex:1;min-width:10px;max-width:64px;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer}
.bar i{display:block;width:100%;border-radius:999px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);transform-origin:bottom;transition:background 160ms}
.bar.past i{background:rgba(251,246,240,.78)}
.bar.next i{background:var(--amber)}
.bar small{font-size:11px;color:var(--faint);white-space:nowrap}
.bar.next small{color:var(--amber);font-weight:700}
.bar.sel i{box-shadow:0 0 0 2px var(--ink)}
.tip{position:absolute;top:0;transform:translateX(-50%);background:#fbf6f0;color:#1a120c;font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap;transition:left 300ms var(--ease-move);pointer-events:none}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-top:14px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.js .bar i{transform:scaleY(.02)}
.js .bar.on i{transform:none;transition:transform 700ms var(--ease-out),background 160ms}

/* 달력 */
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,360px));gap:22px 30px;margin-top:18px}
.months>*{min-width:0}
.month h3{font-size:15px;font-weight:700;margin:0 0 8px;color:var(--ink-2)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .w{font-size:12px;color:var(--faint);text-align:center;padding:2px 0 6px}
.cal .w.sun{color:#ff9a8a}
.d{aspect-ratio:1;display:grid;place-items:center;font-size:14px;color:var(--sub);border-radius:50%;position:relative;border:0;background:none;font-family:inherit;padding:0}
.d.out{visibility:hidden}
.d.cls{background:var(--amber);color:var(--amber-ink);font-weight:800;cursor:pointer;transition:transform 160ms var(--ease-out)}
.d.cls.past{background:rgba(251,246,240,.78);color:#1a120c}
.d.cls:active{transform:scale(.92)}
.d.today:not(.cls){box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink)}
.d.cls.sel{box-shadow:0 0 0 2px var(--ink)}
.js .d.cls{opacity:0;transform:scale(.95)}
.js .d.cls.on{opacity:1;transform:none;transition:opacity 260ms var(--ease-out),transform 260ms var(--ease-out)}

/* 다음 수업 · 선택한 회차 */
.next .no{display:inline-flex;height:28px;align-items:center;padding:0 12px;border-radius:999px;background:var(--amber);color:var(--amber-ink);font-size:13px;font-weight:800}
.next .when{font-size:clamp(26px,3vw,34px);font-weight:800;letter-spacing:-.025em;line-height:1.2;margin-top:16px}
.next .tm{font-size:17px;color:var(--ink-2);margin-top:6px;font-weight:600}
.next .st{font-size:13px;color:var(--sub);margin-top:4px}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:999px;border:0;background:var(--amber);color:var(--amber-ink);font:inherit;font-size:15px;font-weight:700;text-decoration:none;cursor:pointer;transition:transform 160ms var(--ease-out),background 160ms}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--glass-3);color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge)}
.btn svg{width:18px;height:18px;flex:none}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
@media (hover:hover) and (pointer:fine){.btn:hover{background:#ffad66}.btn.ghost:hover{background:rgba(255,255,255,.16)}.go:hover{background:rgba(255,255,255,.2)}}

/* 참여 방법 */
.route{margin:16px 0 0;padding:0;list-style:none}
.route li{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--edge)}
.route li:last-child{border-bottom:1px solid var(--edge)}
.route .ic{width:36px;height:36px;border-radius:50%;background:var(--glass-3);display:grid;place-items:center}
.route .ic svg{width:18px;height:18px}
.route b{display:block;font-weight:700;font-size:15px}
.route span{color:var(--sub);font-size:14px}
.kv{margin:16px 0 0;display:grid;gap:8px}
.kv div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--glass-2);border-radius:14px;box-shadow:inset 0 0 0 1px var(--edge)}
.kv dt{font-size:13px;color:var(--sub)}
.kv dd{margin:0;font-size:19px;font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.copy{border:0;background:var(--glass-3);color:var(--ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:6px 12px;border-radius:999px;transition:transform 160ms var(--ease-out)}
.copy:active{transform:scale(.95)}
.memo{white-space:pre-wrap;margin-top:14px;padding:14px 16px;background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--edge);border-radius:14px;color:var(--ink);font-size:15px}
.blk+.blk{margin-top:28px;padding-top:24px;border-top:1px solid var(--edge)}
.blk h3{font-size:17px;font-weight:700}
.blk p{margin:4px 0 0;color:var(--sub);font-size:14px}
.fig svg{width:100%;height:auto;display:block;margin-top:14px}
.fig p{font-size:13px;color:var(--sub);margin:10px 0 0}

/* 안내사항 · 멘토 */
.rules{margin:14px 0 0;padding:0;list-style:none;counter-reset:r}
.rules li{counter-increment:r;display:grid;grid-template-columns:32px 1fr;gap:10px;padding:14px 0;border-top:1px solid var(--edge);font-size:15px;color:var(--ink-2)}
.rules li::before{content:counter(r);width:24px;height:24px;border-radius:50%;background:var(--glass-3);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink);margin-top:1px}
.rules li b{color:var(--ink);font-weight:700}
.mentor .av{width:64px;height:64px;flex:none;border-radius:50%;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;font-size:20px;font-weight:800}
.mentor .nm{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:16px}
.mentor .role{font-size:13px;color:var(--sub)}
.mentor .tel{font-size:15px;color:var(--ink-2);margin-top:10px;line-height:1.8}
.mentor .btn{flex:1 1 auto}
.pfoot{margin-top:28px;font-size:13px;color:var(--faint);text-align:center}

.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,12px);opacity:0;background:#fbf6f0;color:#1a120c;font-weight:700;padding:11px 18px;border-radius:999px;font-size:14px;pointer-events:none;transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out);z-index:30}
.toast.on{opacity:1;transform:translate(-50%,0)}
.err{min-height:80vh;display:grid;place-items:center;text-align:center;padding:40px 24px}
.err .glass{padding:36px 28px;max-width:480px}
.err h1{font-size:24px}.err p{color:var(--sub)}

/* 등장 */
.js .rv{opacity:0;transform:translateY(18px) scale(.985)}
.js .rv.in{opacity:1;transform:none;transition:opacity 520ms var(--ease-out),transform 520ms var(--ease-out)}

@media (max-width:980px){
  .page{padding:16px 16px 120px}
  .rail{left:50%;right:auto;top:auto;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);flex-direction:row;padding:7px;gap:0}
  .rail .mark{display:none}
  .nav{flex-direction:row;gap:4px}
  .nav a{width:54px;height:48px;border-radius:999px;display:flex;flex-direction:column;gap:1px;font-size:10.5px}
  .nav a span{position:static;opacity:1;transform:none;background:none;padding:0;color:inherit;font-size:10.5px;font-weight:700}
  .nav a svg{width:19px;height:19px}
  .nav .pill{width:54px;height:48px;border-radius:999px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .span3,.span4{grid-column:span 2}
  .span2.solo-m{grid-column:span 2}
  .hello{margin:30px 0 18px}
  .stat{min-height:132px;padding:18px}
  .card{padding:18px}
  .bars{gap:6px;height:170px}
  .chip.course{display:none}
  .m2{grid-column:span 2}
  .top .chip.num{display:none}
}
@media (max-width:420px){.nav a{width:50px}.nav .pill{width:50px}}
@media (pointer:fine) and (prefers-reduced-motion:no-preference){.lamp{animation:breathe 9s ease-in-out infinite alternate}}
@keyframes breathe{from{opacity:.45}to{opacity:.85}}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .js .rv,.js .rv.in,.js .d.cls,.js .d.cls.on,.js .bar i,.js .bar.on i{transform:none!important;transition:opacity 300ms linear!important}
  .nav .pill{transition:none}
}
@media print{.rail,.btns,.btn,.copy,.toast,.scene,.go{display:none!important}body{color:#000;background:#fff}.glass{background:#fff;box-shadow:inset 0 0 0 1px #ddd;-webkit-backdrop-filter:none;backdrop-filter:none}}
</style>
</head>
<body>
<div class="scene" aria-hidden="true"><div class="lamp"></div></div>
<div id="root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><div class="err"><div class="glass"><h1>개강 안내</h1><p>이 페이지는 브라우저의 자바스크립트가 켜져 있어야 보여요.</p></div></div></noscript>
<script>
(function(){
'use strict';
document.documentElement.classList.add('js');
var DOW='일월화수목금토';
var BRANCH={name:'코리아AI아카데미 부산점',addr:'부산 부산진구 중앙대로 668 에이원플라자 4층',map:'https://map.naver.com/p/entry/place/1728207405',
  routes:[['train','서면역 2번 출구','직진 도보 7분 · 삼정타워 옆 건물'],['train','범내골역 8번 출구','직진 도보 7분'],['car','주차','1시간 무료, 이후 30분당 1,500원']]};
var $=function(s,r){return (r||document).querySelector(s)};
function el(tag,attrs,kids){ var e=document.createElement(tag); if(attrs) for(var k in attrs){ if(k==='text') e.textContent=attrs[k]; else if(k==='html') e.innerHTML=attrs[k]; else if(k==='cls') e.className=attrs[k]; else e.setAttribute(k,attrs[k]); } (kids||[]).forEach(function(c){ if(c!=null) e.appendChild(typeof c==='string'?document.createTextNode(c):c); }); return e; }
function safeUrl(u){ try{ var x=new URL(String(u||'').trim()); return /^https?:$/.test(x.protocol)?x.href:''; }catch(e){ return ''; } }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function pd(s){ var a=String(s).split('-'); return new Date(+a[0],+a[1]-1,+a[2]); }
function ko(s){ var d=pd(s); return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+DOW[d.getDay()]+'요일'; }
function md(s){ var d=pd(s); return (d.getMonth()+1)+'/'+d.getDate()+'('+DOW[d.getDay()]+')'; }
function toast(t){ var x=$('#toast'); x.textContent=t; x.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(function(){ x.classList.remove('on'); },1800); }
function copy(t,label){ var ok=function(){ toast((label||'')+' 복사했어요'); };
  function fb(){ var ta=el('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); ok(); }catch(e){ toast('길게 눌러 복사해 주세요'); } ta.remove(); }
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok,fb); else fb(); }

/* 링크 해석: #1.<deflate-raw → base64url> 또는 #0.<base64url JSON> */
function b64d(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; var bin=atob(s), u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
function decode(){ var h=location.hash.slice(1); var m=h.match(/^([01])\.(.+)$/); if(!m) return Promise.reject(0);
  var bytes=b64d(m[2]);
  if(m[1]==='0') return Promise.resolve(JSON.parse(new TextDecoder().decode(bytes)));
  if(typeof DecompressionStream==='undefined') return Promise.reject(1);
  var ds=new DecompressionStream('deflate-raw'); var w=ds.writable.getWriter(); w.write(bytes); w.close();
  return new Response(ds.readable).text().then(JSON.parse); }

var P=function(d){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>'; };
var ICON={
  mark:P('<path d="M4 20 12 4l8 16"/><path d="M8 13h8"/>'),

/* 지금 보고 있는 칸을 레일 · 독에 표시 */
function setNav(k){ var nav=$('.nav'); if(!nav) return; var a=nav.querySelector('[data-k="'+k+'"]'); if(!a) return;
  nav.querySelectorAll('a').forEach(function(x){ x.classList.toggle('on',x===a); }); var p=nav.querySelector('.pill'); p.style.transform='translate('+a.offsetLeft+'px,'+a.offsetTop+'px)'; }

/* 내 캘린더에 추가 (.ics) */
function ics(D,dates){ var tm=String(D.tm||'').match(/(\d{1,2}):(\d{2})\s*[~\-–]\s*(\d{1,2}):(\d{2})/); var p=function(n){ return String(n).padStart(2,'0'); };
  var lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//KAIA//notice//KO','CALSCALE:GREGORIAN'];
  var esc=function(s){ return String(s||'').replace(/[\\,;]/g,function(c){ return '\\'+c; }).replace(/\n/g,'\\n'); };
  var loc=D.md==='off'?BRANCH.addr:D.md==='zoom'?'ZOOM':'온라인';
  dates.forEach(function(d,i){ var ds=d.replace(/-/g,''); lines.push('BEGIN:VEVENT','UID:'+ds+'-'+i+'-'+Math.abs(hash(D.t||''))+'@kaia','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z');
    if(tm){ lines.push('DTSTART;TZID=Asia/Seoul:'+ds+'T'+p(tm[1])+tm[2]+'00','DTEND;TZID=Asia/Seoul:'+ds+'T'+p(tm[3])+tm[4]+'00'); }
    else { var nx=pd(d); nx.setDate(nx.getDate()+1); lines.push('DTSTART;VALUE=DATE:'+ds,'DTEND;VALUE=DATE:'+ymd(nx).replace(/-/g,'')); }
    lines.push('SUMMARY:'+esc((D.t||'수업')+' '+(i+1)+'회차'),'LOCATION:'+esc(loc));
    if(D.zu) lines.push('URL:'+esc(safeUrl(D.zu)));
    lines.push('END:VEVENT'); });
  lines.push('END:VCALENDAR');
  var blob=new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'}); var u=URL.createObjectURL(blob);
  var a=el('a',{href:u,download:(D.t||'수업')+'.ics'}); document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(u); },4000);
  toast('달력 파일을 열면 수업 '+dates.length+'회가 추가돼요'); }
function hash(s){ var h=0; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return h; }

/* 움직임: 카드 등장 · D-day 숫자 · 회차 막대가 자라남 · 달력에 수업 날이 찍힘 · 길이 그려짐 */
function motion(months,bars,ni,placeTip){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cards=[].slice.call(document.querySelectorAll('.rv'));
  var io=new IntersectionObserver(function(es){ es.forEach(function(e){ if(!e.isIntersecting) return; io.unobserve(e.target); var t=e.target; var i=Math.max(0,cards.indexOf(t));
      setTimeout(function(){ t.classList.add('in'); },reduce?0:Math.min(i,6)*60); }); },{rootMargin:'0px 0px -6% 0px'});
  cards.forEach(function(x){ io.observe(x); });
  var bs=[].slice.call(bars.querySelectorAll('.bar'));
  var io2=new IntersectionObserver(function(es){ if(!es[0].isIntersecting) return; io2.disconnect();
    bs.forEach(function(b,i){ setTimeout(function(){ b.classList.add('on'); },reduce?0:200+i*Math.min(70,1100/bs.length)); });
    setTimeout(function(){ if(bs[ni]){ bs[ni].classList.add('sel'); placeTip(bs[ni],ni); } },reduce?0:200+bs.length*Math.min(70,1100/bs.length)+300); },{threshold:.3});
  io2.observe(bars);
  var cls=[].slice.call(months.querySelectorAll('.d.cls')).sort(function(a,b){ return a.dataset.no-b.dataset.no; });
  var io3=new IntersectionObserver(function(es){ if(!es[0].isIntersecting) return; io3.disconnect();
    cls.forEach(function(b,i){ setTimeout(function(){ b.classList.add('on'); },reduce?0:180+i*Math.min(90,1400/cls.length)); }); },{threshold:.2});
  io3.observe(months);
  var n=document.querySelector('.val[data-to]'); if(n&&!reduce){ var to=+n.dataset.to, st=performance.now(), from=Math.min(to+30,to*2+5);
    (function f(now){ var k=Math.min(1,(now-st)/1100), e=1-Math.pow(1-k,4); n.textContent='D-'+Math.round(from-(from-to)*e); if(k<1) requestAnimationFrame(f); })(st); }
  var walk=document.querySelector('.walk'); if(walk&&!reduce){ walk.querySelectorAll('path').forEach(function(p){ var L=p.getTotalLength(); p.style.strokeDasharray=L; p.style.strokeDashoffset=L;
      var io4=new IntersectionObserver(function(es){ if(!es[0].isIntersecting) return; io4.disconnect(); p.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:1400,easing:'cubic-bezier(.77,0,.175,1)',fill:'forwards'}).onfinish=function(){ p.style.strokeDasharray='6 7'; p.style.strokeDashoffset=0; }; },{threshold:.4}); io4.observe(p); }); }
  /* 스크롤 위치 → 레일 · 독 */
  var secs=['sum','days','join','rules','mentor'].map(function(k){ return document.getElementById('s-'+k); }).filter(Boolean);
  setNav('sum');
  var io5=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting) setNav(e.target.id.slice(2)); }); },{rootMargin:'-40% 0px -55% 0px'});
  secs.forEach(function(s){ io5.observe(s); });
  addEventListener('resize',function(){ var a=document.querySelector('.nav a.on'); if(a) setNav(a.dataset.k); });
}

function fail(){ document.documentElement.classList.remove('js'); $('#root').innerHTML='<div class="err"><div class="glass"><h1>안내 링크를 열 수 없어요</h1><p>링크가 잘렸거나 바뀌었을 수 있어요.<br>받은 메시지의 링크를 처음부터 끝까지 그대로 눌러 주시고, 그래도 안 되면 담당 멘토에게 알려 주세요.</p></div></div>'; }
decode().then(function(D){ if(!D||!D.s) throw 0; render(D); }).catch(fail);
addEventListener('hashchange',function(){ location.reload(); });
})();
