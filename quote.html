.cal-day{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.cal-day .list{gap:6px}
.cal-day .row{padding:11px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.cal-day .row:hover{border-color:var(--accent)}
.cal-day .t1{color:var(--fg);font-weight:600}
.cal-day .t2{color:var(--fg-2);opacity:.85}
.dbadge.n{background:var(--surface-2);color:var(--fg);border:1px solid var(--line);font-weight:700}
body.dark .cal-day .row,body.hud:not(.hlight):not(.exec) .cal-day .row{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14)}
body.dark .dbadge.n,body.hud:not(.hlight):not(.exec) .dbadge.n{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.22)}
body.dark .cal-day .t1{color:#fff}body.dark .cal-day .t2{color:rgba(255,255,255,.72);opacity:1}

/* ===== 마스터본 가져오기 ===== */
.mb-head{display:flex;align-items:baseline;gap:10px;margin:14px 0 8px}.mb-head b{font-size:16px}.mb-head span{font-size:12.5px;color:var(--muted)}
.mb-t td{vertical-align:middle}.mb-t tr.mb-bad td{background:var(--warn-soft)}.mb-t .mb-pick{min-width:220px;height:34px}
.mb-cmp{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px;padding:12px 14px;border-radius:14px;font-size:13.5px}
.mb-cmp.ok{background:var(--ok-soft);color:var(--ok)}.mb-cmp.bad{background:var(--warn-soft);color:var(--warn)}.mb-cmp svg{width:18px;height:18px}.mb-cmp small{width:100%;opacity:.8;font-size:12px}
.mb-who{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.mb-p{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color .2s,background .2s}
.mb-p:hover{border-color:var(--accent)}.mb-p.on{border-color:var(--accent);background:var(--accent-soft)}
.mb-p input{position:absolute;opacity:0;pointer-events:none}
.mb-ck{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}.mb-ck svg{width:14px;height:14px}
.mb-p.on .mb-ck{background:var(--accent);border-color:var(--accent);color:#fff}
.mb-pi{display:flex;flex-direction:column;gap:2px;min-width:0}.mb-pi b{font-size:15px}.mb-pi small{font-size:12px;color:var(--muted)}.mb-pi .mb-sh{color:var(--faint);font-size:11.5px}
.qs-row .qs-who{font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}.qs-row.qs-new{border-left:3px solid var(--warn);padding-left:10px}

/* ===== 특별처리신청서 ===== */
.sp-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:4px 0 0;padding:0;list-style:none;counter-reset:sp}
.sp-steps li{counter-increment:sp;position:relative;padding:12px 12px 12px 44px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px}
.sp-steps li::before{content:counter(sp);position:absolute;left:12px;top:12px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.sp-steps b{font-size:13.5px}.sp-steps span{font-size:12px;color:var(--muted);line-height:1.5}
.sp-types{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.sp-type{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font:inherit;text-align:left;cursor:pointer;color:var(--fg);transition:border-color .2s,background .2s}
.sp-type:hover{border-color:var(--accent)}.sp-type.on{border-color:var(--accent);background:var(--accent-soft)}
.sp-type b{font-size:14.5px}.sp-type small{font-size:12px;color:var(--muted);line-height:1.5}.sp-ti{width:28px;height:28px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent)}.sp-ti svg{width:16px;height:16px}
.sp-when,.sp-warn{margin:0;padding-left:18px;font-size:13px;line-height:1.75}.sp-warn li{color:var(--fg-2)}.sp-warn li::marker{color:var(--warn)}
.sp-h3{margin:16px 0 8px;font-size:13px;font-weight:700;color:var(--muted)}
.sp-p{margin:4px 0;font-size:13px;line-height:1.7;color:var(--fg-2)}
.sp-checks{display:flex;flex-direction:column;gap:6px;font-size:13px}.sp-checks>div{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.sp-checks>div>span:first-child{min-width:104px;color:var(--muted)}
.sp-checks em{font-style:normal;font-size:12px;color:var(--faint)}
.sp-ck{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:8px;border:1px solid var(--line);font-weight:600}.sp-ck.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}.sp-ck svg{width:12px;height:12px}
.sp-outs{position:sticky;top:84px}
.sp-out{margin-bottom:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sp-oh{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface-2)}.sp-oh b{font-size:12.5px}.sp-oh small{font-size:11.5px;color:var(--faint)}.sp-oh .btn{margin-left:auto}
.sp-out pre{margin:0;padding:10px 12px;font-family:var(--mono),ui-monospace,monospace;font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:keep-all;color:var(--fg)}
.sp-det summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:8px}.sp-det summary small{color:var(--faint);font-size:12px}
.sp-form{margin-top:12px;border:1.5px solid var(--fg);border-radius:6px;padding:14px;background:var(--surface)}
.sp-fh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.sp-fh>b{font-size:20px;letter-spacing:.1em}
.sp-fsign{display:flex;align-items:center;gap:6px;font-size:12px}.sp-fsign span{padding:4px 8px;border:1px solid var(--line);border-radius:6px;line-height:1.4}.sp-fsign small{color:var(--muted)}
.sp-ft{width:100%;border-collapse:collapse;font-size:12.5px}.sp-ft th,.sp-ft td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;line-height:1.6}.sp-ft th{width:200px;background:var(--surface-2);font-weight:600;white-space:nowrap}
.sp-ft code{font-size:12px;padding:1px 5px;border-radius:5px;background:var(--surface-2)}
.sp-n{display:inline-grid;place-items:center;width:18px;height:18px;margin-right:4px;border-radius:50%;background:var(--warn);color:#fff;font-style:normal;font-size:10.5px;font-weight:700;vertical-align:1px}
@media (max-width:900px){.sp-steps{grid-template-columns:repeat(2,minmax(0,1fr))}.sp-outs{position:static}.sp-ft th{width:auto;white-space:normal}}
/* ===== 요청메모 ===== */
.rm-form{grid-template-columns:repeat(2,minmax(0,1fr))}
.rm-step{display:inline-grid;place-items:center;width:22px;height:22px;margin-right:8px;border-radius:50%;background:var(--accent);color:#fff;font-style:normal;font-size:12px;font-weight:700;vertical-align:1px}
.rm-hint{margin:8px 0 0;font-size:12px;color:var(--faint)}
.rm-src{margin:12px 0 4px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:13px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.rm-src svg{width:16px;height:16px;color:var(--ok)}.rm-src small{width:100%;color:var(--faint);font-size:11.5px}
.rm-subs{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.rm-sub{display:grid;grid-template-columns:minmax(0,1.6fr) 120px 110px auto 34px;gap:10px;align-items:end;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.rm-sub.miss{border-color:var(--warn);background:var(--warn-soft)}.rm-sub.disc{box-shadow:inset 3px 0 0 var(--warn)}
.rm-sub-p span,.rm-sub-a span{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}.rm-sub-p .in{height:38px;text-align:right}
.rm-sub-a b{display:flex;align-items:center;height:38px;font-variant-numeric:tabular-nums}.rm-sub-s{display:flex;align-items:center;height:38px}
.rm-sub-tip{grid-column:1/-1;font-size:12px;color:var(--warn);line-height:1.6}
.rm-link{border:0;background:none;padding:0 0 0 6px;color:var(--accent);font:inherit;font-size:12px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.rm-hand{display:inline-block;margin-left:4px;padding:0 6px;border-radius:6px;background:var(--warn-soft);color:var(--warn);font-size:10.5px;font-weight:700;vertical-align:1px}
.rm-chips{display:flex;flex-wrap:wrap;gap:6px}
.rm-chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg-2);font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:border-color .2s,background .2s}
.rm-chip:hover{border-color:var(--accent)}.rm-chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.rm-chip.sm{height:28px;padding:0 10px;font-size:12px}.rm-chip small{font-size:11px;color:var(--faint);font-weight:400}
.rm-chips.big .rm-chip{height:auto;padding:10px 16px;flex-direction:column;align-items:flex-start;gap:2px;border-radius:14px;min-width:150px}
.rm-big{height:48px!important;font-size:18px!important;font-weight:700}
.rm-bal{padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:13px;color:var(--muted)}.rm-bal b{color:var(--fg);font-size:15px;margin:0 4px}
.rm-cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rm-cat{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font:inherit;text-align:left;cursor:pointer;color:var(--fg)}
.rm-cat b{font-size:14px}.rm-cat span{font-size:11.5px;color:var(--muted)}.rm-cat.on{border-color:var(--accent);background:var(--accent-soft)}
.rm-pv{margin-top:6px;font-size:11.5px;padding:3px 8px;border-radius:8px;background:var(--surface-2);color:var(--fg-2)!important;word-break:keep-all}
.rm-tier{display:flex;flex-direction:column;gap:8px}
.rm-t{display:flex;align-items:center;gap:10px;flex-wrap:wrap;opacity:.55}.rm-t.on{opacity:1}
.rm-tg{display:inline-flex;align-items:center;gap:4px;min-width:74px;height:32px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:inherit;font-weight:700;cursor:pointer;color:var(--fg)}
.rm-tg svg{width:14px;height:14px;color:var(--accent)}.rm-t.on .rm-tg{border-color:var(--accent);background:var(--accent-soft)}
.rm-line{margin:14px 0 10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:13px;font-family:var(--mono),ui-monospace,monospace}
.rm-auto{display:flex;flex-direction:column;gap:8px;font-size:13px}.rm-auto>div>span{display:inline-block;min-width:62px;color:var(--muted)}.rm-auto small{color:var(--faint);margin-left:4px}.rm-auto .muted{color:var(--faint);font-weight:500}
.rm-sm{font-size:12.5px}
.rm-check{margin:0 0 10px;padding:10px 12px 10px 28px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:12.5px;line-height:1.7}
.rm-ok{display:flex;align-items:center;gap:6px;margin:0 0 10px;padding:9px 12px;border-radius:12px;background:var(--ok-soft);color:var(--ok);font-size:12.5px;font-weight:600}.rm-ok svg{width:16px;height:16px}
.rm-text{width:100%;min-height:520px;font-size:13px;line-height:1.55;font-family:var(--mono),ui-monospace,monospace;white-space:pre;resize:vertical}
@media (max-width:760px){.rm-sub{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px}.rm-sub-n{grid-column:1/-1}.rm-sub-s{grid-column:1/3;height:auto}.rm-cats{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.rm-form{grid-template-columns:minmax(0,1fr)}.rm-text{min-height:420px;font-size:12px}}

/* ===== 사업부 업무 가이드 ===== */
.bg-top{display:flex;flex-direction:column;gap:12px}
.bg-intro{margin:0;font-size:14.5px;line-height:1.75;color:var(--fg-2)}
.bg-prog{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--muted);font-weight:600}
.bg-bar{flex:1;height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bg-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--ok));transition:width .5s var(--ease)}
.bg-q .in{font-size:15px}
.bg-meta{font-size:11.5px;color:var(--faint)}
.bg-grid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start;margin-top:16px}
.bg-nav{position:sticky;top:84px;display:flex;flex-direction:column;gap:6px}
.bg-nav button{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:14px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--fg);cursor:pointer;font:inherit;transition:background .2s,box-shadow .2s}
.bg-nav button:hover{background:var(--surface-2)}
.bg-nav button.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.bg-nav i{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;background:var(--surface-3);color:var(--fg-2)}
.bg-nav i svg{width:14px;height:14px}
.bg-nav button.done i{background:var(--ok);color:#fff}
.bg-nav span{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bg-nav b{font-size:13.5px;font-weight:700}
.bg-nav small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bg-nav em{font-style:normal;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.bg-main{display:flex;flex-direction:column;gap:10px;min-width:0;scroll-margin-top:80px}
.bg-chh{padding:4px 2px 6px}.bg-chh small{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.04em}
.bg-chh h2{margin:2px 0 4px;font-size:24px;letter-spacing:-.02em}.bg-chh p{margin:0;color:var(--muted);font-size:13.5px}
.bg-sec{border-radius:18px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line),var(--shadow-sm);overflow:hidden}
.bg-sec.open{box-shadow:inset 0 0 0 1.5px var(--line-2),var(--shadow-md)}
.bg-sh{width:100%;display:flex;align-items:center;gap:12px;padding:15px 16px;border:0;background:none;color:var(--fg);cursor:pointer;text-align:left;font:inherit}
.bg-ck{flex:none;width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line-2);display:grid;place-items:center}
.bg-sec.done .bg-ck{background:var(--ok);box-shadow:none;color:#fff}.bg-ck svg{width:14px;height:14px}
.bg-st{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.bg-st b{font-size:15.5px;font-weight:750}.bg-st small{font-size:12.5px;color:var(--muted);line-height:1.5}
.bg-cv{flex:none;color:var(--muted);transition:transform .25s var(--ease)}.bg-sec.open .bg-cv{transform:rotate(180deg)}
.bg-sb{padding:2px 18px 18px 52px;display:flex;flex-direction:column;gap:14px;font-size:14px;line-height:1.75;color:var(--fg)}
.bg-p{margin:0}
.bg-steps{margin:0;padding:0;list-style:none;counter-reset:bs;display:flex;flex-direction:column;gap:8px}
.bg-steps li{counter-increment:bs;display:flex;gap:10px;align-items:flex-start}
.bg-steps li::before{content:counter(bs);flex:none;width:24px;height:24px;margin-top:2px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--ink);color:var(--ink-fg)}
.bg-tw{overflow-x:auto;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)}
.bg-tb{width:100%;border-collapse:collapse;font-size:13px;line-height:1.6}
.bg-tb th{text-align:left;padding:9px 12px;background:var(--surface-2);font-weight:700;color:var(--fg-2);white-space:nowrap;border-bottom:1px solid var(--line)}
.bg-tb td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.bg-tb tr:last-child td{border-bottom:0}.bg-tb td:first-child{font-weight:650;white-space:nowrap}
.bg-faint{color:var(--faint)}.bg-note{margin:-6px 0 0;font-size:12.5px;color:var(--muted)}
.bg-kv{margin:0;display:flex;flex-direction:column;gap:0;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.bg-kv div{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line)}.bg-kv div:last-child{border-bottom:0}
.bg-kv dt{font-weight:700;color:var(--fg-2);font-size:13px}.bg-kv dd{margin:0;font-size:13.5px}
.bg-tpl,.bg-ex{border-radius:14px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.bg-tpl-h{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:9px 10px 9px 14px;border-bottom:1px solid var(--line)}
.bg-tpl-h b{display:flex;align-items:center;gap:7px;font-size:13px}.bg-tpl-h b svg{width:14px;height:14px;color:var(--accent)}
.bg-tpl pre,.bg-ex pre{margin:0;padding:12px 14px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font:inherit;font-size:13px;line-height:1.7;max-height:420px;overflow:auto}
.bg-tpl .bg-note{margin:0;padding:0 14px 11px}
.bg-ex-h{padding:8px 14px;font-size:12px;font-weight:700;color:var(--muted);border-bottom:1px dashed var(--line-2)}

.bg-sf{display:flex;justify-content:flex-end;padding-top:2px}
.bg-pn{display:flex;justify-content:space-between;gap:10px;margin-top:8px;flex-wrap:wrap}
.bg-qh{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}.bg-qh b{color:var(--fg)}.bg-qh .btn{margin-left:auto}
.bg-from{font-size:11.5px;font-weight:800;color:var(--accent);margin:6px 0 -4px 4px}

@media (max-width:900px){
 .bg-grid{grid-template-columns:1fr}

}
@media (max-width:640px){

}

/* 가이드 가독성: 배경(풍경 · 무늬)이 비치지 않게 읽기용 판을 깔아요 */
.bg-view{--bgp:#ffffff;--bgp2:color-mix(in srgb,var(--bg) 14%,#ffffff);--bgl:rgba(15,23,42,.1);--bgt:#141821;--bgt2:#3b4352;--bgm:#5d6675}
body.dark .bg-view,body.hud:not(.hlight):not(.exec) .bg-view{--bgp:#10131b;--bgp2:color-mix(in srgb,var(--bg) 30%,#141823);--bgl:rgba(255,255,255,.12);--bgt:#f3f5fa;--bgt2:#d4d9e3;--bgm:#a3abba}
.bg-view .bg-top,.bg-view .bg-chh,.bg-view .bg-sec,.bg-view .bg-nav button,.bg-view .bg-qh,.bg-view>.pane{background:color-mix(in srgb,var(--bgp) 94%,transparent);color:var(--bgt);box-shadow:inset 0 0 0 1px var(--bgl),0 8px 24px -14px rgba(0,0,0,.35);}
.bg-view .bg-chh{padding:14px 18px;border-radius:18px}
.bg-view .bg-qh{padding:10px 14px;border-radius:14px}
.bg-view .bg-nav button:hover{background:var(--bgp2)}
.bg-view .bg-nav button.on{background:color-mix(in srgb,var(--accent) 14%,var(--bgp));box-shadow:inset 0 0 0 2px var(--accent),0 8px 24px -14px rgba(0,0,0,.35)}
.bg-view .bg-sec.open{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 40%,var(--bgl)),0 14px 34px -18px rgba(0,0,0,.45)}
.bg-view .bg-intro,.bg-view .bg-sb,.bg-view .bg-st b,.bg-view .bg-nav b,.bg-view .bg-chh h2,.bg-view .bg-kv dd,.bg-view .bg-tb td,.bg-view pre{color:var(--bgt)}
.bg-view .bg-st small,.bg-view .bg-nav small,.bg-view .bg-chh p,.bg-view .bg-note,.bg-view .bg-prog,.bg-view .bg-qh,.bg-view .bg-ex-h,.bg-view .bg-meta,.bg-view .bg-nav em,.bg-view .bg-cv{color:var(--bgm)}
.bg-view .bg-tb th,.bg-view .bg-kv dt{color:var(--bgt2)}
.bg-view .bg-tb th{background:var(--bgp2);border-color:var(--bgl)}.bg-view .bg-tb td{border-color:var(--bgl)}
.bg-view .bg-tw,.bg-view .bg-kv{box-shadow:inset 0 0 0 1px var(--bgl)}.bg-view .bg-kv div{border-color:var(--bgl)}
.bg-view .bg-tpl,.bg-view .bg-ex{background:var(--bgp2);box-shadow:inset 0 0 0 1px var(--bgl)}
.bg-view .bg-tpl-h,.bg-view .bg-ex-h{border-color:var(--bgl)}
.bg-view .bg-nav i{background:var(--bgp2);color:var(--bgt2);box-shadow:inset 0 0 0 1px var(--bgl)}
.bg-view .bg-ck{box-shadow:inset 0 0 0 2px var(--bgm)}
.bg-view .bg-bar{background:var(--bgp2);box-shadow:inset 0 0 0 1px var(--bgl)}
.bg-view .bg-q .in{background:var(--bgp2);color:var(--bgt);box-shadow:inset 0 0 0 1px var(--bgl)}
.bg-view .bg-q .in::placeholder{color:var(--bgm)}
.bg-view .bg-warn{background:color-mix(in srgb,var(--bad) 11%,var(--bgp))}.bg-view .bg-warn ul{color:var(--bgt)}
.bg-view .bg-tip{background:color-mix(in srgb,var(--accent) 10%,var(--bgp))}.bg-view .bg-tip p{color:var(--bgt)}
.bg-view .bg-chh small,.bg-view .bg-from{color:var(--accent)}
.bg-view .bg-from{display:inline-block;align-self:flex-start;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--bgp) 94%,transparent);box-shadow:inset 0 0 0 1px var(--bgl)}
.bg-view>.vh h1,.bg-view>.vh .sub{text-shadow:0 1px 10px color-mix(in srgb,var(--bg) 70%,transparent)}
@media (max-width:640px){.bg-view .bg-tb tr{background:var(--bgp);box-shadow:inset 0 0 0 1px var(--bgl)}.bg-view .bg-tw{box-shadow:none}.bg-view .bg-tb td::before{color:var(--bgm)}}

/* 수강료표 쉽게 추가 */
.qp-body{display:flex;flex-direction:column;gap:10px}
.qp-way{display:flex;flex-direction:column;gap:2px}.qp-way b{font-size:13.5px}.qp-way span{font-size:12.5px;color:var(--muted)}
#qpText{font-size:13px;line-height:1.6;resize:vertical}
.qp-cs{display:flex;flex-wrap:wrap;gap:6px;max-height:120px;overflow:auto}.qp-cs .chip{cursor:pointer;border:0}.qp-cs .chip.on{background:var(--accent);color:#fff}.qp-cs small{opacity:.7}
.qp-card{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:16px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.qp-card .field small{font-weight:500;color:var(--muted);margin-left:4px}
.qp-need{margin-left:6px;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--accent);color:#fff;font-weight:700}
.qp-price #qpP{font-size:18px;font-weight:700;box-shadow:inset 0 0 0 2px var(--accent)}
.qp-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.qp-chips .chip{cursor:pointer;border:0}
.qp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qp-sum{margin:0;font-size:13px;font-weight:600;color:var(--fg-2)}
@media (max-width:640px){.qp-grid{grid-template-columns:1fr 1fr}}

.qt-sort{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:4px 0 8px;padding:4px 6px;height:auto;border-radius:16px;overflow:visible}.qt-sort>span{flex:none;font-size:12px;font-weight:700;color:var(--muted);padding:0 6px 0 4px;white-space:nowrap}.qt-sort button{flex:none;white-space:nowrap}

.im-dup{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:230px}
.im-mode button{height:28px;padding:0 12px}.im-pick{height:32px;font-size:12.5px;padding:0 8px;max-width:260px}
.im-from{font-size:11.5px;color:var(--muted)}.im-df{display:flex;flex-wrap:wrap;gap:4px}
.im-bulk{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--muted)}.im-bulk span{margin-right:4px}

.stu-cl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:3px 0}.stu-cl+.stu-cl{border-top:1px dashed var(--line);margin-top:3px;padding-top:6px}
.stu-cl b{font-weight:600;font-size:13px}.stu-cl .chip{font-size:11px;padding:1px 7px}
.stu-cd{flex-basis:100%;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* 저장한 · 받은 견적: 폰에서는 이름 줄을 위에 한 줄 다 쓰고 버튼은 아래로 */
@media (max-width:700px){.qt-sv{flex-wrap:wrap;row-gap:10px}.qt-sv>.grow{flex:1 1 100%}.qt-sv .t1{white-space:normal;font-size:15px}.qt-sv .t2{white-space:normal;line-height:1.5}.qt-sv>.btn{flex:none}}
</style>
<style>
html{height:auto!important;overflow-y:auto!important}
body.kq{background:#f6f6f3;height:auto!important;min-height:100vh;overflow:visible!important}
.kq-top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;height:58px;padding:0 max(20px,calc((100vw - 1320px)/2));background:rgba(255,255,255,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.kq-top b{font-weight:700;letter-spacing:.12em;font-size:14px}
.kq-top span{font-size:12.5px;color:var(--muted)}
.kq-top .r{margin-left:auto}
.kq-main{max-width:1320px;margin:0 auto;padding:22px 20px 80px}
@media print{.kq-top{display:none}}
</style>
</head>
<body class="kq">
<header class="kq-top"><b>KAIA 견적서</b><span>코리아AI아카데미 부산 · 견적서 · 요청메모 · 마스터본 가져오기</span><button class="btn sm ghost r" onclick="setupMe(true)">내 정보</button></header>
<main class="kq-main"><div id="view"></div></main>

function toast(title,body,cls='',act){
  const box=$('#toasts'); const el=document.createElement('div'); el.className='toast '+cls; const sticky=/(^|\s)sticky(\s|$)/.test(cls);
  el.innerHTML=`<b>${esc(title)}</b>${body?esc(body):''}${sticky?'<button class="tx" aria-label="닫기">×</button>':''}`; box.appendChild(el); const plain=[...box.children].filter(x=>!x.classList.contains('alarm-t')); if(plain.length>3) plain.slice(0,plain.length-3).forEach(x=>x.remove());
  const kill=()=>{el.style.transition='opacity .4s, transform .4s';el.style.opacity='0';el.style.transform='translateY(8px)';setTimeout(()=>el.remove(),450)};
  if(sticky){ el.addEventListener('click',e=>{ const x=e.target.closest&&e.target.closest('.tx'); kill(); if(!x&&act){ try{ act(); }catch(err){} } }); return; }
  setTimeout(kill,cls?7000:3800);
}

    const m=document.createElement('div'); m.className='modal';
    m.innerHTML=`<div class="sheet narrow" role="dialog" aria-modal="true"><header><h3>${esc(title)}</h3></header><div class="body"><p style="margin:0;color:var(--muted)">${esc(body)}</p></div><footer><button class="btn ghost" data-r="0">취소</button><button class="btn ${danger?'danger':'pri'}" data-r="1">${esc(okLabel)}</button></footer></div>`;
    m.addEventListener('click',e=>{ const b=e.target.closest('[data-r]'); if(b||e.target===m){ m.remove(); res(!!(b&&b.dataset.r==='1')); } });
    document.body.appendChild(m);
  });
}

const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
function choOf(s){ return [...String(s||'')].map(ch=>{ const c=ch.charCodeAt(0)-0xAC00; return c>=0&&c<11172?CHO[Math.floor(c/588)]:ch; }).join(''); }
function aliasNorm(s){ return String(s||'').toLowerCase().replace(/[\s·\-_.,&/()\[\]]/g,'').replace('파이썬','python').replace('자바','java'); }
function sMatch(q,txt){ const n=x=>String(x||'').toLowerCase().replace(/[\s·\-_.,&/()\[\]]/g,''); const a=n(q); if(!a) return true; const b=n(txt); if(b.includes(a)) return true;
  if(/^[ㄱ-ㅎ]+$/.test(a)) return choOf(b).includes(a)||choOf(aliasNorm(txt)).includes(a); return aliasNorm(txt).includes(aliasNorm(q)); }

/* ===== 단독 실행판 추가 도우미: 요청메모 · 마스터본 가져오기에 필요한 것 (KAIA DESK 본체와 같은 동작) ===== */
const serialToYmd=n=>{ const ms=Math.round((n-25569)*864e5); const d=new Date(ms); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; };
function nameSim(a,b){
  const x=aliasNorm(a), y=aliasNorm(b); if(!x||!y) return 0; if(x===y) return 1;
  const nx=(x.match(/(\d+)$/)||[])[1], ny=(y.match(/(\d+)$/)||[])[1]; if(nx&&ny&&nx!==ny) return 0;
  if(x.length>=2&&y.length>=2&&(x.includes(y)||y.includes(x))) return 0.85;
  const bg=s=>{ const o=[]; for(let i=0;i<s.length-1;i++) o.push(s.slice(i,i+2)); return o; };
  const A=bg(x),B=bg(y); if(!A.length||!B.length) return 0; const pool=[...B]; let hit=0; for(const t of A){ const i=pool.indexOf(t); if(i>=0){ hit++; pool.splice(i,1); } }
  return 2*hit/(A.length+B.length);
}

/* ===== 과목 검색 상자 (공용) =====
   cpBox(key,{value,ph,data,clear}) → 입력칸 + 아래 목록. 글자를 치면 바로 걸러지고(띄어쓰기 무시 · 초성 ㅍㅇㅆ 가능), ↑↓ Enter로 고를 수 있어요.
   CPK[key]={items:()=>[{v,t,s,k}], pick:(v,box)=>{}}  — v=null 이면 지우기 */
const CPK={};
function cpBox(key,o={}){
  return `<div class="cp" data-cp="${key}" ${o.data||''}><span class="cp-ic">${ic('search')}</span><input class="in cp-in ${o.cls||''}" ${o.id?`id="${o.id}"`:''} ${o.inAttr||''} value="${esc(o.value||'')}" placeholder="${esc(o.ph||'과목 검색')}" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false">${o.value&&o.clear!==false?`<button type="button" class="cp-x" aria-label="지우기">${ic('x')}</button>`:''}<div class="cp-list" role="listbox" hidden></div></div>`;

/* 목록은 <body> 바로 아래로 옮겨 띄워요 → 창 · 표 · 겹친 패널에 가려지거나 잘리지 않음 */
function cpL(box){ let L=box._L; if(!L){ L=box.querySelector('.cp-list'); if(!L) return null; box._L=L; } if(L.parentNode!==document.body){ document.body.appendChild(L); } L._box=box; return L; }
function cpGc(){ document.querySelectorAll('body>.cp-list').forEach(L=>{ if(!L._box||!L._box.isConnected) L.remove(); }); }
function cpDraw(box,all){
  const inp=box.querySelector('.cp-in'), def=CPK[box.dataset.cp]; if(!def) return; cpGc(); const L=cpL(box); if(!L) return;
  const q=all?'':inp.value.trim(); const jamo=/^[ㄱ-ㅎ\s]+$/.test(q);
  let items=def.items().filter(x=>!q||sMatch(q,x.t)||(!jamo&&(sMatch(q,x.s||'')||sMatch(q,x.k||''))));
  if(q&&!jamo){ const n=t=>String(t).toLowerCase().replace(/\s/g,''); const a=n(q); items=items.map((x,i)=>({x,i,r:n(x.t).startsWith(a)?0:n(x.t).includes(a)?1:2})).sort((p,q2)=>p.r-q2.r||p.i-q2.i).map(o=>o.x); }
  box._items=items.slice(0,80); box._hi=box._items.length?0:-1;
  L.innerHTML=box._items.length?box._items.map((x,i)=>`<div class="cp-opt ${i===0?'hi':''}" role="option" data-i="${i}"><b>${esc(x.t)}</b>${x.s?`<small>${esc(x.s)}</small>`:''}</div>`).join('')+(items.length>80?`<div class="cp-more">${items.length-80}개 더 있어요 · 글자를 더 쳐 보세요</div>`:''):`<div class="cp-more">찾는 과목이 없어요</div>`;

}
function cpPlace(box){ const L=box._L; if(!L||L.hidden) return; if(!box.isConnected){ L.hidden=true; return; } const r=box.querySelector('.cp-in').getBoundingClientRect();
  const vh=(window.visualViewport&&visualViewport.height)||innerHeight;
  const below=vh-r.bottom-12, above=r.top-12, up=below<200&&above>below; const mh=Math.max(140,Math.min(320,up?above-6:below-6));
  L.style.left=Math.max(8,Math.min(r.left,innerWidth-Math.max(r.width,260)-8))+'px'; L.style.width=Math.min(innerWidth-16,Math.max(r.width,260))+'px'; L.style.maxHeight=mh+'px';

function cpClose(box){ const L=box&&box._L; if(L){ L.hidden=true; const i=box.querySelector('.cp-in'); i&&i.setAttribute('aria-expanded','false'); } }
let cpSkip=0;   // 고른 직후 다시 포커스될 때 목록이 또 열리지 않게
function cpPick(box,i){ const x=box._items&&box._items[i]; if(!x) return; cpClose(box); cpSkip=Date.now(); const def=CPK[box.dataset.cp]; box.querySelector('.cp-in').value=x.v==='-'?'':x.t; def&&def.pick(x.v,box); }
document.addEventListener('focusin',e=>{ const inp=e.target.closest&&e.target.closest('.cp-in'); if(inp){ if(Date.now()-cpSkip<400) return; const box=inp.closest('.cp'); inp.select(); cpDraw(box,true); } });

document.addEventListener('keydown',e=>{
  const inp=e.target.classList&&e.target.classList.contains('cp-in')?e.target:null; if(!inp) return; const box=inp.closest('.cp'); const n=(box._items||[]).length; const L=box._L; const open=L&&!L.hidden;
  const hl=i=>{ box._hi=i; L.querySelectorAll('.cp-opt').forEach((o,j)=>o.classList.toggle('hi',j===i)); const o=L.querySelector('.cp-opt.hi'); o&&o.scrollIntoView({block:'nearest'}); };
  if(e.key==='ArrowDown'){ e.preventDefault(); if(!open) cpDraw(box); else if(n) hl(Math.min(n-1,box._hi+1)); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); if(open&&n) hl(Math.max(0,box._hi-1)); }
  else if(e.key==='Enter'&&!e.isComposing){ if(open&&box._hi>=0){ e.preventDefault(); e.stopPropagation(); cpPick(box,box._hi); } }   // 목록에 없는 이름은 원래 동작(직접 추가)으로
  else if(e.key==='Escape'){ if(open){ e.stopPropagation(); cpClose(box); } }
},true);

  const o=e.target.closest&&e.target.closest('.cp-opt'); if(o){ e.preventDefault(); const L=o.closest('.cp-list'); cpPick(L._box,+o.dataset.i); return; }

  const x=e.target.closest&&e.target.closest('.cp-x'); if(x){ e.preventDefault(); const box=x.closest('.cp'); const def=CPK[box.dataset.cp]; box.querySelector('.cp-in').value=''; def&&def.pick(null,box); return; }

/* ===== 견적서: 수강료표 · 순차 할인 · 과목별 배분 · 원본 엑셀 양식 그대로 내려받기 =====
   계산 규칙은 견적서_최종마스터본.xlsx 의 '1. IT견적서' 수식과 '5. 할인률' 시트를 따른다.
   - 할인은 항목별 순차 곱셈 (통 할인율 합산 금지): 원합계 × (1-과목할인) × (1-추가1) × (1-추가2) …
   - 반올림 1원 단위(마스터본 ROUND(…,0)), 목표 금액을 넣으면 그 금액이 우선
   - 과목별 금액: 과목 순서대로 정가를 채우고 남은 금액을 마지막에 → 뒤 과목부터 깎임 */
const QT_TIER=n=>n<=0?0:n===1?5:n<=3?10:n<=5?15:n<=7?20:25;          // 5. 할인률 · 과목 할인
const QT_SOFT_MAX=50;   // 보통 최대 50% (드물게 더 가능 → 막지 않고 안내만)
const QT_PRESET=[['당일할인',10],['리뷰할인',5],['재직자',30],['국비예정학생',50],['자율할인',''],['직접 입력','']];
const QT_ONLINE={'1년':320000,'2년':390000};      // 인터넷강의(따즈아) 수강료
const QT_CATS=['프로그래밍','웹개발','시스템네트워크','빅데이터','AI(지점)','AI개발','자격증','AI콘텐츠','AI생산성','AI마케팅','AI자격증'];
const qtSuffix=/\/(주말방특|주말|주|특)$/;
const qtTypeOf=n=>/\/(주말방특|주말|주)$/.test(n)?'주말':'평일';   // 마스터본 구분은 평일/주말 두 가지 (/특 = 평일 특강반)
const qtCatGuess=n=>{
  if(/정보처리|정보보안기사|빅데이터분석기사|ADsP|CCNA|AiCE|AICE|기능사/.test(n))return'자격증';
  if(/^\[|AI휴먼/.test(n))return'AI개발';
  if(/^(웹|앱)|JPA/.test(n))return'웹개발';
  if(/리눅스|씨스코|네트워크|멀티클라우드|정보보안|해킹/.test(n))return'시스템네트워크';
  if(/빅데이터|R분석|파이썬 데이터/.test(n))return'빅데이터';
  if(/챗봇|컴퓨터비전|Claude|랭체인|바이브|AI에이전트/.test(n))return'AI개발';
  if(/AI활용 콘텐츠|생성형|Gemini|ChatGPT|챗GPT|3D|크리에이터/.test(n))return'AI(지점)';
  return'프로그래밍'};
const qtWon=v=>v===''||v==null||isNaN(v)?'':Number(v).toLocaleString('ko-KR');
const qtPrices=()=>Array.isArray(S.settings.prices)&&S.settings.prices.length?S.settings.prices:PRICE_DEFAULT;
const qtFind=n=>{ n=String(n||'').trim(); return n?qtPrices().find(p=>p.n===n)||null:null; };
const qtRid=()=>'r'+Math.random().toString(36).slice(2,8);

function qtNew(){ return {id:'',name:'',sid:'',date:todayStr(),tpl:'it',tplSet:false,rows:[],tier:true,tierPct:null,steps:[],target:'',onCarve:false,unit:1,online:'없음',staff:''}; }
function qtDraft(){ if(!S.qt){ try{ S.qt=JSON.parse(lsGet('md.qtDraft')||'null'); }catch(e){} if(!S.qt||!Array.isArray(S.qt.rows)) S.qt=qtNew(); } return S.qt; }
function qtKeep(){ try{ lsSet('md.qtDraft',JSON.stringify(S.qt)); }catch(e){} }
function qtStaffDefault(){ const nm=(S.settings.name||'').trim(); if(!nm||nm==='김병로') return QT.staff; return QT.staff.replace('김병로',nm).replace(/HP\. [0-9.]+/,'HP. '); }
const qtStaff=q=>(q&&q.staff)||S.settings.qtStaff||qtStaffDefault();

/* 과목 기본값: 마스터본 시간 · 횟수 · 과정이 있으면 그 값, 없으면 이름으로 추정 */
function qtRowFrom(name){
  const p=qtFind(name); const t=qtTypeOf(name); const sp=/\/특$/.test(name);
  const per=sp?150:t==='평일'?180:240; const cnt=p&&p.m&&p.m%per===0?p.m/per:'';
  return {id:qtRid(),n:name,type:t,cat:(p&&p.cat)||qtCatGuess(name),s:'',e:'',pat:'',time:(p&&p.t)||(t==='평일'&&!sp?'19:00~22:00':''),cnt:(p&&+p.c)||cnt,free:false};
}

/* 요일 패턴(월수금월수 · 토일 · 화목화목금)과 횟수로 종강일 계산 — 주가 바뀌는 지점에서 다음 주 패턴으로 */
const QT_DOW='일월화수목금토';
function qtWeeks(pat){ const seq=[...String(pat||'')].map(c=>QT_DOW.indexOf(c)).filter(i=>i>=0); if(!seq.length) return null;
  const ord=d=>(d+6)%7; const w=[[seq[0]]]; for(let i=1;i<seq.length;i++){ if(ord(seq[i])<=ord(seq[i-1])) w.push([]); w[w.length-1].push(seq[i]); } return w; }
function qtEnd(start,pat,cnt){
  const w=qtWeeks(pat); cnt=+cnt; if(!start||!w||!cnt) return '';
  const d0=parseYmd(start); const mon=d=>{ const x=new Date(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); x.setHours(0,0,0,0); return x; }; const m0=mon(d0);
  let n=0; for(let i=0;i<400;i++){ const d=new Date(d0); d.setDate(d0.getDate()+i); const wk=Math.round((mon(d)-m0)/6048e5)%w.length;
    if(w[wk].includes(d.getDay())){ n++; if(n>=cnt) return ymd(d); } } return '';
}
const qtMD=(v,pat)=>{ if(!v) return ''; const [,m,d]=v.split('-'); return `${m}월${d}일`+(pat?(pat.length===1?` (${pat})`:`(${pat})`):''); };   // 실제 작성본: 10월24일 (토) · 08월12일(월수금월수)
const qtSpaced=n=>{ n=String(n||'').trim(); return /^[가-힣]{2,4}$/.test(n)?[...n].join(' '):n; };
const qtDateLong=v=>{ if(!v) return ''; const d=parseYmd(v); return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`; };

/* ---------- 계산 ---------- */
function qtCalc(q){
  const rows=q.rows.map(r=>{ const p=qtFind(r.n); return {...r,orig:r.free?null:p?p.p:null,hit:!!p}; });
  const paid=rows.filter(r=>!r.free&&r.n);
  const orig=paid.reduce((a,r)=>a+(r.orig||0),0);
  const n=paid.length, tierPct=q.tier?(q.tierPct==null?QT_TIER(n):+q.tierPct):0;
  const steps=[]; let f=1, run=orig;
  const emp=q.steps.find(s=>s.k==='재직자'&&parseFloat(s.p)>0);   // 재직자 할인은 별개 — 이것만 단독 적용
  const use=emp?[emp]:q.steps;
  if(tierPct>0&&!emp){ f*=1-tierPct/100; run=orig*f; steps.push({label:`과목 할인 (${n}과목)`,pct:tierPct,after:run}); }

  if(tgt>0&&base>orig+(carve?onReal:0)) warn.push('목표 금액이 정가 합계보다 커요.');
  if(carve&&base<onReal) warn.push('총액이 인터넷강의 금액보다 적어서 수강료가 0원이 됐어요.');

function qtAutoFit(root){
  const box=root.querySelector('.qts'); if(!box) return []; const tbl=box.querySelector('table'); const cols=[...tbl.querySelectorAll('col')];
  const base=cols.map(c=>parseFloat(c.style.width)||0), extra=base.map(()=>0);
  for(let pass=0;pass<3;pass++){ let grew=false;
    tbl.querySelectorAll('td.f').forEach(td=>{ const need=td.scrollWidth-td.clientWidth; if(need<=1) return; const c0=+td.dataset.c, cs=+td.dataset.cs||1;
      const per=Math.ceil((need+4)/cs); for(let j=c0;j<c0+cs&&j<cols.length;j++){ extra[j]+=per; cols[j].style.width=(base[j]+extra[j])+'px'; } grew=true; });
    const W=base.reduce((s,w,i)=>s+w+extra[i],0); tbl.style.width=W+'px'; box.style.width=W+'px'; if(!grew) break; }
  const X=[0]; base.forEach((w,i)=>X[i+1]=X[i]+w+extra[i]);

}

function qtRefresh(){
  const q=qtDraft(), c=qtCalc(q); qtKeep();
  const sm=$('#qtSum'); if(sm) sm.innerHTML=qtSumHTML(q,c);
  qtPreview();
  q.rows.forEach((r,i)=>{ const el=document.querySelector(`.qt-row[data-rid="${r.id}"] .qt-amt`); const x=c.rows[i]; if(el&&!r.free) el.innerHTML=x.orig==null?'<span class="chip warn">표에 없음</span>':`${x.alloc!==x.orig?`<s>${qtWon(x.orig)}</s>`:''}<b>${qtWon(x.alloc)}</b>`; });
  qtFit();
}
let _qtPv=0;
function qtPreview(){ clearTimeout(qtPreview._t); qtPreview._t=setTimeout(async()=>{ const sc=$('#qtPrev .qt-scale'); if(!sc) return; const my=++_qtPv; const q=qtDraft(), c=qtCalc(q);
  const pv=$('#qtPrev'); const k=pv?Math.min(1,pv.clientWidth/QT_W):1;
  let h; try{ h=(await qtSheetFor(q,c,k)).html; }catch(e){ console.warn(e); h=qtPaper(q,c); }
  if(my!==_qtPv) return; const sc2=$('#qtPrev .qt-scale'); if(sc2){ sc2.innerHTML=h; qtAutoFit(sc2); qtFit(); } },90); }
function qtFit(){ const pv=$('#qtPrev'), sc=$('#qtPrev .qt-scale'); if(!pv||!sc) return; const w=(sc.firstElementChild&&sc.firstElementChild.offsetWidth)||794; sc.style.width=w+'px'; const k=Math.min(1,pv.clientWidth/w); sc.style.transform=`scale(${k})`; pv.style.height=Math.ceil(sc.scrollHeight*k)+'px'; }
addEventListener('resize',()=>{ if(S.view==='quote') qtFit(); });

function qtSavedView(){
  const L=list('quotes').sort((a,b)=>(b.at||0)-(a.at||0));
  return `<section class="pane"><h2>저장한 견적 <small>나만 보여요</small></h2>${L.length?`<div class="list">${L.map(x=>{ const c=qtCalc(x.q); return `<div class="row qt-sv"><div class="grow"><div class="t1">${esc(x.q.name||'이름 없음')} · ${qtWon(c.total)}원</div><div class="t2">${x.from?`<span class="chip cyan">${esc(x.from)}님이 보냄</span> `:''}${esc(x.q.date||'')} · ${c.paid}과목 · ${x.q.tpl==='ai'?'AI':'IT'} 견적서 · ${esc(c.rows.filter(r=>r.n).map(r=>r.n).slice(0,3).join(', '))}${c.paid>3?' 외':''}</div></div>
    <button class="btn sm" data-act="qtOpen" data-id="${x.id}">열기</button><button class="btn sm" data-act="qtXlsxSaved" data-id="${x.id}">${ic('dl')}엑셀</button><button class="btn sm" data-act="rmOpenQuote" data-id="${x.id}">요청메모</button>${typeof qsSendBtn==='function'?qsSendBtn(x.id):''}<button class="btn sm ghost" data-act="qtDel" data-id="${x.id}" aria-label="지우기">${ic('trash')}</button></div>`; }).join('')}</div>`
    :'<div class="empty"><b>저장한 견적이 없어요</b>견적 작성 화면에서 "저장"을 누르면 여기에 모여요.</div>'}</section>`;
}
function qtPriceView(){
  if(typeof qpTidy==='function') qpTidy();
  const qf=(S.qtFind||'').trim().toLowerCase(); const P=qtPrices(); const edited=Array.isArray(S.settings.prices)&&S.settings.prices.length;
  const shown=P.map((p,i)=>({p,i})).filter(({p})=>!qf||p.n.toLowerCase().includes(qf)||(p.cat||'').toLowerCase().includes(qf));
  const so=S.qtSort||lsGet('md.qtSort')||'base', ci=c=>{ const k=QT_CATS.indexOf(c); return k<0?99:k; }, cat=p=>p.cat||qtCatGuess(p.n), ko=(a,b)=>a.p.n.localeCompare(b.p.n,'ko',{numeric:true});
  if(so==='cat') shown.sort((a,b)=>ci(cat(a.p))-ci(cat(b.p))||ko(a,b)); else if(so==='name') shown.sort(ko); else if(so==='low') shown.sort((a,b)=>a.p.p-b.p.p||ko(a,b)); else if(so==='high') shown.sort((a,b)=>b.p.p-a.p.p||ko(a,b));
  const sortBar=`<div class="seg qt-sort"><span>정렬</span>${[['base','기본 순서'],['cat','과정별'],['name','가나다순'],['low','수강료 낮은순'],['high','수강료 높은순']].map(([k,t])=>`<button class="${so===k?'on':''}" data-act="qtSort" data-k="${k}">${t}</button>`).join('')}</div>`;
  const staffBox=`<section class="pane"><h2>내 견적서 담당자 문구 <small>견적서 맨 아래 · 나에게만 적용</small></h2><textarea class="in" rows="2" data-set="qtStaff">${esc(S.settings.qtStaff||qtStaffDefault())}</textarea>${!S.settings.qtStaff&&(S.settings.name||'')!=='김병로'?'<p class="qt-hint" style="margin:6px 0 0">휴대폰 번호(HP.)를 넣고 칸 밖을 누르면 저장돼요.</p>':''}</section>`;
  return staffBox+`<section class="pane"><h2>수강료표 <small>${P.length}개 · ${edited?'수정본 사용 중':'2026.10.01 게시 기준'}${S.mode==='gas'?' · 팀이 같이 써요':''}</small></h2>
    <div class="qt-ptools"><input class="in" id="qtFindIn" value="${esc(S.qtFind||'')}" placeholder="과목 · 과정 검색"><button class="btn sm" data-act="qtPAdd">${ic('plus')}과목 추가</button><button class="btn sm" data-act="qtPExp">${ic('dl')}JSON 받기</button><label class="btn sm">${ic('up')}JSON 올리기<input type="file" id="qtPImp" accept=".json,application/json" hidden></label>${edited?'<button class="btn sm ghost danger" data-act="qtPReset">기본값으로</button>':''}</div>
    ${sortBar}<p class="qt-hint">"사진에 없음"은 마스터본 엑셀에만 있고 10/1 게시 사진에는 없는 과목이에요. 바뀐 수강료는 여기서 고치면 바로 견적에 반영돼요.</p>
    <div class="qt-ptable"><table><thead><tr><th>과목명</th><th>교습비</th><th>분/월</th><th>구분</th><th>과정</th><th>시간</th><th>횟수</th><th>양식</th><th></th></tr></thead><tbody>
    ${shown.slice(0,250).map(({p,i})=>`<tr data-pi="${i}"><td><input class="in" data-pf="n" value="${esc(p.n)}">${p.src==='master'?'<span class="chip">사진에 없음</span>':''}</td><td><input class="in num" data-pf="p" type="number" step="10000" value="${p.p}"></td><td><input class="in num" data-pf="m" type="number" value="${p.m||''}"></td><td>${p.g||qtTypeOf(p.n)}</td>
      <td><input class="in" data-pf="cat" value="${esc(p.cat||'')}" list="qtCats2" placeholder="${esc(qtCatGuess(p.n))}"></td><td><input class="in" data-pf="t" value="${esc(p.t||'')}"></td><td><input class="in num" data-pf="c" type="number" value="${p.c||''}"></td>
      <td><select class="in" data-pf="tpl"><option value="" ${!p.tpl?'selected':''}>-</option><option value="it" ${p.tpl==='it'?'selected':''}>IT</option><option value="ai" ${p.tpl==='ai'?'selected':''}>AI</option></select></td><td><button class="btn sm ghost" data-act="qtPDel" data-k="${i}" aria-label="지우기">${ic('x')}</button></td></tr>`).join('')}
    </tbody></table></div><datalist id="qtCats2">${QT_CATS.map(x=>`<option value="${x}">`).join('')}</datalist></section>`;
}

/* ---------- 입력 처리 ---------- */
function qtRow(id){ return qtDraft().rows.find(r=>r.id===id); }
function qtPriceSave(P){ S.settings.prices=P; store.saveSettings(); }
document.addEventListener('input',e=>{
  if(S.view!=='quote') return; const el=e.target; const q=qtDraft();
  if(el.dataset.qh){ const k=el.dataset.qh; if(k==='tierPct') q.tierPct=el.value===''?null:+el.value; else if(k==='unit') q.unit=+el.value; else q[k]=el.value;
    if(k==='name'){ const st=list('students').find(s=>s.name===el.value.trim()); q.sid=st?st.id:''; }
    qtRefresh(); return; }
  if(el.dataset.qs!=null){ const s=q.steps[+el.dataset.qs]; if(s){ s.p=el.value; qtRefresh(); } return; }
  if(el.dataset.q){ const rowEl=el.closest('.qt-row'); const r=rowEl&&qtRow(rowEl.dataset.rid); if(!r) return; r[el.dataset.q]=el.value; if(el.dataset.q!=='n') qtRefresh(); return; }
  if(el.id==='qtFindIn'){ S.qtFind=el.value; clearTimeout(S._qtF); S._qtF=setTimeout(()=>{ const pos=el.selectionStart; render(); const x=$('#qtFindIn'); if(x){ x.focus(); try{ x.setSelectionRange(pos,pos); }catch(err){} } },250); return; }
  if(el.dataset.pf){ const tr=el.closest('tr'); const P=clone(qtPrices()); const p=P[+tr.dataset.pi]; if(!p) return; const f=el.dataset.pf;
    p[f]=['p','m','c'].includes(f)?(el.value===''?(f==='c'?null:0):+el.value):el.value; clearTimeout(S._qtP); S._qtP=setTimeout(()=>qtPriceSave(P),500); S.settings.prices=P; return; }
});
document.addEventListener('change',e=>{
  if(S.view!=='quote') return; const el=e.target;
  if(el.dataset.q==='n'){ const rowEl=el.closest('.qt-row'); const r=rowEl&&qtRow(rowEl.dataset.rid); if(!r) return;
    if(!r.free){ const nr=qtRowFrom(el.value.trim()); Object.assign(r,{n:nr.n,type:nr.type,cat:r.cat&&r._cat?r.cat:nr.cat,time:r.time&&r._time?r.time:nr.time,cnt:nr.cnt}); qtAutoTpl(); }
    qtKeep(); setTimeout(render,0); return; }
  if(el.dataset.q==='type'){ const r=qtRow(el.closest('.qt-row').dataset.rid); if(r){ const p=qtFind(r.n); if(p&&p.m&&!p.c) r.cnt=Math.round(p.m/(r.type==='평일'?180:240)); qtKeep(); setTimeout(render,0); } return; }
  if(el.dataset.q==='cat'||el.dataset.q==='time'){ const r=qtRow(el.closest('.qt-row').dataset.rid); if(r) r['_'+el.dataset.q]=true; return; }
  if(el.id==='qtAddIn'&&qtFind(el.value)){ setTimeout(()=>WACT.qtAdd(),0); return; }
  if(el.id==='qtPImp'){ const f=el.files[0]; if(!f) return; f.text().then(t=>{ try{ const v=JSON.parse(t); if(!Array.isArray(v)||!v.length) throw 0; qtPriceSave(v.map(x=>({n:String(x.n),p:+x.p||0,m:+x.m||0,cat:x.cat||'',t:x.t||'',c:x.c||null,tpl:x.tpl||'',src:x.src||'edit',g:x.g||''}))); toast('수강료표를 불러왔어요',`${v.length}개 과목`); render(); }catch(err){ toast('형식이 맞지 않는 파일이에요','이 화면에서 받은 JSON 파일만 올릴 수 있어요.'); } }); }
});
document.addEventListener('keydown',e=>{ if(S.view==='quote'&&e.target.id==='qtAddIn'&&e.key==='Enter'&&!e.isComposing){ e.preventDefault(); WACT.qtAdd(); } });
function qtAutoTpl(){ const q=qtDraft(); if(q.tplSet) return; const ps=q.rows.filter(r=>!r.free&&r.n).map(r=>qtFind(r.n)).filter(Boolean); if(ps.length&&ps.every(p=>p.tpl==='ai')) q.tpl='ai'; else if(ps.some(p=>p.tpl==='it')) q.tpl='it'; }
function qtRecord(q,c){ return `견적서 (${q.tpl==='ai'?'AI':'IT'}) · ${c.paid}과목 · 총 ${qtWon(c.total)}원\n${c.rows.filter(r=>r.n).map(r=>`- ${r.n}${r.free?' (무료)':` ${qtWon(r.alloc)}원`}`).join('\n')}${c.steps.length?`\n할인: ${c.steps.map(s=>`${s.label} ${s.pct}%`).join(' → ')}`:''}${c.target?'\n목표 금액 적용':''}${c.carve?`\n인터넷강의 빼주기: 총 ${qtWon(c.base)} = 인강 ${qtWon(c.onReal)} + 수강료 ${qtWon(c.offline)}`:''}`; }

Object.assign(WACT,{
  qtTab:el=>{ S.qtTab=el.dataset.k; render(); },
  qtToMemo:()=>{ S.rm=rmFromQuote(qtDraft(),'작성 중인 견적'); rmKeep(); S.rmEdited=false; S.qtTab='memo'; render(); },
  qtNew:async()=>{ const q=qtDraft(); if(q.rows.length&&!await confirmBox('새 견적을 시작할까요?','지금 쓰던 내용은 지워져요. 남기려면 먼저 "저장"을 눌러 주세요.','새로 시작')) return; S.qt=qtNew(); qtKeep(); S.qtTab='make'; render(); },
  qtTpl:el=>{ const q=qtDraft(); q.tpl=el.dataset.k; q.tplSet=true; qtKeep(); render(); },
  qtAdd:()=>{ const i=$('#qtAddIn'); const v=i&&i.value.trim(); if(!v){ i&&i.focus(); return; } if(S._qtLast===v&&Date.now()-(S._qtLastT||0)<600) return; S._qtLast=v; S._qtLastT=Date.now(); i.value=''; const q=qtDraft(); q.rows.push(qtRowFrom(v)); qtAutoTpl(); qtKeep(); render(); const x=$('#qtAddIn'); x&&x.focus(); if(!qtFind(v)) toast('수강료표에 없는 과목이에요','목록에서 고르거나 수강료표 탭에서 추가해 주세요.'); },
  qtAddFree:()=>{ const q=qtDraft(); q.rows.push({id:qtRid(),n:'무료 1회 재수강권',type:'',cat:'',s:'',e:'',pat:'',time:'',cnt:'',free:true}); qtKeep(); render(); },
  qtRowDel:el=>{ const q=qtDraft(); q.rows=q.rows.filter(r=>r.id!==el.dataset.k); qtKeep(); render(); },
  qtRowUp:el=>{ const q=qtDraft(); const i=q.rows.findIndex(r=>r.id===el.dataset.k); if(i>0){ [q.rows[i-1],q.rows[i]]=[q.rows[i],q.rows[i-1]]; qtKeep(); render(); } },
  qtEnd:el=>{ const r=qtRow(el.dataset.k); if(!r) return; const e=qtEnd(r.s,r.pat,r.cnt); if(!e){ toast('종강일을 계산하지 못했어요','요일은 "월수금" "토일" "월수금월수"처럼 적어 주세요.'); return; } r.e=e; qtKeep(); render(); toast('종강일을 넣었어요',`${fmtMD(e)} · 공휴일은 따로 확인해 주세요.`); },
  qtCarve:el=>{ const q=qtDraft(); q.onCarve=el.checked; if(el.checked&&!QT_ONLINE[q.online]) q.online='1년'; qtKeep(); render(); },
  qtJoin:el=>{ const r=qtRow(el.dataset.k); if(!r) return; r.join=r.join==null?true:r.join===true?false:undefined; qtKeep(); render(); },
  qtMergeAuto:el=>{ const q=qtDraft(); q.mergeAuto=el.checked; qtKeep(); render(); },
  qtTier:el=>{ const q=qtDraft(); q.tier=el.checked; qtKeep(); render(); },
  qtStepAdd:el=>{ const q=qtDraft(); q.steps.push({k:el.dataset.k==='직접 입력'?'추가 할인':el.dataset.k,p:el.dataset.p||''}); qtKeep(); render(); if(!el.dataset.p){ const ins=$$('[data-qs]'); const x=ins[ins.length-1]; x&&x.focus(); } },
  qtStepDel:el=>{ const q=qtDraft(); q.steps.splice(+el.dataset.k,1); qtKeep(); render(); },
  qtOnline:el=>{ const q=qtDraft(); q.online=el.dataset.k; if(!QT_ONLINE[q.online]) q.onCarve=false; qtKeep(); render(); },
  qtXlsx:async()=>{ const q=qtDraft(); const c=qtCalc(q); if(c.rows.filter(r=>r.n).length>15){ toast('과목은 15개까지 들어가요','원본 양식 칸이 15줄이에요.'); }
    try{ const b=await qtXlsxBlob(q,c); await saveFile(qtFile(q,'xlsx'),b); }catch(e){ console.warn(e); toast('엑셀을 만들지 못했어요','인터넷 연결을 확인하고 다시 눌러 주세요.'); } },
  qtPrint:async()=>{ const q=qtDraft(); const c=qtCalc(q); let pa=document.getElementById('printArea'); if(!pa){ pa=document.createElement('div'); pa.id='printArea'; document.body.appendChild(pa); }
    let h; try{ let m=qtMeasure((await qtSheetFor(q,c)).html); const k=Math.min(718/m.W,990/m.H);   /* 넓힌 표 전체를 A4 (위 20mm · 나머지 8mm 여백) 한 장에 맞춤 */
      m=qtMeasure((await qtSheetFor(q,c,k)).html);   // 줄인 배율에서도 선이 선명하게
      h=`<div style="width:${Math.floor(m.W*k)}px"><div style="zoom:${k}">${m.html}</div></div>`; }catch(e){ console.warn(e); h=qtPaper(q,c); }
    pa.innerHTML=h; document.body.classList.add('printing','qt-printing'); const done=()=>{ document.body.classList.remove('printing','qt-printing'); pa.innerHTML=''; };
    addEventListener('afterprint',done,{once:true}); setTimeout(()=>{ try{ window.print(); }catch(e){} setTimeout(()=>{ if(document.body.classList.contains('printing')&&!matchMedia('print').matches) done(); },1500); },80); },
  qtSave:()=>{ const q=qtDraft(); const c=qtCalc(q); if(!c.paid) return; if(!q.id) q.id=uid('q'); store.put('quotes',{id:q.id,q:clone(q),at:Date.now()});
    if(q.sid&&D().students[q.sid]){ const s=wNorm(clone(D().students[q.sid])); const t=qtRecord(q,c); const ex=s.logs.find(l=>l.qid===q.id); if(ex){ ex.t=t; ex.d=q.date||todayStr(); } else s.logs.push({id:wid('l'),k:'memo',d:q.date||todayStr(),t,qid:q.id,at:Date.now()}); store.put('students',s); toast('저장했어요',`${s.name} 학생 기록에도 남겼어요.`); }
    else toast('저장했어요','저장한 견적 탭에서 다시 열 수 있어요.'); qtKeep(); },
  qtOpen:el=>{ const x=D().quotes[el.dataset.id]; if(!x) return; S.qt=clone(x.q); qtKeep(); S.qtTab='make'; render(); },
  qtXlsxSaved:async el=>{ const x=D().quotes[el.dataset.id]; if(!x) return; try{ await saveFile(qtFile(x.q,'xlsx'),await qtXlsxBlob(x.q,qtCalc(x.q))); }catch(e){ toast('엑셀을 만들지 못했어요',''); } },
  qtDel:async el=>{ if(!await confirmBox('이 견적을 지울까요?','저장한 견적 목록에서만 지워져요. 학생 기록은 남아요.','지우기',true)) return; store.del('quotes',el.dataset.id); render(); },
  qtSort:el=>{ S.qtSort=el.dataset.k; lsSet('md.qtSort',S.qtSort); render(); },
  qtPAdd:()=>{ const P=clone(qtPrices()); P.unshift({n:'새 과목',p:500000,m:1800,cat:'',t:'',c:null,tpl:'',src:'edit'}); S.qtFind=''; qtPriceSave(P); render(); const x=document.querySelector('[data-pi="0"] [data-pf="n"]'); x&&(x.focus(),x.select()); },
  qtPDel:async el=>{ const P=clone(qtPrices()); const p=P[+el.dataset.k]; if(!p||!await confirmBox(`"${p.n}"을(를) 지울까요?`,'수강료표에서 빠지고, 새 견적에서 고를 수 없어요.','지우기',true)) return; P.splice(+el.dataset.k,1); qtPriceSave(P); render(); },
  qtPReset:async()=>{ if(!await confirmBox('수강료표를 기본값으로 되돌릴까요?','2026.10.01 게시 사진 기준으로 돌아가요. 고친 내용은 사라져요.','되돌리기',true)) return; S.settings.prices=null; store.saveSettings(); render(); },
  qtPExp:()=>saveFile(`수강료표_${todayStr().replace(/-/g,'')}.json`,new Blob([JSON.stringify(qtPrices(),null,1)],{type:'application/json'})),
});
/* ===== 수강료표 쉽게 추가 =====
   인트라넷 강의 카드를 그대로 복사해 붙여넣거나, 시간표에 있는 과정을 고르면
   과목명 · 시간 · 횟수 · 분/월 · 구분을 알아서 채워요. 사람은 수강료만 넣으면 돼요. */
const QP_DOW='일월화수목금토';
function qpMin(t){ const m=String(t||'').match(/(\d{1,2}):(\d{2})\s*[~∼\-]\s*(\d{1,2}):(\d{2})/); if(!m) return 0; let a=+m[1]*60+ +m[2], b=+m[3]*60+ +m[4]; if(b<=a) b+=12*60; return b-a; }
function qpCat(n){ if(/인스타|마케팅|SNS|블로그|유튜브|숏폼|쇼츠|광고|브랜딩|수익화/i.test(n)) return 'AI마케팅'; if(/영상|이미지|콘텐츠|디자인|3D|미드저니|캔바/i.test(n)) return 'AI콘텐츠'; if(/업무|자동화|엑셀|노션|생산성|문서/i.test(n)) return 'AI생산성'; return qtCatGuess(n); }
function qpYmd(v){ const m=String(v||'').match(/(\d{4})[-./년\s]+(\d{1,2})[-./월\s]+(\d{1,2})/); return m?`${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`:''; }
/* 붙여넣은 글 → 과목 정보 */
function qpParse(txt){
  const raw=String(txt||'').replace(/\r/g,''); const lines=raw.split('\n').map(x=>x.trim()).filter(Boolean); if(!lines.length) return null;
  const get=k=>{ const m=raw.match(new RegExp('(?:^|\\n)\\s*'+k+'\\s*[:：]\\s*([^\\n]*)')); return m?m[1].trim():''; };
  let name=lines.find(l=>!/[:：]/.test(l)&&!/^(메모|강사|정원)/.test(l))||''; name=name.replace(/\s*개강일정\s*복사.*$/,'').replace(/\s+/g,' ').trim();
  const start=qpYmd(get('개강(?:일)?')), end=qpYmd(get('종강(?:일)?'));
  const dayTxt=get('요일'); const days=[...new Set([...dayTxt].map(c=>QP_DOW.indexOf(c)).filter(i=>i>=0))];
  const time=(get('(?:수업)?시간').match(/\d{1,2}:\d{2}\s*[~∼\-]\s*\d{1,2}:\d{2}/)||[''])[0].replace(/\s/g,'').replace(/[∼\-]/,'~');
  let per=qpMin(time), cnt=0, how='';
  const hd=raw.match(/(\d+(?:\.\d+)?)\s*(?:H|시간)\s*[*xX×]\s*(\d+)\s*(?:D|일|회)/i);
  if(hd){ cnt=+hd[2]; if(!per) per=Math.round(+hd[1]*60); how='메모'; }
  if(!cnt){ const dl=lines.find(l=>/^[\d,，\s/]+(수업|강의)?$/.test(l)&&/\d+\s*[,，]\s*\d+/.test(l)); if(dl){ cnt=dl.replace(/(수업|강의)$/,'').split(/[,，]/).filter(x=>x.trim()).length; how='수업 날짜'; } }
  if(!cnt&&start&&end&&days.length&&typeof sessionsOf==='function'){ cnt=sessionsOf({start,end,days,skipHol:true}).length; how='개강~종강'; }
  return qpFill({name,start,end,days,time,per,cnt,how});
}
function qpFill(x){
  const wk=x.days.length&&x.days.every(d=>d===0||d===6);
  if(wk&&!/\/(주말방특|주말|주|특)$/.test(x.name)) x.name+='/주';
  if(!x.per) x.per=wk?240:180;
  x.m=x.per&&x.cnt?x.per*x.cnt:0; x.cat=qpCat(x.name); x.tpl=/AI|에이아이|인공지능|챗GPT|ChatGPT|Claude|Gemini|인스타/i.test(x.name)?'ai':'it';
  x.dayTxt=x.days.map(d=>QP_DOW[d]).join(''); x.p=''; return x;
}
function qpFromCourse(c){
  return qpFill({name:String(c.name||'').trim(),start:c.start||'',end:c.end||'',days:(c.days||[]).slice(),time:c.time||'',per:qpMin(c.time),cnt:(typeof sessionsOf==='function'?sessionsOf(c).length:0)||c.total||0,how:'시간표'});
}
function qpCourses(){ if(typeof list!=='function') return []; const have=new Set(qtPrices().map(p=>p.n)); const seen=new Set();
  return list('courses').filter(c=>c.name&&!have.has(c.name)&&!have.has(c.name+'/주')&&!seen.has(c.name)&&seen.add(c.name)&&(!c.end||c.end>=todayStr())).sort((a,b)=>(a.start||'').localeCompare(b.start||'')).slice(0,40); }

/* 새 과목은 맨 위가 아니라 비슷한 과목(같은 이름 · 같은 과정) 바로 뒤에 넣어요 */
function qpPlace(P,row){ const base=row.n.replace(/\/(주말방특|주말|주|특)$/,'').replace(/\d+$/,''); let at=-1;
  P.forEach((p,k)=>{ if(base.length>=2&&p.n.startsWith(base)&&/^(\d|\/|$)/.test(p.n.slice(base.length))) at=k; });
  if(at<0) P.forEach((p,k)=>{ if((p.cat||qtCatGuess(p.n))===(row.cat||qtCatGuess(row.n))) at=k; });
  if(at<0) P.push(row); else P.splice(at+1,0,row); }
/* 예전 방식으로 맨 위에 추가됐던 과목을 한 번만 제자리로 옮겨요 */
function qpTidy(){ try{ if(lsGet('md.qpTidy')||!Array.isArray(S.settings.prices)||!S.settings.prices.length) return; lsSet('md.qpTidy','1');
  const P=clone(S.settings.prices), top=[]; while(P.length&&P[0].src==='edit'&&P[0].n!=='새 과목'&&P[0].cat) top.push(P.shift());
  if(!top.length) return; top.reverse().forEach(r=>qpPlace(P,r)); qtPriceSave(P); }catch(e){} }
/* ===== 견적서 → 요청메모 (수납 · 할인) =====
   견적(작성 중 · 저장한 견적 · 견적서 엑셀 파일)을 불러오면 과목 · 원 수강료 · 기간이 자동으로 들어가고,

   만들어지는 글은 실제 요청메모 양식(줄 순서 · 띄어쓰기 · 빈 줄)을 그대로 따라요. */

const rmWon=n=>Math.round(+n||0).toLocaleString('ko-KR');
const rmNum=v=>{ const n=parseInt(String(v??'').replace(/[^\d-]/g,''),10); return isNaN(n)?null:n; };
const rmStrip=n=>String(n||'').replace(/\(지원과목\)\s*$/,'').trim();
const rmLevel=n=>rmStrip(n).replace(qtSuffix,'').trim();                 // Python2/주 → Python2
const rmBase=n=>rmLevel(n).replace(/\s*\d+$/,'').trim()||rmLevel(n);      // Python2 → Python
const rmYM=v=>v?`${v.slice(2,4)}.${v.slice(5,7)}`:'';
function rmNew(){ return {src:'',srcLabel:'',name:'',rows:[],orig:0,quoted:0,dept:'',mcf:'X',pay:'카드',period:'',space:false,kind:'pay',paid:'',codAmt:10000,codDate:'',receipt:'-',

/* 견적 → 요청메모 바탕값 */
function rmFromQuote(q,label){
  const c=qtCalc(q); const R=rmNew();
  R.src='quote'; R.srcLabel=label; R.name=String(q.name||'').replace(/\s+/g,'');
  R.rows=c.rows.filter(r=>r.n&&!r.free).map(r=>({n:r.n,cat:r.cat||qtCatGuess(r.n),s:r.s||'',e:r.e||'',orig:r.orig||0,miss:r.orig==null}));
  rmFinish(R,c.orig,c.offline);
  const st=q.steps||[]; const has=k=>st.find(s=>s.k===k&&parseFloat(s.p)>0);
  if(has('재직자')){ R.cat='emp'; R.empPct=parseFloat(has('재직자').p)||30; }
  else if(c.target||has('자율할인')||has('추가 할인')){ R.cat='su'; }
  else { R.cat='tier'; R.tier.과목={on:c.tierPct>0,p:c.tierPct||5}; R.tier.당일={on:!!has('당일할인'),p:has('당일할인')?parseFloat(has('당일할인').p):10}; R.tier.리뷰={on:!!has('리뷰할인'),p:has('리뷰할인')?parseFloat(has('리뷰할인').p):5}; }
  return R;
}
function rmFinish(R,orig,quoted){
  R.orig=orig||R.rows.reduce((a,r)=>a+(r.orig||0),0); R.quoted=quoted||0; R.paid=R.quoted?rmWon(R.quoted):'';
  const cnt={}; R.rows.forEach(r=>{ if(r.cat) cnt[r.cat]=(cnt[r.cat]||0)+1; }); R.dept=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]||'';
  const ss=R.rows.map(r=>r.s).filter(Boolean).sort(), es=R.rows.map(r=>r.e).filter(Boolean).sort();
  R.period=ss.length?`${rmYM(ss[0])}~${rmYM(es.length?es[es.length-1]:ss[ss.length-1])}`:'';
}

/* 견적서 엑셀(.xlsx) 읽기 — 앱이 만든 견적서와 마스터본 양식(같은 칸 위치) 모두 */
async function rmReadXlsx(file){
  const Z=await loadJSZip(); const zip=await Z.loadAsync(await file.arrayBuffer()); const P=s=>new DOMParser().parseFromString(s,'application/xml');
  const wb=P(await zip.file('xl/workbook.xml').async('string')); const sheets=[...wb.getElementsByTagNameNS(QT_NS,'sheet')];
  const rels=zip.file('xl/_rels/workbook.xml.rels')?P(await zip.file('xl/_rels/workbook.xml.rels').async('string')):null;
  const ss=zip.file('xl/sharedStrings.xml')?[...P(await zip.file('xl/sharedStrings.xml').async('string')).getElementsByTagNameNS(QT_NS,'si')].map(si=>[...si.getElementsByTagNameNS(QT_NS,'t')].map(t=>t.textContent).join('')):[];
  const cellsOf=async path=>{ const f=zip.file(path); if(!f) return null; const d=P(await f.async('string')); const M={};
    [...d.getElementsByTagNameNS(QT_NS,'c')].forEach(c=>{ const t=c.getAttribute('t'), v=c.getElementsByTagNameNS(QT_NS,'v')[0];
      let val=t==='inlineStr'?[...c.getElementsByTagNameNS(QT_NS,'t')].map(x=>x.textContent).join(''):v?v.textContent:''; if(t==='s') val=ss[+val]||''; else if(t!=='inlineStr'&&t!=='str'&&val!==''&&!isNaN(val)) val=+val; M[c.getAttribute('r')]=val; }); return M; };
  /* 견적서 시트 고르기: 성함(K3) · 과목 칸(E6~)이 있는 첫 시트 */
  const paths=sheets.map(s=>{ const rid=s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'); const r=rels&&[...rels.getElementsByTagName('Relationship')].find(x=>x.getAttribute('Id')===rid); const tg=r?r.getAttribute('Target'):''; return {name:s.getAttribute('name'),path:tg?(tg.startsWith('/')?tg.slice(1):'xl/'+tg.replace(/^\.\.\//,'')):''}; });
  let M=null, used='';
  for(const p of paths){ const m=await cellsOf(p.path); if(m&&(m.K3||m.E6)&&[...Array(15)].some((_,i)=>m['E'+(6+i)])){ M=m; used=p.name; break; } }
  if(!M) M=await cellsOf('xl/worksheets/sheet1.xml');
  if(!M) throw new Error('nosheet');
  return {M,used};
}
function rmFromCells(M,fname){
  const R=rmNew(); R.src='file'; R.srcLabel=fname; R.name=String(M.K3||'').replace(/\s+/g,'');
  let yr=new Date().getFullYear(), cm=new Date().getMonth()+1; const qd=String(M.Q3||'').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if(qd){ yr=+qd[1]; cm=+qd[2]; } else if(typeof M.Q3==='number'&&M.Q3>20000){ const d=serialToYmd(M.Q3); yr=+d.slice(0,4); cm=+d.slice(5,7); }
  /* 견적서 날짜엔 연도가 없어요(10월24일) → 상담일과 가장 가까운 해로, 종강일은 개강일보다 뒤로 */
  const qday=new Date(yr,cm-1,qd?+qd[3]:15);
  const md=v=>{ if(typeof v==='number'&&v>20000) return serialToYmd(v); const m=String(v||'').match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/); return m?[+m[1],+m[2]]:null; };
  const near=v=>{ const x=md(v); if(!x) return ''; if(typeof x==='string') return x; const best=[yr-1,yr,yr+1].map(y=>new Date(y,x[0]-1,x[1])).sort((a,b)=>Math.abs(a-qday)-Math.abs(b-qday))[0]; return ymd(best); };
  const after=(v,s)=>{ const x=md(v); if(!x) return ''; if(typeof x==='string') return x; let y=s?+s.slice(0,4):yr; let d=new Date(y,x[0]-1,x[1]); if(s&&ymd(d)<s) d=new Date(y+1,x[0]-1,x[1]); return ymd(d); };
  let cat=''; let allocSum=0, missing=[];
  for(let i=6;i<=20;i++){ const n=rmStrip(M['E'+i]); if(M['C'+i]) cat=String(M['C'+i]).trim(); if(!n) continue; if(/무료|재수강권/.test(n)&&!(+M['P'+i])) continue;
    const p=qtFind(n); const alloc=typeof M['P'+i]==='number'?M['P'+i]:rmNum(M['P'+i])||0; allocSum+=alloc; if(!p) missing.push(n);
    const sd=near(M['I'+i]); R.rows.push({n,cat:cat||qtCatGuess(n),s:sd,e:after(M['K'+i],sd),orig:p?p.p:alloc}); }
  const quoted=typeof M.Q21==='number'?M.Q21:rmNum(M.Q21)||allocSum;
  rmFinish(R,0,quoted); R.missing=missing; R.rows.forEach(r=>r.miss=missing.includes(r.n)); return R;
}

/* 원 수강료 = 과목 정가 합 (정가는 과목 표에서 바로 고칠 수 있어요) */
function rmSync(R){ (R.rows||[]).forEach(r=>{ if(r.miss==null) r.miss=(R.missing||[]).includes(r.n); }); R.orig=(R.rows||[]).reduce((a,r)=>a+(+r.orig||0),0); return R; }
/* 원래 내야 할 금액(할인 후)을 과목 순서대로 채움 — 견적서와 같은 규칙: 앞 과목부터 정가, 뒤 과목이 할인 · 지원 */
function rmAlloc(R,amt){ let rem=amt; return R.rows.map(r=>{ const o=+r.orig||0, a=Math.min(o,Math.max(rem,0)); rem-=a; return {...r,orig:o,alloc:a}; }); }
/* 과목지원 · 과목할인엔 반(/주 · /특 · /주말)까지 그대로 붙여요: 바이브코딩2/주 · C언어1,2/주 */
const rmSfx=n=>{ const m=rmStrip(n).match(qtSuffix); return m?m[0]:''; };
const rmFull=n=>rmLevel(n)+rmSfx(n);
function rmJoinLv(rows){ const out=[]; rows.forEach(r=>{ const lv=rmLevel(r.n), b=rmBase(r.n), sf=rmSfx(r.n), m=lv.match(/(\d+)$/); const last=out[out.length-1];
  if(m&&last&&last.b===b&&last.sf===sf&&last.nums) last.nums.push(m[1]); else out.push({b,sf,nums:m?[m[1]]:null,lv}); }); return out.map(o=>(o.nums?`${o.b}${o.nums.join(',')}`:o.lv)+o.sf).join('/'); }
function rmCalc(R){
  rmSync(R);
  const final=rmNum(R.paid)||0;                       // 할인 후 원래 내야 할 금액 (COD여도 이 금액 기준)
  const disc=Math.max(0,R.orig-final);
  const al=rmAlloc(R,final); const sup=al.filter(r=>r.alloc===0&&r.orig>0); const part=al.filter(r=>r.alloc>0&&r.alloc<r.orig);
  const manual=!!R.subDiscOn&&R.subDiscRow!==''&&R.subDiscRow!=null&&!!al[+R.subDiscRow];   // 직접 고치기를 켰을 때만 고른 과목 사용 (예전 화면에서 골라 둔 값은 무시)
  let pi=manual?+R.subDiscRow:(part.length?al.indexOf(part[part.length-1]):-1);
  /* 깎인 과목이 딱 떨어지지 않아도(지원 과목만 있거나 정가를 모를 때) 할인이 있으면 마지막으로 돈을 낸 과목에 표시 */
  if(pi<0&&disc>0&&al.length){ const payers=al.filter(r=>r.alloc>0); pi=al.indexOf(payers.length?payers[payers.length-1]:al[al.length-1]); }
  const autoAmt=pi>=0?(part.includes(al[pi])||manual?al[pi].orig-al[pi].alloc:(sup.length?0:disc)):0;
  const amt=R.subDiscOn&&rmNum(R.subDisc)!=null?rmNum(R.subDisc):autoAmt;
  const supText=R.supportOn&&R.support.trim()?R.support.trim():rmJoinLv(sup);
  const warn=[]; if(!R.rows.length) warn.push('견적을 불러오거나 과목을 추가해 주세요'); if(R.rows.some(r=>r.miss)) warn.push('수강료표에 없는 과목이 있어요 — 정가를 확인해 주세요');
  if(!final) warn.push(R.kind==='cod'?'원래 내야 할 금액(할인 후)을 넣어 주세요':'납부금액을 넣어 주세요'); if(final>R.orig&&R.orig) warn.push('납부금액이 원 수강료보다 커요');
  if(!R.dept) warn.push('학과를 골라 주세요'); if(!R.period) warn.push('기간(26.06~26.12)을 넣어 주세요'); if(!R.name) warn.push('이름을 넣어 주세요');
  if(R.kind==='cod'&&!R.codDate) warn.push('잔액 납부 예정일을 골라 주세요');
  if(R.kind==='cod'&&final&&final<=(rmNum(R.codAmt)||0)) warn.push('할인 후 총 수강료에 COD 금액을 넣은 것 같아요 — 학생이 내야 할 전체 금액(예: 600,000)을 넣어 주세요');
  return {final,disc,al,sup,part,pi,autoAmt,amt,supText,warn};
}
function rmRate(R,k){
  if(R.cat==='su') return `수변 (원장님승인)${rmWon(k.disc)}원 -> ${rmWon(k.disc)}원 할인`;
  if(R.cat==='emp') return `재직자할인${R.empPct}% -> ${rmWon(k.disc)}원 할인`;
  const parts=['과목','당일','리뷰'].filter(x=>R.tier[x].on).map(x=>`${x}${R.tier[x].p}%`);
  return `${parts.join(', ')||'과목0%'} -> ${rmWon(k.disc)}원 할인`;
}
function rmText(R){
  const k=rmCalc(R); const sep=R.space?' / ':'/';
  const subs=[]; R.rows.forEach(r=>{ const b=rmBase(r.n); if(b&&!subs.includes(b)) subs.push(b); });
  const content=[R.name||'(이름)',...subs,R.period||'(기간)'].join(sep);
  const cod=R.kind==='cod', codAmt=rmNum(R.codAmt)||0, bal=Math.max(0,k.final-codAmt);
  const cd=R.codDate?`${R.codDate.slice(2,4)}.${R.codDate.slice(5,7)}.${R.codDate.slice(8,10)}`:'(날짜)';
  const L=['*수납','',`학과 : ${R.dept||'(학과)'}`,'',`MCF 안내여부: ${R.mcf}`,'',`결제수단 : ${R.pay}`,'',`결제내용 : ${content}`,'',
    cod?`납부금액 : ${rmWon(codAmt)}원(COD)`:`납부금액 : ${rmWon(k.final)}원`,'',
    cod?`잔액: ${rmWon(bal)}원`:'잔액: -','',
    cod?`납부일정: ${cd} 잔액 ${rmWon(bal)}원 납부 예정`:'납부일정: -','',
    `현금영수증 : ${R.receipt||'-'}`,'---------------------------------','* 할인','',`원 수강료 : ${rmWon(R.orig)}원`,'',`할인율 : ${rmRate(R,k)}`];
  const tail=[]; if(k.supText) tail.push(`> 과목지원 = ${k.supText}`);
  if(k.pi>=0&&k.amt>0) tail.push(`> 과목할인 = ${rmFull(k.al[k.pi].n)}에서 ${rmWon(k.amt)}원 할인${R.notice?'(수강생안내완료)':''}`);
  if(tail.length) L.push('',...tail);
  return L.join('\n');
}

/* ---------- 화면: ① 과목 → ② 받은 금액 → ③ 할인 종류 → ④ 나머지 확인 ---------- */
CPK.rmCourse={items:()=>qtCourseItems(),pick:(v,box)=>{ if(v==null) return; const R=rmDraft(), i=+box.dataset.i, p=qtFind(v); if(!R.rows[i]) return; R.rows[i].n=v; if(p){ R.rows[i].orig=p.p; R.rows[i].miss=false; } if(!R.rows[i].cat) R.rows[i].cat=qtCatGuess(v); rmAfterRows(R); rmKeep(); render(); }};
function rmAfterRows(R){ rmSync(R); if(!R.dept){ const cnt={}; R.rows.forEach(r=>{ if(r.cat) cnt[r.cat]=(cnt[r.cat]||0)+1; }); R.dept=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]||''; } }
function rmChips(key,opts,cur,cls=''){ return `<div class="rm-chips ${cls}">${opts.map(([v,l,sub])=>`<button class="rm-chip ${String(cur)===String(v)?'on':''}" data-act="rmSet" data-k="${key}" data-v="${esc(v)}">${l}${sub?`<small>${sub}</small>`:''}</button>`).join('')}</div>`; }

    if(labs['과목']&&labs['구분']&&(labs['개강일'])&&(labs['종강일'])&&(labs['수강료']||labs['과목수강료'])){ hr=r; Object.assign(H,{cat:labs['과정'],n:labs['과목'],type:labs['구분'],s:labs['개강일'],e:labs['종강일'],time:labs['시간'],cnt:labs['시수']||labs['횟수'],p:labs['수강료']||labs['과목수강료']}); break; } }

/* 수강료표에서 과목 찾기: 정확히 → 반 표시(/주 · /주말) 붙여서 → 비슷한 이름 후보 */

  const L=MB.list, cur=L[MB.sel]; const r=mbToQuote(cur.info,MB.pick[MB.sel]);
  const opts=L.map((x,i)=>`<option value="${i}" ${i===MB.sel?'selected':''}>${esc(x.sh.name)} · ${esc(x.info.name||'이름 없음')} · ${x.info.items.length}과목 · ${qtWon(x.info.offline)}원</option>`).join('');
  const rows=r.rep.map((x,i)=>`<tr class="${x.to?'':'mb-bad'}"><td>${esc(x.src)}</td><td>${x.to?`<b>${esc(x.to)}</b> <span class="chip ${x.how==='같음'?'ok':'cyan'}">${x.how==='같음'?'같은 이름':x.how}</span>`
      :`<select class="in mb-pick" data-i="${i}"><option value="">수강료표에서 고르기…</option>${x.cand.map(c=>`<option value="${esc(c.p.n)}">${esc(c.p.n)} (${qtWon(c.p.p)}원)</option>`).join('')}<option disabled>──────</option>${qtPrices().map(p=>`<option value="${esc(p.n)}">${esc(p.n)}</option>`).join('')}</select>`}</td><td class="num">${x.orig!=null?qtWon(x.orig):'—'}</td><td class="num">${qtWon(x.srcAmt)}</td></tr>`).join('');
  const html=`${mHead('마스터본 견적서 가져오기')}<div class="body">
    <p style="margin:0 0 10px;font-size:13px;color:var(--muted)">${esc(MB.file)} — 읽을 수 있는 견적서 ${L.length}장${MB.old||MB.hid?` · 나머지 ${MB.old+MB.hid}장은 빈 틀 · 설명 · 숨긴 시트 · 예전 양식이라 건너뛰었어요`:''}</p>
    ${L.length>1?`<div class="field"><span>누구 견적서인가요? <small>(한 명을 체크하면 그 학생 걸로 ${MB.dest==='memo'?'요청메모를 써요':'가져와요'})</small></span><div class="mb-who">${L.map((x,i)=>`<label class="mb-p ${i===MB.sel?'on':''}"><input type="radio" name="mbWho" class="mb-who-in" value="${i}" ${i===MB.sel?'checked':''}><span class="mb-ck">${ic('check')}</span><span class="mb-pi"><b>${esc(x.info.name||'이름 없음')}</b><small>${esc(x.info.items.map(t=>t.n).slice(0,3).join(', '))}${x.info.items.length>3?' 외':''} · ${qtWon(x.info.offline)}원</small><small class="mb-sh">${esc(x.sh.name)}${i===MB.act?' · 마지막으로 열어 둔 시트':''}</small></span></label>`).join('')}</div></div>`:''}
    <div class="mb-head"><b>${esc(cur.info.name||'이름 없음')}</b><span>${cur.info.kind==='ai'?'AI 견적서':'IT 견적서'} · ${esc(cur.sh.name)}</span></div>
    <div class="tablewrap"><table class="t mb-t"><thead><tr><th>마스터본 과목</th><th>KAIA 수강료표 과목</th><th>정가</th><th>마스터본 금액</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="mb-cmp ${r.same?'ok':'bad'}">${r.same?ic('check'):''}<span>원본 오프라인 수강료 <b>${qtWon(r.srcOffline)}원</b> → 변환 후 <b>${qtWon(r.newOffline)}원</b> ${r.same?'· 똑같아요':'· 달라요 — 과목을 확인해 주세요'}</span><small>${r.how==='steps'?'마스터본 할인율 그대로 옮겼어요':'원본 총액을 목표 금액으로 넣어 똑같이 맞췄어요'}${r.unsure?` · 고를 과목 ${r.unsure}개`:''}</small></div>
  </div><footer>${L.length>1?`<button class="btn" data-act="mbAll" style="margin-right:auto">${ic('dl')}${L.length}장 모두 저장한 견적으로</button>`:''}<button class="btn ghost" data-act="close">취소</button><button class="btn pri" data-act="mbGo" ${r.unsure?'disabled':''}>${esc(cur.info.name||'')}${cur.info.name?' ':''}${MB.dest==='memo'?'요청메모로 가져오기':'견적에 넣기'}</button></footer>`;
  if(modalEl&&modalEl._kind==='mb') modalEl.querySelector('.sheet').innerHTML=html; else { openModal(html,'wide'); modalEl._kind='mb'; }
}
function mbApply(r){
  closeModal(); if(MB&&MB.dest==='memo'){ S.rm=rmSync(rmFromQuote(r.q,`마스터본 · ${MB.file}`)); rmKeep(); S.rmEdited=false; S.qtTab='memo'; }
  else { S.qt=r.q; qtKeep(); S.qtTab='make'; }
  render(); toast('마스터본 견적을 가져왔어요',`${r.q.name||'이름 없음'} · ${r.q.rows.length}과목 · ${qtWon(r.newOffline)}원${r.same?' (원본과 같음)':''}`);
}
Object.assign(WACT,{
  mbGo:()=>{ const r=mbToQuote(MB.list[MB.sel].info,MB.pick[MB.sel]); if(r.unsure){ toast('과목을 먼저 골라 주세요',''); return; }
    const pk=MB.pick[MB.sel]||{}; const al={...(S.settings.mbAlias||{})}; Object.entries(pk).forEach(([i,v])=>{ if(v) al[mbNorm(MB.list[MB.sel].info.items[i].n)]=v; }); if(Object.keys(pk).length){ S.settings.mbAlias=al; store.saveSettings(); }
    mbApply(r); },
  mbAll:async()=>{ const ok=[],skip=[]; MB.list.forEach((x,i)=>{ const r=mbToQuote(x.info,MB.pick[i]); if(r.unsure) skip.push(x.sh.name); else { r.q.id=uid('q'); store.put('quotes',{id:r.q.id,q:clone(r.q),at:Date.now()-i}); ok.push(x); } });
    closeModal(); S.qtTab='saved'; render(); toast(`${ok.length}장을 저장한 견적에 넣었어요`,skip.length?`과목을 못 맞춘 ${skip.length}장은 빠졌어요: ${skip.slice(0,3).join(', ')}${skip.length>3?' 외':''}`:''); },
  qtMasterPick:()=>{ const i=$('#qtMasterFile'); i&&i.click(); },
});
document.addEventListener('change',e=>{ const el=e.target;
  if(el.id==='qtMasterFile'&&el.files[0]){ mbOpen(el.files[0],'make'); el.value=''; return; }
  if(el.id==='mbSheet'){ MB.sel=+el.value; mbDraw(); return; }
  if(el.classList&&el.classList.contains('mb-who-in')){ MB.sel=+el.value; mbDraw(); return; }
  if(el.classList&&el.classList.contains('mb-pick')){ const p=MB.pick[MB.sel]=MB.pick[MB.sel]||{}; p[+el.dataset.i]=el.value; mbDraw(); }
});
/* 단독판 보정: 기본 담당자 줄에 다른 사람 번호가 들어가지 않게 */
qtStaffDefault=function(){ return staffLine(S.settings.name||'',''); };
render(); setupMe();

</script>
</body></html>
