<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAIA 견적서</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="quote.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: white studio canvas, floating glass bar at the top, an ink-black hero with live line art; content on clean white cards. Dark themes re-map the same tokens. */
:root{
  color-scheme: light;
  --bg:#ffffff; --bg-soft:#f7f7f8;
  --surface:#ffffff; --surface-2:#f4f4f6; --surface-3:#ebebef;
  --fg:#0b0b0f; --fg-2:#3a3a42; --muted:#6c6c76; --faint:#a1a1ab;
  --line:#ebebef; --line-2:#dadae0;
  --ink:#0b0b0f; --ink-fg:#ffffff; --ink-soft:rgba(11,11,15,.06);
  --accent:#2f5bff; --accent-2:#5b7cff; --accent-soft:rgba(47,91,255,.09);
  --ok:#0e9f6e; --ok-soft:rgba(14,159,110,.1); --warn:#c27803; --warn-soft:rgba(232,153,20,.13); --bad:#e0434b; --bad-soft:rgba(224,67,75,.1); --cyan:#0e7fa8; --cyan-soft:rgba(14,127,168,.1);
  --blue:var(--accent); --violet:var(--ink); --magenta:var(--accent);
  --bar:rgba(255,255,255,.74); --bar-line:rgba(11,11,15,.08); --overlay:rgba(12,12,18,.28);
  --pill-bg:var(--ink); --pill-fg:#fff;
  --shadow-sm:0 1px 2px rgba(16,16,24,.04),0 1px 1px rgba(16,16,24,.03);
  --shadow-md:0 10px 30px -14px rgba(16,16,24,.16),0 2px 6px rgba(16,16,24,.04);
  --shadow-lg:0 40px 80px -24px rgba(16,16,24,.3),0 8px 20px rgba(16,16,24,.06);
  --spot:rgba(47,91,255,.07);
  --font:'Pretendard Variable','Pretendard','Noto Sans KR','Geist',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --display:'Geist','Pretendard Variable','Pretendard','Noto Sans KR',system-ui,sans-serif;
  --r-xl:28px; --r-lg:20px; --r-md:14px; --r-sm:10px;
  --ease:cubic-bezier(.22,.8,.2,1); --spring:cubic-bezier(.34,1.4,.4,1);
  /* compatibility with older class names */
  --glass:var(--surface-2); --glass-2:var(--surface-3); --glass-3:var(--line-2); --stroke:var(--line); --stroke-2:var(--line-2); --pane:var(--surface); --pane-solid:var(--surface); --blue-2:var(--accent-2); --text:var(--fg);
}
body.dark{
  color-scheme: dark;
  --bg:#05040f; --bg-soft:#0a0918;
  --surface:rgba(14,14,46,.46); --surface-2:rgba(255,255,255,.07); --surface-3:rgba(255,255,255,.12);
  --fg:#f3f4fc; --fg-2:#d9dbf0; --muted:rgba(222,226,255,.64); --faint:rgba(222,226,255,.38);
  --line:rgba(255,255,255,.13); --line-2:rgba(255,255,255,.24);
  --ink:#ffffff; --ink-fg:#0b0b0f; --ink-soft:rgba(255,255,255,.1);
  --accent:#7c9cff; --accent-2:#a9bcff; --accent-soft:rgba(124,156,255,.18);
  --ok:#3fdc9a; --ok-soft:rgba(63,220,154,.14); --warn:#ffc75e; --warn-soft:rgba(255,199,94,.14); --bad:#ff7d8f; --bad-soft:rgba(255,107,128,.15); --cyan:#6fdcff; --cyan-soft:rgba(83,214,255,.13);
  --violet:#c79bff;
  --bar:rgba(255,255,255,.1); --bar-line:rgba(255,255,255,.2); --overlay:rgba(2,1,8,.5);
  --pill-bg:rgba(255,255,255,.16); --pill-fg:#fff;
  --shadow-sm:none; --shadow-md:0 20px 40px -20px rgba(0,0,0,.6); --shadow-lg:0 40px 80px -20px rgba(0,0,0,.8);
  --spot:rgba(255,255,255,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .5s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
::selection{background:var(--accent);color:#fff}
.num{font-variant-numeric:tabular-nums}

/* ---------- backdrop ---------- */
.space{position:fixed;inset:0;overflow:hidden;z-index:0;background:var(--bg)}
#bgfx{position:absolute;inset:0;width:100%;height:100%;display:block}
.veil{position:absolute;inset:0;pointer-events:none}
body:not(.dark) .veil{background:none}
body.dark .veil{background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(2,2,12,.35))}
.planet,.stars{display:none}
body[data-bg="space"] .planet,body[data-bg="space"] .stars{display:block}
.planet{position:absolute;border-radius:50%}
.planet.p1{width:190vmax;height:190vmax;left:22vmax;top:-152vmax;background:radial-gradient(circle at 22% 86%,#a648f5 0%,#7426d6 7%,#42129c 19%,#1d0852 36%,#0a0420 58%);box-shadow:inset 6px -6px 0 -2px rgba(246,170,255,.85),inset 40px -40px 90px -30px rgba(230,110,255,.55),0 0 90px 10px rgba(185,80,255,.28)}
.planet.p2{width:210vmax;height:210vmax;left:-38vmax;top:58vh;background:radial-gradient(circle at 62% 8%,#4374f2 0%,#2449cf 8%,#142e94 20%,#0a1858 38%,#040a2a 60%);box-shadow:inset -4px 6px 0 -1px rgba(160,205,255,.9),inset -30px 50px 90px -30px rgba(90,150,255,.55),0 -10px 120px 0 rgba(60,110,255,.3)}
.stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 12% 22%,rgba(255,255,255,.5),transparent 50%),radial-gradient(1px 1px at 72% 12%,rgba(255,255,255,.35),transparent 50%),radial-gradient(1px 1px at 33% 68%,rgba(255,255,255,.3),transparent 50%)}

/* ---------- shell ---------- */
.shell{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;gap:14px;padding:16px max(22px,env(safe-area-inset-right,0px)) 0 max(22px,env(safe-area-inset-left,0px))}
.main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:10px 6px 56px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.lights{display:flex;gap:6px}
.lights i{width:10px;height:10px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}

/* ---------- top bar ---------- */
.topnav{position:relative;z-index:20;flex:0 0 auto;width:100%;max-width:1440px;margin:0 auto;height:64px;display:flex;align-items:center;gap:14px;padding:0 10px 0 18px;border-radius:22px;
  background:var(--bar);border:1px solid var(--bar-line);box-shadow:var(--shadow-md);
  backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);animation:barIn .9s var(--ease) both}
body.dark .topnav{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 24px 50px -24px rgba(0,0,0,.65)}
@keyframes barIn{from{opacity:0;transform:translateY(-16px) scale(.985)}}
.tn-left{display:flex;align-items:center;gap:14px;flex:none}
.wordmark{position:relative;display:flex;align-items:center;gap:10px;height:34px;min-width:168px;text-align:left}
.wordmark img{width:28px;height:auto;display:block;transition:transform .6s var(--spring)}
body.dark .wordmark img{filter:invert(1)}
.wordmark:hover img{transform:rotate(-8deg) scale(1.06)}
.wordmark b{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.12em;white-space:nowrap;color:var(--fg);transition:opacity .35s}
.wordmark b.short{display:none}
.tn-title{display:none;font-weight:700;font-size:16px;letter-spacing:-.02em}
.tn-nav{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:2px;height:42px}
.tn-nav .pill{position:absolute;left:0;top:0;height:42px;width:0;border-radius:999px;pointer-events:none;opacity:0;background:var(--pill-bg);box-shadow:0 6px 16px -6px rgba(11,11,15,.45);
  transition:transform .55s var(--spring),width .55s var(--spring),opacity .25s}
body.dark .tn-nav .pill{box-shadow:inset 0 1px 0 rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.3)}
.tn-nav a{position:relative;z-index:1;height:42px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:999px;color:var(--fg-2);text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap;cursor:pointer;transition:color .3s}
.tn-nav a.pon{color:var(--pill-fg)}
.tn-nav a .ic{position:relative;width:18px;height:18px;display:grid;place-items:center;flex:none}
.tn-nav a .ic svg{width:18px;height:18px}
.tn-nav a .badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;font-family:var(--display)}
.tn-nav a .dot{position:absolute;top:-2px;right:-3px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg);opacity:0}
.tn-sep{width:1px;height:20px;margin:0 8px;background:var(--line-2);flex:none}
.tn-right{display:flex;align-items:center;gap:2px;flex:none}
.tn-btn{position:relative;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--fg-2);transition:background .2s,color .2s}
.tn-btn:hover{background:var(--surface-2);color:var(--fg)}
.tn-btn svg{width:18px;height:18px}
.tn-btn .dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
.sync{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:999px;font-size:11.5px;color:var(--muted);background:var(--surface-2);margin-right:4px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.sync.busy i{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);animation:blink 1s infinite}
.sync.off i{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.sync span{display:none}
@keyframes blink{50%{opacity:.3}}
.who{display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;border-radius:14px;text-align:left;margin-left:4px;border:1px solid transparent;transition:background .2s,border-color .2s}
.who:hover{background:var(--surface-2)}
.who .mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--ink);color:var(--ink-fg)}
.who .meta strong{display:block;font-weight:600;font-size:13.5px;line-height:1.2;white-space:nowrap}
.who .meta span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.who .chev svg{width:14px;height:14px;color:var(--faint)}
.m-only{display:none}
.topnav.mini .tn-nav a .tx,.topnav.mini .tn-nav a .badge{display:none}
.topnav.mini .tn-nav a{padding:0 13px}
.topnav.mini .tn-nav a .dot.has{opacity:1}
@media (max-width:1640px){.who .meta,.who .chev{display:none}.who{padding:4px}}
@media (max-width:1400px){.tn-nav a.sec .tx{display:none}.tn-nav a.sec{padding:0 12px}.sync span{display:none}.sync{padding:0 9px}}
@media (max-width:1160px){.tn-nav a .tx,.tn-nav a .badge{display:none}.tn-nav a{padding:0 12px}.tn-nav a .dot.has{opacity:1}.wordmark{min-width:0}.wordmark b.full{display:none}}

/* phone */
.dock,.scrim,.sheetnav{display:none}
@media (max-width:900px){
  body::before{content:"";position:fixed;inset:0 0 auto;height:calc(env(safe-area-inset-top,0px) + 26px);z-index:59;pointer-events:none;background:linear-gradient(180deg,var(--bg) 0,var(--bg) calc(env(safe-area-inset-top,0px) + 12px),color-mix(in srgb,var(--bg) 0%,transparent) 100%)}
  .pane h2{flex-wrap:wrap;row-gap:4px}
  .pane h2 small{flex-basis:100%;order:3;line-height:1.5}
  .shell{display:block;padding:0}
  .main{height:100%;padding:82px max(16px,env(safe-area-inset-right,0px)) 112px max(16px,env(safe-area-inset-left,0px))}
  .topnav{position:fixed;z-index:60;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 10px);width:auto;height:56px;padding:0 6px 0 12px;border-radius:18px;gap:10px}
  .tn-nav,.d-only{display:none!important}
  .m-only{display:grid}
  .tn-left{flex:1;min-width:0;gap:10px}
  .wordmark{min-width:0}.wordmark b{display:none}
  .lights{display:none}
  .tn-title{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sync{height:26px}
  .sheetnav{display:block;position:fixed;z-index:55;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 74px);
    padding:12px;border-radius:22px;background:var(--bar);border:1px solid var(--bar-line);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
    box-shadow:var(--shadow-lg);transform:translateY(-10px) scale(.98);opacity:0;pointer-events:none;transition:transform .45s var(--spring),opacity .25s;transform-origin:top center}
  .sheetnav.open{transform:none;opacity:1;pointer-events:auto}
  .sheet-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .sheet-grid a{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;border-radius:16px;color:var(--fg-2);font-size:12.5px;font-weight:500;text-decoration:none;background:var(--surface-2)}
  .sheet-grid a.on{background:var(--ink);color:var(--ink-fg)}
  .sheet-grid a svg{width:21px;height:21px}
  .sheet-grid a .badge{position:absolute;top:8px;right:10px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:10.5px;display:grid;place-items:center}
  .scrim{display:block;position:fixed;inset:0;z-index:50;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .3s}
  .scrim.show{opacity:1;pointer-events:auto}
  .dock{display:flex;position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
    width:min(440px,calc(100% - 24px));height:62px;padding:6px;border-radius:22px;gap:2px;
    background:var(--bar);border:1px solid var(--bar-line);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);box-shadow:var(--shadow-lg)}
  .dock a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:16px;font-size:10.5px;font-weight:500;color:var(--muted);text-decoration:none;position:relative;transition:background .35s var(--ease),color .35s}
  .dock a svg{width:20px;height:20px}
  .dock a.on{color:var(--ink-fg);background:var(--ink)}
  .dock a .dot{position:absolute;top:7px;left:calc(50% + 7px);width:7px;height:7px;border-radius:50%;background:var(--accent)}
}

/* ---------- content ---------- */
.view{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.view>*{animation:rise .8s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:.001;transform:translateY(18px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 2px 6px}
.vh h1{margin:0;font-size:36px;font-weight:700;letter-spacing:-.035em;line-height:1.1;text-wrap:balance}
.vh .sub{color:var(--muted);font-size:13px;margin-bottom:8px}
.pane{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:22px;min-width:0;isolation:isolate;transition:box-shadow .4s var(--ease),border-color .4s}
body.dark .pane{backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%)}
.pane::before,.pcard::before,.stat::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0;transition:opacity .4s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),var(--spot),transparent 60%)}
.pane:hover::before,.pcard:hover::before,.stat:hover::before{opacity:1}
.pane h2{margin:0 0 14px;font-size:15px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.pane h2 small{font-weight:400;color:var(--faint);font-size:12px}
.pane h2 .r{margin-left:auto}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
.grid2.split{grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr)}
.subjlist{max-height:640px;overflow:auto}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
@media (max-width:1100px){.grid2,.grid2.split{grid-template-columns:minmax(0,1fr)}.subjlist{max-height:280px}}
@media (max-width:900px){.grid3{grid-template-columns:minmax(0,1fr)}.vh h1{font-size:28px}.pane{padding:16px;border-radius:18px}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.stat{position:relative;isolation:isolate;padding:16px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--display);font-size:32px;font-weight:600;letter-spacing:-.03em;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .v small{font-family:var(--font);font-size:13px;color:var(--faint);font-weight:400;margin-left:4px;letter-spacing:0}

/* hero (home) */
.hero{position:relative;overflow:hidden;border-radius:var(--r-xl);background:#0b0b0f;color:#fff;min-height:300px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;padding:34px 36px;isolation:isolate;box-shadow:0 30px 60px -30px rgba(11,11,15,.55)}
body.dark .hero{background:rgba(6,6,18,.6);border:1px solid var(--line);backdrop-filter:blur(14px)}
#herofx{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero-in{display:flex;flex-direction:column;gap:14px;min-width:0}
.hero .eyebrow{display:flex;align-items:center;gap:10px;font-size:12.5px;color:rgba(255,255,255,.6);letter-spacing:.02em}
.hero .eyebrow .live{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.hero .eyebrow .live i{width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 10px #4ade80}
.hero h1{margin:6px 0 0;font-size:clamp(30px,4vw,48px);font-weight:700;letter-spacing:-.04em;line-height:1.08;text-wrap:balance}
.hero h1 .line{display:block;overflow:hidden}
.hero h1 .line>span{display:inline-block;animation:lineUp 1s var(--ease) both}
.hero h1 .line:nth-child(2)>span{animation-delay:.08s}
@keyframes lineUp{from{transform:translateY(105%)}}
.hero p{margin:0;color:rgba(255,255,255,.7);font-size:15px}
.hero p b{color:#fff;font-weight:600}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.hero .btn.inv{background:#fff;color:#0b0b0f;border-color:#fff}
.hero .btn.inv:hover{background:#eef0ff}
.hero .btn.inv-g{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.18)}
.hero .btn.inv-g:hover{background:rgba(255,255,255,.12)}
.hero-stats{align-self:end;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hero-stats>div{padding:16px 18px;background:rgba(11,11,15,.55)}
.hero-stats b{display:block;font-family:var(--display);font-size:34px;font-weight:600;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums}
.hero-stats span{font-size:12px;color:rgba(255,255,255,.55)}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr);padding:24px 22px;border-radius:22px;min-height:0}}

.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.chip.blue{background:var(--accent-soft);color:var(--accent)}

.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface-2);gap:2px;max-width:100%}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}

.in,select.in,textarea.in{width:100%;min-width:0;height:42px;padding:0 13px;border-radius:12px;background:var(--surface-2);border:1px solid transparent;outline:none;transition:border-color .2s,background .2s,box-shadow .2s}

.in:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--accent-soft)}

.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

@media (max-width:600px){.form{grid-template-columns:minmax(0,1fr)}}
.dowpick{display:flex;gap:6px;flex-wrap:wrap}
.dowpick button{width:38px;height:38px;border-radius:12px;background:var(--surface-2);font-size:13px;font-weight:600;transition:background .2s,color .2s,transform .3s var(--spring)}

.dowpick button:active{transform:scale(.9)}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.check input{appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:7px;border:1.5px solid var(--line-2);background:var(--surface);display:grid;place-items:center;margin:0;flex:0 0 20px;transition:background .2s,border-color .2s,transform .3s var(--spring)}

.list{display:flex;flex-direction:column}

.row .t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.click{cursor:pointer;border-radius:12px;transition:background .2s,transform .35s var(--ease)}

.empty{padding:28px 10px;text-align:center;color:var(--muted);font-size:13px}

@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--accent-soft)}50%{box-shadow:0 0 0 6px var(--accent-soft)}}

.alarm{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-top:10px;position:relative;overflow:hidden;transition:transform .4s var(--ease),box-shadow .4s}

@media (max-width:600px){.alarm{flex-wrap:wrap}.alarm .btns{width:100%;justify-content:flex-end}}

.strip{position:relative;display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;padding-top:4px}
.strip .d{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 0;border-radius:14px;font-size:11px;color:var(--faint);min-width:0;transition:background .2s}
.strip .d b{font-family:var(--display);font-size:16px;color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.strip .d.today{background:var(--ink);color:rgba(255,255,255,.6)}

.strip .d.we b{color:var(--muted)}
.strip .m{display:flex;flex-direction:column;gap:3px;align-items:center;min-height:22px}
.strip .m i{width:7px;height:7px;border-radius:50%;display:block;animation:pop .7s var(--spring) both}
.strip .m i.s{background:var(--accent)}
.strip .m i.e{background:var(--ink)}
.strip .d.today .m i.e{background:var(--ink-fg)}
.strip .m i.a{background:transparent;box-shadow:inset 0 0 0 1.5px var(--warn)}
@keyframes pop{from{transform:scale(0)}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
@media (max-width:600px){.strip{grid-template-columns:repeat(7,minmax(0,1fr))}}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .h{font-size:11px;font-weight:600;color:var(--faint);text-align:center;padding:4px 0}

.cal .c{min-height:98px;padding:7px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;transition:background .2s,border-color .2s,transform .35s var(--ease)}
.cal .c:hover{border-color:var(--line-2);background:var(--bg-soft)}
.cal .c.out{opacity:.38}
.cal .c.today{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cal .c.sel{background:var(--surface-2)}
.cal .c .n{font-size:12px;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;color:var(--muted)}
.cal .c .n .hol{color:var(--bad);font-size:10px}
.cal .c.sun .n>b,.cal .c.hd .n>b{color:var(--bad)}
.cal .c.sat .n>b{color:var(--accent)}
.cal .c .n>b{font-family:var(--display);font-weight:600;color:var(--fg)}
.cal .c.today .n>b{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:999px;background:var(--ink);color:var(--ink-fg);padding:0 5px}
.cal .ev{font-size:11px;font-weight:500;line-height:19px;height:19px;padding:0 7px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.s{background:var(--accent-soft);color:var(--accent)}
.cal .ev.e{background:var(--ink-soft);color:var(--fg)}
.cal .more{font-size:10.5px;color:var(--faint);padding-left:4px}
.cal .run{font-size:10px;color:var(--faint);margin-top:auto}
.cal .dots{display:none;gap:3px;flex-wrap:wrap}
.cal .dots i{width:6px;height:6px;border-radius:50%}
.cal .dots i.s{background:var(--accent)}.cal .dots i.e{background:var(--ink)}
@media (max-width:700px){.cal{gap:3px}.cal .c{min-height:56px;padding:4px;border-radius:10px}.cal .ev,.cal .more,.cal .run{display:none}.cal .dots{display:flex}}

.tablewrap{overflow-x:auto;margin:0 -4px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-weight:600;color:var(--faint);font-size:11.5px;text-align:left;padding:8px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
table.t td{padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
table.t tr.click{cursor:pointer}

table.t tr.click:hover td{background:var(--bg-soft)}

.ring{--p:0;--c:var(--accent);width:64px;height:64px;flex:0 0 64px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--surface-3) 0);position:relative}
.ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface)}

.ring b{position:relative;font-family:var(--display);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ink);transform-origin:left;animation:grow 1.1s var(--ease) both}
.bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--warn);border-radius:1px}
@keyframes grow{from{transform:scaleX(0)}}
.pcard{position:relative;isolation:isolate;display:flex;gap:16px;align-items:center;padding:18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);cursor:pointer;transition:box-shadow .4s var(--ease),transform .4s var(--ease);min-width:0}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.pcard .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.pcard .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .t2{font-size:12px;color:var(--muted)}

.sess{display:grid;grid-template-columns:36px 92px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 4px;border-top:1px solid var(--line)}
.sess.today{background:var(--accent-soft);border-radius:12px}
.sess .no{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
.sess .dt{font-size:13px;font-variant-numeric:tabular-nums}
.sess .dt.past{color:var(--muted)}
.sess .in{height:36px}
@media (max-width:600px){.sess{grid-template-columns:28px 78px minmax(0,1fr)}.sess .act{grid-column:2/-1;justify-content:flex-end}}

.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;background:var(--overlay);backdrop-filter:blur(8px) saturate(120%);-webkit-backdrop-filter:blur(8px) saturate(120%);animation:fade .3s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(760px,100%);max-height:calc(100% - 20px);overflow:auto;border-radius:24px;background:var(--bg);border:1px solid var(--line);box-shadow:var(--shadow-lg);animation:pop2 .55s var(--spring)}
body.dark .sheet{background:linear-gradient(160deg,rgba(44,38,96,.92),rgba(14,12,36,.96))}
.sheet.wide{width:min(1040px,100%)}
.sheet.narrow{width:min(440px,100%)}
@keyframes pop2{from{transform:translateY(14px) scale(.96);opacity:0}}
.sheet header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:18px 22px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
body.dark .sheet header{background:rgba(32,28,72,.96)}
.sheet header h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .body{padding:22px;display:flex;flex-direction:column;gap:18px}
.sheet footer{position:sticky;bottom:0;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:14px 22px;background:var(--bg);border-top:1px solid var(--line)}
body.dark .sheet footer{background:rgba(20,17,48,.96)}
.tabs{display:flex;gap:4px;padding:0 22px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:61px;z-index:2;overflow-x:auto}
body.dark .tabs{background:rgba(28,24,64,.96)}
.tabs button{height:44px;padding:0 14px;color:var(--muted);font-size:13.5px;font-weight:500;position:relative;white-space:nowrap}
.tabs button.on{color:var(--fg);font-weight:600}
.tabs button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:var(--ink)}
@media (max-width:700px){.modal{padding:0;place-items:end stretch}.sheet,.sheet.wide,.sheet.narrow{width:100%;max-height:92%;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);animation:sheetUp .5s var(--ease)}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}}

.toasts{position:fixed;z-index:120;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;min-width:260px;max-width:min(380px,calc(100vw - 32px));padding:13px 16px;border-radius:16px;background:#0b0b0f;color:#fff;box-shadow:0 20px 40px -14px rgba(11,11,15,.5);animation:tin .55s var(--spring);font-size:13px;color-scheme:dark}
.toast b{display:block;font-weight:600;margin-bottom:2px}
.toast{color:rgba(255,255,255,.75)}.toast b{color:#fff}
.toast.alarm-t{box-shadow:0 0 0 1px var(--accent),0 20px 40px -14px rgba(47,91,255,.55)}
body.dark .toast{background:#fff;color:rgba(11,11,15,.7)}body.dark .toast b{color:#0b0b0f}
@keyframes tin{from{transform:translateY(16px) scale(.96);opacity:0}}
@media (max-width:900px){.toasts{left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);align-items:stretch}.toast{max-width:none}}

.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-radius:18px;background:var(--warn-soft);border:1px solid transparent}
.banner p{margin:0;flex:1;min-width:220px;font-size:13px;color:var(--fg-2)}
.banner p b{color:var(--fg)}

.lock{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:rgba(255,255,255,.72);backdrop-filter:blur(40px) saturate(160%);-webkit-backdrop-filter:blur(40px) saturate(160%);animation:fade .4s;text-align:center;cursor:pointer;color:var(--fg)}

.lock img{width:46px;margin:0 auto 22px;display:block;opacity:.9}

.pin{display:flex;gap:10px;justify-content:center;margin-top:28px}
.pin i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line-2)}
.pin i.f{background:var(--ink);border-color:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(3,64px);gap:12px;justify-content:center;margin-top:24px}
.keys button{height:64px;border-radius:50%;background:var(--surface-2);font-family:var(--display);font-size:22px;font-weight:500;transition:transform .3s var(--spring),background .2s}
.keys button:active{background:var(--surface-3);transform:scale(.9)}

.msgbox{white-space:pre-wrap;font-size:13.5px;line-height:1.75;padding:18px;border-radius:16px;background:var(--surface-2);border:1px solid transparent}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0}
.snip{position:relative;display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);min-width:0;transition:box-shadow .4s var(--ease),transform .4s var(--ease)}
.snip:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}

.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted)}

@keyframes spin{to{transform:rotate(360deg)}}
.hide-m{}
@media (max-width:700px){.hide-m{display:none!important}}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}

.swatch.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.swatch.on::after{content:"사용 중";position:absolute;right:10px;top:10px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:#0b0b0f;color:#fff}
.dropzone{position:fixed;inset:0;z-index:150;display:grid;place-items:center;padding:24px;background:var(--overlay);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .2s}

/* ================= J.A.R.V.I.S. HUD MODE ================= */
body.hud{
  color-scheme:dark;
  --bg:#06192a; --bg-soft:#0a2236;
  --surface:rgba(20,70,104,.34); --surface-2:rgba(70,200,255,.07); --surface-3:rgba(70,200,255,.13);
  --fg:#dff6ff; --fg-2:#b6e6fb; --muted:rgba(150,215,245,.66); --faint:rgba(130,200,235,.42);
  --line:rgba(80,205,255,.2); --line-2:rgba(80,205,255,.38);
  --ink:#5be1ff; --ink-fg:#01121c; --ink-soft:rgba(91,225,255,.1);
  --accent:#5be1ff; --accent-2:#a9f0ff; --accent-soft:rgba(91,225,255,.12);
  --amber:#ffb547; --amber-soft:rgba(255,181,71,.14);
  --ok:#59f2b2; --ok-soft:rgba(89,242,178,.12); --warn:#ffb547; --warn-soft:rgba(255,181,71,.13); --bad:#ff6b5b; --bad-soft:rgba(255,107,91,.14); --cyan:#5be1ff; --cyan-soft:rgba(91,225,255,.12);
  --violet:#a9f0ff;

/* ---- command center (home) ---- */
.hudhome{perspective:1600px}
.hud-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,460px) minmax(0,1fr);gap:22px;align-items:center;transform-style:preserve-3d}
.hpanel{position:relative;isolation:isolate;padding:22px 22px 20px;min-width:0}
.hpanel.left{transform:rotateY(9deg);transform-origin:right center}
.hpanel.right{transform:rotateY(-9deg);transform-origin:left center}
.hl{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;color:var(--accent);opacity:.8;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.hl::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-2),transparent)}
.hpanel .greet{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:.02em;line-height:1.15;color:#effbff;text-shadow:0 0 22px rgba(91,225,255,.35)}
.hpanel .clock{font-family:var(--mono);font-size:44px;font-weight:400;letter-spacing:-.03em;color:#e9fbff;text-shadow:0 0 26px rgba(91,225,255,.55);margin:6px 0 2px;font-variant-numeric:tabular-nums}
.hpanel .clock small{font-size:16px;color:var(--accent);margin-left:6px}
.hpanel .date{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em}
.readout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.readout div{padding:10px 12px;border:1px solid rgba(91,225,255,.15);background:rgba(91,225,255,.04);position:relative}
.readout div::before{content:"";position:absolute;left:-1px;top:-1px;width:6px;height:6px;border-left:1.5px solid var(--accent);border-top:1.5px solid var(--accent)}
.readout b{display:block;font-family:var(--mono);font-size:26px;font-weight:500;color:#effbff;line-height:1.1}
.readout span{font-size:11px;color:var(--muted);letter-spacing:.04em}
.readout .warn b{color:var(--amber);text-shadow:0 0 14px rgba(255,181,71,.5)}
.hpanel .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.core-wrap{position:relative;aspect-ratio:1/1;width:100%;max-width:460px;margin:0 auto}
#corefx{position:absolute;inset:0;width:100%;height:100%}
.core-label{position:absolute;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;color:var(--accent);white-space:nowrap;text-shadow:0 0 8px rgba(91,225,255,.6)}
.core-label.t{top:-2px}.core-label.b{top:calc(100% + 2px)}
.core-wrap{margin-bottom:58px}
.core-next{position:absolute;left:50%;top:calc(100% + 22px);transform:translateX(-50%);text-align:center;pointer-events:none;width:100%}
.core-next b{display:inline-block;margin-right:8px;font-family:var(--mono);font-size:18px;color:var(--amber);text-shadow:0 0 16px rgba(255,181,71,.6);letter-spacing:.02em}
.core-next span{font-size:12.5px;color:var(--fg-2);display:inline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpanel .alist{display:flex;flex-direction:column;gap:8px;max-height:330px;overflow:auto}
.hpanel .aitem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:10px 12px;border-left:2px solid var(--c,var(--accent));background:linear-gradient(90deg,rgba(91,225,255,.08),transparent);cursor:pointer;transition:background .2s,transform .3s var(--ease)}
.hpanel .aitem:hover{background:linear-gradient(90deg,rgba(91,225,255,.18),transparent);transform:translateX(4px)}
.hpanel .aitem.e{--c:var(--amber)}
.hpanel .aitem b{font-family:var(--mono);font-size:13px;color:var(--c,var(--accent));grid-row:span 2;align-self:center;min-width:54px}
.hpanel .aitem .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpanel .aitem .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1100px){.hud-grid{grid-template-columns:minmax(0,1fr)}.hpanel.left,.hpanel.right{transform:none}.core-wrap{max-width:380px;order:-1}}

/* ---- boot sequence ---- */
.boot{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:radial-gradient(60% 60% at 50% 50%,#04182a,#01060b 70%);transition:opacity .7s,filter .7s}
.boot.out{opacity:0;filter:blur(8px) brightness(2);pointer-events:none}
.boot svg{width:min(320px,70vw);height:auto;overflow:visible}
.boot circle{fill:none;stroke:#5be1ff;transform-origin:100px 100px}
.boot .b1{stroke-width:.6;stroke-dasharray:2 3;animation:bspin 6s linear infinite,bdraw 1.2s ease-out both}
.boot .b2{stroke-width:1.4;stroke-dasharray:420;stroke-dashoffset:420;animation:bdash 1.1s .15s cubic-bezier(.6,0,.2,1) forwards,bspin 9s linear infinite reverse;filter:drop-shadow(0 0 6px #5be1ff)}
.boot .b3{stroke-width:7;stroke:rgba(91,225,255,.25);stroke-dasharray:28 10;animation:bspin 4s linear infinite,bdraw .8s .3s both}
.boot .b4{stroke-width:1;stroke:#ffb547;stroke-dasharray:40 300;animation:bspin 1.6s linear infinite;filter:drop-shadow(0 0 6px #ffb547)}
.boot image{opacity:0;animation:bfade .6s .7s forwards}
@keyframes bspin{to{transform:rotate(360deg)}}
@keyframes bdash{to{stroke-dashoffset:0}}
@keyframes bdraw{from{opacity:0;transform:scale(.6) rotate(-90deg)}}
@keyframes bfade{to{opacity:1}}
.boot-lines{position:absolute;left:50%;top:calc(50% + min(190px,42vw));transform:translateX(-50%);width:min(440px,86vw);font-family:'JetBrains Mono',monospace;font-size:12px;color:#7fe3ff;letter-spacing:.08em;text-align:center;line-height:1.9;min-height:6em}
.boot-lines p{margin:0;opacity:0;animation:bfade .25s forwards}
.boot-lines p.ok{color:#ffb547}
.boot-skip{position:absolute;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(127,227,255,.5);letter-spacing:.2em}

/* ---- command console ---- */
.cmd{position:fixed;inset:0;z-index:250;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;background:var(--overlay);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s}
.cmd-box{width:min(680px,100%);background:var(--bg);border:1px solid var(--line-2);box-shadow:var(--shadow-lg);border-radius:20px;overflow:hidden;animation:pop2 .4s var(--spring)}
body.hud .cmd-box{border-radius:0;background:linear-gradient(180deg,rgba(6,30,48,.96),rgba(2,12,20,.98));clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px)}
.cmd-in{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.cmd-in svg{width:20px;height:20px;color:var(--accent);flex:none}
.cmd-in input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:18px;color:var(--fg)}
body.hud .cmd-in input{font-family:var(--display);font-size:20px;letter-spacing:.03em}
.cmd-mic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--fg)}
.cmd-mic.on{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
.cmd-list{max-height:52vh;overflow:auto;padding:6px}
.cmd-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;cursor:pointer}
body.hud .cmd-item{border-radius:0}
.cmd-item.sel{background:var(--surface-2);box-shadow:inset 2px 0 0 var(--accent)}
.cmd-item .k{font-size:11px;font-family:var(--mono,monospace);color:var(--accent);min-width:56px;letter-spacing:.06em}
.cmd-item .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd-item .h{font-size:12px;color:var(--faint)}
.cmd-foot{padding:10px 18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);display:flex;gap:16px;flex-wrap:wrap}


/* ================= EXECUTIVE : minimal premium on the HUD skeleton ================= */
body.hud.exec{
  color-scheme:light;
  --bg:#f6f6f3; --bg-soft:#efefeb;
  --surface:#ffffff; --surface-2:#f2f2ef; --surface-3:#e8e8e3;
  --fg:#0c0c10; --fg-2:#33333b; --muted:#6d6d76; --faint:#a3a3aa;
  --line:#e7e7e2; --line-2:#d6d6cf;
  --ink:#0c0c10; --ink-fg:#ffffff; --ink-soft:rgba(12,12,16,.06);
  --accent:#3554ff; --accent-2:#2a43d6; --accent-soft:rgba(53,84,255,.09);
  --amber:#ff6a3d; --amber-soft:rgba(255,106,61,.11);
  --ok:#0f9f6e; --ok-soft:rgba(15,159,110,.1); --warn:#e8590c; --warn-soft:rgba(255,106,61,.11); --bad:#e5484d; --bad-soft:rgba(229,72,77,.1); --cyan:#3554ff; --cyan-soft:rgba(53,84,255,.09);
  --violet:#0c0c10;
  --bar:rgba(255,255,255,.78); --bar-line:rgba(12,12,16,.07); --overlay:rgba(20,20,26,.28);
  --pill-bg:#0c0c10; --pill-fg:#fff;
  --shadow-sm:0 1px 2px rgba(16,16,24,.04); --shadow-md:0 12px 32px -16px rgba(16,16,24,.18); --shadow-lg:0 40px 80px -28px rgba(16,16,24,.3),0 0 0 1px rgba(16,16,24,.04);
  --spot:rgba(53,84,255,.06);
  --display:'Geist','Pretendard Variable','Pretendard','Noto Sans KR',sans-serif;
  --mono:'Geist','Pretendard Variable',sans-serif;
}
body.hud.exec .space::after{display:none}
body.hud.exec .veil{background:none}
body.hud.exec .view>*{animation:rise .9s var(--ease) both;animation-delay:calc(var(--i,0)*80ms)}
body.hud.exec .pane,body.hud.exec .stat,body.hud.exec .pcard,body.hud.exec .snip,body.hud.exec .alarm,body.hud.exec .hpanel{
  background:var(--card,#fff);border:1px solid var(--line);border-radius:22px;box-shadow:0 1px 2px rgba(16,16,24,.03),0 18px 40px -28px rgba(16,16,24,.22);backdrop-filter:none;-webkit-backdrop-filter:none}
body.hud.exec .pane::after,body.hud.exec .hpanel::after,body.hud.exec .stat::after,body.hud.exec .pcard::after{display:none}
body.hud.exec .pane h2{font-family:var(--font);font-size:15px;letter-spacing:-.01em;text-transform:none;color:var(--fg)}
body.hud.exec .pane h2::before{display:none}
body.hud.exec .vh h1{font-family:var(--display);font-weight:700;letter-spacing:-.04em;font-size:40px;text-shadow:none;color:var(--fg)}
body.hud.exec .vh .sub{font-family:var(--font);letter-spacing:0;color:var(--muted);font-size:13px;opacity:1}
body.hud.exec .vh .sub::before{content:none}
body.hud.exec .btn{border-radius:999px;background:var(--card,#fff);border:1px solid var(--line-2);font-family:var(--font);font-size:13px;letter-spacing:0;color:var(--fg)}
body.hud.exec .btn:hover{background:var(--surface-2);box-shadow:none}
body.hud.exec .btn.pri{background:var(--ink);border-color:var(--ink);color:var(--ink-fg);box-shadow:0 10px 22px -12px rgba(12,12,16,.7)}
body.hud.exec .btn.pri:hover{background:var(--ink-2,#26262e)}
body.hud.exec .btn.ghost{background:transparent;border-color:transparent}
body.hud.exec .in,body.hud.exec select.in,body.hud.exec textarea.in,body.hud.exec .msgbox{background:var(--surface-2);border-color:transparent}
body.hud.exec .in:focus{border-color:var(--accent);background:var(--card,#fff);box-shadow:0 0 0 4px var(--accent-soft)}
body.hud.exec .seg{background:var(--surface-2);border:0;border-radius:999px}

body.hud.exec .chip{border:0;background:var(--surface-2);font-family:var(--font);letter-spacing:0;font-weight:600}
body.hud.exec .chip.blue,body.hud.exec .chip.cyan{background:var(--accent-soft);color:var(--accent)}
body.hud.exec .chip.warn{background:var(--amber-soft);color:#c2410c}

body.hud.exec .dbadge{font-family:var(--display);letter-spacing:-.01em}

body.hud.exec .alarm::before{box-shadow:none}
body.hud.exec .alarm.e{--c:var(--ink)}
body.hud.exec table.t th{font-family:var(--font);letter-spacing:0;text-transform:none;color:var(--faint)}
body.hud.exec .row.click:hover{background:var(--surface-2)}
body.hud.exec .strip .d.today{background:var(--ink);box-shadow:none;color:rgba(255,255,255,.6)}
body.hud.exec .strip .d.today b{color:var(--ink-fg)}
body.hud.exec .strip .m i.s{box-shadow:none}

body.hud.exec .cal .c{background:var(--card,#fff);border-color:var(--line)}

body.hud.exec .cal .c.today .n>b{background:var(--ink);color:var(--ink-fg)}
body.hud.exec .cal .ev.s{background:var(--accent-soft);color:var(--accent);box-shadow:none}

body.hud.exec .ring::before{background:var(--card,#fff)}
body.hud.exec .bar{background:var(--surface-3)}
body.hud.exec .bar i{background:var(--ink);box-shadow:none}
body.hud.exec .sheet{background:var(--card,#fff);border-color:var(--line)}
body.hud.exec .sheet header,body.hud.exec .sheet footer,body.hud.exec .tabs{background:var(--card,#fff);border-color:var(--line)}
body.hud.exec .sheet header h3{font-family:var(--font);letter-spacing:-.02em;font-size:17px}

body.hud.exec .toast{background:var(--ink);color:rgba(255,255,255,.75);border:0;box-shadow:0 20px 40px -14px rgba(12,12,16,.5)}

body.hud.exec .toast.alarm-t{box-shadow:0 0 0 1px var(--accent),0 20px 40px -14px rgba(53,84,255,.5)}
body.hud.exec .banner{background:var(--amber-soft);border-color:transparent}
body.hud.exec .banner p,body.hud.exec .banner p b{color:var(--fg-2)}
body.hud.exec .topnav{background:rgba(255,255,255,.8);border:1px solid rgba(12,12,16,.07);box-shadow:0 10px 30px -18px rgba(16,16,24,.25)}
body.hud.exec .topnav::after{display:none}

body.hud.exec .tn-nav a{font-family:var(--font);font-size:14px;font-weight:500;letter-spacing:0;color:var(--fg-2);border-radius:999px}

body.hud.exec .tn-btn{color:var(--fg-2)}

.login-mark{width:52px;height:52px;margin:0 auto 16px;border-radius:16px;display:grid;place-items:center;background:var(--cyan-soft);color:var(--cyan);border:1px solid var(--line)}
.login-mark svg{width:24px;height:24px}
.pane.login h1{font-size:24px;letter-spacing:-.02em;margin:0 0 8px;color:var(--fg)}
.login-sub{margin:0 0 20px;font-size:13px;line-height:1.65;color:var(--muted)}
.login-seg{margin:0 auto 18px}
.login-form{display:grid;gap:12px;text-align:left}
.login-form .field{display:grid;gap:6px}
.login-form .field>span{font-size:12px;color:var(--muted)}
.login-hide{display:none!important}
.login-go{height:46px;margin-top:6px;justify-content:center;font-size:15px}
.login-link{display:block;margin:14px auto 0;background:none;border:0;color:var(--faint);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.login-link+.login-link{margin-top:6px}
.login-link:hover{color:var(--fg)}
/* iOS 날짜·시간 입력이 칸 밖으로 튀어나가는 문제 */
input[type=time].in,input[type=date].in,input[type=datetime-local].in,input[type=month].in{-webkit-appearance:none;appearance:none;display:block;box-sizing:border-box;width:100%;max-width:100%;min-width:0;text-align:left;line-height:40px}
input[type=time].in::-webkit-date-and-time-value,input[type=date].in::-webkit-date-and-time-value{text-align:left;margin:0}
.topnav.fit1 .tn-nav a.sec .tx{display:none}.topnav.fit1 .tn-nav a.sec{padding:0 12px}
.topnav.fit2 .tn-nav a .tx,.topnav.fit2 .tn-nav a .badge{display:none}.topnav.fit2 .tn-nav a{padding:0 12px}.topnav.fit2 .tn-nav a .dot.has{opacity:1}

/* ===== J.A.R.V.I.S. 라이트 v2 — 밝은 화이트 · 박스 볼륨감 · 테두리=박스색 ===== */
body.hud.hlight{
  --bg:#f1f4f7; --bg-soft:#e9eef2;
  --surface:#ffffff; --surface-2:#f3f6f8; --surface-3:#e9eef2;
  --fg:#0f1d29; --fg-2:#2c3e4e; --muted:#5a6a78; --faint:#8b98a4;
  --line:rgba(15,29,41,.06); --line-2:rgba(15,29,41,.1);
  --accent:#0a8fc7; --accent-2:#0a6f9a; --accent-soft:rgba(10,143,199,.09);
  --bar:#ffffff; --bar-line:#ffffff; --overlay:rgba(120,140,155,.35);
  --pill-bg:#ffffff; --pill-fg:#0f1d29;
  --vol:0 1px 1px rgba(15,29,41,.04),0 2px 4px rgba(15,29,41,.04),0 8px 18px -6px rgba(15,29,41,.08),0 22px 44px -18px rgba(15,29,41,.14);
  --vol-hi:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(15,29,41,.035);
  --vol-sm:0 1px 2px rgba(15,29,41,.07),0 4px 10px -4px rgba(15,29,41,.12);
  --shadow-md:var(--vol); --shadow-lg:0 2px 6px rgba(15,29,41,.05),0 30px 70px -22px rgba(15,29,41,.28);
  --spot:rgba(10,143,199,.05);
}
body.hud.hlight .space::after{display:none}
body.hud.hlight .veil{background:radial-gradient(120% 90% at 50% 35%,rgba(255,255,255,.35),transparent 60%)}
/* 박스: 흰 면 + 같은 색 테두리 + 겹 그림자로 볼륨 */
body.hud.hlight .pane,body.hud.hlight .stat,body.hud.hlight .pcard,body.hud.hlight .snip,body.hud.hlight .alarm,body.hud.hlight .hpanel{
  background:linear-gradient(180deg,#ffffff 0%,#fcfdfe 60%,#f8fafb 100%);border:1px solid #ffffff;
  box-shadow:var(--vol),var(--vol-hi);backdrop-filter:none;-webkit-backdrop-filter:none}
body.hud.hlight .pane::after,body.hud.hlight .hpanel::after,body.hud.hlight .stat::after,body.hud.hlight .pcard::after{display:none}
body.hud.hlight .pane h2{color:var(--fg);letter-spacing:.04em}
body.hud.hlight .pane h2::before{background:var(--accent);box-shadow:none}
body.hud.hlight .pane h2 small{color:var(--faint)}
body.hud.hlight .vh h1{color:var(--fg);text-shadow:none}
body.hud.hlight .vh .sub{color:var(--muted)}
/* 버튼 */
body.hud.hlight .btn{background:linear-gradient(180deg,#ffffff,#f7f9fa);border:1px solid #ffffff;color:var(--fg);box-shadow:var(--vol-sm),inset 0 1px 0 #fff;transition:transform .2s,box-shadow .2s,background .2s}
body.hud.hlight .btn:hover{background:#ffffff;color:var(--fg);transform:translateY(-1px);box-shadow:0 2px 4px rgba(15,29,41,.07),0 10px 20px -8px rgba(15,29,41,.18),inset 0 1px 0 #fff}
body.hud.hlight .btn:active{transform:translateY(0);box-shadow:var(--vol-sm)}
body.hud.hlight .btn.pri{background:linear-gradient(180deg,#22b4ec,#0a8fc7);border-color:#0f9ad3;color:#fff;box-shadow:0 1px 2px rgba(10,111,154,.25),0 8px 18px -6px rgba(10,143,199,.5),inset 0 1px 0 rgba(255,255,255,.35)}
body.hud.hlight .btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
body.hud.hlight .btn.danger{color:#c9382c}
/* 입력칸: 살짝 들어간 느낌 */
body.hud.hlight .in,body.hud.hlight select.in,body.hud.hlight textarea.in,body.hud.hlight .msgbox{background:#f3f6f8;border:1px solid #f3f6f8;color:var(--fg);box-shadow:inset 0 1px 2px rgba(15,29,41,.06)}
body.hud.hlight .in:focus,body.hud.hlight textarea.in:focus{background:var(--card,#fff);border-color:#fff;box-shadow:0 0 0 3px rgba(10,143,199,.18),inset 0 1px 2px rgba(15,29,41,.04)}
body.hud.hlight .in::placeholder{color:#a3aeb8}
/* 세그먼트 */
body.hud.hlight .seg{background:#eef2f5;border:1px solid #eef2f5;box-shadow:inset 0 1px 2px rgba(15,29,41,.06)}
body.hud.hlight .seg button{color:var(--muted)}
body.hud.hlight .seg button.on{background:#ffffff;color:var(--fg);box-shadow:var(--vol-sm)}
/* 상단 바 */
body.hud.hlight .topnav{background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.92);box-shadow:var(--vol),var(--vol-hi);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%)}
body.hud.hlight .topnav::after{display:none}
body.hud.hlight .wordmark b{color:var(--fg);text-shadow:none}
body.hud.hlight .wordmark img{filter:invert(37%) sepia(93%) saturate(1352%) hue-rotate(172deg) brightness(92%)}
body.hud.hlight .tn-nav a{color:var(--muted)}
body.hud.hlight .tn-nav a.pon{color:var(--fg)}
body.hud.hlight .tn-nav .pill{background:linear-gradient(180deg,#ffffff,#f6f8fa);border:1px solid #ffffff;box-shadow:0 1px 2px rgba(15,29,41,.08),0 6px 14px -6px rgba(15,29,41,.18),inset 0 1px 0 #fff}
body.hud.hlight .tn-btn{color:var(--fg-2)}
body.hud.hlight .who .mark{background:var(--card,#fff);color:var(--accent-2);box-shadow:var(--vol-sm)}
body.hud.hlight .sync{background:#f3f6f8}
/* 팝업 · 토스트 · 독 */
body.hud.hlight .sheet{background:#ffffff;border:1px solid #ffffff;box-shadow:var(--shadow-lg)}
body.hud.hlight .sheet header,body.hud.hlight .sheet footer,body.hud.hlight .tabs{background:#fafbfc}
body.hud.hlight .toast{background:#ffffff;border:1px solid #ffffff;color:var(--fg-2);box-shadow:0 2px 6px rgba(15,29,41,.06),0 18px 40px -14px rgba(15,29,41,.25)}
body.hud.hlight .toast.alarm-t{border-color:#ffffff;box-shadow:inset 3px 0 0 var(--amber),0 2px 6px rgba(15,29,41,.06),0 18px 40px -14px rgba(15,29,41,.25)}
body.hud.hlight .dock,body.hud.hlight .sheetnav{background:rgba(255,255,255,.94);border-color:rgba(255,255,255,.94);box-shadow:var(--vol)}
body.hud.hlight .dock a.on,body.hud.hlight .sheet-grid a.on{background:var(--card,#fff);color:var(--fg);box-shadow:var(--vol-sm)}
body.hud.hlight .cmd-box{background:#ffffff;border-color:#ffffff}
/* 안쪽 작은 칸들 */
body.hud.hlight .readout div{background:#f5f7f9;border:1px solid #f5f7f9;box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(15,29,41,.04)}
body.hud.hlight .readout b{color:var(--fg)}
body.hud.hlight .readout span{color:var(--muted)}
body.hud.hlight .hpanel .aitem{background:#f5f7f9;box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(15,29,41,.04)}
body.hud.hlight .hpanel .aitem .n{color:var(--fg)}
body.hud.hlight .hpanel .aitem .s{color:var(--muted)}
body.hud.hlight .cal .c{background:#f7f9fa;border-color:#f7f9fa}
body.hud.hlight .cal .c:hover{background:#ffffff;box-shadow:var(--vol-sm)}
body.hud.hlight .banner{background:#fff8ee;border-color:#fff8ee;box-shadow:var(--vol-sm)}
body.hud.hlight .hpanel .greet,body.hud.hlight .hpanel .clock{color:var(--fg);text-shadow:none}
body.hud.hlight .core-label{color:var(--muted)}
body.hud.hlight .lock{background:rgba(241,244,247,.92)}
body.hud.hlight .lock .clock{color:var(--fg);text-shadow:none}
body.hud.hlight .boot{background:radial-gradient(60% 60% at 50% 50%,#ffffff,#e6ecf1 75%)}
body.hud.hlight table th{color:var(--muted)}
body.hud.hlight .login-mark{background:var(--card,#fff);border-color:#fff;box-shadow:var(--vol-sm)}
body.hud.hlight .alarm::before{display:none}
body.hud.hlight .alarm{background:#f7f9fa;border:1px solid #f7f9fa;box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(15,29,41,.05)}
body.hud.hlight .chip{background:#eef2f5;border:0;color:var(--fg-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
body.hud.hlight .chip.blue,body.hud.hlight .chip.cyan{background:rgba(10,143,199,.1);color:#0a6f9a}
body.hud.hlight .chip.ok{background:rgba(11,158,108,.1);color:#07865b}
body.hud.hlight .chip.warn{background:rgba(232,137,12,.12);color:#b56500}
body.hud.hlight .chip.bad{background:rgba(224,72,59,.1);color:#c3392c}
body.hud.hlight .chip.violet{background:#eef2f5;color:var(--fg-2)}

/* ===== 로딩 화면 (모든 테마) ===== */
.boot2{position:fixed;inset:0;z-index:300;overflow:hidden;transition:opacity .6s ease,transform .6s ease}
.boot2.out{opacity:0;transform:scale(1.02);pointer-events:none}
.boot2 canvas{position:absolute;inset:0}
.bl-logo{position:absolute;height:auto;opacity:0;will-change:transform,opacity;pointer-events:none}
.bl-name{position:absolute;left:0;right:0;text-align:center;font-weight:700;font-size:13px;letter-spacing:.42em;padding-left:.42em;opacity:0}
.bl-line{position:absolute;left:0;right:0;text-align:center;font-size:12.5px;letter-spacing:.02em;opacity:0;padding:0 24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bl-line.show{animation:blIn .45s cubic-bezier(.2,.8,.2,1) forwards}
.boot2.mono .bl-line{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.08em}
.bl-skip{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);text-align:center;font-size:11px;letter-spacing:.12em;opacity:.45}
@keyframes blIn{from{opacity:0;transform:translateY(6px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}

/* ===== 학생 업무 (기록 · 과제 · 첨삭 · 수신함) ===== */
.wk-tabs{top:0}
.wk-tabs small{font-size:11px;color:var(--faint);margin-left:2px}
.wk{display:flex;flex-direction:column;gap:14px}
.wk-hint{font-size:12.5px;color:var(--muted);line-height:1.6;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.wk-hint b{color:var(--fg)}
.field.wk-hint{display:block}
.wk-add{display:flex;flex-direction:column;gap:10px}
.wk-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wk-row .in{flex:1;min-width:130px}
.wk-row input[type=date].in,.wk-row input[type=time].in{flex:0 0 auto;width:auto;min-width:150px}
.wk-hide{display:none!important}
.wk-kinds{align-self:flex-start;flex-wrap:wrap}
.wk-panel{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:var(--surface-2)}
.wk-panel>b{font-size:13.5px}
.wk-panel>p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.6}
.wk-cbs{display:flex;flex-direction:column;gap:6px}
.wk-cb{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--warn-soft);font-size:13px}
.wk-cb .grow{flex:1;min-width:0}
.wk-tl{display:flex;flex-direction:column}
.wk-it{display:grid;grid-template-columns:52px 14px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.wk-it:first-child{border-top:0}
.wk-d{font-size:12px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.wk-dot{width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--faint)}
.wk-dot.blue{background:var(--accent)}.wk-dot.ok{background:var(--ok)}.wk-dot.cyan{background:var(--cyan)}.wk-dot.warn{background:var(--warn)}.wk-dot.violet{background:var(--violet)}
.wk-c{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.wk-txt{font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--fg)}
.wk-more summary{list-style:none;cursor:pointer}
.wk-more summary::-webkit-details-marker{display:none}
.wk-more summary b{display:inline-block;margin-top:4px;font-size:12px;color:var(--accent);font-weight:600}
.wk-more[open] summary{display:none}
.wk-link{font-size:12.5px;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.wk-as,.wk-ver{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:var(--surface-2)}
.wk-as.done{opacity:.85}
.wk-as-h{display:flex;align-items:center;gap:8px}
.wk-as-h .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-as-m{font-size:12px;color:var(--muted)}
.wk-steps{align-self:flex-start}
.wk-cnt{font-size:12px;color:var(--muted);margin-left:auto}
.wk-in .wk-insel{width:auto;max-width:140px;height:34px}
.wk-hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.wk-hub-c{padding:14px 16px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:4px;min-width:0}
.wk-hub-n{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.wk-hub-c.warn .wk-hub-n{color:var(--warn)}.wk-hub-c.bad .wk-hub-n{color:var(--bad)}
.wk-hub-t{font-size:12.5px;color:var(--muted)}
.wk-hub-l{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.wk-hub-l button{text-align:left;font-size:12.5px;color:var(--fg-2);padding:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;cursor:pointer}
.wk-hub-l button:hover{color:var(--accent)}
@media (max-width:640px){.wk-it{grid-template-columns:44px 10px minmax(0,1fr) auto;gap:8px}.wk-row input[type=date].in,.wk-row input[type=time].in{flex:1;min-width:0}}

/* ===== 과제 제작 · 분석 ===== */
.qz{display:flex;flex-direction:column;gap:16px}
.qz-lead{margin:0;font-size:15px;font-weight:600}
.qz-subs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.qz-sub{display:flex;flex-direction:column;gap:6px;text-align:left;padding:18px;border-radius:16px;background:var(--surface-2);border:1px solid transparent;cursor:pointer;transition:transform .2s,box-shadow .2s;color:var(--fg)}
.qz-sub:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.qz-sub b{font-size:17px}.qz-sub span{font-size:12.5px;color:var(--muted);line-height:1.6}.qz-sub small{font-size:11.5px;color:var(--faint)}
.qz-lv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qz-lv button{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:14px;background:var(--surface-2);text-align:left;color:var(--fg);border:2px solid transparent;cursor:pointer}
.qz-lv button b{font-size:20px}.qz-lv button span{font-size:12px;color:var(--muted)}
.qz-lv button.on{border-color:var(--accent);background:var(--accent-soft)}
.qz-tops{display:flex;flex-wrap:wrap;gap:8px 18px;padding:6px 2px}
.qz-head{display:flex;align-items:center;gap:12px}.qz-head>div{flex:1;display:flex;flex-direction:column}.qz-head b{font-size:16px}.qz-head span{font-size:12.5px;color:var(--muted)}
.qz-prev{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow:auto;padding-right:4px}
.qz-q{padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.qz-qh{font-size:13.5px;line-height:1.6}.qz-qh .chip{margin-left:6px;vertical-align:middle}
.qz-q pre,.qzr pre{margin:8px 0;padding:10px 12px;border-radius:10px;background:var(--surface-3);font-family:'JetBrains Mono',Consolas,monospace;font-size:12.5px;line-height:1.55;white-space:pre-wrap;overflow:auto}
.qz-q ol{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 14px;font-size:13px;color:var(--fg-2)}
.qz-q ol li{white-space:pre-wrap}.qz-q ol li.ok{color:var(--ok);font-weight:600}
.qz-reg{grid-template-columns:1fr 1fr}
.qz-cardh{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.qz-cardh .chip{margin-right:auto}
.qz-grade{display:flex;flex-direction:column;gap:10px}
.qz-gh{display:flex;flex-direction:column}.qz-gh b{font-size:13.5px}.qz-gh span{font-size:12px;color:var(--muted)}
.qz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.qz-cell{display:flex;align-items:center;gap:3px;padding:4px 6px;border-radius:10px;background:var(--surface)}
.qz-cell span{width:24px;font-size:12px;font-weight:700;color:var(--muted);text-align:right;margin-right:4px}
.qz-cell button{width:26px;height:26px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--fg-2);background:transparent;border:1px solid var(--line-2);cursor:pointer}
.qz-cell button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.qz-cnt{font-size:12px;color:var(--muted)}
.qz-done{display:flex;align-items:center;flex-wrap:wrap;gap:10px}.qz-done b{font-size:22px}.qz-done span{flex:1;font-size:12.5px;color:var(--muted);min-width:160px}
.qzr{display:flex;flex-direction:column;gap:16px}
.qzr-top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.qzr-k{font-size:12.5px;color:var(--muted)}
.qzr-score{display:flex;align-items:baseline;gap:6px}.qzr-score b{font-size:52px;line-height:1;font-weight:800;letter-spacing:-.03em}.qzr-score span{font-size:16px;font-weight:600}.qzr-score em{font-style:normal;font-size:13px;color:var(--muted);margin-left:8px}
.qzr-sum{flex:1;min-width:240px;max-width:520px;margin:0;font-size:14px;line-height:1.7;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.qzr-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
.qzr-box{padding:16px;border-radius:16px;background:var(--surface-2)}
.qzr-box h4{margin:0 0 12px;font-size:13.5px}.qzr-box h4 small{color:var(--faint);font-weight:500}
.qz-chart,.qz-radar{width:100%;height:auto;display:block;color:var(--fg)}
.qz-radar{max-width:340px;margin:0 auto}
.qzr-tp{padding:10px 0;border-top:1px solid var(--line)}.qzr-tp:first-of-type{border-top:0}
.qzr-tph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.qzr-tph b{font-size:14px}
.qzr-m{font-size:12px;color:var(--muted)}
.qzr-tp p{margin:6px 0 0;font-size:13px;line-height:1.7;color:var(--fg-2)}
.qzr-w{padding:10px 0;border-top:1px solid var(--line)}.qzr-w:first-of-type{border-top:0}
.qzr-wq{margin:0;font-size:13.5px;line-height:1.6}.qzr-wa{margin:4px 0 0;font-size:12.5px}.qzr-wa b.bad{color:var(--bad)}.qzr-wa b.ok{color:var(--ok)}
.qzr-we{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
@media (max-width:700px){.qzr-grid,.qz-reg{grid-template-columns:1fr}.qz-lv{grid-template-columns:1fr}.qz-q ol{grid-template-columns:1fr}.qzr-score b{font-size:42px}}
.qz-bars{display:flex;flex-direction:column;gap:12px}
.qz-bar{display:grid;grid-template-columns:minmax(80px,30%) 1fr 44px;align-items:center;gap:10px}
.qz-bar .n{font-size:13px;text-align:right;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qz-bar .tr{height:16px;border-radius:9px;background:var(--surface-3);overflow:hidden}

.qz-bar b{font-size:13px}
.qzr.print .qz-bar .tr{background:#e6e6e6}.qzr.print .qz-bar .n{color:#222}
.qz-cat{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:4px 0 -6px}
.qz-ref{margin:0;padding:12px 14px;border-radius:12px;background:var(--surface-3);font-family:'JetBrains Mono',Consolas,monospace;font-size:12px;line-height:1.55;white-space:pre;overflow:auto}
/* 인쇄 */
#printArea{display:none}
@media print{
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block!important;position:static}
  body.printing{background:var(--card,#fff)!important}
  body.printing .qzr.print{gap:10pt}
  body.printing .qzr.print .qzr-box,body.printing .qzr.print .qzr-sum{background:#f6f6f6!important;page-break-inside:avoid}
  body.printing .qzr.print .qzr-grid{grid-template-columns:1.4fr 1fr}
  @page{size:A4;margin:16mm 14mm}
}
