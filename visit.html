function ics(D){ var d=ymd(D.d), t=String(D.tm||'14:00').split(':'); var st=new Date(d.getFullYear(),d.getMonth(),d.getDate(),+t[0],+t[1]); var en=new Date(st.getTime()+60*60000);
  var f=function(x){ return x.getFullYear()+('0'+(x.getMonth()+1)).slice(-2)+('0'+x.getDate()).slice(-2)+'T'+('0'+x.getHours()).slice(-2)+('0'+x.getMinutes()).slice(-2)+'00'; };

     '<div class="when"><div class="dd num '+(left<=1?'soon':'')+'">'+(left<0?'지남':left===0?'오늘':'D-'+left)+'</div><div><b>'+wd+(tmTxt?' '+tmTxt:'')+'</b><span>'+h(BR.addr)+'</span></div></div>'+
     '<div class="row" style="grid-template-columns:repeat(2,minmax(0,1fr))"><button class="btn" id="bCal">'+IC.cal+'달력에 저장</button><button class="btn" id="bTop">'+IC.pin+'오시는 길</button></div></section>'+
   (D.nt?'<section class="glass card in-2"><h2>'+IC.hi+'담당자 메모</h2><div class="memo2">'+h(D.nt)+'</div></section>':'')+
   '<section class="glass card in-2" id="way"><h2>'+IC.pin+'학원 찾아오기</h2>'+
     '<div class="addr"><p>'+h(BR.addr)+'</p><button class="mini" id="bAddr">주소 복사</button></div>'+
     '<ol class="steps2">'+
       '<li><span class="sn">'+IC.cafe+'</span><div><b>1층에 빽다방이 있는 건물이에요</b><span>중앙대로변 에이원플라자 · 빽다방 간판을 찾아 주세요</span></div></li>'+
       '<li><span class="sn">'+IC.elev+'</span><div><b>건물 엘리베이터를 타고 4층</b><span>1층 로비 안쪽 엘리베이터를 이용해 주세요</span></div></li>'+
       '<li><span class="sn">'+IC.door+'</span><div><b>내리면 바로 옆 통유리문이 학원이에요</b><span>들어오셔서 '+h(D.mn||'담당 멘토')+'를 찾아 주세요</span></div></li>'+
     '</ol>'+
     '<ul class="route"><li><b>'+IC.train.replace('aria-hidden','style="width:15px;height:15px;vertical-align:-2px" aria-hidden')+' 서면역 2번 출구</b><span>직진 도보 7분 · 삼정타워 옆 건물</span></li><li><b>'+IC.train.replace('aria-hidden','style="width:15px;height:15px;vertical-align:-2px" aria-hidden')+' 범내골역 8번 출구</b><span>직진 도보 7분</span></li></ul>'+
     '<div class="row" style="grid-template-columns:1fr"><a class="btn" href="'+BR.map+'" target="_blank" rel="noopener">'+IC.pin+'네이버 지도에서 보기</a></div></section>'+
   '<section class="glass card in-3"><h2>'+IC.car+'차로 오시는 길</h2><p class="desc" style="margin:0">내비 앱을 누르면 학원 주소로 바로 길안내를 시작할 수 있어요.</p><div class="navis" id="navis"></div>'+
     '<div class="park"><div class="park-h"><b>P</b><span>건물 주차장 이용 · 주차 요금</span></div><div class="park-r"><div class="park-c free"><span>1시간</span><b>무료</b></div><div class="park-c"><span>이후 30분마다</span><b class="num">1,500원</b></div></div><p class="park-n">상담은 보통 1시간 안쪽이라 대부분 무료로 이용하실 수 있어요.</p></div></section>'+
   (prep.length?'<section class="glass card in-3"><h2>'+IC.bag+'가져오시면 좋아요</h2><ul class="prep">'+prep.map(function(x){ return '<li>'+h(x)+'</li>'; }).join('')+'</ul></section>':'')+
   '<section class="card2 in-4"><div class="bn">'+h(D.br||BR.name)+'</div><div class="nm">'+h(D.mn||'담당 멘토')+'</div><div class="rl">상담 · 학사 담당</div>'+
     '<dl>'+(D.hp?'<dt>휴대폰</dt><dd class="num">'+h(D.hp)+'</dd>':'')+(D.tel?'<dt>학원</dt><dd class="num">'+h(D.tel)+'</dd>':'')+'<dt>주소</dt><dd>'+h(BR.addr)+'</dd></dl>'+
     ((D.hp||D.tel)?'<div class="row" style="grid-template-columns:repeat('+(D.hp?2:1)+',minmax(0,1fr))"><a class="btn pri" href="tel:'+h(D.hp||D.tel)+'">'+IC.tel+'전화하기</a>'+(D.hp?'<a class="btn" href="sms:'+h(D.hp)+'">'+IC.sms+'문자 보내기</a>':'')+'</div>':'')+

   '<div class="pfoot">이 페이지는 받은 링크 안의 정보로만 보여요</div>';
  var nv=document.getElementById('navis'); NAVI.forEach(function(n){ if(!MOBILE&&n[0]==='tmap') return; var b=document.createElement('button'); b.className='navi n-'+n[0]; b.type='button'; b.innerHTML='<i>'+({kakao:'K',naver:'N',tmap:'T'})[n[0]]+'</i><span></span>'; b.lastChild.textContent=n[1]; b.onclick=function(){ openNavi(n); }; nv.appendChild(b); });

function fail(){ document.getElementById('app').innerHTML='<section class="glass fail"><b>예약 정보를 열 수 없어요</b><p>링크가 잘렸을 수 있어요. 받은 링크 전체를 다시 눌러 주세요.</p></section>'; }
/* ===== 방문 예약: 링크에 k(예약 열쇠) · s(서버 번호)가 있으면 학생이 직접 날짜 · 시간을 골라요 =====
   고른 시간은 담당 멘토의 KAIA DESK 업무(상담)로 바로 들어가고, 이미 찬 시간은 막혀요. 예약하면 아래 오시는 길 안내로 바뀌어요. */
function pad(n){ return (n<10?'0':'')+n; }
function ymdOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function renderBook(B){
  var SV='https://script.google.com/macros/s/'+String(B.s).replace(/[^\w-]/g,'')+'/exec';
  var from=B.a||'10:00', to=B.b||'19:00', step=+B.st||30, days=+B.dd||14, off=String(B.x==null?'0':B.x);
  var taken={}, sel={d:'',tm:''};
  var list=[]; var now=new Date(); for(var i=0;list.length<days&&i<days*2;i++){ var d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i+(B.t0?0:0)); if(off.indexOf(String(d.getDay()))>=0) continue; list.push(d); }
  var slots=[]; (function(){ var a=from.split(':'), b=to.split(':'); for(var m=+a[0]*60+ +a[1]; m<=+b[0]*60+ +b[1]; m+=step) slots.push(pad(Math.floor(m/60))+':'+pad(m%60)); })();
  render({n:'',d:ymdOf(now),tm:'',mn:B.mn,hp:B.hp,tel:B.tel,p:B.p});
  document.title='방문 상담 예약 · '+BR.name;
  var hero=document.querySelector('.hero');
  hero.innerHTML='<span class="eyebrow">'+IC.cal.replace('aria-hidden','style="width:15px;height:15px" aria-hidden')+'방문 상담 예약</span>'+
    '<h1>편한 날짜와 시간을<br>눌러 주세요</h1><div class="who">고르시면 '+h((B.mn||'담당 멘토').replace(/\s*멘토$/,''))+' 멘토 일정에 바로 등록돼요</div>'+
    '<div class="bk-lab">날짜</div><div class="bk-days" id="bkD"></div>'+
    '<div class="bk-lab">시간</div><div class="bk-times" id="bkT"><div style="grid-column:1/-1;color:var(--sub);font-size:14px">날짜를 먼저 골라 주세요</div></div>'+
    '<div class="bk-lab">예약하시는 분</div><input class="bk-in" id="bkN" placeholder="성함" autocomplete="name" maxlength="30"><input class="bk-in" id="bkP" placeholder="연락처 (010-0000-0000)" inputmode="tel" autocomplete="tel" maxlength="20"><textarea class="bk-in" id="bkM" rows="2" placeholder="궁금한 과정이나 남기실 말씀 (선택)" maxlength="300"></textarea>'+
    '<label class="bk-ag"><input type="checkbox" id="bkA">상담 일정 안내 목적으로만 성함 · 연락처를 사용하는 데 동의해요</label>'+
    '<div class="bk-sum" id="bkS" hidden></div><div class="bk-err" id="bkE"></div>'+
    '<button class="btn pri" id="bkGo" style="width:100%">'+IC.cal+'이 시간으로 예약하기</button>';
  var DW='일월화수목금토';
  var dBox=document.getElementById('bkD'), tBox=document.getElementById('bkT');
  function drawDays(){ dBox.innerHTML=list.map(function(d){ var v=ymdOf(d); return '<button class="bk-d'+(d.getDay()===6?' sat':'')+(sel.d===v?' on':'')+'" data-d="'+v+'"><small>'+(v===ymdOf(new Date())?'오늘':DW[d.getDay()])+'</small><b class="num">'+d.getDate()+'</b><small>'+(d.getMonth()+1)+'월</small></button>'; }).join('');
    [].forEach.call(dBox.children,function(b){ b.onclick=function(){ sel.d=b.dataset.d; sel.tm=''; drawDays(); drawTimes(); sum(); }; }); }
  function drawTimes(){ if(!sel.d) return; var n=new Date(), isToday=sel.d===ymdOf(n), nm=n.getHours()*60+n.getMinutes()+60;
    tBox.innerHTML=slots.map(function(s){ var p=s.split(':'), past=isToday&&(+p[0]*60+ +p[1])<nm, tk=taken[sel.d+' '+s]; return '<button class="bk-t num'+(sel.tm===s?' on':'')+'" data-t="'+s+'"'+(past||tk?' disabled':'')+' title="'+(tk?'이미 예약된 시간':'')+'">'+s+'</button>'; }).join('');
    [].forEach.call(tBox.children,function(b){ b.onclick=function(){ sel.tm=b.dataset.t; drawTimes(); sum(); }; }); }
  function sum(){ var e=document.getElementById('bkS'); if(!sel.d||!sel.tm){ e.hidden=true; return; } var d=ymd(sel.d), hh=+sel.tm.split(':')[0], mm=+sel.tm.split(':')[1];
    e.hidden=false; e.textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DW[d.getDay()]+') '+(hh<12?'오전 ':'오후 ')+((hh%12)||12)+'시'+(mm?' '+mm+'분':'')+'에 뵐게요'; }
  drawDays();
  fetch(SV+'?a=bookinfo&k='+encodeURIComponent(B.k),{redirect:'follow'}).then(function(r){ return r.json(); }).then(function(j){ if(j&&j.taken) j.taken.forEach(function(x){ taken[x]=1; }); if(j&&j.error==='nokey'){ document.getElementById('bkE').textContent='예약 링크가 만료됐어요. 담당 멘토에게 새 링크를 받아 주세요.'; document.getElementById('bkGo').disabled=true; } drawTimes(); }).catch(function(){});
  document.getElementById('bkGo').onclick=function(){ var E=document.getElementById('bkE'), n=document.getElementById('bkN').value.trim(), p=document.getElementById('bkP').value.trim(), m=document.getElementById('bkM').value.trim();
    if(!sel.d||!sel.tm){ E.textContent='날짜와 시간을 골라 주세요.'; return; } if(!n){ E.textContent='성함을 적어 주세요.'; return; } if(p.replace(/\D/g,'').length<9){ E.textContent='연락처를 정확히 적어 주세요.'; return; }
    if(!document.getElementById('bkA').checked){ E.textContent='개인정보 사용에 동의해 주세요.'; return; }
    var btn=this; btn.disabled=true; E.textContent=''; btn.textContent='예약하는 중…';
    fetch(SV,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({a:'book',k:B.k,n:n,p:p,d:sel.d,tm:sel.tm,memo:m})}).then(function(r){ return r.json(); }).then(function(j){
      if(j&&j.ok){ render({n:n,d:sel.d,tm:sel.tm,mn:B.mn,hp:B.hp,tel:B.tel,p:B.p}); var a=document.getElementById('app'); var ok=document.createElement('div'); ok.className='bk-ok in-1'; ok.innerHTML=IC.cal+'예약이 접수됐어요. 담당 멘토가 확인 후 연락드릴게요.'; a.insertBefore(ok,a.children[1]); scrollTo(0,0); return; }
      btn.disabled=false; btn.innerHTML=IC.cal+'이 시간으로 예약하기';
      if(j&&j.error==='taken'){ taken[sel.d+' '+sel.tm]=1; sel.tm=''; drawTimes(); sum(); E.textContent='방금 다른 분이 예약한 시간이에요. 다른 시간을 골라 주세요.'; }
      else E.textContent=j&&j.error==='busy'?'잠시 후 다시 시도해 주세요.':'예약하지 못했어요. 입력한 내용을 확인하거나 담당 멘토에게 연락해 주세요.'; })
    .catch(function(){ btn.disabled=false; btn.innerHTML=IC.cal+'이 시간으로 예약하기'; E.textContent='연결이 불안정해요. 잠시 후 다시 눌러 주세요.'; }); };
}
decode().then(function(d){ if(d&&d.k&&d.s){ renderBook(d); return; } if(!d||!d.d) throw 0; render(d); }).catch(fail);
