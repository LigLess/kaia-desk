<style>
:root{
  --bg:#12141b; --panel:#191c25; --panel-2:#20242f; --panel-3:#2a2f3c; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --fg:#eef0f5; --fg-2:#c9cdd8; --muted:#9aa1b2; --faint:#6d7486;
  --acc:#ff9d4d; --acc-ink:#24140a; --acc-soft:rgba(255,157,77,.14);
  --ok:#5fd59a; --ok-soft:rgba(95,213,154,.13); --bad:#ff7b72; --bad-soft:rgba(255,123,114,.13); --warn:#ffc163; --warn-soft:rgba(255,193,99,.13); --info:#8ab4ff;
  --f:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  --mono:'JetBrains Mono','D2Coding','Consolas','SFMono-Regular',Menlo,monospace;
  --ease:cubic-bezier(.23,1,.32,1);

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-rows:auto auto minmax(0,1fr);}
.app.rv{grid-template-rows:auto auto auto minmax(0,1fr);}
.app{height:100vh;height:100dvh}
/* 위쪽 줄 */
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.mark{width:30px;height:30px;border-radius:9px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;flex:none}.mark svg{width:17px;height:17px}
.ttl{min-width:0}.ttl b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ttl small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--panel-2);font-size:13px;font-weight:600;color:var(--fg-2);white-space:nowrap}
.pill.dd.soon{color:var(--acc)}.pill.dd.over{color:var(--bad)}
.btn{appearance:none;border:0;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;background:var(--panel-3);color:var(--fg);font-weight:600;font-size:14px;cursor:pointer;transition:background .15s,transform .12s var(--ease);white-space:nowrap}
.btn:hover{background:#343a49}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--acc);color:var(--acc-ink)}.btn.pri:hover{background:#ffad66}
.btn.ok{background:#2f8f62;color:#fff}.btn.ok:hover{background:#38a571}
.btn.ghost{background:transparent;color:var(--fg-2)}.btn.ghost:hover{background:var(--panel-2)}
/* 문제 탭 */
.tabs{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto}
.tab{appearance:none;border:0;display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:9px;background:transparent;color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--panel-2);color:var(--fg)}.tab.on{background:var(--panel-3);color:var(--fg)}
.tab i{width:8px;height:8px;border-radius:50%;background:var(--faint)}.tab i.w{background:var(--info)}.tab i.p{background:var(--warn)}.tab i.a{background:var(--ok)}
.tab em{font-style:normal;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--panel-2);color:var(--muted)}
/* 본문 */
.main{display:grid;grid-template-columns:minmax(340px,42%) minmax(0,1fr);min-height:0}
.desc{overflow:auto;padding:22px 24px 40px;border-right:1px solid var(--line)}
.desc .lv{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:6px}
.desc .lv b{color:var(--acc);font-weight:700}
.desc h1{font-size:21px;margin:0 0 14px;letter-spacing:-.01em}
.desc .tx{white-space:pre-wrap;color:var(--fg-2)}
.desc h3{font-size:14px;margin:24px 0 8px;color:var(--fg)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.tags span{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--panel-2);color:var(--fg-2)}
table.io{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:13px;border-radius:10px;overflow:hidden;background:var(--panel)}
table.io th{font-family:var(--f);font-weight:600;font-size:12.5px;color:var(--muted);text-align:left;padding:8px 12px;background:var(--panel-2)}
table.io td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top;white-space:pre-wrap;word-break:break-all;color:var(--fg)}
.hintb{margin-top:16px}.hintb summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:13.5px}.hintb p{margin:8px 0 0;color:var(--fg-2)}
.schema{font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;background:var(--panel);border-radius:10px;padding:12px 14px;color:var(--fg-2)}
.main>section{min-width:0}.work{min-width:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto minmax(150px,34%);min-height:0}
.ebar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.ebar .lang{font-size:12.5px;font-weight:700;color:var(--fg-2);padding:4px 10px;border-radius:8px;background:var(--panel-2)}
.ebar .sp{flex:1}.ebar small{color:var(--faint);font-size:12px}
.editor{min-height:0;min-width:0;position:relative;overflow:hidden;background:#151821}
.editor .CodeMirror{height:100%;background:#151821;color:#e6e9ef;font-family:var(--mono);font-size:14px;line-height:1.6}
.CodeMirror-gutters{background:#151821!important;border-right:1px solid var(--line)!important}.CodeMirror-linenumber{color:#4f5668!important}
.CodeMirror-cursor{border-left:2px solid var(--acc)!important}.CodeMirror-selected{background:rgba(138,180,255,.18)!important}.CodeMirror-focused .CodeMirror-selected{background:rgba(138,180,255,.24)!important}
.CodeMirror-matchingbracket{color:#fff!important;background:rgba(255,157,77,.25)}
.editor .CodeMirror .cm-keyword{color:#ff9db0}.editor .CodeMirror .cm-def{color:#82aaff}.editor .CodeMirror .cm-variable-2{color:#e6e9ef}.editor .CodeMirror .cm-builtin{color:#7fdbca}.editor .CodeMirror .cm-string{color:#c3e88d}.editor .CodeMirror .cm-number{color:#f78c6c}.editor .CodeMirror .cm-comment{color:#6b7389;font-style:italic}.editor .CodeMirror .cm-operator{color:#89ddff}.editor .CodeMirror .cm-type{color:#ffcb6b}.editor .CodeMirror .cm-atom{color:#f78c6c}.editor .CodeMirror .cm-property{color:#e6e9ef}.editor .CodeMirror .cm-variable,.editor .CodeMirror .cm-variable-3{color:#e6e9ef}.editor .CodeMirror .cm-meta{color:#c792ea}.editor .CodeMirror .cm-bracket{color:#e6e9ef}
textarea.plain{width:100%;height:100%;border:0;resize:none;padding:12px 14px;background:#151821;color:#e6e9ef;font-family:var(--mono);font-size:14px;line-height:1.6;tab-size:4;outline:0}
.actions{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel)}
.actions .sp{flex:1}
.actions .st{font-size:13px;color:var(--muted)}
.console{overflow:auto;padding:12px 14px 24px;background:#10121a;font-size:13.5px}
.console .empty{color:var(--faint)}
.res{border-radius:10px;background:var(--panel);margin-bottom:8px;overflow:hidden}
.res-h{display:flex;align-items:center;gap:10px;padding:9px 12px;font-weight:600}
.res-h .b{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
.b.ok{background:var(--ok-soft);color:var(--ok)}.b.bad{background:var(--bad-soft);color:var(--bad)}.b.warn{background:var(--warn-soft);color:var(--warn)}.b.info{background:rgba(138,180,255,.14);color:var(--info)}
.res-h .ms{margin-left:auto;font-size:12px;color:var(--faint);font-weight:500}
.res-b{padding:0 12px 10px;font-family:var(--mono);font-size:12.5px;color:var(--fg-2);white-space:pre-wrap;word-break:break-all}
.res-b .k{color:var(--muted);font-family:var(--f)}
.grade{border-radius:12px;background:var(--panel);padding:14px;margin-bottom:10px}
.grade .big{display:flex;align-items:baseline;gap:10px}.grade .big b{font-size:28px;font-weight:800}.grade .big span{color:var(--muted)}
.cells{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cell{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;background:var(--panel-2);font-size:12.5px;font-family:var(--mono)}
.cell i{width:8px;height:8px;border-radius:50%}.cell.ok i{background:var(--ok)}.cell.bad i{background:var(--bad)}.cell.to i{background:var(--warn)}.cell.er i{background:#c792ea}
.sqlt{border-collapse:collapse;font-family:var(--mono);font-size:12px;margin:6px 0}.sqlt th,.sqlt td{border:1px solid var(--line-2);padding:3px 8px;text-align:left}.sqlt th{color:var(--muted)}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted)}.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--panel-3);border-top-color:var(--acc);animation:sp 0.8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
/* 제출 창 */
.ov{position:fixed;inset:0;background:rgba(5,6,10,.66);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.on{display:flex}
.sheet{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border-radius:18px;box-shadow:0 0 0 1px var(--line-2),0 30px 80px rgba(0,0,0,.5);padding:20px}
.sheet h2{margin:0 0 4px;font-size:19px}.sheet p.s{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.sum-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto 64px;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.sum-row .n{color:var(--muted);font-weight:700}.sum-row b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sum-row .sc{text-align:right;font-weight:800}
.bar{height:6px;border-radius:9px;background:var(--panel-3);overflow:hidden;width:90px}.bar i{display:block;height:100%;background:var(--acc);width:var(--w)}
textarea.cm{width:100%;margin-top:12px;min-height:70px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--fg);padding:10px 12px;font:inherit;font-size:14px;resize:vertical}
.msg{white-space:pre-wrap;font-family:var(--mono);font-size:11.5px;color:var(--fg-2);background:#10121a;border-radius:10px;padding:10px 12px;max-height:140px;overflow:auto;word-break:break-all;margin-top:12px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
.banner{padding:8px 16px;background:rgba(138,180,255,.12);color:var(--info);font-size:13px;font-weight:600;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#2a2f3c;color:var(--fg);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;transition:all .25s var(--ease);pointer-events:none;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fail{max-width:420px;margin:20vh auto;text-align:center;padding:24px}.fail b{display:block;font-size:19px;margin-bottom:6px}.fail p{color:var(--muted)}
@media (max-width:900px){
  .app,.app.rv{display:block;height:auto;min-height:100vh}
  .main{display:block}
  .desc{border-right:0;border-bottom:1px solid var(--line);max-height:none;overflow:visible}
  .work{display:flex;flex-direction:column}
  .editor{height:56vh;flex:none}
  .console{min-height:180px}
  .top .pill.tm{display:none}
  .top{flex-wrap:wrap}.ttl{flex:1 1 55%}.top .sp{display:none}
  .actions{flex-wrap:wrap}.actions .st{order:-1;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>

function h(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function b64d(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; var bin=atob(s), u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
function b64e(u){ var b=''; for(var i=0;i<u.length;i+=0x8000) b+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }

var DOW='일월화수목금토'; function ymd(s){ var p=String(s).split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function md(s){ var d=ymd(s); return (d.getMonth()+1)+'/'+d.getDate()+'('+DOW[d.getDay()]+')'; }

var D=null, PS=[], cur=0, ST=null, CM=null, REVIEW=false, busy=false, KEY='';

"var py=null;",
"self.onmessage=async function(e){ var m=e.data;",
" if(m.init){ try{ importScripts(m.url+'pyodide.js'); py=await loadPyodide({indexURL:m.url}); py.runPython(m.boot); postMessage({ready:true}); }catch(err){ postMessage({ready:false,err:String(err)}); } return; }",
" try{ var r=py.globals.get('_kaia_run')(m.code,m.args,m.fn); postMessage({id:m.id,r:r}); }catch(err){ postMessage({id:m.id,r:JSON.stringify({ok:false,err:'InternalError',msg:String(err).slice(0,300)})}); }",
"};"].join('\n');
var PY_BOOT=[
"import sys, io, json, time, traceback, builtins",
"_BLOCK={'js','pyodide','pyodide_js','_pyodide','micropip','pyodide.ffi','pyodide.http','pyodide.code'}",
"_real_import=builtins.__import__",
"def _guard(name,*a,**k):",
"    if name.split('.')[0] in _BLOCK: raise ImportError('이 모듈은 쓸 수 없어요: '+name)",
"    return _real_import(name,*a,**k)",
"def _no_input(*a,**k): raise RuntimeError('input()은 쓰지 않아요. solution 함수의 매개변수를 사용하세요.')",
"def _norm(x,d=0):",
"    if d>40: return repr(x)",
"    if isinstance(x,bool) or x is None or isinstance(x,(int,str)): return x",
"    if isinstance(x,float): return x if x==x and x not in (float('inf'),float('-inf')) else repr(x)",
"    if isinstance(x,(list,tuple)): return [_norm(v,d+1) for v in x]",
"    if isinstance(x,(set,frozenset)):",
"        try: return sorted(_norm(v,d+1) for v in x)",
"        except Exception: return [_norm(v,d+1) for v in x]",
"    if isinstance(x,dict): return {'__dict__':[[_norm(k,d+1),_norm(v,d+1)] for k,v in x.items()]}",
"    return repr(x)",
"def _kaia_run(code,args_json,fn):",
"    out=io.StringIO(); old=sys.stdout; sys.stdout=out; ns={'__name__':'__main__','input':_no_input}",
"    builtins.__import__=_guard",
"    try:",
"        exec(compile(code,'solution.py','exec'),ns)",
"        f=ns.get(fn)",
"        if not callable(f): raise NameError(fn+' 함수를 찾을 수 없어요. def '+fn+'(...) 로 시작해야 해요.')",
"        args=json.loads(args_json)",
"        t=time.perf_counter(); r=f(*args); ms=(time.perf_counter()-t)*1000",
"        return json.dumps({'ok':True,'r':_norm(r),'ms':round(ms,2),'out':out.getvalue()[:3000]},ensure_ascii=False)",

   (T.tot!=null?'<div class="sum-row" style="border-top:2px solid var(--line-2)"><span></span><b>평균</b><span></span><span class="sc num" style="color:var(--acc)">'+T.tot+'점</span></div>':'')+
   (notDone?'<p class="note" style="color:var(--warn)">아직 채점하지 않은 문제가 '+notDone+'개 있어요.</p>':'')+
   '<textarea class="cm" id="fCm" maxlength="400" placeholder="멘토님께 한마디 (선택) · 어려웠던 점이나 질문"></textarea>'+
   '<div id="fOut"></div><div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end"><button class="btn ghost" id="fX">계속 풀기</button><button class="btn pri" id="fGo">'+IC.send+'제출 메시지 만들기</button></div>';
  $('#ov').classList.add('on'); $('#fX').onclick=closeOv; $('#fGo').onclick=makeSubmit; }
function closeOv(){ $('#ov').classList.remove('on'); }
$('#ov').addEventListener('click',function(e){ if(e.target.id==='ov') closeOv(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeOv(); });
function makeSubmit(){ var T=totals(); var at=new Date().toISOString(); var cm=($('#fCm').value||'').trim().slice(0,400);
  var r=T.rows.map(function(x){ var s=x.s||{c:x.p.st}; var b=s.best||{}; return {p:x.p.id,c:(b.c!=null?b.c:s.c||'').slice(0,6000),s:b.sc!=null?b.sc:null,ps:b.pass||null,e:b.err||null,ms:b.ms||null,ru:s.runs||0,su:s.subs||0,se:s.sec||0,fo:s.firstOk||null,cc:s.c!==b.c?(s.c||'').slice(0,6000):null}; });
  var o={k:'code',h:D.h,sid:D.sid,n:D.n,t:D.t,lang:D.lang,at:at,cm:cm,tot:T.tot,r:r};
  encode(o).then(function(code){ var d=new Date(at); var when=(d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
    var msg='[코딩 과제 제출] '+(D.n||'')+' · '+D.t+'\n'+(T.tot!=null?'자동 채점 평균: '+T.tot+'점\n':'')+T.rows.map(function(x,i){ return (i+1)+'. '+x.p.ti+' — '+(x.sc==null?'-':x.sc+'점'); }).join('\n')+(cm?'\n한마디: '+cm:'')+'\n제출 시각: '+when+'\n\n제출 확인 코드: KAIAHW1.'+code;
    ST.sent=at; stSave();
    $('#fOut').innerHTML='<div class="msg" id="fMsg"></div><div class="row3"><button class="btn pri" id="fSms">'+IC.sms+'문자</button><button class="btn" id="fSh">'+IC.share+'공유</button><button class="btn" id="fCp">'+IC.copy+'복사</button></div><p class="note">메시지 맨 아래 <b>제출 확인 코드</b>까지 통째로 보내야 제출이 기록돼요. 코드가 길면 문자보다 <b>카톡에 붙여넣기</b>가 편해요.</p>';
    $('#fMsg').textContent=msg; $('#fGo').textContent='메시지를 다시 만들기';
    $('#fCp').onclick=function(){ copy(msg); }; $('#fSh').onclick=function(){ if(navigator.share) navigator.share({text:msg}).catch(function(){}); else copy(msg); };
    $('#fSms').onclick=function(){ if(!D.hp){ copy(msg); toast('멘토 번호가 없어 복사했어요 · 카톡에 붙여 넣어 주세요'); return; } var ios=/iP(hone|ad|od)/.test(navigator.userAgent); location.href='sms:'+String(D.hp).replace(/[^0-9+]/g,'')+(ios?'&':'?')+'body='+encodeURIComponent(msg); }; }); }
function copy(t){ if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(t).then(function(){ toast('복사했어요'); },fb); else fb(); function fb(){ var a=document.createElement('textarea'); a.value=t; a.style.position='fixed'; a.style.opacity='0'; document.body.appendChild(a); a.select(); try{ document.execCommand('copy'); toast('복사했어요'); }catch(e){ toast('길게 눌러 직접 복사해 주세요'); } a.remove(); } }

/* ---------- 시작 ---------- */
function fail(t){ $('#app').innerHTML='<div class="fail"><b>'+h(t||'과제 정보를 열 수 없어요')+'</b><p>링크가 잘렸을 수 있어요. 받은 링크 전체를 다시 눌러 주세요.</p></div>'; }
function boot(d){ if(!d||!d.ps||!d.lang||!window.CODEBANK) throw 0; D=d;
  PS=d.ps.map(function(id){ return CODEBANK.find(function(p){ return p.id===id; }); }).filter(Boolean); if(!PS.length) throw 0;
  KEY='kaiacode.'+d.h; REVIEW=!!d.rv; ST=REVIEW?{p:{}}:(stLoad()||{p:{}});
  if(REVIEW) d.rv.forEach(function(x){ ST.p[x.p]={c:x.c,runs:0,subs:0,sec:0}; });
  document.title=d.t+' · 코딩 테스트';
  var cmReady=loadScript(CMB+'codemirror.min.js').then(function(){ var m={python:'mode/python/python.min.js',sql:'mode/sql/sql.min.js',java:'mode/clike/clike.min.js',c:'mode/clike/clike.min.js'}[d.lang];
    return Promise.all([loadScript(CMB+m),loadScript(CMB+'addon/edit/matchbrackets.min.js'),loadScript(CMB+'addon/edit/closebrackets.min.js')]); }).catch(function(){});
  var tmo=new Promise(function(ok){ setTimeout(ok,4000); });
  Promise.race([cmReady,tmo]).then(function(){ render(); if(CODE_LANGS[d.lang].run){ (d.lang==='python'?pyStart():sqlStart()).catch(function(){}); }
    if(REVIEW) setTimeout(function(){ var i=0; (function nx(){ if(i>=PS.length) return; go(i); doRunAsync().then(function(){ i++; nx(); }); })(); },300); }); }
function doRunAsync(){ return new Promise(function(ok){ doRun(true); var w=setInterval(function(){ if(!busy){ clearInterval(w); ok(); } },200); }); }
var hs=location.hash.slice(1); if(!hs) fail(); else decodeStr(hs).then(boot).catch(function(){ fail(); });
</script>
