<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
:root{--bx:translateX(-50%)}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:"Segoe UI Variable Text","Segoe UI","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;user-select:none;color:#f4f2ee}
#pill{position:absolute;left:50%;top:0;transform:translateX(-50%);width:128px;height:34px;border-radius:17px;background:#0b0b0d;overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,255,255,.06);
  transition:width .5s cubic-bezier(.2,.9,.25,1.08),height .5s cubic-bezier(.2,.9,.25,1.08),border-radius .5s ease}
#pill.hov{width:440px;border-radius:26px}
.v{position:absolute;left:0;right:0;top:0;opacity:0;transition:opacity .2s ease;pointer-events:none}
#pill:not(.hov) .idle,#pill.hov .big{opacity:1;transition-delay:.16s;pointer-events:auto}
.idle{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.dot{width:7px;height:7px;border-radius:50%;background:#46d17f}
.mini{font-size:11.5px;font-weight:600;color:#c9c6bf;font-variant-numeric:tabular-nums}
.bad{min-width:16px;height:16px;padding:0 5px;border-radius:9px;background:rgba(255,255,255,.14);color:#f4f2ee;font-size:10.5px;font-weight:800;visibility:hidden;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}.bad.on{visibility:visible}
.big{padding:14px 16px 14px;width:440px;right:auto;box-sizing:border-box}
.hd{display:flex;align-items:center;gap:8px}
.clock b{display:block;font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.clock small{font-size:11.5px;color:#9b988f}
.hd .sp{flex:1}
.md{display:flex;gap:4px;margin-right:4px}
.md button{width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.08);cursor:pointer;display:grid;place-items:center;padding:0}
.md button:hover{background:rgba(255,255,255,.16)}.md button:active{transform:scale(.92)}
.md svg{width:14px;height:14px;fill:#f4f2ee}
.md .pp{background:#f4f2ee}.md .pp svg{fill:#0b0b0d}.md .pp:hover{background:#fff}
.quit,.open{font:inherit;font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:999px;cursor:pointer}
.quit{border:1px solid rgba(255,255,255,.16);background:transparent;color:rgba(244,242,238,.62)}.quit:hover{color:#ff8a80;border-color:rgba(255,138,128,.5)}
.open{border:0;background:#ff9d4d;color:#2a1606;font-weight:700}
.lab{display:flex;align-items:center;font-size:11px;color:#8e8b84;letter-spacing:.06em;margin:14px 2px 6px}
.lab button{margin-left:auto;font:inherit;font-size:11px;color:#8e8b84;background:none;border:0;cursor:pointer;padding:0}.lab button:hover{color:#f4f2ee}
#apps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.ap{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px 7px;border-radius:14px;cursor:pointer;min-width:0}
.ap:hover{background:rgba(255,255,255,.07)}.ap:active .im{transform:scale(.92)}
.im{font-style:normal;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;transition:transform .12s;flex:none}
.im img{width:36px;height:36px;object-fit:contain;-webkit-user-drag:none}
.im.tx{background:rgba(255,255,255,.1);font-size:17px;font-weight:700;color:#f4f2ee}
.im.pl{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22);color:#b9b6ae;font-size:20px;font-weight:300}
.ap span{max-width:100%;font-size:11px;color:#c9c6bf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px;box-sizing:border-box}
.ed{position:absolute;inset:0;border-radius:14px;background:rgba(11,11,13,.94);display:none;align-items:center;justify-content:center;gap:2px}
.ap.on .ed{display:flex}
.ed button{font:inherit;font-size:10.5px;font-weight:700;border:0;border-radius:8px;padding:6px 4px;white-space:nowrap;background:rgba(255,255,255,.1);color:#f4f2ee;cursor:pointer}
.ed button.x{background:#ff6b5e;color:#2a0906;padding:6px 6px}
#add{margin-top:8px;display:none;gap:8px;flex-direction:column}#add.on{display:flex}
.row{display:flex;gap:8px}
.bt{flex:1;font:inherit;font-size:12.5px;font-weight:700;border:0;border-radius:12px;padding:10px 0;background:rgba(255,255,255,.08);color:#f4f2ee;cursor:pointer}
.bt:hover{background:rgba(255,255,255,.14)}.bt.acc{background:#f4f2ee;color:#0b0b0d;flex:none;padding:10px 16px}
input{font:inherit;font-size:13px;color:#f4f2ee;background:rgba(255,255,255,.07);border:0;outline:0;border-radius:12px;padding:10px 12px;user-select:text;min-width:0}
input::placeholder{color:#7d7a74}input:focus{box-shadow:inset 0 0 0 1.5px rgba(244,242,238,.55)}
#web{display:none;gap:8px}#web.on{display:flex}#wn{width:104px;flex:none}#wu{flex:1}
.tk{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:12px;cursor:pointer}
.tk:hover{background:rgba(255,255,255,.05)}
.ck{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.6px #6c6a66;flex:none;display:grid;place-items:center}
.tk.done .ck{background:#46d17f;box-shadow:none}.tk.done .ck::after{content:"";width:8px;height:4px;border:2px solid #0b0b0d;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.tk span{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk.done span{color:#7d7a74;text-decoration:line-through}
#todos{max-height:170px;overflow:auto}#todos::-webkit-scrollbar{width:0}
.none{font-size:12.5px;color:#8e8b84;padding:6px 8px}
.memo{display:flex;margin-top:8px}.memo input{flex:1}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;font-size:12px;font-weight:700;background:#f4f2ee;color:#0b0b0d;padding:6px 12px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}

/* 새 프로그램은 창이 화면 맨 위에 붙어요(y0). 자동 숨김(tuck)이면 평소엔 얇은 선만 남기고 위로 숨어요 */
body.y0 #pill{top:6px}
#pill{transition:width .5s cubic-bezier(.2,.9,.25,1.08),height .5s cubic-bezier(.2,.9,.25,1.08),border-radius .5s ease,transform .3s cubic-bezier(.2,.9,.25,1)}
#pill.near:not(.hov){box-shadow:0 8px 24px rgba(0,0,0,.3),inset 0 0 0 1.5px rgba(244,242,238,.55)}
.idle{cursor:pointer}
body.tuck #pill:not(.hov):not(.alrt){transform:translate(-50%,-36px);box-shadow:0 2px 8px rgba(0,0,0,.25)}
body.lay #pill{transform:var(--bx)}
body.lay.tuck #pill:not(.hov):not(.alrt){transform:var(--bx) var(--tk)}
body.drag #pill{transition:none!important;transform:var(--bx)!important;cursor:grabbing;box-shadow:0 14px 34px rgba(0,0,0,.45),inset 0 0 0 1.5px rgba(244,242,238,.7)}
.clock{cursor:grab}
#inst{display:none;flex-direction:column;gap:6px}#inst.on{display:flex}
#instL{max-height:210px;overflow:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:2px}#instL::-webkit-scrollbar{width:0}
.ia{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;cursor:pointer;font-size:12.5px;min-width:0}.ia:hover{background:rgba(255,255,255,.08)}
.ia img,.ia i{width:22px;height:22px;flex:none;border-radius:5px;object-fit:contain}.ia i{background:rgba(255,255,255,.1)}
.ia span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np{display:flex;align-items:center;gap:9px;min-width:0;max-width:170px;margin-right:6px}.np[hidden]{display:none}
.np i{width:38px;height:38px;border-radius:9px;flex:none;background:#26262b center/cover no-repeat;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.np div{min-width:0;line-height:1.3}.np b{display:block;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np small{display:block;font-size:11px;color:#9b988f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np.off b,.np.off i{opacity:.55}
.msb{width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.08);cursor:pointer;display:grid;place-items:center;padding:0;margin-right:4px}
.msb svg{width:15px;height:15px;fill:none;stroke:#f4f2ee;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.msb:hover,.msb.on{background:rgba(255,255,255,.18)}
#mus{margin-top:12px}.mrow{display:flex;gap:8px}.mrow input{flex:1}
#mL{max-height:220px;overflow:auto;margin-top:6px}#mL::-webkit-scrollbar{width:0}
.mi{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;cursor:pointer}.mi:hover{background:rgba(255,255,255,.07)}.mi.on{background:rgba(255,255,255,.1)}
.mi img{width:52px;height:30px;border-radius:6px;object-fit:cover;flex:none;background:#26262b}
.mi div{flex:1;min-width:0;line-height:1.3}.mi b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mi small{font-size:11px;color:#9b988f}
.mi.on b{color:#7fe0a5}
#mAd{font-size:12px;color:#ffb36b;margin-top:8px;display:flex;align-items:center;gap:8px}#mAd[hidden]{display:none}#mAd button{font:inherit;font-size:11.5px;font-weight:700;border:0;border-radius:999px;padding:4px 10px;background:#ffb36b;color:#2a1606;cursor:pointer}
.mbar{height:3px;border-radius:2px;background:rgba(255,255,255,.1);margin-top:8px;overflow:hidden}.mbar i{display:block;height:100%;width:0;background:#f4f2ee;transition:width .9s linear}
</style></head><body>
<div id="pill">
  <div class="v idle" id="idle"><i class="dot"></i><span class="mini" id="mini"></span><span class="bad" id="bad"></span></div>
  <div class="v big" id="big">
    <div class="hd"><div class="clock"><b id="hh">--:--</b><small id="dd"></small></div><span class="sp"></span>
      <div class="np" id="np" hidden><i id="npI"></i><div><b id="npT"></b><small id="npA"></small></div></div><button class="msb" id="bMus" title="음악 찾아 틀기" hidden><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></button><div class="md"><button data-m="prev" title="이전 곡"><svg viewBox="0 0 24 24"><path d="M6 5h2.4v14H6zM20 5.6v12.8L9.8 12z"/></svg></button><button class="pp" data-m="play" title="재생 · 일시정지"><svg viewBox="0 0 24 24"><path d="M5 4.5v15l9-7.5zM15.5 5H18v14h-2.5zM20 5h2.5v14H20z" transform="translate(-1.6 0)"/></svg></button><button data-m="next" title="다음 곡"><svg viewBox="0 0 24 24"><path d="M15.6 5H18v14h-2.4zM4 5.6v12.8L14.2 12z"/></svg></button></div>
      <button class="open" id="bOpen" hidden></button><button class="quit" id="bQuit" title="Island 끄기">종료</button></div>
    <div id="mus" hidden><div class="mrow"><input id="mQ" placeholder="노래 · 가수 검색하고 Enter" maxlength="80"><button class="bt sm" id="mStop" hidden>끄기</button></div>
      <div id="mAd" hidden>광고 중 <button id="mSkip">건너뛰기</button></div><div class="mbar" id="mBar" hidden><i id="mFill"></i></div><div id="mL"></div></div>
    <div class="lab">바로가기</div><div id="apps"></div>
    <div id="add"><div class="row"><button class="bt" id="bInst">설치된 프로그램</button><button class="bt" id="bApp">파일에서 고르기</button><button class="bt" id="bWeb">웹사이트 주소 넣기</button></div>
      <div id="inst"><input id="instQ" placeholder="찾기 (예: 카카오톡 · 디스코드 · 스팀)" maxlength="40"><div id="instL"><div class="none">불러오는 중…</div></div></div><div id="web"><input id="wn" placeholder="이름" maxlength="24"><input id="wu" placeholder="주소 (예: youtube.com)" maxlength="400"><button class="bt acc" id="wOk">추가</button></div></div>
    <div class="lab">메모<button id="bClr" hidden>끝낸 것 지우기</button></div><div id="todos"></div>
    <div class="memo"><input id="memo" placeholder="메모 적고 Enter" maxlength="120"></div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script>
const $=id=>document.getElementById(id), pill=$('pill'); const DW='일월화수목금토';
const act=a=>window.island?island.act(a):Promise.resolve('');
let S={apps:[],todos:[]}, hov=false, addOn=false;
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){ if(!m) return; const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),1600); }
function fit(){ pill.style.height=pill.classList.contains('hov')?($('big').scrollHeight)+'px':''; }
function clock(){ const n=new Date(); const hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  $('hh').textContent=hm; $('dd').textContent=`${n.getMonth()+1}월 ${n.getDate()}일 (${DW[n.getDay()]})`; $('mini').textContent=hm; }
function paint(){ const A=S.apps||[], T=S.todos||[]; const left=T.filter(x=>!x.done).length;
  $('bMus').hidden=!S.mus; const pl=S.pl; $('mStop').hidden=!pl; $('mAd').hidden=!(pl&&pl.ad); $('mBar').hidden=!pl||!pl.d; if(pl&&pl.d) $('mFill').style.width=Math.min(100,pl.t0/pl.d*100)+'%';
  document.querySelectorAll('.mi').forEach(e=>e.classList.toggle('on',!!pl&&e.dataset.id===pl.id));
  const np=S.np; $('np').hidden=!np; if(np){ $('npT').textContent=np.t; $('npA').textContent=np.a||''; $('np').title=np.t+(np.a?' · '+np.a:''); $('np').classList.toggle('off',!np.on); $('npI').style.backgroundImage=np.img?`url("${np.img}")`:np.th?`url(data:image/png;base64,${np.th})`:''; }
  $('bad').textContent=left; $('bad').classList.toggle('on',left>0);
  $('bOpen').hidden=!S.web; $('bOpen').textContent=S.open?'접기 ▲':(S.title||'')+' ⤢';
  $('apps').innerHTML=A.map(x=>`<div class="ap" data-id="${esc(x.id)}" title="${esc(x.name)} · 오른쪽 클릭: 순서 바꾸기 · 빼기">${x.icon?`<i class="im"><img src="${esc(x.icon)}" alt=""></i>`:`<i class="im tx">${esc([...String(x.name||'?')][0].toUpperCase())}</i>`}<span>${esc(x.name)}</span><div class="ed"><button data-e="l">◀</button><button class="x" data-e="x">빼기</button><button data-e="r">▶</button></div></div>`).join('')
    +`<div class="ap" id="plus" title="바로가기 추가"><i class="im pl">+</i><span>${A.length?'추가':'바로가기 추가'}</span></div>`;
  $('add').classList.toggle('on',addOn);
  $('todos').innerHTML=T.length?T.map(x=>`<div class="tk${x.done?' done':''}" data-id="${esc(x.id)}"><i class="ck"></i><span>${esc(x.text)}</span></div>`).join(''):'<div class="none">적어 둔 메모가 없어요</div>';
  $('bClr').hidden=!T.some(x=>x.done); clock(); fit(); }
function placePill(L){ const st=pill.style; document.body.classList.toggle('lay',!!L); if(!L) return;
  st.left=L.ax==='r'?'auto':L.x+'px'; st.right=L.ax==='r'?L.x+'px':'auto'; st.top=L.ay==='t'?L.y+'px':'auto'; st.bottom=L.ay==='b'?L.y+'px':'auto';
  const R=document.documentElement.style; R.setProperty('--bx',L.ax==='c'?'translateX(-50%)':'translateX(0)');
  R.setProperty('--tk',{top:'translateY(-36px)',bottom:'translateY(36px)',left:'translateX(-130px)',right:'translateX(130px)'}[L.edge]||'translateY(-36px)'); }
window.island&&island.on(s=>{ S=s||S; placePill(S.lay); document.body.classList.toggle('y0',!!S.y0&&!S.lay); document.body.classList.toggle('tuck',!!S.tuck); paint(); });
/* 마우스가 알약 위에 있을 때만 클릭을 받아요 (나머지 투명한 곳은 뒤 화면으로 통과) */
/* ---------- 여닫기 ----------
   자동 숨김: 화면 맨 위에 마우스를 잠깐(0.15초) 대면 내려와서 펼쳐져요.
   알약 형태: 마우스를 올려도 그대로, 눌러야 펼쳐져요.  둘 다 마우스가 벗어나면 접혀요(글을 적는 중이면 기다려요). */
let cap=false, over=false, dwT=0;
const typing=()=>{ const a=document.activeElement; return !!a&&a.tagName==='INPUT'; };
function setCap(on){ if(on===cap) return; cap=on; window.island&&island.hover(on); }
function setHov(on){ if(on===hov) return; if(!on&&typing()) return; hov=on; pill.classList.toggle('hov',on); pill.classList.remove('near');
  if(!on){ addOn=false; $('web').classList.remove('on'); $('inst').classList.remove('on'); document.querySelectorAll('.ap.on').forEach(e=>e.classList.remove('on')); $('add').classList.remove('on'); } fit(); }
/* 펼친 판 둘레 24px까지는 안으로 쳐요. 그보다 멀리 나가면 바로 접어요 */
function track(x,y){ if(dragging) return; const r=pill.getBoundingClientRect(); const m=hov?24:0; over=x>=r.left-2-m&&x<=r.right+2+m&&y>=r.top-8-m&&y<=r.bottom+6+m;
  if(hov){ if(!over) setHov(false); setCap(hov&&over); return; }
  if(document.body.classList.contains('tuck')){ if(over){ if(!dwT) dwT=setTimeout(()=>{ dwT=0; if(over){ setHov(true); setCap(true); } },150); } else if(dwT){ clearTimeout(dwT); dwT=0; } setCap(false); return; }
  setCap(over); pill.classList.toggle('near',over); }
if(window.island&&island.cur) island.cur(p=>track(p.x,p.y));
else { document.addEventListener('mousemove',e=>track(e.clientX,e.clientY)); document.addEventListener('mouseleave',()=>track(-999,-999)); }
document.addEventListener('focusout',()=>setTimeout(()=>{ if(hov&&!over&&!typing()){ setHov(false); setCap(false); } },0));
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&e.target.tagName==='INPUT'){ e.target.value=''; e.target.blur(); } });
/* 끌어서 옮기기: 알약(또는 펼친 판의 시계)을 누른 채 5px 넘게 움직이면 끌기 → 놓으면 가장 가까운 벽(다른 모니터도 됨)에 붙어요 */
let dg=null, dragging=false, justDragged=0;
function dragDown(e){ if(e.button!==0||!window.island||!island.drag) return; dg={x:e.clientX,y:e.clientY}; }
document.addEventListener('mousemove',e=>{ if(!dg||dragging) return; if(Math.hypot(e.clientX-dg.x,e.clientY-dg.y)<5) return;
  dragging=true; if(hov){ hov=false; pill.classList.remove('hov'); fit(); } document.body.classList.add('drag'); island.drag({k:'start',gx:dg.x,gy:dg.y}); });
document.addEventListener('mouseup',()=>{ if(dragging){ dragging=false; justDragged=Date.now(); document.body.classList.remove('drag'); cap=false; island.drag({k:'end'}); } dg=null; });
$('idle').addEventListener('mousedown',dragDown); document.querySelector('.clock').addEventListener('mousedown',dragDown);
$('idle').onclick=()=>{ if(Date.now()-justDragged<300) return; if(S.web&&S.open){ act({k:'open'}); return; } setHov(true); setCap(true); };
$('bOpen').onclick=()=>act({k:'open'});
let ML=[];
$('bMus').onclick=()=>{ const on=$('mus').hidden; $('mus').hidden=!on; $('bMus').classList.toggle('on',on); fit(); if(on) $('mQ').focus(); };
$('mQ').addEventListener('keydown',async e=>{ if(e.key!=='Enter') return; const q=e.target.value.trim(); if(!q) return; $('mL').innerHTML='<div class="none">찾는 중…</div>'; fit();
  ML=await act({k:'msearch',q})||[]; $('mL').innerHTML=ML.length?ML.map((x,i)=>`<div class="mi" data-i="${i}" data-id="${esc(x.id)}"><img src="${esc(x.th)}" alt=""><div><b>${esc(x.t)}</b><small>${esc(x.a)} · ${esc(x.len)}</small></div></div>`).join(''):'<div class="none">찾지 못했어요 · 다른 말로 검색해 보세요</div>'; fit(); });
$('mL').addEventListener('click',e=>{ const r=e.target.closest('.mi'); if(r) act({k:'mplay',list:ML,i:+r.dataset.i}); });
$('mStop').onclick=async()=>toast(await act({k:'mstop'})); $('mSkip').onclick=()=>act({k:'mskip'});
$('bQuit').onclick=()=>{ const b=$('bQuit'); if(b.dataset.sure){ act({k:'quit'}); return; } b.dataset.sure='1'; b.textContent='끌까요?'; setTimeout(()=>{ delete b.dataset.sure; b.textContent='종료'; },2500); };
document.querySelector('.md').addEventListener('click',async e=>{ const b=e.target.closest('[data-m]'); if(b) toast(await act({k:'media',b:b.dataset.m})); });
$('apps').addEventListener('click',async e=>{ const ed=e.target.closest('[data-e]'), a=e.target.closest('.ap'); if(!a) return;
  if(a.id==='plus'){ addOn=!addOn; $('add').classList.toggle('on',addOn); $('web').classList.remove('on'); fit(); return; }
  if(ed){ const k=ed.dataset.e; if(k==='x') toast(await act({k:'del',id:a.dataset.id})); else { await act({k:'move',id:a.dataset.id,d:k==='l'?-1:1}); const n=document.querySelector(`.ap[data-id="${a.dataset.id}"]`); n&&n.classList.add('on'); } return; }
  if(a.classList.contains('on')){ a.classList.remove('on'); return; }
  toast(await act({k:'run',id:a.dataset.id})); });
$('apps').addEventListener('contextmenu',e=>{ e.preventDefault(); const a=e.target.closest('.ap'); document.querySelectorAll('.ap.on').forEach(x=>x!==a&&x.classList.remove('on')); if(a&&a.id!=='plus') a.classList.toggle('on'); });
let INST=null;
function instDraw(){ const q=$('instQ').value.trim().toLowerCase(); const L=(INST||[]).filter(o=>!q||o.name.toLowerCase().includes(q)).slice(0,80);
  $('instL').innerHTML=INST?(L.length?L.map((o,i)=>`<div class="ia" data-i="${INST.indexOf(o)}" title="${esc(o.name)}">${o.icon?`<img src="${esc(o.icon)}" alt="">`:'<i></i>'}<span>${esc(o.name)}</span></div>`).join(''):'<div class="none">찾는 프로그램이 없어요 · "파일에서 고르기"를 써 보세요</div>'):'<div class="none">불러오는 중…</div>'; fit(); }
$('bInst').onclick=async()=>{ const on=!$('inst').classList.contains('on'); $('inst').classList.toggle('on',on); $('web').classList.remove('on'); fit(); if(!on) return; $('instQ').focus(); instDraw(); if(!INST){ INST=await act({k:'apps'})||[]; instDraw(); } };
$('instQ').addEventListener('input',instDraw);
$('instL').addEventListener('click',async e=>{ const r=e.target.closest('.ia'); if(!r||!INST) return; const o=INST[+r.dataset.i]; toast(await act({k:'addPath',path:o.path,name:o.name})); });
$('bApp').onclick=async()=>{ const m=await act({k:'addApp'}); if(m){ addOn=false; toast(m); paint(); } };
$('bWeb').onclick=()=>{ $('web').classList.toggle('on'); fit(); if($('web').classList.contains('on')) $('wn').focus(); };
async function addWeb(){ const u=$('wu').value.trim(); if(!u){ $('wu').focus(); return; } const m=await act({k:'addUrl',name:$('wn').value,url:u}); toast(m); if(/넣었어요/.test(m)){ $('wn').value=''; $('wu').value=''; $('web').classList.remove('on'); addOn=false; paint(); } }
$('wOk').onclick=addWeb; $('wu').addEventListener('keydown',e=>{ if(e.key==='Enter') addWeb(); }); $('wn').addEventListener('keydown',e=>{ if(e.key==='Enter') $('wu').focus(); });
$('memo').addEventListener('keydown',async e=>{ if(e.key==='Enter'&&e.target.value.trim()){ const v=e.target.value.trim(); e.target.value=''; toast(await act({k:'todoAdd',text:v})); } });
$('todos').addEventListener('click',e=>{ const r=e.target.closest('.tk'); if(r) act({k:'todo',id:r.dataset.id}); });
$('bClr').onclick=async()=>toast(await act({k:'todoClear'}));
setInterval(clock,1000); paint(); window.island&&island.act({k:'get'}).then(s=>{ if(s&&s.apps){ S=s; document.body.classList.toggle('y0',!!S.y0); document.body.classList.toggle('tuck',!!S.tuck); paint(); } });
if(location.search.includes('demo')){ S={web:false,apps:['Chrome','카카오톡','YouTube','Steam','리그 오브 레전드','Discord','넷플릭스'].map((n,i)=>({id:'a'+i,name:n,icon:''})),todos:[{id:'1',text:'택배 반품 접수하기'},{id:'2',text:'치과 예약 전화',done:true}]}; paint(); pill.classList.add('hov'); hov=true; fit(); }
</script></body></html>
