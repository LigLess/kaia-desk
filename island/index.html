<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:"Segoe UI Variable Text","Segoe UI","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;user-select:none;color:#f4f2ee}
#pill{position:absolute;left:50%;top:0;transform:translateX(-50%);width:128px;height:34px;border-radius:17px;background:#0b0b0d;overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,255,255,.06);
  transition:width .5s cubic-bezier(.2,.9,.25,1.08),height .5s cubic-bezier(.2,.9,.25,1.08),border-radius .5s ease}
#pill.hov{width:440px;border-radius:26px}
#pill.alrt{width:460px;height:var(--ah,96px);border-radius:28px}
.v{position:absolute;left:0;right:0;top:0;opacity:0;transition:opacity .2s ease;pointer-events:none}
#pill:not(.hov):not(.alrt) .idle,#pill.hov .big,#pill.alrt .al{opacity:1;transition-delay:.16s;pointer-events:auto}
/* 작은 알약 */
.idle{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;cursor:pointer}
.dot{width:7px;height:7px;border-radius:50%;background:#3a3d44}.dot.on{background:#46d17f}
.mini{font-size:11.5px;font-weight:600;color:#c9c6bf;font-variant-numeric:tabular-nums}
.bad{min-width:16px;height:16px;padding:0 5px;border-radius:9px;background:#ff9d4d;color:#2a1606;font-size:10.5px;font-weight:800;display:none;align-items:center;justify-content:center}.bad.on{display:inline-flex}
/* 펼친 판 */
.big{padding:14px 16px 14px;width:440px;right:auto;box-sizing:border-box}
.hd{display:flex;align-items:center;gap:14px}
.clock b{display:block;font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.clock small{font-size:11.5px;color:#9b988f}
.hd .sp{flex:1}
.chip{font:inherit;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:999px;border:0;background:rgba(255,255,255,.08);color:#d9d6cf;cursor:pointer}
.chip.hot{background:#ff9d4d;color:#2a1606}
.quit{font:inherit;font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:transparent;color:rgba(244,242,238,.62);cursor:pointer}.quit:hover{color:#ff8a80;border-color:rgba(255,138,128,.5)}
.open{font:inherit;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:999px;border:0;background:#f4f2ee;color:#0b0b0d;cursor:pointer}
.lab{font-size:11px;color:#8e8b84;letter-spacing:.06em;margin:14px 2px 6px}
.tk{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:12px;cursor:pointer}
.tk:hover{background:rgba(255,255,255,.05)}
.ck{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.6px #6c6a66;flex:none;display:grid;place-items:center}
.tk.done .ck{background:#46d17f;box-shadow:none}.tk.done .ck::after{content:"";width:8px;height:4px;border:2px solid #0b0b0d;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.tk span{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk.done span{color:#7d7a74;text-decoration:line-through}
.tk em{font-style:normal;font-size:11.5px;color:#9b988f;font-variant-numeric:tabular-nums}.tk em.late{color:#ff8a7a}
.none{font-size:12.5px;color:#8e8b84;padding:6px 8px}
.memo{display:flex;gap:8px;margin-top:12px}
.memo input{flex:1;font:inherit;font-size:13px;color:#f4f2ee;background:rgba(255,255,255,.07);border:0;outline:0;border-radius:12px;padding:10px 12px;user-select:text}
.memo input::placeholder{color:#7d7a74}
.memo input:focus{box-shadow:inset 0 0 0 1.5px #ff9d4d}
.row{display:flex;gap:8px;margin-top:10px}
.bt{flex:1;font:inherit;font-size:12.5px;font-weight:700;border:0;border-radius:12px;padding:10px 0;background:rgba(255,255,255,.08);color:#f4f2ee;cursor:pointer}
.bt:hover{background:rgba(255,255,255,.14)}
#ntList{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.nt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.05);cursor:pointer;font-size:13px}
.nt:hover{background:rgba(255,157,77,.18)}.nt span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nt em{font-style:normal;font-size:11.5px;color:#9b988f;font-variant-numeric:tabular-nums}.bt.acc{background:#ff9d4d;color:#2a1606}
/* 알림 */
.al{padding:16px 18px;width:460px;right:auto;box-sizing:border-box}
.alh{display:flex;align-items:center;gap:14px;cursor:pointer}
.ic{width:40px;height:40px;border-radius:14px;background:#ff9d4d;display:grid;place-items:center;flex:none}
.ic svg{width:20px;height:20px;stroke:#2a1606}
.al .tx{flex:1;min-width:0}
.al .tx b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al .tx span{display:block;font-size:12.5px;color:#b9b6ae;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al .row{margin-top:12px}
#pill.alrt{animation:pop .6s cubic-bezier(.2,.9,.25,1.2)}
@keyframes pop{0%{transform:translateX(-50%) scale(.96)}60%{transform:translateX(-50%) scale(1.02)}100%{transform:translateX(-50%) scale(1)}}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;font-size:12px;font-weight:700;background:#f4f2ee;color:#0b0b0d;padding:6px 12px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
</style></head><body>
<div id="pill">
  <div class="v idle" id="idle"><i class="dot" id="dot"></i><span class="mini" id="mini"></span><span class="bad" id="bad"></span></div>
  <div class="v big" id="big">
    <div class="hd"><div class="clock"><b id="hh">--:--</b><small id="dd"></small></div><span class="sp"></span>
      <button class="chip" id="cIn" data-open="team-inflow">DB 0</button><button class="chip" id="cVi" data-open="team-visit">방문 0</button><button class="open" id="bOpen">펼치기 ⤢</button><button class="quit" id="bQuit" title="KAIA Island 끄기">종료</button></div>
    <div class="lab" id="lab">오늘 할 일</div><div id="list"></div>
    <div class="memo"><input id="memo" placeholder="빠른 메모 → 업무 (예: 3시 김민수 콜백)" maxlength="200"></div>
    <div class="row"><button class="bt acc" id="bBook">방문 예약 링크 복사</button><button class="bt" id="bNt">개강안내 복사 ▾</button></div>
    <div id="ntList" hidden></div>
  </div>
  <div class="v al" id="al"><div class="alh" id="alh"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg></span><div class="tx"><b id="at"></b><span id="ab"></span></div></div>
    <div class="row" id="alb"></div></div>
  <div class="toast" id="toast"></div>
</div>
<script>
const $=id=>document.getElementById(id), pill=$('pill'); const DW='일월화수목금토';
const act=a=>window.island?island.act(a):Promise.resolve('');
let S={}, Q=[], showing=null, hideT=0, hov=false;
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){ if(!m) return; const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),1600); }
function fit(){ /* 펼친 판 높이를 내용에 맞춰요 */ if(pill.classList.contains('hov')) pill.style.height=($('big').scrollHeight)+'px'; else if(!pill.classList.contains('alrt')) pill.style.height=''; }
function clock(){ const n=new Date(); const hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  $('hh').textContent=hm; $('dd').textContent=`${n.getMonth()+1}월 ${n.getDate()}일 (${DW[n.getDay()]})`; $('mini').textContent=S.next&&S.next.time?S.next.time:hm; }
function paint(){ $('dot').classList.toggle('on',!!S.team);
  const n=(S.inflow||0)+(S.visit||0); $('bad').textContent=n; $('bad').classList.toggle('on',n>0&&!S.open);
  $('cIn').textContent='DB '+(S.inflow||0); $('cIn').classList.toggle('hot',S.inflow>0); $('cVi').textContent='방문 '+(S.visit||0); $('cVi').classList.toggle('hot',S.visit>0);
  $('bOpen').textContent=S.open?'접기 ▲':'펼치기 ⤢';
  $('lab').textContent=!S.ready?'KAIA DESK 연결 중…':!S.team?'로그인이 필요해요 · 펼치기를 눌러 주세요':`오늘 할 일 · ${S.today||0}건 남음`;
  const L=S.list||[]; $('list').innerHTML=L.length?L.map(x=>`<div class="tk${x.done?' done':''}" data-id="${esc(x.id)}" data-on="${x.done?0:1}"><i class="ck"></i><span>${esc(x.text)}</span><em class="${x.late?'late':''}">${x.late?'밀림':esc(x.time||'')}</em></div>`).join(''):'<div class="none">오늘 남은 할 일이 없어요</div>';
  const C=S.courses||[]; $('ntList').innerHTML=C.length?C.map(c=>`<div class="nt" data-id="${esc(c.id)}"><span>${esc(c.name)}</span><em>${esc(c.when)}</em></div>`).join(''):'<div class="none">3주 안에 개강하는 과정이 없어요</div>';
  clock(); fit(); }
function nextAlert(){ if(showing||!Q.length) return; showing=Q.shift();
  $('at').textContent=showing.t; $('ab').textContent=showing.b||'눌러서 확인하세요';
  const tag=String(showing.tag||''), m=tag.match(/^(if|bk)-(.+)$/), ph=(String(showing.b)+' '+String(showing.t)).match(/01[016789][-\s]?\d{3,4}[-\s]?\d{4}/);
  showing.ok=m?{type:m[1],id:m[2]}:null; showing.ph=ph?ph[0]:'';
  $('alb').innerHTML=(showing.ok?'<button class="bt acc" data-a="ok">확인</button>':'')+(showing.ph?'<button class="bt" data-a="ph">연락처 복사</button>':'')+'<button class="bt" data-a="open">열기</button>';
  pill.style.setProperty('--ah',(showing.ok||showing.ph?128:96)+'px'); pill.style.height='';
  pill.classList.remove('hov'); pill.classList.add('alrt'); clearTimeout(hideT); hideT=setTimeout(()=>{ if(!hov) endAlert(); },9000); }
function endAlert(){ showing=null; pill.classList.remove('alrt'); pill.classList.toggle('hov',hov); fit(); setTimeout(nextAlert,700); }
window.island&&island.on(s=>{ S=s||{}; if(S.q&&S.q.length) Q.push(...S.q); paint(); nextAlert(); });
/* 마우스가 알약 위에 있을 때만 클릭을 받아요 (나머지 투명한 곳은 뒤 화면으로 통과) */
function setHov(on){ if(on===hov) return; if(!on&&document.activeElement===$('memo')) return; hov=on; window.island&&island.hover(on); if(!showing){ pill.classList.toggle('hov',on); } else if(!on){ clearTimeout(hideT); hideT=setTimeout(endAlert,2500); } fit(); }
document.addEventListener('mousemove',e=>{ const r=pill.getBoundingClientRect(); setHov(e.clientX>=r.left-2&&e.clientX<=r.right+2&&e.clientY>=r.top&&e.clientY<=r.bottom+6); });
document.addEventListener('mouseleave',()=>setHov(false));
$('memo').addEventListener('blur',()=>setTimeout(()=>{ const r=pill.getBoundingClientRect(); if(!hov) return; },0));
$('memo').addEventListener('keydown',async e=>{ if(e.key==='Enter'&&e.target.value.trim()){ const v=e.target.value.trim(); e.target.value=''; toast(await act({k:'add',text:v})); }
  if(e.key==='Escape'){ e.target.value=''; e.target.blur(); setHov(false); } });
$('idle').onclick=()=>act({k:'open'});
$('bOpen').onclick=()=>act({k:'open'});
$('bQuit').onclick=()=>{ const b=$('bQuit'); if(b.dataset.sure){ act({k:'quit'}); return; } b.dataset.sure='1'; b.textContent='끌까요?'; setTimeout(()=>{ delete b.dataset.sure; b.textContent='종료'; },2500); };
$('cIn').onclick=()=>act({k:'open',where:'team-inflow'}); $('cVi').onclick=()=>act({k:'open',where:'team-visit'});
$('bBook').onclick=async()=>toast(await act({k:'book'}));
$('bNt').onclick=()=>{ const L=$('ntList'); L.hidden=!L.hidden; $('bNt').textContent=L.hidden?'개강안내 복사 ▾':'개강안내 복사 ▴'; fit(); };
$('ntList').addEventListener('click',async e=>{ const r=e.target.closest('.nt'); if(!r) return; toast('만드는 중…'); toast(await act({k:'notice',id:r.dataset.id})); });
$('list').addEventListener('click',async e=>{ const r=e.target.closest('.tk'); if(!r) return; r.classList.toggle('done'); toast(await act({k:'done',id:r.dataset.id,on:r.dataset.on==='1'})); });
$('alh').onclick=()=>{ const w=showing?(showing.tab?'team-'+showing.tab:(showing.go||'')):''; endAlert(); act({k:'open',where:w||'home'}); };
$('alb').addEventListener('click',async e=>{ const b=e.target.closest('[data-a]'); if(!b||!showing) return; const a=b.dataset.a;
  if(a==='ok'){ toast(await act({k:'ok',type:showing.ok.type,id:showing.ok.id})); endAlert(); }
  else if(a==='ph') toast(await act({k:'copy',text:showing.ph}));
  else { const w=showing.tab?'team-'+showing.tab:(showing.go||''); endAlert(); act({k:'open',where:w||'home'}); } });
setInterval(clock,1000); paint();
if(location.search.includes('demo')){ S={ready:true,team:true,today:3,next:{time:'14:00',text:'홍길동 방문 상담'},inflow:2,visit:1,
  courses:[{id:'c1',name:'정보처리기사 실기 평일반',when:'11/13(금) 개강'},{id:'c2',name:'Python 1 주말반',when:'11/15(일) 개강'}],list:[{id:'a',text:'홍길동 방문 상담 · 010-0000-1234',time:'14:00'},{id:'b',text:'김민수 콜백 · 국비 서류 안내',time:'16:30'},{id:'c',text:'정보처리기사 실기 개강 문자 보내기',time:''},{id:'d',text:'이서연 견적서 다시 보내기',time:'',late:true}]}; paint(); }
</script></body></html>
